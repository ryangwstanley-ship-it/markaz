مَا اسْتَطَاعَ من طهر، ويدهن من دهنه، أَو يمس من طيب بَيته، ثمَّ يخرج فَلَا يفرق بَين اثْنَيْنِ ثمَّ يُصَلِّي مَا كتب لَهُ، ثمَّ ينصت إِذا تكلم الإِمَام، إِلَّا غفر لَهُ مَا بَينه وَبَين الْجُمُعَة الْأُخْرَى \" رَوَاهُ البُخَارِيّ\n\n(١٤) وَمن مس الْحَصَى فقد لَغَا\n\n(١٥) إِن فِي الْجُمُعَة لساعة لَا يُوَافِقهَا مُسلم قَائِم يُصَلِّي يسْأَل الله خيرا إِلَّا أعطَاهُ إِيَّاه، وَقَالَ بِيَدِهِ يقللها يزهدها\" هَكَذَا أخرجه مُسلم وَأخرجه البُخَارِيّ بِنَحْوِهِ.\n\n(١٦) رَكعَتَا الْفجْر خير من الدُّنْيَا وَمَا فِيهَا \" رَوَاهُ مُسلم\n\n(١٧) من ثابر على اثْنَتَيْ عشرَة رَكْعَة فِي الْيَوْم وَاللَّيْلَة دخل الْجنَّة\n\n(١٨) من حَافظ على أَربع رَكْعَات قبل الظّهْر وَأَرْبع بعْدهَا، حرمه الله على النَّار\n\n(١٩) عَن أبي هُرَيْرَة رَضِي الله عَنهُ، قَالَ: \"أَوْصَانِي خليلي بِثَلَاث: بصيام ثَلَاثَة أَيَّام من كل شهر، وركعتي الضُّحَى، وَأَن أوتر قبل أَن أرقد\" أخرجه البُخَارِيّ وَمُسلم.\n\n(٢٠) من حَافظ على شُفْعَة الضُّحَى غفرت ذنُوبه وَإِن كَانَت مثل زبد الْبَحْر\" أخرجه ابْن مَاجَه\n\n(٢١) من قعد فِي مُصَلَّاهُ حِين ينْصَرف من صَلَاة الصُّبْح حَتَّى يسبح رَكْعَتي الضُّحَى لَا يَقُول إِلَّا خيرا غفر لَهُ خطاياه وَإِن كَانَت أَكثر من زبد الْبَحْر\n\n(٢٢) يَقُول الله عز وَجل: ابْن آدم لَا تعجزن أَربع رَكْعَات فِي أول نهارك أكفك آخِره\"\n\n(٢٣) رحم الله رجلا قَامَ من اللَّيْل فصلى وَأَيْقَظَ امْرَأَته فَإِن أَبَت نضح فِي وَجههَا المَاء، رحم الله امْرَأَة قَامَت من اللَّيْل فصلت وأيقظت زَوجهَا فَإِن أَبى نضحت فِي وَجهه المَاء\" رَوَاهُ أَبُو دَاوُد وَابْن مَاجَه\n\n(٢٤) يَا أَيهَا النَّاس افشوا السَّلَام وأطعموا الطَّعَام وصلوا بِاللَّيْلِ وَالنَّاس نيام تدْخلُوا الْجنَّة بِسَلام\n\n(٢٥) أفضل الصّيام بعد شهر رَمَضَان شهر الله الْمحرم، وَأفضل الصَّلَاة بعد الْفَرِيضَة صَلَاة اللَّيْل\" رَوَاهُ مُسلم.\n\n(٢٦) عَن أنس بن مَالك رَضِي الله عَنهُ فِي هَذِه الْآيَة {تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ يَدْعُونَ رَبَّهُمْ خَوْفاً وَطَمَعاً وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ} قَالَ: \"كَانُوا يتيقظون مَا بَين الْمغرب وَالْعشَاء يصلونَ\"، وَكَانَ الْحسن يَقُول: \"قيام اللَّيْل\". رَوَاهُ أَبُو دَاوُد\n\n(٢٧) من خَافَ أَلا يقوم آخر اللَّيْل فليوتر أَوله، وَمن طمع أَن يقوم آخِره فليوتر آخر اللَّيْل، فَإِن صَلَاة آخر اللَّيْل مَشْهُودَة وَذَلِكَ أفضل\" رَوَاهُ مُسلم\n\n(٢٨) أَفلا أعلمكُم شَيْئا تدركون بِهِ من سبقكم، وتسبقون بِهِ من بعدكم، وَلَا يكون أحد أفضل مِنْكُم إِلَّا من صنع مثل مَا صَنَعْتُم\"؟ قَالُوا: بلَى يَا رَسُول الله، قَالَ: \"تسبحون وتكبرون وتحمدون فِي دبر كل صَلَاة ثَلَاثًا وَثَلَاثِينَ مرّة\n\n(٢٩) \"من تعار من اللَّيْل فَقَالَ: لَا إِلَه إِلَّا الله وَحده لَا شريك لَهُ لَهُ الْملك وَله الْحَمد وَهُوَ على كل شَيْء قدير الْحَمد الله وَسُبْحَان الله وَالله أكبر وَلَا إِلَه إِلَّا الله وَلَا حول وَلَا قُوَّة إِلَّا بِاللَّه ثمَّ قَالَ: اللَّهُمَّ اغْفِر لي أَو دَعَا اسْتُجِيبَ لَهُ، فَإِن تَوَضَّأ قبلت صلَاته\" أخرجه البُخَارِيّ.\n\n(٣٠) من قَالَ لَا إِلَه إِلَّا الله وَحده لَا شريك لَهُ، لَهُ الْملك وَله الْحَمد وَهُوَ على كل شَيْء قدير، فِي يَوْم مائَة مرّة، كَانَت لَهُ عدل عشر رِقَاب، وكتبت لَهُ مائَة حَسَنَة، ومحيت عَنهُ مائَة سَيِّئَة، وَكَانَت لَهُ حرْزا من الشَّيْطَان فِي يَوْمه ذَلِك حَتَّى يُمْسِي، وَلم يَأْتِ أحد أفضل مِمَّا جَاءَ بِهِ إِلَّا أحد عمل أَكثر من ذَلِك، وَمن قَالَ سُبْحَانَ الله وَبِحَمْدِهِ فِي يَوْمه مائَة مرّة، حطت خطاياه وَإِن كَانَت مثل زبد الْبَحْر \" رَوَاهُ البُخَارِيّ وَمُسلم\n\n(٣١) من قَالَ لَا إِلَه إلا الله وَحده لَا شريك لَهُ، لَهُ الْملك وَله الْحَمد وَلَهو على كل شَيْء قدير عشر مَرَّات، كَانَ كمن أعتق أَرْبَعَة أنفس من ولد إِسْمَاعِيل\" رَوَاهُ البُخَارِيّ وَمُسلم\n\n(٣٢) يسبح الله مائَة تَسْبِيحَة فَيكْتب لَهُ ألف حَسَنَة أَو يحط عَنهُ ألف خَطِيئَة\" رَوَاهُ مُسلم.\n\n(٣٣) من جلس فِي مجْلِس يكثر فِيهِ لغطه فَقَالَ قبل أَن يقوم من مَجْلِسه ذَلِك، سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِك أشهد أَن لَا إِلَه إِلَّا أَنْت أستغفرك وَأَتُوب إِلَيْك، إِلَّا غفر لَهُ مَا كَانَ فِي مَجْلِسه ذَلِك\n\n(٣٤) سيد الاسْتِغْفَار أَن تَقول: اللَّهُمَّ أَنْت رَبِّي لَا إِلَه إِلَّا أَنْت خلقتني وَأَنا عَبدك وَأَنا على عَهْدك وَوَعدك مَا اسْتَطَعْت أعوذ بك من شَرّ مَا صنعت أَبُوء لَك بنعمتك عَليّ وأبوء بذنبي فَاغْفِر لي فَإِنَّهُ لَا يغْفر الذُّنُوب إِلَّا أَنْت، فَإِن قَالَهَا بعد مَا يُمْسِي فَمَاتَ من ليلته دخل الْجنَّة، وَإِن قَالَهَا بعد مَا يصبح فَمَاتَ من يَوْمه فَمَاتَ من يَوْمه دخل الْجنَّة\" أخرجه البُخَارِيّ بِمَعْنَاهُ \n\n(٣٥) إِن كُنَّا لنعد لرَسُول الله صلى الله عَلَيْهِ وَسلم فِي الْمجْلس الْوَاحِد مائَة مرّة قبل أَن يقوم، رب اغْفِر لي وَتب عَليّ إِنَّك أَنْت التواب الغفور \" أخرجه أَبُو دَاوُد وَالنَّسَائِيّ وَابْن مَاجَه وَالتِّرْمِذِيّ وَقَالَ: حَدِيث حسن صَحِيح غَرِيب\n\n(٣٦) يَا عبد الله بن قيس أَلا أدلك على كنز من كنوز الْجنَّة\"، فَقلت: بلَى يَا رَسُول الله، قَالَ: \"قل لَا حول وَلَا قُوَّة إِلَّا بِاللَّه\" أخرجه البُخَارِيّ وَمُسلم\n\n(٣٧) الْمُؤمن إِذا عَاد أَخَاهُ الْمُسلم لم يزل فِي خرافة الْجنَّة\" رَوَاهُ مُسلم بِنَحْوِهِ\n\n(٣٨) من كَانَ لَهُ عمل يعمله فَشَغلهُ عَنهُ مرض أَو سفر فَإِنَّهُ يكْتب لَهُ صَالح مَا كَانَ يعْمل وَهُوَ صَحِيح مُقيم\" أخرجه البُخَارِيّ بِنَحْوِهِ\n\n(٣٩) إن الله إذا أحب قوما ابتلاهم فمن رضي فله الرضى ومن سخط فعليه السخط\n\n(٤٠) من أراد بحبوحة الجنة فليلزم الجماعة فإن الشيطان مع الواحد وهو من الاثنين أبعد\n\n(٤١) لا يحافظ على الوضوء إلا مؤمن؟\n\n(٤٢) صلاة الأوابين حين ترمض الفصال (الضحى)\n\n٤٣ - مَن لَبِسَ ثَوبًا فقال: الحَمدُ لله الذي كَساني هذا الثَّوبَ ورَزَقَنيه مِن غَيرِ حَولٍ مِنِّي ولا قُوَّةٍ، غُفِرَ له ما تقَدَّمَ مِن ذَنبِه\n\n٤٤ = من قال حين يصبحُ اللهم ما أصبح بي من نعمةٍ أو بأحدٍ من خلقِك فمنك وحدك لا شريكَ لك لك الحمدُ ولك الشكرُ فقد أدى شكرَ يومِه ومن قال مثل ذلك حين يمسي فقد أدى شكرَ ليلتِه\n\nخلاصة حكم المحدث : حسن"], "wordCount": 1256}]};
// ============ State ============
let lessonsData = null;
let currentLesson = null;
let currentCardIndex = 0;
let cardOrder = [];
let speeds = [1, 1.25, 1.5, 0.75];
let speedIndex = 0;

// Reading tab state
const PAGES_PER_DAY = 5;
let readingData = null;
let readingDays = [];       // array of {dayNumber, pages: [pageObj,...]}
let currentDayIndex = 0;    // 0-based index into readingDays
let completedDays = new Set(); // day numbers marked complete (persisted)

const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabicDigits(str) {
  return String(str).replace(/[0-9]/g, d => arabicDigits[d]);
}

// ============ Load data ============
async function loadLessons() {
  lessonsData = window.EMBEDDED_LESSONS;
  renderLessonList();
  loadLesson(lessonsData.lessons[0].id);
}

// ============ Sidebar ============
function renderLessonList() {
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  lessonsData.lessons.forEach(lesson => {
    const item = document.createElement('div');
    item.className = 'lesson-item';
    item.dataset.id = lesson.id;
    item.setAttribute('tabindex', '0');
    item.setAttribute('role', 'button');
    item.innerHTML = `
      <span class="lesson-item-number">${toArabicDigits(lesson.number)}</span>
      <span class="lesson-item-title">${lesson.title}</span>
    `;
    item.addEventListener('click', () => loadLesson(lesson.id));
    item.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') loadLesson(lesson.id);
    });
    list.appendChild(item);
  });
}

function markActiveLesson(id) {
  document.querySelectorAll('.lesson-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

// ============ Load a lesson ============
function loadLesson(id) {
  const lesson = lessonsData.lessons.find(l => l.id === id);
  if (!lesson) return;
  currentLesson = lesson;

  document.getElementById('bookTitle').textContent = lesson.bookTitle;
  document.getElementById('lessonTitle').textContent = lesson.title;
  document.getElementById('lessonAuthor').textContent = lesson.author;

  markActiveLesson(id);
  renderLessonText(lesson);
  renderFlashcards(lesson);
  setupAudio(lesson);
}

// ============ Text rendering ============
function renderLessonText(lesson) {
  const container = document.getElementById('lessonText');
  container.innerHTML = '';
  lesson.paragraphs.forEach(p => {
    const el = document.createElement(p.type === 'heading' ? 'h3' : 'p');
    el.className = p.type === 'heading' ? 'lesson-heading' : 'lesson-para';
    el.textContent = p.text;
    el.dataset.id = p.id;
    if (p.type === 'paragraph' && p.start !== null) {
      el.addEventListener('click', () => seekAudioTo(p.start));
    }
    container.appendChild(el);
  });
}

// Highlight the paragraph currently playing, based on audio currentTime.
// Paragraph start/end times are placeholders (null) until lesson data includes them.
function updatePlayingParagraph(currentTime) {
  if (!currentLesson) return;
  document.querySelectorAll('.lesson-para').forEach(el => el.classList.remove('playing'));
  const match = currentLesson.paragraphs.find(p =>
    p.type === 'paragraph' && p.start !== null && p.end !== null &&
    currentTime >= p.start && currentTime < p.end
  );
  if (match) {
    const el = document.querySelector(`.lesson-para[data-id="${match.id}"]`);
    if (el) {
      el.classList.add('playing');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function seekAudioTo(seconds) {
  const audio = document.getElementById('audioEl');
  if (seconds === null || !audio.src) return;
  audio.currentTime = seconds;
  audio.play();
}

// ============ Audio player ============
function setupAudio(lesson) {
  const audio = document.getElementById('audioEl');
  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.querySelector('.icon-play');
  const iconPause = document.querySelector('.icon-pause');

  audio.pause();
  audio.currentTime = 0;
  iconPlay.style.display = '';
  iconPause.style.display = 'none';

  if (lesson.audioSrc) {
    audio.src = lesson.audioSrc;
  } else {
    audio.removeAttribute('src');
  }

  updateTimeDisplay(0, 0);
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressHandle').style.right = '0%';
}

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return toArabicDigits(`${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);
}

function updateTimeDisplay(current, total) {
  document.getElementById('timeCurrent').textContent = formatTime(current);
  document.getElementById('timeTotal').textContent = formatTime(total);
}

function initPlayerEvents() {
  const audio = document.getElementById('audioEl');
  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.querySelector('.icon-play');
  const iconPause = document.querySelector('.icon-pause');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const progressHandle = document.getElementById('progressHandle');
  const speedBtn = document.getElementById('speedBtn');
  const rewindBtn = document.getElementById('rewindBtn');

  playBtn.addEventListener('click', () => {
    if (!audio.src) return;
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', () => {
    iconPlay.style.display = 'none';
    iconPause.style.display = '';
  });

  audio.addEventListener('pause', () => {
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
  });

  audio.addEventListener('loadedmetadata', () => {
    updateTimeDisplay(audio.currentTime, audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    progressFill.style.width = pct + '%';
    progressHandle.style.right = pct + '%';
    updateTimeDisplay(audio.currentTime, audio.duration);
    updatePlayingParagraph(audio.currentTime);
  });

  progressTrack.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = progressTrack.getBoundingClientRect();
    // RTL: distance from the right edge represents progress
    const fromRight = rect.right - e.clientX;
    const pct = Math.min(Math.max(fromRight / rect.width, 0), 1);
    audio.currentTime = pct * audio.duration;
  });

  speedBtn.addEventListener('click', () => {
    speedIndex = (speedIndex + 1) % speeds.length;
    audio.playbackRate = speeds[speedIndex];
    speedBtn.textContent = toArabicDigits(speeds[speedIndex]) + 'x';
  });

  rewindBtn.addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  });
}

// ============ View toggle ============
function initViewToggle() {
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.toggle-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');

      const view = btn.dataset.view;
      document.querySelectorAll('.view-panel').forEach(panel => {
        panel.dataset.active = (panel.id === `view-${view}`) ? 'true' : 'false';
      });
    });
  });
}

// ============ Flashcards ============
function renderFlashcards(lesson) {
  const cards = lesson.flashcards || [];
  const flashcardsTabBtn = document.querySelector('.toggle-btn[data-view="flashcards"]');
  const hasCards = cards.length > 0;

  if (flashcardsTabBtn) {
    flashcardsTabBtn.style.display = hasCards ? '' : 'none';
    // if the flashcards tab was active but this lesson has none, fall back to the text view
    if (!hasCards && flashcardsTabBtn.classList.contains('active')) {
      const textTabBtn = document.querySelector('.toggle-btn[data-view="text"]');
      if (textTabBtn) textTabBtn.click();
    }
  }

  if (!hasCards) {
    cardOrder = [];
    currentCardIndex = 0;
    document.getElementById('cardTotal').textContent = toArabicDigits(0);
    document.getElementById('cardIndex').textContent = toArabicDigits(0);
    document.getElementById('cardQuestion').textContent = 'لا توجد بطاقات مراجعة لهذا الدرس.';
    document.getElementById('cardAnswer').textContent = '';
    return;
  }

  cardOrder = cards.map((_, i) => i);
  currentCardIndex = 0;
  document.getElementById('cardTotal').textContent = toArabicDigits(cards.length);
  showCard();
}

function showCard() {
  const flashcard = document.getElementById('flashcard');
  flashcard.classList.remove('flipped');

  const cards = currentLesson.flashcards || [];
  if (cards.length === 0) return;
  const idx = cardOrder[currentCardIndex];
  const card = cards[idx];

  document.getElementById('cardQuestion').textContent = card.q;
  document.getElementById('cardAnswer').textContent = card.a;
  document.getElementById('cardIndex').textContent = toArabicDigits(currentCardIndex + 1);
}

function initFlashcardEvents() {
  const flashcard = document.getElementById('flashcard');
  const flipBtn = document.getElementById('flipCard');
  const prevBtn = document.getElementById('prevCard');
  const nextBtn = document.getElementById('nextCard');
  const shuffleBtn = document.getElementById('shuffleCards');

  function flip() {
    flashcard.classList.toggle('flipped');
  }

  flashcard.addEventListener('click', flip);
  flashcard.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  });
  flipBtn.addEventListener('click', flip);

  prevBtn.addEventListener('click', () => {
    if (cardOrder.length === 0) return;
    currentCardIndex = (currentCardIndex - 1 + cardOrder.length) % cardOrder.length;
    showCard();
  });

  nextBtn.addEventListener('click', () => {
    if (cardOrder.length === 0) return;
    currentCardIndex = (currentCardIndex + 1) % cardOrder.length;
    showCard();
  });

  shuffleBtn.addEventListener('click', () => {
    if (cardOrder.length === 0) return;
    for (let i = cardOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cardOrder[i], cardOrder[j]] = [cardOrder[j], cardOrder[i]];
    }
    currentCardIndex = 0;
    showCard();
  });
}

// ============ Reading tab ============
function loadReadingData() {
  readingData = window.EMBEDDED_READING;
  const pages = readingData.pages;
  readingDays = [];
  for (let i = 0; i < pages.length; i += PAGES_PER_DAY) {
    readingDays.push({
      dayNumber: readingDays.length + 1,
      pages: pages.slice(i, i + PAGES_PER_DAY)
    });
  }
  loadCompletedDays();
  renderDayList();
  renderReadingProgressSummary();
}

function completedStorageKey() {
  return 'targheeb_completed_days';
}

function loadCompletedDays() {
  try {
    const raw = localStorage.getItem(completedStorageKey());
    completedDays = new Set(raw ? JSON.parse(raw) : []);
  } catch (e) {
    completedDays = new Set();
  }
}

function saveCompletedDays() {
  try {
    localStorage.setItem(completedStorageKey(), JSON.stringify([...completedDays]));
  } catch (e) { /* ignore storage errors */ }
}

function renderReadingProgressSummary() {
  const el = document.getElementById('readingProgressSummary');
  if (!el) return;
  el.innerHTML = `أتممتَ <strong>${toArabicDigits(completedDays.size)}</strong> من <strong>${toArabicDigits(readingDays.length)}</strong> وِرْداً`;
}

function renderDayList() {
  const list = document.getElementById('dayList');
  if (!list) return;
  list.innerHTML = '';
  readingDays.forEach((day, idx) => {
    const item = document.createElement('div');
    const isDone = completedDays.has(day.dayNumber);
    item.className = 'day-item' + (isDone ? ' completed' : '');
    item.dataset.idx = idx;
    item.setAttribute('tabindex', '0');
    item.setAttribute('role', 'button');
    item.innerHTML = `
      <span class="lesson-item-number">${toArabicDigits(day.dayNumber)}</span>
      <span class="lesson-item-title" style="flex:1">اليوم ${toArabicDigits(day.dayNumber)}</span>
      <span class="day-item-check">${isDone ? '✓' : ''}</span>
    `;
    item.addEventListener('click', () => loadReadingDay(idx));
    item.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') loadReadingDay(idx);
    });
    list.appendChild(item);
  });
}

function markActiveDay(idx) {
  document.querySelectorAll('.day-item').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.idx) === idx);
  });
}

function ordinalDayLabel(n) {
  const names = {1:'الأول',2:'الثاني',3:'الثالث',4:'الرابع',5:'الخامس'};
  return names[n] ? `اليوم ${names[n]}` : `اليوم ${toArabicDigits(n)}`;
}

function loadReadingDay(idx) {
  if (idx < 0 || idx >= readingDays.length) return;
  currentDayIndex = idx;
  const day = readingDays[idx];

  markActiveDay(idx);
  document.getElementById('readingDayTitle').textContent = ordinalDayLabel(day.dayNumber);
  document.getElementById('readingDayBadge').textContent = `${toArabicDigits(day.pages.length)} صفحات`;

  const container = document.getElementById('readingPages');
  container.innerHTML = '';
  day.pages.forEach(page => {
    const pageEl = document.createElement('div');
    pageEl.className = 'reading-page';
    const label = document.createElement('p');
    label.className = 'reading-page-label';
    label.textContent = `الصفحة ${toArabicDigits(page.page)}`;
    pageEl.appendChild(label);
    page.hadiths.forEach(h => {
      const block = document.createElement('p');
      block.className = 'hadith-block';
      block.textContent = h;
      pageEl.appendChild(block);
    });
    container.appendChild(pageEl);
  });

  const isDone = completedDays.has(day.dayNumber);
  updateCompleteButton(isDone);
  document.getElementById('readingProgressFill').style.width = isDone ? '100%' : '0%';

  document.getElementById('readingPrevDay').disabled = idx === 0;
  document.getElementById('readingNextDay').disabled = idx === readingDays.length - 1;

  document.getElementById('readingView').scrollIntoView({ behavior: 'instant', block: 'start' });
}

function updateCompleteButton(isDone) {
  const btn = document.getElementById('readingCompleteBtn');
  btn.classList.toggle('done', isDone);
  btn.textContent = isDone ? 'تم إتمام هذا الورد ✓' : 'تحديد الورد كمكتمل';
}

function markCurrentDayComplete() {
  const day = readingDays[currentDayIndex];
  if (!day) return;
  completedDays.add(day.dayNumber);
  saveCompletedDays();
  updateCompleteButton(true);
  document.getElementById('readingProgressFill').style.width = '100%';
  renderDayList();
  markActiveDay(currentDayIndex);
  renderReadingProgressSummary();
}

function initReadingEvents() {
  document.getElementById('readingCompleteBtn').addEventListener('click', markCurrentDayComplete);
  document.getElementById('readingPrevDay').addEventListener('click', () => loadReadingDay(currentDayIndex - 1));
  document.getElementById('readingNextDay').addEventListener('click', () => loadReadingDay(currentDayIndex + 1));

  document.getElementById('modeLessonsBtn').addEventListener('click', () => setSidebarMode('lessons'));
  document.getElementById('modeReadingBtn').addEventListener('click', () => setSidebarMode('reading'));
}

function setSidebarMode(mode) {
  const isReading = mode === 'reading';
  document.getElementById('modeLessonsBtn').classList.toggle('active', !isReading);
  document.getElementById('modeReadingBtn').classList.toggle('active', isReading);
  document.getElementById('lessonList').style.display = isReading ? 'none' : '';
  document.getElementById('readingSidebar').style.display = isReading ? '' : 'none';

  const headerEl = document.querySelector('.lesson-header');
  if (headerEl) headerEl.style.display = isReading ? 'none' : '';
  document.getElementById('player').style.display = isReading ? 'none' : '';
  document.querySelector('.view-toggle').style.display = isReading ? 'none' : '';
  document.getElementById('view-text').style.display = isReading ? 'none' : '';
  document.getElementById('view-flashcards').style.display = isReading ? 'none' : '';
  document.getElementById('readingView').dataset.active = isReading ? 'true' : 'false';

  if (isReading && !readingData) {
    loadReadingData();
    loadReadingDay(0);
  } else if (isReading) {
    loadReadingDay(currentDayIndex);
  }
}

// ============ Init ============
document.addEventListener('DOMContentLoaded', () => {
  initPlayerEvents();
  initViewToggle();
  initFlashcardEvents();
  initReadingEvents();
  loadLessons();
});

</script>
