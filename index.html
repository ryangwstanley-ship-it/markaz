<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجلس التوحيد — استماع وقراءة ومراجعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Markazi+Text:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root {
  --ink: #1C2530;
  --ink-soft: #2E3B49;
  --parchment: #F2ECDD;
  --parchment-deep: #E8DFC8;
  --gold: #B8935F;
  --gold-soft: #D9C39C;
  --sage: #6B7C6E;
  --rust: #A34B34;
  --line: rgba(28, 37, 48, 0.12);

  --font-display: 'Amiri', serif;
  --font-body: 'Noto Naskh Arabic', serif;
  --font-ui: 'Markazi Text', serif;

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  color: var(--parchment);
  font-family: var(--font-body);
}

body {
  min-height: 100vh;
}

::selection {
  background: var(--gold);
  color: var(--ink);
}

/* ============ Shell layout ============ */
.app-shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: 100vh;
}

@media (max-width: 860px) {
  .app-shell {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: static;
    height: auto;
  }
}

/* ============ Sidebar ============ */
.sidebar {
  background: #161D26;
  border-left: 1px solid var(--line);
  padding: 32px 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid rgba(184, 147, 95, 0.25);
}

.brand {
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--gold);
  margin: 0 0 8px;
  line-height: 1.3;
}

.brand-sub {
  font-family: var(--font-ui);
  font-size: 1rem;
  color: rgba(242, 236, 221, 0.6);
  margin: 0;
  line-height: 1.5;
}

.lesson-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.lesson-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background 0.2s ease;
  color: rgba(242, 236, 221, 0.75);
  font-family: var(--font-ui);
  font-size: 1.1rem;
}

.lesson-item:hover {
  background: rgba(184, 147, 95, 0.1);
}

.lesson-item.active {
  background: rgba(184, 147, 95, 0.16);
  color: var(--parchment);
}

.lesson-item-number {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--ink-soft);
  color: var(--gold);
  font-size: 0.95rem;
  font-weight: 600;
  flex-shrink: 0;
}

.lesson-item.active .lesson-item-number {
  background: var(--gold);
  color: var(--ink);
}

/* ============ Main ============ */
.main {
  background: var(--parchment);
  color: var(--ink);
  padding: 40px clamp(20px, 5vw, 72px) 80px;
}

.lesson-header {
  margin-bottom: 28px;
  text-align: center;
}

.lesson-eyebrow {
  font-family: var(--font-ui);
  font-size: 1.1rem;
  letter-spacing: 0.04em;
  color: var(--rust);
  margin: 0 0 6px;
}

.lesson-title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.8rem);
  margin: 0 0 8px;
  color: var(--ink);
}

.lesson-author {
  font-family: var(--font-ui);
  font-size: 1.1rem;
  color: var(--ink-soft);
  opacity: 0.75;
  margin: 0;
}

/* ============ Player ============ */
.player {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 20px;
  background: var(--ink);
  color: var(--parchment);
  border-radius: var(--radius-lg);
  padding: 18px 24px;
  margin-bottom: 28px;
  position: sticky;
  top: 16px;
  z-index: 20;
  box-shadow: 0 12px 30px rgba(28, 37, 48, 0.25);
}

.play-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: var(--gold);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s ease, background 0.2s ease;
}

.play-btn:hover {
  background: var(--gold-soft);
  transform: scale(1.04);
}

.play-btn:active {
  transform: scale(0.97);
}

.player-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.progress-track {
  position: relative;
  height: 6px;
  background: rgba(242, 236, 221, 0.18);
  border-radius: 3px;
  cursor: pointer;
}

.progress-fill {
  position: absolute;
  top: 0;
  right: 0;
  height: 100%;
  width: 0%;
  background: var(--gold);
  border-radius: 3px;
}

.progress-handle {
  position: absolute;
  top: 50%;
  right: 0%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--parchment);
  transform: translate(50%, -50%);
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.player-meta {
  display: flex;
  gap: 6px;
  font-family: var(--font-ui);
  font-size: 0.95rem;
  color: rgba(242, 236, 221, 0.65);
  direction: ltr;
  justify-content: flex-end;
}

.player-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.speed-btn, .rewind-btn {
  border: 1px solid rgba(242, 236, 221, 0.25);
  background: transparent;
  color: var(--parchment);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 1rem;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.2s ease;
}

.speed-btn:hover, .rewind-btn:hover {
  background: rgba(242, 236, 221, 0.08);
}

/* ============ View toggle ============ */
.view-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.toggle-btn {
  border: none;
  background: transparent;
  font-family: var(--font-ui);
  font-size: 1.15rem;
  color: var(--ink-soft);
  opacity: 0.55;
  padding: 10px 18px;
  cursor: pointer;
  position: relative;
  transition: opacity 0.2s ease, color 0.2s ease;
}

.toggle-btn:hover {
  opacity: 0.8;
}

.toggle-btn.active {
  opacity: 1;
  color: var(--rust);
}

.toggle-btn.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  right: 0;
  left: 0;
  height: 2px;
  background: var(--rust);
}

/* ============ View panels ============ */
.view-panel {
  display: none;
}

.view-panel[data-active="true"] {
  display: block;
}

/* ============ Lesson text ============ */
.lesson-text {
  max-width: 780px;
  margin: 0 auto;
  font-family: var(--font-body);
  font-size: 1.25rem;
  line-height: 2.3;
}

.lesson-heading {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--rust);
  margin: 40px 0 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--gold-soft);
}

.lesson-heading:first-child {
  margin-top: 0;
}

.lesson-para {
  margin: 0 0 22px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  transition: background 0.4s ease;
  cursor: pointer;
}

.lesson-para:hover {
  background: rgba(184, 147, 95, 0.08);
}

.lesson-para.playing {
  background: rgba(184, 147, 95, 0.22);
  box-shadow: inset 3px 0 0 var(--gold);
}

/* ============ Flashcards ============ */
.flashcard-stage {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}

.flashcard-counter {
  font-family: var(--font-ui);
  font-size: 1.1rem;
  color: var(--ink-soft);
  opacity: 0.7;
}

.flashcard {
  width: 100%;
  height: 320px;
  perspective: 1400px;
  cursor: pointer;
}

.flashcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  transform-style: preserve-3d;
}

.flashcard.flipped .flashcard-inner {
  transform: rotateY(180deg);
}

.flashcard-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius-lg);
  padding: 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: 0 16px 34px rgba(28, 37, 48, 0.16);
}

.flashcard-front {
  background: var(--ink);
  color: var(--parchment);
}

.flashcard-back {
  background: var(--gold-soft);
  color: var(--ink);
  transform: rotateY(180deg);
}

.flashcard-label {
  font-family: var(--font-ui);
  font-size: 1rem;
  letter-spacing: 0.06em;
  opacity: 0.6;
  margin: 0 0 16px;
}

.flashcard-content {
  font-family: var(--font-body);
  font-size: 1.2rem;
  line-height: 1.8;
  margin: 0;
}

.flashcard-nav {
  display: flex;
  gap: 10px;
}

.fc-btn {
  font-family: var(--font-ui);
  font-size: 1.05rem;
  padding: 10px 22px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.2s ease;
}

.fc-btn:hover {
  background: rgba(28, 37, 48, 0.06);
}

.fc-btn-flip {
  background: var(--rust);
  color: var(--parchment);
  border-color: var(--rust);
}

.fc-btn-flip:hover {
  background: #8C3D29;
}

.fc-shuffle {
  display: flex;
  align-items: center;
  gap: 8px;
  border: none;
  background: transparent;
  color: var(--sage);
  font-family: var(--font-ui);
  font-size: 1rem;
  cursor: pointer;
  padding: 6px 10px;
}

.fc-shuffle:hover {
  text-decoration: underline;
}

/* ============ Focus states ============ */
button:focus-visible,
.flashcard:focus-visible,
.lesson-item:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

/* ============ Reduced motion ============ */
@media (prefers-reduced-motion: reduce) {
  .flashcard-inner,
  .lesson-para,
  .play-btn {
    transition: none !important;
  }
}

/* ============ Responsive ============ */
@media (max-width: 600px) {
  .player {
    grid-template-columns: auto 1fr;
    row-gap: 12px;
  }
  .player-controls {
    grid-column: 1 / -1;
    justify-content: flex-end;
  }
  .lesson-text {
    font-size: 1.1rem;
  }
  .flashcard {
    height: 280px;
  }
}

</style>
</head>
<body>

<div class="app-shell">

  <!-- ============ Sidebar: Lesson list ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="brand">مَجَالِسُ التَّوْحِيد</h1>
      <p class="brand-sub">شرح كتاب التوحيد للإمام محمد بن عبد الوهاب</p>
    </div>
    <nav class="lesson-list" id="lessonList">
      <!-- populated by JS -->
    </nav>
  </aside>

  <!-- ============ Main content ============ -->
  <main class="main" id="main">

    <header class="lesson-header">
      <p class="lesson-eyebrow" id="bookTitle">كتاب التوحيد</p>
      <h2 class="lesson-title" id="lessonTitle">المجلس الخامس</h2>
      <p class="lesson-author" id="lessonAuthor">الإمام المجدد محمد بن عبد الوهاب</p>
    </header>

    <!-- ============ Audio player (persistent) ============ -->
    <section class="player" id="player">
      <button class="play-btn" id="playBtn" aria-label="تشغيل">
        <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
      </button>

      <div class="player-body">
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-handle" id="progressHandle"></div>
        </div>
        <div class="player-meta">
          <span id="timeCurrent">٠٠:٠٠</span>
          <span class="time-sep">/</span>
          <span id="timeTotal">٠٠:٠٠</span>
        </div>
      </div>

      <div class="player-controls">
        <button class="speed-btn" id="speedBtn" title="سرعة التشغيل">١x</button>
        <button class="rewind-btn" id="rewindBtn" title="رجوع ١٠ ثوانٍ">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/></svg>
        </button>
      </div>

      <audio id="audioEl" preload="metadata"></audio>
    </section>

    <!-- ============ View toggle ============ -->
    <div class="view-toggle" role="tablist">
      <button class="toggle-btn active" data-view="text" role="tab" aria-selected="true">النص</button>
      <button class="toggle-btn" data-view="flashcards" role="tab" aria-selected="false">البطاقات التعليمية</button>
    </div>

    <!-- ============ Text view ============ -->
    <section class="view-panel" id="view-text" data-active="true">
      <article class="lesson-text" id="lessonText">
        <!-- populated by JS: headings + paragraphs -->
      </article>
    </section>

    <!-- ============ Flashcards view ============ -->
    <section class="view-panel" id="view-flashcards" data-active="false">
      <div class="flashcard-stage">

        <div class="flashcard-counter">
          <span id="cardIndex">١</span> / <span id="cardTotal">٥٥</span>
        </div>

        <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="اضغط لقلب البطاقة">
          <div class="flashcard-inner" id="flashcardInner">
            <div class="flashcard-face flashcard-front">
              <p class="flashcard-label">سؤال</p>
              <p class="flashcard-content" id="cardQuestion"></p>
            </div>
            <div class="flashcard-face flashcard-back">
              <p class="flashcard-label">جواب</p>
              <p class="flashcard-content" id="cardAnswer"></p>
            </div>
          </div>
        </div>

        <div class="flashcard-nav">
          <button class="fc-btn" id="prevCard">السابق</button>
          <button class="fc-btn fc-btn-flip" id="flipCard">قلب البطاقة</button>
          <button class="fc-btn" id="nextCard">التالي</button>
        </div>

        <button class="fc-shuffle" id="shuffleCards">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M17 3l4 4-4 4M3 7h13a4 4 0 010 8H7m10 6l4-4-4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          ترتيب عشوائي
        </button>
      </div>
    </section>

  </main>
</div>

<script>
window.EMBEDDED_LESSONS = {
  "lessons": [
    {
      "id": "lesson-1",
      "number": 1,
      "title": "الدرس الأول: مقدمات في أهمية التوحيد وتعريفه وأقسامه",

      "audioSrc": null,
      "paragraphs": [
        {
          "id": 0,
          "type": "paragraph",
          "text": "نَصُّ الدَّرْسِ الْأَوَّلِ مُوَشَّحًا بِالْحَرَكَاتِ الْكَامِلَةِ",
          "start": null,
          "end": null
        },
        {
          "id": 1,
          "type": "heading",

          "start": null,
          "end": null
        },
        {
          "id": 2,
          "type": "paragraph",
          "text": "مُقَدِّمَاتٌ مُهِمَّةٌ. الْمُقَدِّمَةُ الْأُولَى: أَهَمِّيَّةُ دِرَاسَةِ التَّوْحِيدِ. لِمَاذَا نَدْرُسُ التَّوْحِيدَ؟ لِمَاذَا نَحْرِصُ عَلَى دَعْوَةِ التَّوْحِيدِ؟ لِمَاذَا يَعِيبُ أَهْلُ الْبَاطِلِ مِنْ عُبَّادِ الْقُبُورِ وَنَحْوِهِمْ عَلَى أَهْلِ السُّنَّةِ الدَّعْوَةَ إِلَى التَّوْحِيدِ؟ لِمَاذَا اسْتَمْسَكَ أَهْلُ الْحَقِّ بِهَذِهِ الدَّعْوَةِ؟",
          "start": null,
          "end": null

        {
          "id": 3,
          "type": "paragraph",
          "text": "أَوَّلًا: يَهْتَمُّ أَهْلُ السُّنَّةِ وَطُلَّابُ الْعِلْمِ بِدِرَاسَةِ التَّوْحِيدِ لِأَنَّهُ أَوَّلُ دَعْوَةِ الْأَنْبِيَاءِ وَالرُّسُلِ وَآخِرُهَا، فَهِيَ أَوَّلُ دَعْوَةِ الْأَنْبِيَاءِ وَالرُّسُلِ وَآخِرُهَا. قَالَ جَلَّ وَعَلَا: {وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ}. قَوْلُهُ: \"فِي كُلِّ\" مِنْ أَلْفَاظِ الْعُمُومِ، فَكُلُّ رَسُولٍ أَرْسَلَهُ اللَّهُ جَلَّ وَعَلَا فِي أُمَّةٍ مِنَ الْأُمَمِ إِلَّا وَأَمَرَهُ بِالتَّوْحِيدِ. كَيْفَ عَرَفْنَا؟ لِأَنَّ كُلَّ أَمْرٍ بِالْعِبَادَةِ فِي كِتَابِ اللَّهِ جَلَّ وَعَلَا وَفِي سُنَّةِ نَبِيِّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هُوَ أَمْرٌ بِالتَّوْحِيدِ. وَكَذَلِكَ الْأَنْبِيَاءُ يَقُولُونَ لِأَقْوَامِهِمْ: \"يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَهٍ غَيْرُهُ\". إِذَا قُلْنَا هُوَ أَوَّلُ دَعْوَةِ التَّوْحِيدِ وَآخِرُهُ؛ إِذًا أَوَّلُهَا هَذِهِ مَاذَا؟ وَاضِحَةٌ جِدًّا صَحِيحٌ أَوْ لَا؟ وَآخِرُهَا تَظْهَرُ فِي قَوْلِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ كَانَ آخِرُ كَلَامِهِ لَا إِلَهَ إِلَّا اللَّهُ دَخَلَ الْجَنَّةَ\". وَالنَّبِيُّ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ فِي مَرَضِ مَوْتِهِ كَانَ يَقُولُ: \"لَعَنَ اللَّهُ الْيَهُودَ وَالنَّصَارَى اتَّخَذُوا قُبُورَ أَنْبِيَائِهِمْ مَسَاجِدَ\". كَانَ يُغْمَى عَلَيْهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَإِذَا اسْتَفَاقَ قَالَ هَذَا الْكَلَامَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِيَتَبَيَّنَ لَنَا يَا طُلَّابَ الْعِلْمِ عَظِيمُ دَعْوَةِ التَّوْحِيدِ عِنْدَ الْأَنْبِيَاءِ وَالرُّسُلِ وَأَتْبَاعِهِمْ. وَكَذَلِكَ مِنَ الدَّلَائِلِ عَلَى أَنَّهَا آخِرُ مَا يُدْعَى إِلَيْهِ النَّاسُ مَا جَاءَ فِي حَدِيثِ أَبِي طَالِبٍ أَنَّ النَّبِيَّ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ قَالَ: \"يَا عَمَّاهُ، قُلْ لَا إِلَهَ إِلَّا اللَّهُ، كَلِمَةً أُحَاجُّ لَكَ بِهَا عِنْدَ اللَّهِ\".",
          "start": null,
          "end": null
        },
        {
          "id": 4,
          "type": "paragraph",
          "text": "وَلِعَظِيمِ أَهَمِّيَّةِ التَّوْحِيدِ أَنَّ أَوَّلَ أَمْرٍ فِي الْقُرْآنِ هُوَ أَمْرٌ بِهِ، مَا هُوَ أَوَّلُ أَمْرٍ فِي الْقُرْآنِ؟ {يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ وَالَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ}. هَذَا أَوَّلُ أَمْرٍ فِي الْقُرْآنِ الْكَرِيمِ، أَوَّلُ أَمْرٍ كَانَ بِمَاذَا؟ بِتَوْحِيدِ اللَّهِ؛ لِأَنَّهُ مَرَّ مَعَنَا أَنَّ كُلَّ أَمْرٍ بِالْعِبَادَةِ هُوَ أَمْرٌ بِالتَّوْحِيدِ. إِذًا الْأَمْرُ الْأَوَّلُ قُلْنَا نَدْرُسُ عِلْمَ التَّوْحِيدِ لِأَنَّهُ أَوَّلُ دَعْوَةِ الْأَنْبِيَاءِ وَالرُّسُلِ.",
          "start": null,
          "end": null
        },
        {
          "id": 5,
          "type": "paragraph",
          "text": "ثَانِيًا: لِأَنَّهُ مِنْ أَجْلِهِ خَلَقَ اللَّهُ الْخَلْقَ، اللَّهُ عَزَّ وَجَلَّ خَلَقَ الْخَلْقَ لِعِبَادَتِهِ جَلَّ وَعَلَا، كَمَا قَالَ الْحَافِظُ الْحَكَمِيُّ رَحِمَهُ اللَّهُ: \"خَلَقَ الْخَلْقَ لِيَعْبُدُوهُ وَبِالْإِلَهِيَّةِ يُفْرِدُوهُ\". وَقَالَ جَلَّ وَعَلَا: {وَمَا خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ}. وَسَيَأْتِي الْكَلَامُ عَنْ هَذِهِ الْآيَةِ مُفَصَّلًا فِي ذِكْرِ الْمُصَنِّفِ لَهَا رَحِمَهُ اللَّهُ، وَمَعْنَى \"يَعْبُدُونِ\" عَلَى أَحَدِ التَّفَاسِيرِ أَنَّهَا بِمَعْنَى \"يُوَحِّدُونَ\". {وَمَا خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ} جَاءَ تَفْسِيرُهَا عَلَى أَحَدِ أَوْجُهِ التَّفْسِيرِ أَنَّ \"يَعْبُدُونِ\" يُوَحِّدُونِ.",
          "start": null,
          "end": null
        },
        {
          "id": 6,
          "type": "paragraph",
          "text": "ثَالِثًا: أَنَّ أَعْظَمَ آيَةٍ فِي كِتَابِ اللَّهِ جَلَّ وَعَلَا بَدَأَتْ بِالتَّوْحِيدِ، مَا هِيَ أَعْظَمُ آيَةٍ؟ {اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ}. رَابِعًا: أَنَّ أَعْظَمَ سُورَةٍ فِي كِتَابِ اللَّهِ جَلَّ وَعَلَا اشْتَمَلَتْ عَلَيْهِ، وَأَعْظَمُ سُورَةٍ هِيَ الْفَاتِحَةُ. فَاتِحَةٌ، فَاتِحَةٌ.",

        {

        {

          "text": "سَادِسًا: أَنَّهُ أَوَّلُ وَاجِبٍ عَلَى الْعِبَادِ كَمَا جَاءَ فِي حَدِيثِ عَبْدِ اللَّهِ بْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ النَّبِيَّ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ لَمَّا بَعَثَ مُعَاذًا إِلَى الْيَمَنِ قَالَ لَهُ: \"إِنَّكَ تَقْدَمُ عَلَى قَوْمٍ مِنْ أَهْلِ الْكِتَابِ، فَلْيَكُنْ أَوَّلَ مَا تَدْعُوهُمْ إِلَيْهِ إِلَى أَنْ يُوَحِّدُوا اللَّهَ\".",

        {

        {

        {
          "id": 12,

          "text": "تَاسِعًا: أَنَّهُ مِنْ أَعْظَمِ أَسْبَابِ تَحْقِيقِ الْأَمْنِ وَالِاسْتِخْلَافِ وَالتَّمْكِينِ فِي الْأَرْضِ. قَالَ جَلَّ وَعَلَا: {وَعَدَ اللَّهُ الَّذِينَ آمَنُوا مِنْكُمْ وَعَمِلُوا الصَّالِحَاتِ لَيَسْتَخْلِفَنَّهُمْ فِي الْأَرْضِ كَمَا اسْتَخْلَفَ الَّذِينَ مِنْ قَبْلِهمْ وَلَيُمَكِّنَنَّ لَهُمْ دِينَهُمُ الَّذِي ارْتَضَى لَهُمْ وَلَيُبَدِّلَنَّهُمْ مِنْ بَعْدِ خَوْفِهِمْ أَمْنًا يَعْبُدُونَنِي لَا يُشْرِكُونَ بِي شَيْئًا}. وَقَالَ جَلَّ وَعَلَا: {الَّذِينَ آمَنُوا وَلَمْ يَلْبِسُوا إِيمَانَهُمْ بِظُلْمٍ أُولَئِكَ لَهُمُ الْأَمْنُ وَهُمْ مُهْتَدُونَ}.",

        {
          "id": 13,

          "text": "عَاشِرًا: أَنَّهُ مِنْ أَعْظَمِ أَسْبَابِ تَفْرِيجِ الْكُرُبَاتِ فِي الدُّنْيَا وَالْآخِرَةِ، أَيْ وَاللَّهِ، التَّوْحِيدُ يَا طُلَّابَ الْعِلْمِ مِنْ أَعْظَمِ أَسْبَابِ تَفْرِيجِ الْكُرُبَاتِ فِي الدُّنْيَا وَكَذَلِكَ فِي الْآخِرَةِ بِإِذْنِ اللَّهِ. قَالَ جَلَّ وَعَلَا: {وَذَا النُّونِ إِذْ ذَهَبَ مُغَاضِبًا فَظَنَّ أَنْ لَنْ نَقْدِرَ عَلَيْهِ فَنَادَى فِي الظُّلُمَاتِ} لِمَاذَا نَادَى يَا طُلَّابَ الْعِلْمِ؟ بِالتَّوْحِيدِ: {أَنْ لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ}. لَمَّا قَالَ هَذَا الدُّعَاءَ مَا الَّذِي حَصَلَ؟ فَرَّجَ اللَّهُ جَلَّ وَعَلَا عَنْهُ هَذِهِ الْكُرْبَةَ، قَالَ: {فَاسْتَجَبْنَا لَهُ وَنَجَّيْنَاهُ مِنَ الْغَمِّ وَكَذَلِكَ نُنْجِي الْمُؤْمِنِينَ}. فَاللَّهُ عَزَّ وَجَلَّ ذَكَرَ فِي هَذِهِ الْآيَةِ أَنَّ مِنْ أَعْظَمِ أَسْبَابِ النَّجَاةِ هُوَ تَوْحِيدُ اللَّهِ تَبَارَكَ وَتَعَالَى.",

          "text": "وَهُوَ \"الْقَوْلُ السَّدِيدُ فِي الرَّدِّ عَلَى مَنْ أَنْكَرَ تَقْسِيمَ التَّوْحِيدِ\" لِلشَّيْخِ عَبْدِ الرَّزَّاقِ الْبَدْرِ حَفِظَهُ اللَّهُ جَلَّ وَعَلَا، وَنَقُولُ يَا طُلَّابَ الْعِلْمِ إِنَّ هَذَا التَّقْسِيمَ الثُّلَاثِيَّ أَوِ الثُّنَائِيَّ لَيْسَ تَقْسِيمًا بِدْعِيًّا، وَقَدْ دَلَّ عَلَى هَذَا التَّقْسِيمِ أَوَّلًا: التَّتَبُّعُ وَالِاسْتِقْرَاءُ لِأَدِلَّةِ الْكِتَابِ وَالسُّنَّةِ، فَإِنَّ النَّاظِرَ وَالْمُتَأَمِّلَ فِي أَدِلَّةِ الْكِتَابِ وَالسُّنَّةِ يَجِدُ أَنَّ التَّوْحِيدَ عَلَى ثَلَاثَةِ أَقْسَامٍ: تَوْحِيدُ الرُّبُوبِيَّةِ وَالْأُلُوهِيَّةِ وَالْأَسْمَاءِ وَالصِّفَاتِ. ثَانِيًا: أَنَّ هَذَا التَّقْسِيمَ مَعْرُوفٌ قَبْلَ شَيْخِ الْإِسْلَامِ ابْنِ تَيْمِيَّةَ؛ لِأَنَّكُمُ الْيَوْمَ تَسْمَعُونَ هَذَا التَّقْسِيمَ لَمْ يَأْتِ بِهِ إِلَّا شَيْخُ الْإِسْلَامِ ابْنُ تَيْمِيَّةَ وَبَعْضُهُمْ يَقُولُ هَذَا التَّقْسِيمُ مَا أَتَى بِهِ إِلَّا مُحَمَّدُ بْنُ عَبْدِ الْوَهَّابِ وَغَيْرُ ذَلِكَ مِنَ التُّرَّهَاتِ، بَلْ هَذَا التَّقْسِيمُ يَا إِخْوَانِي كَمَا قُلْنَا دَلَّ عَلَيْهِ مَاذَا؟ التَّتَبُّعُ وَالِاسْتِقْرَاءُ ثُمَّ دَلَّ عَلَيْهِ كَلَامُ الْأَئِمَّةِ. أَبُو حَنِيفَةَ تَيْمِيٌّ أَوْ وَهَّابِيٌّ؟ هَا! أَبُو حَنِيفَةَ تُوُفِّيَ سَنَةَ كَمْ؟ سَنَةَ خَمْسِينَ وَمِائَةٍ مِنْ هِجْرَةِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ وَسَلَّمَ قَالَ كَمَا فِي كِتَابِ الْفِقْهِ الْأَكْبَرِ: \"وَاللَّهُ تَعَالَى يُدْعَى مِنْ أَعْلَى لَا مِنْ أَسْفَلَ؛ لِأَنَّ الْأَسْفَلَ لَيْسَ مِنْ وَصْفِ الرُّبُوبِيَّةِ وَالْأُلُوهِيَّةِ فِي شَيْءٍ\". إِذًا هَذِهِ الْأَلْفَاظُ مَنْ أَثْبَتَهَا قَبْلَ شَيْخِ الْإِسْلَامِ ابْنِ تَيْمِيَّةَ رَحِمَهُ اللَّهُ جَلَّ وَعَلَا؟ أَبُو حَاتِمٍ وَهُوَ مُحَمَّدُ بْنُ حِبَّانَ الْبُسْتِيُّ",

        {
          "id": 28,
          "type": "paragraph",
          "text": "تُوُفِّيَ سَنَةَ أَرْبَعٍ وَخَمْسِينَ وَثَلَاثِمِائَةٍ مِنْ هِجْرَةِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ فِي مُقَدِّمَةِ كِتَابِهِ \"رَوْضَةِ الْعُقَلَاءِ وَنُزْهَةِ الْفُضَلَاءِ\": \"الْحَمْدُ لِلَّهِ الْمُتَفَرِّدِ بِوَحْدَانِيَّةِ الْأُلُوهِيَّةِ، الْحَمْدُ لِلَّهِ الْمُتَفَرِّدِ بِوَحْدَانِيَّةِ الْأُلُوهِيَّةِ وَبِعَظَمَةِ مَاذَا؟ الرُّبُوبِيَّةِ\" فَذَكَرَ ابْنُ حِبَّانَ الْبُسْتِيُّ رَحِمَهُ اللَّهُ جَلَّ وَعَلَا هَذَا التَّقْسِيمَ كَذَلِكَ، وَقَالَ بِهِ ابْنُ جَرِيرٍ الطَّبَرِيُّ وَابْنُ بَطَّةَ الْعُكْبَرِيُّ وَأَبُو بَكْرٍ الطُّرْطُوشِيُّ الْمَالِكِيُّ رَحِمَهُمُ اللَّهُ وَغَيْرُ هَؤُلَاءِ مِنْ أَئِمَّةِ وَعُلَمَاءِ... ثَالِثًا: أَنَّ هَذَا التَّقْسِيمَ مِنْ جِنْسِ تَقْسِيمَاتِ الْعُلَمَاءِ الْأُخْرَى كَتَقْسِيمِ الْأَمْرِ إِلَى مَاذَا؟ إِلَى وَاجِبٍ وَمَنْدُوبٍ، صَحِيحٌ أَوْ لَا؟ كَتَقْسِيمِ الْأَوَامِرِ، وَتَقْسِيمِ النَّوَاهِي إِلَى مَاذَا؟ إِلَى مُحَرَّمٍ وَمَكْرُوهٍ، فَهَذَا التَّقْسِيمُ لِمَاذَا؟ الْغَايَةُ مِنْهُ هُوَ تَقْرِيبُ الْعِلْمِ وَبَيَانُهُ لِلنَّاسِ، فَهَذَا مِنْ جِنْسِ تَقْسِيمَاتِ الْعُلَمَاءِ الْأُخْرَى. وَسَبَبُ ظُهُورِ هَذَا التَّقْسِيمِ بِشَكْلٍ وَاضِحٍ فِي كَلَامِ شَيْخِ الْإِسْلَامِ ابْنِ تَيْمِيَّةَ يَا طُلَّابَ الْعِلْمِ وَمِنْ بَعْدِهِ مِنْ طُلَّابِهِ، لِمَاذَا انْتَشَرَ هَذَا التَّقْسِيمُ؟ لِمَاذَا؟ لِأَنَّ الْخَلَلَ وَالضَّلَالَ فِي مَسَائِلِ التَّوْحِيدِ انْتَشَرَ وَعَمَّ فِي ذَلِكَ الْعَهْدِ، فَاضْطُرَّ الْعُلَمَاءُ فِي ذَلِكَ الزَّمَانِ إِلَى مَاذَا؟ إِلَى بَيَانِ وَنَشْرِ هَذِهِ الِاصْطِلَاحَاتِ لِبَيَانِ الْعِلْمِ أَنَّ تَوْحِيدَ الرُّبُوبِيَّةِ وَحْدَهُ لَا يَكْفِي لِدُخُولِ الْمَرْءِ فِي الْإِسْلَامِ، وَأَنَّ هَذَا الْقِسْمَ مِنَ التَّوْحِيدِ لَا بُدَّ لَهُ مِنَ الْأَقْسَامِ مَاذَا؟ الْأُخْرَى",

        {
          "id": 30,
          "type": "paragraph",
          "text": "الْمُقَدِّمَةُ السَّادِسَةُ وَنَخْتِمُ بِهَذِهِ الْمُقَدِّمَةِ: قَوَاعِدُ مُهِمَّةٌ فِي تَوْحِيدِ الْعِبَادَةِ. الْقَاعِدَةُ الْأُولَى: الْعِبَادَةُ هِيَ الْغَايَةُ الَّتِي خَلَقَ اللَّهُ لَهَا الْخَلْقَ مِنْ جِهَةِ أَمْرِهِ وَمَحَبَّتِهِ، وَالْعِبَادَةُ هِيَ الْغَايَةُ الَّتِي خَلَقَ اللَّهُ لَهَا الْخَلْقَ مِنْ جِهَةِ أَمْرِهِ وَمَحَبَّتِهِ وَرِضَاهُ. الْقَاعِدَةُ الثَّانِيَةُ: لَيْسَ فِي الشَّرِيعَةِ - هَذَا مُهِمٌّ سَيَأْتِي مَعَنَا سَنَحْتَاجُ هَذِهِ الْقَوَاعِدَ أَثْنَاءَ الشَّرْحِ لِذَلِكَ لَا بُدَّ أَنْ تُحْفَظَ - لَيْسَ فِي الشَّرِيعَةِ بُقْعَةٌ تُقْصَدُ لِلْعِبَادَةِ لِذَاتِهَا إِلَّا الْمَسَاجِدُ وَمَشَاعِرُ الْحَجِّ. قَالَ شَيْخُ الْإِسْلَامِ ابْنُ تَيْمِيَّةَ رَحِمَهُ اللَّهُ: \"وَأَصْلُ دِينِ الْمُسْلِمِينَ أَنَّهُ لَا تَخْتَصُّ بُقْعَةٌ بِقَصْدِ الْعِبَادَةِ فِيهَا إِلَّا الْمَسَاجِدُ خَاصَّةً وَمَشَاعِرُ الْحَجِّ كَعَرَفَةَ وَمُزْدَلِفَةَ وَمِنًى وَنَحْوِ ذَلِكَ\". إِذًا الَّذِي يَقْصِدُ بُقْعَةً بِعَيْنِهَا لِلتَّعَبُّدِ فِيهَا مَاذَا يُقَالُ لَهُ؟ لَيْسَ فِي الشَّرِيعَةِ بُقْعَةٌ تُقْصَدُ لِلْعِبَادَةِ لِذَاتِهَا إِلَّا الْمَسَاجِدُ، فَمَنْ أَرَادَ أَنْ يُصَلِّيَ عِنْدَ الْقُبُورِ نَرُدُّ عَلَيْهِ بِهَذِهِ الْقَاعِدَةِ، مَنْ أَرَادَ شَدَّ الرِّحَالِ إِلَى غَيْرِ الْمَسَاجِدِ الثَّلَاثَةِ الَّتِي ذَكَرَهَا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَاذَا يُرَدُّ عَلَيْهِ؟ بِهَذِهِ الْقَاعِدَةِ وَغَيْرِ ذَلِكَ. الْقَاعِدَةُ الثَّالِثَةُ: أَنَّ الْخُصُومَةَ بَيْنَ الرُّسُلِ وَأَقْوَامِهِمْ إِنَّمَا كَانَتْ فِي إِفْرَادِ اللَّهِ بِالْعِبَادَةِ وَتَرْكِ عِبَادَةِ مَا سِوَاهُ. إِذًا الْخُصُومَةُ بَيْنَ الْأَنْبِيَاءِ وَأَقْوَامِهِمْ يَا طُلَّابَ الْعِلْمِ فِي مَاذَا؟",

        {
          "id": 31,
          "type": "paragraph",
          "text": "فِي تَوْحِيدِ مَاذَا؟ الْعِبَادَةِ، هَذَا هُوَ الْغَالِبُ وَهَذَا هُوَ الْأَصْلُ فِي هَذِهِ الْخُصُومَةِ. قَالَ جَلَّ وَعَلَا: {وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ}، وَقَالَ تَبَارَكَ وَتَعَالَى: {وَمَا أَرْسَلْنَا مِنْ قَبْلِكَ مِنْ رَسُولٍ إِلَّا نُوحِي إِلَيْهِ أَنَّهُ لَا إِلَهَ إِلَّا أَنَا فَاعْبُدُونِ}، فَكُلُّ رَسُولٍ أَرْسَلَهُ اللَّهُ جَلَّ وَعَلَا إِلَّا بِمَاذَا؟ بِهَذَا التَّوْحِيدِ. قَالَ شَيْخُ الْإِسْلَامِ مُحَمَّدُ بْنُ عَبْدِ الْوَهَّابِ رَحِمَهُ اللَّهُ: \"وَالْعِبَادَةُ هِيَ التَّوْحِيدُ؛ لِأَنَّ الْخُصُومَةَ بَيْنَ الْأَنْبِيَاءِ وَالْأُمَمِ فِيهِ\". الْقَاعِدَةُ الرَّابِعَةُ وَكَذَلِكَ هِيَ قَاعِدَةٌ مُهِمَّةٌ سَنَحْتَاجُهَا فِي بَابِ التَّبَرُّكِ: الْبَرَكَةُ لِلَّهِ وَصْفًا وَمِلْكًا وَفِعْلًا. إِيش مَعْنَى هَذَا الْكَلَامِ؟ مَعْنَاهُ أَنَّ كُلَّ بَرَكَةٍ فِي الْكَوْنِ هِيَ مِنْ آثَارِ بَرَكَتِهِ جَلَّ وَعَلَا، فَإِذَا تَقَرَّرَ هَذَا وَأَنَّ الْبَرَكَةَ مِنَ اللَّهِ جَلَّ وَعَلَا فَالْوَاجِبُ أَوَّلًا أَلَّا تُرْجَى هَذِهِ الْبَرَكَةُ إِلَّا مِنَ اللَّهِ، فَالْوَاجِبُ أَوَّلًا أَلَّا تُرْجَى هَذِهِ الْبَرَكَةُ إِلَّا مِنَ اللَّهِ، ثَانِيًا وَأَلَّا تُلتَمَسَ إِلَّا بِمَا شَرَعَ اللَّهُ، فَلَا تُطْلَبُ إِلَّا مِمَّنْ ثَبَتَتْ بَرَكَتُهُ عَنِ الشَّارِعِ. يَكْفِي؟ لَا يَكْفِي. عَلَى وَفْقِ الْكَيْفِيَّةِ الْوَارِدَةِ فِي الشَّرْعِ. فَالنَّبِيُّ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ بَرَكَتُهُ ذَاتِيَّةٌ، صَحِيحٌ أَوْ لَا؟ لِأَنَّ الصَّحَابَةَ كَانُوا يَتَبَرَّكُونَ بِعَرَقِهِ وَنُخَامَتِهِ وَفَضْلِ وُضُوئِهِ صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ وَسَلَّمَ. الصَّالِحُونَ إِيش الْبَرَكَةُ؟ الْمُؤْمِنُ إِيش الْبَرَكَةُ؟",

          "text": "ذَاتِيَّةٌ؟ لَا. لِذَلِكَ الْيَوْمَ الَّذِي يَفْعَلُهُ النَّاسُ مِنَ التَّبَرُّكِ بِذَوَاتِ الصَّالِحِينَ هَذَا مُخَالِفٌ لِشَرِيعَةِ اللَّهِ جَلَّ وَعَلَا. لِمَاذَا؟ مَنْ يُجِيبُ مِنْ خِلَالِ مَا ذَكَرْنَا الْآنَ؟ مَنْ يُجِيبُ؟ هَا؟ لِأَنَّ الْبَرَكَةَ لَا تُطْلَبُ إِلَّا مِمَّنْ ثَبَتَتْ بَرَكَتُهُ عَنِ الشَّارِعِ عَلَى وَفْقِ - وَهَذَا الْمُهِمُّ يَا إِخْوَانُ - عَلَى وَفْقِ الْكَيْفِيَّةِ الْوَارِدَةِ فِي الشَّرْعِ، صَحِيحٌ أَوْ لَا؟ يَأْتِي إِنْسَانٌ يَتَبَرَّكُ بِالصَّالِحِينَ بِذَوَاتِهِمْ وَيَقُولُ \"الْمُؤْمِنُ مُبَارَكٌ وَقَدْ دَلَّتِ السُّنَّةُ عَلَى ذَلِكَ\" نَقُولُ نَعَمْ دَلَّتِ السُّنَّةُ عَلَى بَرَكَةِ مَاذَا؟ الْمُؤْمِنِ صَحِيحٌ أَوْ لَا؟ لَكِنَّ هَذِهِ الْبَرَكَةَ لَا تَكُونُ إِلَّا عَلَى وَفْقِ مَاذَا؟ الْكَيْفِيَّةِ الْوَارِدَةِ فِي الشَّرْعِ، فَإِذَا ضَبَطْتَ هَذِهِ الْمَسْأَلَةَ يَا طَالِبَ الْعِلْمِ فَهِمْتَ مَسَائِلَ الْبَرَكَةِ وَسَيَأْتِي تَفْصِيلُهَا فِي بَابِهَا بِإِذْنِ اللَّهِ جَلَّ وَعَلَا. الْقَاعِدَةُ الْخَامِسَةُ: أَنَّ التَّوَجُّهَ إِلَى شَيْءٍ أَوْ إِلَى جِهَةٍ بِقَصْدِ الْقُرْبَةِ وَحُصُولِ الثَّوَابِ عِبَادَةٌ. أُعِيدُ عَلَيْكُمُ الْقَاعِدَةَ: أَنَّ التَّوَجُّهَ إِلَى شَيْءٍ أَوْ إِلَى جِهَةٍ بِقَصْدِ الْقُرْبَةِ وَحُصُولِ الثَّوَابِ فَهُوَ مَاذَا؟ فَهُوَ عِبَادَةٌ. نَضْرِبُ مِثَالًا: اسْتِقْبَالُ الْقِبْلَةِ عِبَادَةٌ أَمْ مَا هُوَ عِبَادَةٌ؟ عِبَادَةٌ؛ لِأَنَّ اللَّهَ جَلَّ وَعَلَا يَقُولُ: {قَدْ نَرَى تَقَلُّبَ وَجْهِكَ فِي السَّمَاءِ فَلَنُوَلِّيَنَّكَ قِبْلَةً تَرْضَاهَا فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ}. طَيِّبٌ الَّذِي يَذْهَبُ إِلَى الْمَسْجِدِ النَّبَوِيِّ وَيَسْتَقْبِلُ الْقَبْرَ وَالْحُجْرَةَ وَيَرْفَعُ يَدَهُ بِالدُّعَاءِ، إِيش هَذَا؟ إِيش هَذَا؟",

        {
          "id": 34,
          "type": "paragraph",
          "text": "الْقَاعِدَةُ وَرَدَ بِالْقَاعِدَةِ: التَّوَجُّهُ إِلَى شَيْءٍ أَوْ جِهَةٍ بِقَصْدِ الْقُرْبَةِ وَحُصُولِ الثَّوَابِ مَاذَا؟ عِبَادَةٌ. فَهُوَ مَا تَوَجَّهَ إِلَى الْقَبْرِ النَّبَوِيِّ وَإِلَى الْحُجْرَةِ إِلَّا عَلَى هَذَا مَاذَا؟ الْأَمْرِ، فَيَكُونُ هَذَا الْأَمْرُ مَاذَا؟ مُخَالِفًا لِشَرْعِ اللَّهِ جَلَّ وَعَلَا. وَالْأَمْثِلَةُ عَلَى ذَلِكَ كَثِيرَةٌ سَتَأْتِي فِي مَوَاطِنِهَا إِنْ شَاءَ اللَّهُ تَعَالَى. الْمُهِمُّ عِنْدِي الْآنَ أَنْ تَضْبِطَ هَذِهِ الْقَوَاعِدَ. الْقَاعِدَةُ السَّادِسَةُ: الْعِبَادَةُ لَا تُسَمَّى عِبَادَةً فِي حُكْمِ الشَّارِعِ إِلَّا مَعَ التَّوْحِيدِ. لِمَاذَا يَا طُلَّابَ الْعِلْمِ؟ لِأَنَّ الْعِبَادَةَ مَهْمَا عَظُمَتْ عِنْدَ فَاعِلِهَا مَعَ الشِّرْكِ لَا تَنْفَعُ: {وَلَقَدْ أُوحِيَ إِلَيْكَ وَإِلَى الَّذِينَ مِنْ قَبْلِكَ لَئِنْ أَشْرَكْتَ لَيَحْبَطَنَّ عَمَلُكَ} صَحِيحٌ أَوْ لَا؟ فَالشِّرْكُ مُحْبِطٌ لِجَمِيعِ الْأَعْمَالِ. لَوْ يَأْتِي إِنْسَانٌ يَقُومُ اللَّيْلَ، يَصُومُ النَّهَارَ، يَتَصَدَّقُ عَلَى الْمَسَاكِينِ، وَيَخْرُجُ إِلَى الْجِهَادِ ثُمَّ هُوَ يَدْعُو غَيْرَ اللَّهِ، وَيَنْذُرُ لِغَيْرِ اللَّهِ تَبَارَكَ وَتَعَالَى، وَيَذْبَحُ لِغَيْرِ اللَّهِ جَلَّ وَعَلَا، هَلْ تَنْفَعُهُ هَذِهِ الطَّاعَاتُ وَالْعِبَادَاتُ؟ الْجَوَابُ لَا تَنْفَعُهُ؛ لِمَاذَا؟ لِأَنَّ الْعِبَادَةَ لَا تُسَمَّى عِبَادَةً إِلَّا مَعَ التَّوْحِيدِ، أَيْ فِي حُكْمِ الشَّرْعِ. الْقَاعِدَةُ السَّابِعَةُ: الْعِبَادَةُ لَا تَكُونُ إِلَّا مَعَ غَايَةِ الذُّلِّ وَغَايَةِ الْحُبِّ، وَلَا تَنْفَعُ عِبَادَةٌ بِوَاحِدٍ دُونَ الْآخَرِ. إِذًا لِأَنَّ الْعِبَادَةَ اسْمٌ يَجْمَعُ كَمَالَ الْحُبِّ لِلَّهِ وَنِهَايَتَهُ، وَكَمَالَ الذُّلِّ لِلَّهِ وَنِهَايَتَهُ، فَالْحُبُّ الْخَلِيُّ عَنْ ذُلٍّ هَا؟ لَا يُسَمَّى عِبَادَةً، وَالذُّلُّ الْخَلِيُّ عَنْ حُبٍّ لَا يُسَمَّى عِبَادَةً",

        {
          "id": 35,
          "type": "paragraph",
          "text": "وَإِنَّمَا الْعِبَادَةُ مَا يَجْمَعُ كَمَالَ الْأَمْرَيْنِ، أَيْ كَمَالَ الْحُبِّ لِلَّهِ وَكَمَالَ الذُّلِّ لِلَّهِ جَلَّ وَعَلَا. إِذًا يَا طُلَّابَ الْعِلْمِ الْعِبَادَةُ تُبْنَى عَلَى رُكْنَيْنِ اثْنَيْنِ: الرُّكْنُ الْأَوَّلُ مَحَبَّةُ الْمَعْبُودِ، وَالرُّكْنُ الثَّانِي الذُّلُّ وَالْخُضُوعُ لَهُ، فَلَا يَكُونُ حُبٌّ بِدُونِ ذُلٍّ لِلْمَعْبُودِ، وَلَا يَنْفَعُ ذُلٌّ بِدُونِ مَحَبَّةٍ لِلْمَعْبُودِ، وَسَيَأْتِي مَعَنَا فِي أَثْنَاءِ هَذَا الشَّرْحِ. الْقَاعِدَةُ الثَّامِنَةُ وَهَذِهِ مُهِمَّةٌ كَذَلِكَ: الرُّبُوبِيَّةُ وَالْأُلُوهِيَّةُ مَفْهُومَانِ مُتَغَايِرَانِ. الرُّبُوبِيَّةُ وَالْأُلُوهِيَّةُ مَفْهُومَانِ مُتَغَايِرَانِ فَإِذَا افْتَرَقَا اقْتَرَنَا، وَإِذَا اقْتَرَنَا افْتَرَقَا، فَالرُّبُوبِيَّةُ وَالْأُلُوهِيَّةُ صِفَتَانِ لِلَّهِ جَلَّ وَعَلَا وَقَدْ تَفَرَّدَ بِهِمَا دُونَ أَحَدٍ مِنْ خَلْقِهِ، فَهُوَ الرَّبُّ وَهُوَ الْمَعْبُودُ جَلَّ وَعَلَا. قَالَ شَيْخُ الْإِسْلَامِ ابْنُ تَيْمِيَّةَ رَحِمَهُ اللَّهُ عَلَيْهِ: \"وَذَلِكَ أَنَّ الِاسْمَ الْوَاحِدَ تَخْتَلِفُ دَلَالَتُهُ بِالْإِفْرَادِ وَالِاقْتِرَانِ، فَقَدْ يَكُونُ عِنْدَ الْإِفْرَادِ فِيهِ عُمُومٌ لِمَعْنَيَيْنِ وَعِنْدَ الِاقْتِرَانِ لَا يَدُلُّ إِلَّا عَلَى أَحَدِهِمَا\". نَضْرِبُ مِثَالًا قَبْلَ أَنْ نَأْتِيَ، ذَكَرْنَا سَابِقًا فِي مَسْأَلَةِ الْإِيمَانِ وَالْإِسْلَامِ أَنَّ الْإِيمَانَ وَالْإِسْلَامَ إِذَا اجْتَمَعَا افْتَرَقَا وَإِذَا افْتَرَقَا اجْتَمَعَا. فَأَيْنَ الدَّلِيلُ عَلَى هَذَا؟ {قَالَتِ الْأَعْرَابُ آمَنَّا قُلْ لَمْ تُؤْمِنُوا وَلَكِنْ قُولُوا أَسْلَمْنَا}. دَلَّتْ هَذِهِ الْآيَةُ عَلَى أَنَّ الْإِسْلَامَ وَالْإِيمَانَ مَاذَا؟ إِذَا اجْتَمَعَا مَاذَا؟ افْتَرَقَا. مَا مَعْنَى إِذَا اجْتَمَعَا افْتَرَقَا؟ أَيْ أَصْبَحَ لِكُلِّ وَاحِدٍ مِنْهُمَا",

          "text": "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ. كِتَابُ التَّوْحِيدِ وَقَوْلُ اللَّهِ تَعَالَى: {وَمَا خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ}. قَبْلَ أَنْ نَشْرَعَ فِي الشَّرْحِ نَأْخُذُ إِعْرَابَ الْبَسْمَلَةِ، نَأْخُذُ إِعْرَابَ الْبَسْمَلَةِ. \"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\"؛ الْبَاءُ فِي \"بِسْمِ اللَّهِ\" حَرْفُ جَرٍّ مَبْنِيٌّ عَلَى الْكَسْرِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ، وَأَمَّا \"اسْم\" فَهُوَ مَجْرُورٌ بِالْبَاءِ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ عَلَى آخِرِهِ، وَالْجَارُّ وَالْمَجْرُورُ مُتَعَلِّقَانِ بِفِعْلٍ مَحْذُوفٍ مُؤَخَّرٍ مُقَدَّرٍ تَقْدِيرُهُ \"بِسْمِ اللَّهِ أَكْتُبُ\" أَوْ \"أُؤَلِّفُ\" أَيْ فِي هَذَا الْمَقَامِ. وَهُنَا يَا إِخْوَانِي فَائِدَةٌ فِي هَذَا الْأَمْرِ، وَهِيَ أَنَّ الْأَحْسَنَ فِي مُتَعَلِّقِ الْجَارِّ وَالْمَجْرُورِ الْمَحْذُوفِ أَنْ يُقَدَّرَ فِعْلًا، وَأَنْ يُقَدَّرَ خَاصًّا، وَأَنْ يُقَدَّرَ مُؤَخَّرًا. خُذُوا هَذَا: الْأَحْسَنُ فِي مُتَعَلِّقِ الْجَارِّ وَالْمَجْرُورِ الْمَحْذُوفِ أَنْ يُقَدَّرَ فِعْلًا خَاصًّا مُؤَخَّرًا. أَمَّا كَوْنُهُ فِعْلًا؛ فَلِأَنَّ الْأَصْلَ فِي الْعَمَلِ الْأَفْعَالُ. أَمَّا كَوْنُهُ خَاصًّا؛ فَلِأَنَّهُ أَدَلُّ عَلَى الْمَقْصُودِ إِذْ كُلُّ مُبْتَدِئٍ بِالْبَسْمَلَةِ فِي أَمْرٍ يُضْمِرُ فِي نَفْسِهِ مَا جَعَلَ الْبَسْمَلَةَ مَبْدَأً لَهُ. إِيش مَعْنَى خَاصٍّ؟ مَثَلًا عِنْدَمَا أُرِيدُ أَنْ أَشْرَبَ هَذَا، أَقُولُ \"بِسْمِ اللَّهِ\"؛ هُنَا مُتَعَلِّقُ الْجَارِّ وَالْمَجْرُورِ هُنَا خَاصٌّ. مَا مَعْنَى خَاصٍّ؟ أَيْ خَاصٌّ بِهَذَا الْفِعْلِ وَهُوَ الشُّرْبُ. فَإِذَا كَانَ الْإِنْسَانُ يَشْرَبُ مَعْنَاهُ \"بِسْمِ اللَّهِ أَشْرَبُ\"، وَإِذَا كَانَ \"بِسْمِ اللَّهِ\" يَأْكُلُ مَعْنَاهُ يُضْمِرُ فِي نَفْسِهِ أَنَّهُ يَأْكُلُ، وَإِذَا كَانَ يَكْتُبُ وَهَكَذَا. هَذَا مَعْنَى أَنْ يَكُونَ خَاصًّا. فَالْمُبْتَدِئُ بِالْأَكْلِ إِذَا قَالَ \"بِسْمِ اللَّهِ\" فَإِنَّهُ يَنْوِي أَنْ يَكُونَ \"بِسْمِ اللَّهِ آكُلُ\" وَهَكَذَا. أَمَّا كَوْنُهُ مُؤَخَّرًا فَذَلِكَ لِأَمْرَيْنِ اثْنَيْنِ: الْأَمْرُ الْأَوَّلُ التَّبَرُّكُ بِالْبَدْءِ بِاسْمِ اللَّهِ جَلَّ وَعَلَا، وَالْأَمْرُ الثَّانِي لِإِفَادَةِ الْحَصْرِ؛ لِأَنَّ تَقْدِيمَ مَا حَقُّهُ التَّأْخِيرُ وَتَأْخِيرَ مَا حَقُّهُ التَّقْدِيمُ يَدُلُّ عَلَى الْحَصْرِ. فَإِذَا قُلْتَ \"بِسْمِ اللَّهِ أَكْتُبُ\" كَانَ بِمَنْزِلَةِ \"لَا أَكْتُبُ إِلَّا بِبِسْمِ اللَّهِ\" جَلَّ وَعَلَا. عِنْدَمَا تَقُولُ \"بِسْمِ اللَّهِ أَكْتُبُ\" كَانَ بِمَنْزِلَةِ أَنْ تَقُولَ \"لَا أَكْتُبُ إِلَّا بِبِسْمِ اللَّهِ\" جَلَّ وَعَلَا. إِذًا قُلْنَا الْجَارُّ وَالْمَجْرُورُ مُتَعَلِّقَانِ بِفِعْلٍ مَحْذُوفٍ مُقَدَّرٍ تَقْدِيرُهُ هُنَا \"بِسْمِ اللَّهِ أَكْتُبُ\" أَوْ \"أُؤَلِّفُ\". \"اسْم\" مُضَافٌ وَلَفْظُ الْجَلَالَةِ \"اللَّهُ\" مُضَافٌ إِلَيْهِ مَجْرُورٌ بِالْمُضَافِ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ عَلَى آخِرِهِ. \"الرَّحْمَنِ\" نَعْتٌ أَوَّلُ لِلَفْظِ الْجَلَالَةِ \"اللَّهُ\" وَهُوَ مَجْرُورٌ مِثْلَهُ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ عَلَى آخِرِهِ. \"الرَّحِيمِ\" نَعْتٌ ثَانٍ لِلَفْظِ الْجَلَالَةِ \"اللَّهُ\" وَهُوَ مَجْرُورٌ مِثْلَهُ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ عَلَى آخِرِهِ. وَالْمُصَنِّفُ رَحِمَهُ اللَّهُ جَلَّ وَعَلَا بَدَأَ بِالْبَسْمَلَةِ تَأَسِّيًا وَاقْتِدَاءً بِكِتَابِ اللَّهِ جَلَّ وَعَلَا، ثُمَّ اقْتِدَاءً بِسُنَّةِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي مُكَاتَبَتِهِ إِلَى الْمُلُوكِ وَغَيْرِهِمْ، وَمِنْهُ مُكَاتَبَةُ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِهِرَقْلَ عَظِيمِ الرُّومِ: \"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ مِنْ مُحَمَّدِ بْنِ عَبْدِ اللَّهِ إِلَى هِرَقْلَ عَظِيمِ الرُّومِ\". وَالْبَسْمَلَةُ يَا طُلَّابَ الْعِلْمِ هِيَ قَوْلُ \"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\" وَهَذَا اللَّفْظُ أَيِ الْبَسْمَلَةُ يُطْلَقُ عَلَيْهِ الْبَيَانُ مَاذَا يُسَمَّى هَذَا هَا مَرَّ مَعَنَا مَرَّةً أَظُنُّ نَعَمْ.",

          "text": "لِيَدُلَّ عَلَى أَنَّ غَايَةَ الْخَلْقِ أَيْ خَلْقِ الْخَلْقِ وَاحِدَةٌ، لِذَلِكَ قَالَ بَعْدَهَا: {مَا أُرِيدُ مِنْهُمْ مِنْ رِزْقٍ وَمَا أُرِيدُ أَنْ يُطْعِمُونِ إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ}. إِذًا عِنْدَنَا الْفَائِدَةُ الْأُولَى يَا إِخْوَانُ: \"مَا\" وَ\"إِلَّا\"؛ \"مَا\" النَّافِيَةُ وَ\"إِلَّا\" إِذَا اجْتَمَعَا أَفَادَا مَاذَا؟ الْحَصْرَ. الْفَائِدَةُ الثَّانِيَةُ: أَنَّ \"إِلَّا\" هِيَ أَدَاةُ اسْتِثْنَاءٍ مُفَرَّغٍ مِنْ أَعَمِّ أَحْوَالِهِ لِلدَّلَالَةِ عَلَى أَنَّ مَقْصِدَ الْخَلْقِ إِنَّمَا كَانَ لِأَمْرٍ وَاحِدٍ وَهُوَ تَحْقِيقُ الْعُبُودِيَّةِ لِلَّهِ تَبَارَكَ وَتَعَالَى. {وَمَا خَلَقْتُ} قَوْلُهُ جَلَّ وَعَلَا {خَلَقْتُ}؛ وَالْخَلْقُ هُنَا بِمَعْنَى الْإِيجَادِ مِنْ عَدَمٍ. الْخَلْقُ هُوَ الْإِيجَادُ مِنْ عَدَمٍ لِذَلِكَ كَانَ الْخَلْقُ مِنْ خَصَائِصِ اللَّهِ تَبَارَكَ وَتَعَالَى. لِمَاذَا خَلَقَهُمْ؟ {إِلَّا لِيَعْبُدُونِ}. قَوْلُهُ {لِيَعْبُدُونِ}؛ هَذَا تَعْلِيلٌ لِبَيَانِ الْحِكْمَةِ مِنَ الْخَلْقِ، وَالْعِلَّةُ هُنَا عِلَّةٌ غَائِيَّةٌ. تَنَبَّهُوا يَا إِخْوَانُ مَعِي الْآنَ، هِيَ عِلَّةٌ غَائِيَّةٌ وَلَيْسَتْ عِلَّةً مُوجِبَةً. إِيش مَعْنَى هَذَا الْكَلَامِ؟ وَإِيش هِيَ الْعِلَّةُ الْغَائِيَّةُ؟ وَإِيش هِيَ الْعِلَّةُ الْمُوجِبَةُ؟ وَالْفَرْقُ بَيْنَهُمَا: أَنَّ الْعِلَّةَ الْغَائِيَّةَ قَدْ تَكُونُ وَقَدْ لَا تَكُونُ. أَضْرِبُ لَكُمْ مِثَالًا: أَحْضَرْتُ الْكِتَابَ لِأَقْرَأَ، أَحْضَرْتُ الْكِتَابَ لِأَقْرَأَ؛ قَدْ أَنَا أَتَيْتُ بِالْكِتَابِ لِغَايَةٍ وَهِيَ الْعِلَّةُ الْغَائِيَّةُ أَنِّي لِأَقْرَأَ مِنْهُ، لَكِنْ قَدْ لَا أَقْرَأُ؛ أَنَا أَفْتَحُ الْكِتَابَ يَأْتِي سَعْدٌ يَقُولُ لِي أَحْتَاجُكَ فِي أَمْرٍ، فَهُنَا لَمْ أَقْرَأْ. اللَّهُ جَلَّ وَعَلَا خَلَقَ الْخَلْقَ لِهَذِهِ الْعِلَّةِ وَهِيَ الْعِلَّةُ الْغَائِيَّةُ لِيَعْبُدُونِ.",

هِ وَسَلَّمَ. إِذًا الشَّيْخُ الْأَمِينُ ذَكَرَ الْقِسْمَ الْأَوَّلَ وَهُوَ أَنْ يَكُونَ الْخِطَابُ مُوَجَّهًا لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلَا يُرَادُ بِهِ النَّبِيُّ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ وَإِنَّمَا يُرَادُ بِهِ مَاذَا؟ الْأُمَّةُ، هَذَا الْقِسْمُ الْأَوَّلُ. وَالْقِسْمُ الثَّانِي يَكُونُ خَاصًّا بِهِ وَلَا يَدْخُلُ مَعَهُ غَيْرُهُ مِنْ أُمَّتِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. قَالَ رَحِمَهُ اللَّهُ: الثَّالِثُ هُوَ الشَّامِلُ لَهُ وَلِغَيْرِهِ، بِدَلِيلِ قَوْلِهِ تَعَالَى {يَا أَيُّهَا النَّبِيُّ إِذَا طَلَّقْتُمُ النِّسَاءَ} وَقَوْلِهِ {يَا أَيُّهَا النَّبِيُّ لِمَ تُحَرِّمُ مَا أَحَلَّ اللَّهُ لَكَ تَبْتَغِي مَرْضَاتَ أَزْوَاجِكَ}؛ فَهَذَا كُلُّهُ خِطَابٌ لِمَنْ؟ لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمَ. وَقَدْ جَاءَ بَعْدَ هَذَا الْخِطَابِ مُبَاشَرَةً قَوْلُ اللَّهِ جَلَّ وَعَلَا: {قَدْ فَرَضَ اللَّهُ لَكُمْ تَحِلَّةَ مَاذَا أَيْمَانِكُمْ} بِخِطَابِ مَاذَا؟ الْجَمْعِ، بِخِطَابِ الْجَمْعِ. فَخَاطَبَ اللَّهُ عَزَّ وَجَلَّ عُمُومَ الْأُمَّةِ بِذَلِكَ، وَإِنْ كَانَ الْخِطَابُ ابْتِدَاءً مُوَجَّهًا لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ شَامِلٌ لِكُلِّ أُمَّةِ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. مَنْ يَسْتَطِيعُ أَنْ يُعِيدَ لَنَا هَذِهِ الْأَقْسَامَ الثَّلَاثَةَ الَّتِي ذَكَرَهَا الشَّيْخُ مُحَمَّدٌ الْأَمِينُ الشِّنْقِيطِيُّ رَحِمَهُ اللَّهُ جَلَّ وَعَلَا؟ نَعَمْ. يَكُونُ مُوَجَّهًا لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلِأُمَّتِهِ.",

          "text": "فِي نَفْسِ الْوَقْتِ مَصْدَرِيَّةٌ؟ نَعَمْ نَعَمْ. وَفِي نَفْسِ الْوَقْتِ مَصْدَرِيَّةٌ؟ هُنَا تَفْسِيرِيَّةٌ. نَعَمْ هُنَا الْآنَ تَفْسِيرِيَّةٌ، أَيْ أَنَّ اللَّهَ تَبَارَكَ وَتَعَالَى عِنْدَمَا قَالَ {قُلْ تَعَالَوْا أَتْلُ مَا حَرَّمَ رَبُّكُمْ عَلَيْكُمْ} قَالَ {أَلَّا تُشْرِكُوا بِي شَيْئًا} أَيْ مَا حَرَّمَهُ اللَّهُ فَسَّرَهُ فِيمَا بَعْدُ، فَبَدَأَ بِالْإِشْرَاكِ بِاللَّهِ رَبِّ الْعَالَمِينَ ثُمَّ ذَكَرَ {وَبِالْوَالِدَيْنِ إِحْسَانًا} وَمَا مَرَّتْ مَعَنَا فِي الْآيَةِ الَّتِي قَبْلَهَا، ثُمَّ قَالَ {وَلَا تَقْتُلُوا أَوْلَادَكُمْ مِنْ إِمْلَاقٍ}؛ وَالْإِمْلَاقُ هُوَ الْفَقْرُ. وَوَرَدَ فِي آيَةٍ أُخْرَى قَوْلُ اللَّهِ جَلَّ وَعَلَا {وَلَا تَقْتُلُوا أَوْلَادَكُمْ خَشْيَةَ إِمْلَاقٍ}؛ مَا الْفَرْقُ بَيْنَهُمَا يَا طُلَّابَ الْعِلْمِ؟ مَا الْفَرْقُ بَيْنَ هَذِهِ الْفَائِدَةِ ذَكَرَهَا الشَّيْخُ الْعُثَيْمِينَ رَحِمَهُ اللَّهُ فِي كِتَابِ \"الْقَوْلِ الْمُفِيدِ\" عَلَى شَرْحِ كِتَابِ التَّوْحِيدِ؟ مَا الْفَرْقُ بَيْنَ قَوْلِ اللَّهِ جَلَّ وَعَلَا {وَلَا تَقْتُلُوا أَوْلَادَكُمْ مِنْ إِمْلَاقٍ} وَالثَّانِيَةِ {وَلَا تَقْتُلُوا أَوْلَادَكُمْ خَشْيَةَ إِمْلَاقٍ}؟ نَعَمْ إِمْلَاقُ الْأُولَى الْمَقْصُودُ الْفَقْرُ مُتَحَقِّقٌ، خَشْيَةَ الْفَقْرِ لَيْسَ مُتَحَقِّقًا وَلَكِنْ قَدَرًا...",

          "id": 10,
          "type": "paragraph",
          "text": "أَحْسَنْتَ. قَوْلُهُ {مِنْ إِمْلَاقٍ} أَيِ الْفَقْرُ هُنَا مُتَحَقِّقٌ، أَيْ أَنَّ الْإِنْسَانَ يَقْتُلُ وَلَدَهُ مِنَ الْفَقْرِ. أَمَّا فِي الْآيَةِ الثَّانِيَةِ {خَشْيَةَ إِمْلَاقٍ} هُوَ غَنِيٌّ وَلَكِنَّهُ يَخْشَى مَاذَا؟ يَخْشَى الْفَقْرَ. وَكِلَاهُمَا مُحَرَّمٌ فِي شَرْعِ اللَّهِ جَلَّ وَعَلَا. أَحْسَنْتَ ثُمَّ قَالَ جَلَّ وَعَلَا {نَحْنُ نَرْزُقُكُمْ وَإِيَّاهُمْ}؛ فَلَمَّا حَرَّمَ قَتْلَ الْأَوْلَادِ خَشْيَةَ الْفَقْرِ، بَيَّنَ اللَّهُ تَبَارَكَ وَتَعَالَى أَنَّ الرِّزْقَ بِيَدِهِ؛ {وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ فَوَرَبِّ السَّمَاءِ وَالْأَرْضِ إِنَّهُ لَحَقٌّ مِثْلَمَا أَنَّكُمْ تَنْطِقُونَ}، فَالرِّزْقُ بِيَدِهِ جَلَّ وَعَلَا وَلَيْسَ بِيَدِ مَاذَا؟ بِيَدِ وَالِدِهِ. ثُمَّ قَالَ {وَلَا تَقْرَبُوا الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ}؛ وَفِي هَذِهِ الْآيَةِ حَرَّمَ اللَّهُ جَلَّ وَعَلَا قُرْبَانَ الْفَوَاحِشِ، أَنْ يَقْرَبَ الْإِنْسَانُ الْفَوَاحِشَ، وَمِنْهُ قَوْلُ اللَّهِ جَلَّ وَعَلَا {وَلَا تَقْرَبُوا الزِّنَا إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا}، وَالنَّهْيُ عَنْ قُرْبِ الشَّيْءِ أَبْلَغُ مِنَ النَّهْيِ عَنْ قُرْبِهِ، لِمَاذَا؟ لِأَنَّ النَّهْيَ عَنْ قُرْبِ الشَّيْءِ يُؤَدِّي إِلَى النَّهْيِ عَنْ كُلِّ الْوَسَائِلِ الْمُوصِلَةِ إِلَيْهِ. فَلَمَّا حَرَّمَ اللَّهُ جَلَّ وَعَلَا الزِّنَا حَرَّمَ كُلَّ مَا مِنْ شَأْنِهِ أَنْ يُوصِلَ إِلَيْهِ مِنَ إِطْلَاقِ النَّظَرِ، وَمِنَ الْخَلْوَةِ بِالْأَجْنَبِيَّةِ، وَمِنَ الدُّخُولِ عَلَى النِّسَاءِ كَمَا جَاءَ فِي الْحَدِيثِ \"إِيَّاكُمْ وَالدُّخُولَ عَلَى النِّسَاءِ\" قَالُوا يَا رَسُولَ اللَّهِ أَرَأَيْتَ الْحَمْو - يَعْنِي أَخُو الزَّوْجِ يَدْخُلُ عَلَى زَوْجَةِ أَخِيهِ - فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الْحَمْوُ مَاذَا؟ الْمَوْتُ\". لِذَلِكَ أَتَتِ الشَّرِيعَةُ بِتَحْرِيمِ كُلِّ الْوَسَائِلِ الْمُوصِلَةِ إِلَى الْفَاحِشَةِ وَالْعِيَاذُ بِاللَّهِ. لِذَلِكَ تَحْرِيمُ قُرْبَانِ الشَّيْءِ أَعْظَمُ مِنْ تَحْرِيمِهِ مَاذَا أَصْلًا، لِمَاذَا؟ لِأَنَّ تَحْرِيمَ قُرْبِ الشَّيْءِ هُوَ تَحْرِيمٌ لِكُلِّ الْوَسَائِلِ الْمُوصِلَةِ إِلَيْهِ. ثُمَّ قَالَ جَلَّ وَعَلَا {وَلَا تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللَّهَ إِلَّا بِالْحَقِّ}؛ اللَّهُ تَبَارَكَ وَتَعَالَى تَعَالَى نَهَى عَنْ قَتْلِ النَّفْسِ وَاسْتَثْنَى مَا إِذَا كَانَ الْقَتْلُ بِحَقٍّ كَالْقَتْلِ فِي مَاذَا؟ فِي حَدٍّ مِنْ حُدُودِ اللَّهِ رَبِّ الْعَالَمِينَ جَلَّ وَعَلَا كَرَجْمِ مَاذَا؟ الزَّانِي، وَكَذَلِكَ النَّفْسِ بِالنَّفْسِ، وَكَذَلِكَ التَّارِكِ لِدِينِهِ الْمُفَارِقِ لِلْجَمَاعَةِ. فَهُنَا اللَّهُ عَزَّ وَجَلَّ لَمَّا حَرَّمَ قَتْلَ النَّفْسِ اسْتَثْنَى مَا يَكُونُ مِنْهَا بِحَقٍّ، وَهُوَ الَّذِي فِيهِ حَيَاةُ الْعِبَادِ كَمَا قَالَ جَلَّ وَعَلَا: {وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ يَا أُولِي الْأَلْبَابِ}. ثُمَّ قَالَ {ذَلِكُمْ وَصَّاكُمْ بِهِ لَعَلَّكُمْ تَعْقِلُونَ}. قَالَ {وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ حَتَّى يَبْلُغَ أَشُدَّهُ}؛ نَهَى اللَّهُ عَزَّ وَجَلَّ أَنْ يَقْرَبَ الْوَلِيُّ مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ، مَا مَعْنَى \"إِلَّا بِالَّتِي هِيَ أَحْسَنُ\"؟ إِلَّا بِمَا يَعُودُ عَلَيْهِ بِالنَّفْعِ دِينًا وَدُنْيَا، إِلَّا مَا يَعُودُ عَلَيْهِ دِينًا وَدُنْيَا. أَضْرِبُ لَكُمْ مِثَالًا: لَوْ أَنَّ الْوَلِيَّ يَعْمَلُ بِمَالِ الْيَتِيمِ فِي عَمَلٍ بِمَالِ الْيَتِيمِ يَدُرُّ عَلَيْهِ رِبْحًا كَبِيرًا وَفِيهِ رِبًا، وَيَعْمَلُ فِي مَالِ الْيَتِيمِ وَيَدُرُّ عَلَيْهِ رِبْحًا أَقَلَّ وَلَيْسَ فِيهِ رِبًا، فَمَا الْوَاجِبُ عَلَيْهِ فِي حَقِّهِ؟ هَا! الَّذِي لَا... لِمَاذَا؟ هُوَ أَحْسَنُ.",

          "text": "نَعَمْ مَبْنَاهُ أَنَّ هَذِهِ الْأُمُورَ لَا يُمْكِنُ أَنْ يَلْتَزِمَهَا الْعَبْدُ إِلَّا إِذَا اتَّقَى اللَّهَ، لِمَاذَا؟ لِأَنَّ اللَّهَ عَزَّ وَجَلَّ عَهِدَ بِوَصِيَّةٍ لِلْأَوَّلِينَ وَالْآخِرِينَ وَهِيَ تَقْوَى اللَّهِ، لِأَنَّ تَقْوَى اللَّهِ هِيَ أَسَاسُ كُلِّ خَيْرٍ. وَالتَّقْوَى إِجْمَالًا هِيَ امْتِثَالٌ لِلْمَأْمُورِ وَاجْتِنَابٌ لِمَاذَا؟ لِلْمَحْذُورِ. فَلَا يُمْكِنُ لِلْعَبْدِ أَنْ يَمْتَثِلَ مَا أُمِرَ بِهِ وَأَنْ يَجْتَنِبَ مَا نُهِيَ عَنْهُ إِلَّا إِذَا مَاذَا؟ إِلَّا إِذَا اتَّقَى اللَّهَ. أَحْسَنْتَ هَذَا سُؤَالٌ فِي مَحَلِّهِ. فَخَتَمَ اللَّهُ عَزَّ وَجَلَّ لِلْوَصَايَا الْعَشْرِ بِقَوْلِهِ {لَعَلَّكُمْ تَتَّقُونَ} لِهَذَا الْأَمْرِ، وَهُوَ أَنَّ الْإِنْسَانَ لَا يُمْكِنُ أَنْ يَتَّقِيَ اللَّهَ جَلَّ وَعَلَا حَقَّ التَّقْ... لَا يُمْكِنُ أَنْ يَمْتَثِلَ لِلْمَأْمُورِ وَيَجْتَنِبَ الْمَحْذُورَ إِلَّا إِذَا مَاذَا؟ إِلَّا إِذَا اتَّقَى اللَّهَ عَزَّ وَجَلَّ حَقَّ التَّقْوَى. قَالَ ابْنُ مَسْعُودٍ: \"مَنْ أَرَادَ أَنْ يَنْظُرَ إِلَى وَصِيَّةِ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الَّتِي عَلَيْهَا خَاتِمُهُ\" أَيْ إِذَا أَرَادَ الْإِنْسَانُ أَنْ يَنْظُرَ إِلَى وَصِيَّةٍ مَكْتُوبَةٍ وَعَلَيْهَا خَاتَمُ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَلْيَقْرَأْ... وَالْمَعْلُومُ يَا طُلَّابَ الْعِلْمِ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَاتَ وَلَمْ يَتْرُكْ وَصِيَّةً مَكْتُوبَةً. فَفِي مَرَضِ مَوْتِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ \"تَعَالَوْا أَكْتُبْ لَكُمْ كِتَابًا لَنْ تَضِلُّوا بَعْدِي أَبَدًا\". فَقَالَ جَمَاعَةٌ مِنَ الْقَوْمِ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَرِيضٌ فَلَا تَقَدَّمَ لَهُ الْكِتَابَ، وَقَالَ بَعْضُهُمْ بَلْ قَدِّمُوا لَهُ كِتَابًا يَكْتُبْ لَنَا كِتَابًا لَا نَضِلُّ بَعْدَهُ أَبَدًا. فَحَصَلَ التَّنَازُعُ فَقَالَ...",

// ============ State ============
let lessonsData = null;
let currentLesson = null;
let currentCardIndex = 0;
let cardOrder = [];
let speeds = [1, 1.25, 1.5, 0.75];
let speedIndex = 0;

const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabicDigits(str) {
  return String(str).replace(/[0-9]/g, d => arabicDigits[d]);
}

// ============ Load data ============
async function loadLessons() {
  lessonsData = window.EMBEDDED_LESSONS;
  renderLessonList();
  loadLesson(lessonsData.lessons[0].id);
}

// ============ Sidebar ============
function renderLessonList() {
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  lessonsData.lessons.forEach(lesson => {
    const item = document.createElement('div');
    item.className = 'lesson-item';
    item.dataset.id = lesson.id;
    item.setAttribute('tabindex', '0');
    item.setAttribute('role', 'button');
    item.innerHTML = `
      <span class="lesson-item-number">${toArabicDigits(lesson.number)}</span>
      <span class="lesson-item-title">${lesson.title}</span>
    `;
    item.addEventListener('click', () => loadLesson(lesson.id));
    item.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') loadLesson(lesson.id);
    });
    list.appendChild(item);
  });
}

function markActiveLesson(id) {
  document.querySelectorAll('.lesson-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

// ============ Load a lesson ============
function loadLesson(id) {
  const lesson = lessonsData.lessons.find(l => l.id === id);
  if (!lesson) return;
  currentLesson = lesson;

  document.getElementById('bookTitle').textContent = lesson.bookTitle;
  document.getElementById('lessonTitle').textContent = lesson.title;
  document.getElementById('lessonAuthor').textContent = lesson.author;

  markActiveLesson(id);
  renderLessonText(lesson);
  renderFlashcards(lesson);
  setupAudio(lesson);
}

// ============ Text rendering ============
function renderLessonText(lesson) {
  const container = document.getElementById('lessonText');
  container.innerHTML = '';
  lesson.paragraphs.forEach(p => {
    const el = document.createElement(p.type === 'heading' ? 'h3' : 'p');
    el.className = p.type === 'heading' ? 'lesson-heading' : 'lesson-para';
    el.textContent = p.text;
    el.dataset.id = p.id;
    if (p.type === 'paragraph' && p.start !== null) {
      el.addEventListener('click', () => seekAudioTo(p.start));
    }
    container.appendChild(el);
  });
}

// Highlight the paragraph currently playing, based on audio currentTime.
// Paragraph start/end times are placeholders (null) until lesson data includes them.
function updatePlayingParagraph(currentTime) {
  if (!currentLesson) return;
  document.querySelectorAll('.lesson-para').forEach(el => el.classList.remove('playing'));
  const match = currentLesson.paragraphs.find(p =>
    p.type === 'paragraph' && p.start !== null && p.end !== null &&
    currentTime >= p.start && currentTime < p.end
  );
  if (match) {
    const el = document.querySelector(`.lesson-para[data-id="${match.id}"]`);
    if (el) {
      el.classList.add('playing');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function seekAudioTo(seconds) {
  const audio = document.getElementById('audioEl');
  if (seconds === null || !audio.src) return;
  audio.currentTime = seconds;
  audio.play();
}

// ============ Audio player ============
function setupAudio(lesson) {
  const audio = document.getElementById('audioEl');
  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.querySelector('.icon-play');
  const iconPause = document.querySelector('.icon-pause');

  audio.pause();
  audio.currentTime = 0;
  iconPlay.style.display = '';
  iconPause.style.display = 'none';

  if (lesson.audioSrc) {
    audio.src = lesson.audioSrc;
  } else {
    audio.removeAttribute('src');
  }

  updateTimeDisplay(0, 0);
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressHandle').style.right = '0%';
}

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return toArabicDigits(`${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);
}

function updateTimeDisplay(current, total) {
  document.getElementById('timeCurrent').textContent = formatTime(current);
  document.getElementById('timeTotal').textContent = formatTime(total);
}

function initPlayerEvents() {
  const audio = document.getElementById('audioEl');
  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.querySelector('.icon-play');
  const iconPause = document.querySelector('.icon-pause');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const progressHandle = document.getElementById('progressHandle');
  const speedBtn = document.getElementById('speedBtn');
  const rewindBtn = document.getElementById('rewindBtn');

  playBtn.addEventListener('click', () => {
    if (!audio.src) return;
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', () => {
    iconPlay.style.display = 'none';
    iconPause.style.display = '';
  });

  audio.addEventListener('pause', () => {
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
  });

  audio.addEventListener('loadedmetadata', () => {
    updateTimeDisplay(audio.currentTime, audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    progressFill.style.width = pct + '%';
    progressHandle.style.right = pct + '%';
    updateTimeDisplay(audio.currentTime, audio.duration);
    updatePlayingParagraph(audio.currentTime);
  });

  progressTrack.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = progressTrack.getBoundingClientRect();
    // RTL: distance from the right edge represents progress
    const fromRight = rect.right - e.clientX;
    const pct = Math.min(Math.max(fromRight / rect.width, 0), 1);
    audio.currentTime = pct * audio.duration;
  });

  speedBtn.addEventListener('click', () => {
    speedIndex = (speedIndex + 1) % speeds.length;
    audio.playbackRate = speeds[speedIndex];
    speedBtn.textContent = toArabicDigits(speeds[speedIndex]) + 'x';
  });

  rewindBtn.addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  });
}

// ============ View toggle ============
function initViewToggle() {
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.toggle-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');

      const view = btn.dataset.view;
      document.querySelectorAll('.view-panel').forEach(panel => {
        panel.dataset.active = (panel.id === `view-${view}`) ? 'true' : 'false';
      });
    });
  });
}

// ============ Flashcards ============
function renderFlashcards(lesson) {
  const cards = lesson.flashcards || [];
  const flashcardsTabBtn = document.querySelector('.toggle-btn[data-view="flashcards"]');
  const hasCards = cards.length > 0;

  if (flashcardsTabBtn) {
    flashcardsTabBtn.style.display = hasCards ? '' : 'none';
    // if the flashcards tab was active but this lesson has none, fall back to the text view
    if (!hasCards && flashcardsTabBtn.classList.contains('active')) {
      const textTabBtn = document.querySelector('.toggle-btn[data-view="text"]');
      if (textTabBtn) textTabBtn.click();
    }
  }

  if (!hasCards) {
    cardOrder = [];
    currentCardIndex = 0;
    document.getElementById('cardTotal').textContent = toArabicDigits(0);
    document.getElementById('cardIndex').textContent = toArabicDigits(0);
    document.getElementById('cardQuestion').textContent = 'لا توجد بطاقات مراجعة لهذا الدرس.';
    document.getElementById('cardAnswer').textContent = '';
    return;
  }

  cardOrder = cards.map((_, i) => i);
  currentCardIndex = 0;
  document.getElementById('cardTotal').textContent = toArabicDigits(cards.length);
  showCard();
}

function showCard() {
  const flashcard = document.getElementById('flashcard');
  flashcard.classList.remove('flipped');

  const cards = currentLesson.flashcards || [];
  if (cards.length === 0) return;
  const idx = cardOrder[currentCardIndex];
  const card = cards[idx];

  document.getElementById('cardQuestion').textContent = card.q;
  document.getElementById('cardAnswer').textContent = card.a;
  document.getElementById('cardIndex').textContent = toArabicDigits(currentCardIndex + 1);
}

function initFlashcardEvents() {
  const flashcard = document.getElementById('flashcard');
  const flipBtn = document.getElementById('flipCard');
  const prevBtn = document.getElementById('prevCard');
  const nextBtn = document.getElementById('nextCard');
  const shuffleBtn = document.getElementById('shuffleCards');

  function flip() {
    flashcard.classList.toggle('flipped');
  }

  flashcard.addEventListener('click', flip);
  flashcard.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  });
  flipBtn.addEventListener('click', flip);

  prevBtn.addEventListener('click', () => {
    if (cardOrder.length === 0) return;
    currentCardIndex = (currentCardIndex - 1 + cardOrder.length) % cardOrder.length;
    showCard();
  });

  nextBtn.addEventListener('click', () => {
    if (cardOrder.length === 0) return;
    currentCardIndex = (currentCardIndex + 1) % cardOrder.length;
    showCard();
  });

  shuffleBtn.addEventListener('click', () => {
    if (cardOrder.length === 0) return;
    for (let i = cardOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cardOrder[i], cardOrder[j]] = [cardOrder[j], cardOrder[i]];
    }
    currentCardIndex = 0;
    showCard();
  });
}

// ============ Init ============
document.addEventListener('DOMContentLoaded', () => {
  initPlayerEvents();
  initViewToggle();
  initFlashcardEvents();
  loadLessons();
});

</script>
