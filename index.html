<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Benefit Sorter</title>
<style>
  :root{
    --bg:#15181b; --bg-raised:#1e2226; --card:#23282d; --card-hover:#292f35;
    --ink:#e9e6df; --ink-dim:#9aa1a8; --ink-faint:#656d74; --line:#33393f;
    --amber:#d4a24c; --teal:#5eb1a3; --red:#c86b5a; --blue:#6f9bd1; --purple:#a689c9;
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  html[data-theme="light"]{
    --bg:#f2efe8; --bg-raised:#e9e5db; --card:#fbfaf6; --card-hover:#f2efe6;
    --ink:#242220; --ink-dim:#5c574f; --ink-faint:#8a8579; --line:#d9d3c4;
    --amber:#a8783a; --teal:#2f8577; --red:#b0503d; --blue:#3d6ea8; --purple:#7a5a9c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); min-height:100vh;}
  button{font-family:var(--sans); cursor:pointer;}
  input,select,textarea{font-family:var(--sans);}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}

  .shell{display:grid; grid-template-columns:270px 1fr; min-height:100vh;}
  @media (max-width:900px){ .shell{grid-template-columns:1fr;} .sidebar{position:fixed; z-index:40; height:100%; transform:translateX(-100%); transition:transform .2s;} .sidebar.open{transform:translateX(0);} }

  .sidebar{background:var(--bg-raised); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:16px 12px; gap:10px; width:270px; overflow-y:auto;}
  .brand{display:flex; align-items:center; gap:8px; padding:2px 4px 4px;}
  .brand .mark{font-family:var(--mono); color:var(--amber); font-size:12px; letter-spacing:2px; border:1px solid var(--amber); padding:2px 6px; border-radius:3px;}
  .brand h1{font-size:17px; font-weight:700;}
  .side-label{font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--ink-faint); padding:6px 6px 2px; font-weight:700; display:flex; justify-content:space-between; align-items:center;}
  .side-label button{background:none; border:none; color:var(--ink-faint); font-size:14px;}
  .side-label button:hover{color:var(--teal);}
  .nav-item{display:flex; align-items:center; gap:8px; padding:8px 8px; border-radius:6px; cursor:pointer; font-size:13.5px; color:var(--ink-dim);}
  .nav-item:hover{background:var(--card);}
  .nav-item.active{background:var(--card); color:var(--ink); font-weight:600;}
  .nav-item .badge{margin-left:auto; font-family:var(--mono); font-size:10px; background:var(--amber); color:#1a1408; padding:1px 6px; border-radius:8px;}
  .nb-item{display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--ink-dim);}
  .nb-item:hover{background:var(--card);}
  .nb-item.active{background:var(--card); color:var(--ink); font-weight:600;}
  .nb-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .nb-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nb-count{font-family:var(--mono); font-size:10px; color:var(--ink-faint);}
  .side-bottom{margin-top:auto; display:flex; flex-direction:column; gap:6px; padding-top:8px; border-top:1px solid var(--line);}
  .side-btn{display:flex; align-items:center; gap:6px; background:transparent; border:1px dashed var(--line); color:var(--ink-faint); border-radius:6px; padding:7px 8px; font-size:12.5px; text-align:left;}
  .side-btn:hover{color:var(--ink); border-color:var(--ink-faint);}
  .theme-toggle{display:flex; align-items:center; justify-content:space-between; padding:6px 2px;}
  .theme-toggle button{background:var(--card); border:1px solid var(--line); color:var(--ink-dim); padding:5px 9px; border-radius:5px; font-size:11px;}
  .theme-toggle button.active{color:var(--ink); border-color:var(--teal);}

  .main{display:flex; flex-direction:column; min-width:0;}
  .topbar{border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:10;}
  .menu-btn{display:none; background:none; border:none; color:var(--ink); font-size:20px;}
  @media (max-width:900px){ .menu-btn{display:block;} }
  .ctx-title{font-size:17px; font-weight:700;}
  .ctx-sub{font-size:11.5px; color:var(--ink-faint); font-family:var(--mono);}
  .topbar-right{display:flex; gap:8px; flex-wrap:wrap;}
  .wrap{max-width:1200px; width:100%; margin:0 auto; padding:22px 22px 80px; display:flex; flex-direction:column; gap:18px;}

  .btn{font-size:12.5px; font-weight:600; border:none; border-radius:6px; padding:8px 14px;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--teal); color:#0f1412;}
  .btn-primary:hover{opacity:.88;}
  .btn-ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-faint); color:var(--ink);}
  .btn-danger{background:transparent; color:var(--red); border:1px solid var(--line);}
  .btn-danger:hover{background:rgba(200,107,90,.12); border-color:var(--red);}
  .btn-sm{padding:5px 10px; font-size:11.5px;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .icon-btn{background:transparent; border:none; color:var(--ink-faint); font-size:11.5px; padding:4px 7px; border-radius:4px;}
  .icon-btn:hover{color:var(--ink); background:var(--bg-raised);}
  .icon-btn.danger:hover{color:var(--red);}

  /* Import view */
  .import-box{background:var(--bg-raised); border:1px solid var(--line); border-radius:8px; padding:20px;}
  .import-box textarea{width:100%; min-height:260px; background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:12px; font-size:13.5px; line-height:1.6; resize:vertical;}
  .import-opts{display:flex; gap:16px; flex-wrap:wrap; margin:12px 0; font-size:12.5px; color:var(--ink-dim);}
  .import-opts label{display:flex; align-items:center; gap:6px;}
  .import-preview{font-family:var(--mono); font-size:12px; color:var(--teal); margin-bottom:10px;}
  .drop-zone{border:1px dashed var(--line); border-radius:6px; padding:10px; text-align:center; font-size:12px; color:var(--ink-faint); margin-bottom:10px;}

  /* Quick add / paste panel */
  .quickadd{background:var(--bg-raised); border:1px solid var(--line); border-radius:8px; padding:14px;}
  .quickadd h3{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--ink-faint); margin-bottom:8px;}
  .quickadd textarea{width:100%; min-height:60px; background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:8px; font-size:13px;}
  .quickadd .row{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}

  /* Headings section */
  .headings-box{background:var(--bg-raised); border:1px solid var(--line); border-radius:8px; padding:14px;}
  .headings-box h3{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--ink-faint); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
  .headings-box .sub{font-size:11.5px; color:var(--ink-faint); margin-bottom:10px;}

  /* Triage */
  .triage-toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between;}
  .triage-toolbar input[type=text]{flex:1; min-width:200px; background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:8px 10px; font-size:13px;}
  .triage-row{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:10px; margin-bottom:10px;}
  .triage-row.focused{border-color:var(--teal);}
  .triage-text{font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word;}
  .triage-text textarea{width:100%; min-height:70px; background:var(--bg-raised); border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:8px; font-size:13.5px;}
  .pill-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .pill{border:1px solid var(--line); background:var(--bg-raised); color:var(--ink-dim); border-radius:16px; padding:6px 13px; font-size:12px; display:flex; align-items:center; gap:6px;}
  .pill .num{font-family:var(--mono); font-size:9.5px; opacity:.6;}
  .pill.sel{color:#fff; border-color:transparent;}
  .pill.add{border-style:dashed; color:var(--ink-faint);}
  .pill.add:hover{color:var(--ink);}
  .pill.static{cursor:default;}
  .row-actions{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
  .empty{text-align:center; padding:60px 20px; color:var(--ink-faint);}
  .empty .big{font-size:32px; margin-bottom:10px;}
  .load-more-row{display:flex; justify-content:center; margin-top:10px;}

  /* Notebook view */
  .group{margin-bottom:18px;}
  .group-head{display:flex; align-items:center; gap:8px; margin-bottom:8px; padding-bottom:5px; border-bottom:1px solid var(--line);}
  .group-head .cat-name{font-weight:700; font-size:14px;}
  .group-head .cat-count{font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); background:var(--bg-raised); padding:2px 7px; border-radius:10px;}
  .placement-row{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; display:flex; gap:12px; align-items:flex-start; margin-bottom:8px;}
  .placement-num{font-family:var(--mono); color:var(--amber); font-size:12px; min-width:34px; padding-top:2px;}
  .placement-body{flex:1; font-size:13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word;}
  .placement-body textarea{width:100%; min-height:70px; background:var(--bg-raised); border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:8px; font-size:13.5px;}
  .placement-actions{display:flex; gap:4px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; max-width:150px;}

  /* All benefits view */
  .chip{font-size:10px; padding:2px 8px; border-radius:9px; color:#fff; font-family:var(--mono);}
  .benefit-row{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:8px; display:flex; flex-direction:column; gap:6px;}
  .benefit-chips{display:flex; gap:5px; flex-wrap:wrap;}

  /* Modal */
  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--bg-raised); border:1px solid var(--line); border-radius:10px; padding:22px; width:100%; max-width:560px;}
  .modal.wide{max-width:840px;}
  .modal h3{font-size:15px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}
  .modal h3 button{background:none; border:none; color:var(--ink-faint); font-size:18px;}
  .modal-body{display:flex; flex-direction:column; gap:10px; max-height:70vh; overflow:auto;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .mini-row{display:flex; gap:8px; align-items:center; justify-content:space-between; background:var(--card); padding:8px 10px; border-radius:6px; border:1px solid var(--line);}
  .mini-row .grow{flex:1;}
  .swatches{display:flex; gap:6px;}
  .swatch{width:16px; height:16px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch.sel{border-color:var(--ink);}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px;}
  .stat-box{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px;}
  .stat-box .num{font-family:var(--mono); font-size:22px; font-weight:700; color:var(--teal);}
  .stat-box .lbl{font-size:11px; color:var(--ink-faint); margin-top:2px;}
  .read-doc{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; font-size:14.5px; line-height:1.9;}
  .read-doc .rd-num{font-family:var(--mono); color:var(--amber); font-size:11px; margin-right:8px;}
  .read-doc p{margin-bottom:16px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.7px;}
  input[type=text]{background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:8px 10px; font-size:13.5px;}
  .hint{font-size:11.5px; color:var(--ink-faint);}
  .kbd{background:var(--card); border:1px solid var(--line); border-radius:3px; padding:0 5px; font-family:var(--mono); font-size:10px;}

  footer{text-align:center; padding:20px; color:var(--ink-faint); font-size:10.5px; font-family:var(--mono);}
  @media print{ .sidebar,.topbar,footer,.modal-overlay:not(.print-target){display:none !important;} }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="mark">§</span><h1>Ledger</h1></div>

    <div class="nav-item" data-nav="import">📥 Import Text</div>
    <div class="nav-item" data-nav="triage">🏷 Triage: New Benefits<span class="badge" id="pendingBadge">0</span></div>
    <div class="nav-item" data-nav="all">📚 All Benefits</div>
    <div class="nav-item" data-nav="trash">🗑 Trash</div>

    <div class="side-label">Notebooks<button id="addNbBtn">+</button></div>
    <div id="nbList"></div>

    <div class="side-bottom">
      <button class="side-btn" id="statsBtn">▦ Dashboard</button>
      <button class="side-btn" id="dataBtn">⇅ Import / Export Backup</button>
      <div class="theme-toggle">
        <span class="side-label" style="padding:0;">Theme</span>
        <div><button id="themeDark" class="btn-sm">Dark</button><button id="themeLight" class="btn-sm">Light</button></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div><div class="ctx-title" id="ctxTitle">Import Text</div><div class="ctx-sub" id="ctxSub"></div></div>
      </div>
      <div class="topbar-right" id="topbarActions"></div>
    </div>
    <div class="wrap" id="viewRoot"></div>
    <footer>LEDGER · INDEXEDDB · BULK IMPORT + RECURSIVE HEADING DRILL-DOWN</footer>
  </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modalNb">
  <div class="modal">
    <h3>New notebook <button data-close>✕</button></h3>
    <div class="modal-body">
      <div class="field"><label>Name</label><input type="text" id="nbNameInput" placeholder="e.g. Aqeedah, Tafsir, Seerah"></div>
      <div class="field"><label>Color</label><div class="swatches" id="nbColorSwatches"></div></div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="createNbBtn">Create</button></div>
  </div>
</div>

<div class="modal-overlay" id="modalStats">
  <div class="modal wide">
    <h3>Dashboard <button data-close>✕</button></h3>
    <div class="modal-body">
      <div class="stat-grid" id="statGrid"></div>
      <div class="side-label" style="padding-left:0;">Notebooks</div>
      <div id="statNb" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" data-close>Close</button></div>
  </div>
</div>

<div class="modal-overlay" id="modalData">
  <div class="modal">
    <h3>Import / Export Backup <button data-close>✕</button></h3>
    <div class="modal-body">
      <div class="mini-row"><span class="grow">Export everything (JSON)</span><button class="btn btn-ghost btn-sm" id="exportAllBtn">Export</button></div>
      <div class="mini-row"><span class="grow">Import from JSON backup (merge)</span><button class="btn btn-ghost btn-sm" id="importBtn">Choose file</button></div>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" data-close>Close</button></div>
  </div>
</div>

<div class="modal-overlay" id="modalRead">
  <div class="modal wide print-target">
    <h3><span id="readTitle">Read view</span><button data-close>✕</button></h3>
    <div class="modal-body"><div class="read-doc" id="readDocBody"></div></div>
    <div class="modal-actions"><button class="btn btn-ghost btn-sm" id="printReadBtn">🖨 Print</button><button class="btn btn-ghost" data-close>Close</button></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ===================== IndexedDB ===================== */
const DB_NAME="LedgerDB3", DB_VERSION=1;
let db;
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=(e)=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('benefits')) d.createObjectStore('benefits',{keyPath:'id'});
      if(!d.objectStoreNames.contains('notebooks')) d.createObjectStore('notebooks',{keyPath:'id'});
      if(!d.objectStoreNames.contains('placements')){
        const s=d.createObjectStore('placements',{keyPath:'id'});
        s.createIndex('benefitId','benefitId');
        s.createIndex('notebookId','notebookId');
      }
    };
    req.onsuccess=(e)=>resolve(e.target.result);
    req.onerror=(e)=>reject(e);
  });
}
function tx(store,mode){ return db.transaction(store,mode).objectStore(store); }
function idbGetAll(store){ return new Promise((res,rej)=>{ const r=tx(store,'readonly').getAll(); r.onsuccess=()=>res(r.result); r.onerror=(e)=>rej(e); }); }
function idbPut(store,obj){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').put(obj); r.onsuccess=()=>res(obj); r.onerror=(e)=>rej(e); }); }
function idbDelete(store,id){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=(e)=>rej(e); }); }

/* ===================== State ===================== */
let benefits=[], notebooks=[], placements=[];
let view = {type:'import'};
let rowSelections = new Map();   // benefitId -> Set(notebookId or headingId)
let skippedIds = new Set();      // scope-prefixed benefit ids, session only
let pendingLimit=40, notebookLimit=100, allBenefitsLimit=60, headingPendingLimit=40;
const PALETTE=["#d4a24c","#5eb1a3","#c86b5a","#6f9bd1","#a689c9","#8bbf5a","#d17aa8","#7a8fa6"];
function uid(p){ return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ===================== Boot ===================== */
async function boot(){
  db = await idbOpen();
  benefits = await idbGetAll('benefits');
  notebooks = await idbGetAll('notebooks');
  placements = await idbGetAll('placements');

  if(topLevelNotebooks().length===0){
    for(const name of ["Aqeedah","Fiqh","Usul","Miscellaneous"]){
      const nb={id:uid('nb'), name, color:PALETTE[notebooks.length%PALETTE.length], parentId:null, categorisedChildId:null, headings:[], nextNumber:1, createdAt:Date.now()};
      notebooks.push(nb); await idbPut('notebooks',nb);
    }
  }

  const savedTheme = localStorage.getItem('ledger_theme');
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeButtons();

  renderSidebar();
  renderView();
}

/* ===================== Helpers ===================== */
function nbById(id){ return notebooks.find(n=>n.id===id); }
function benefitById(id){ return benefits.find(b=>b.id===id); }
function topLevelNotebooks(){ return notebooks.filter(n=>!n.parentId); }
function childrenOf(nbId){ return notebooks.filter(n=>n.parentId===nbId); }
function placementsForNotebook(nbId){
  return placements.filter(p=>p.notebookId===nbId && benefitById(p.benefitId) && !benefitById(p.benefitId).trashed)
    .sort((a,b)=>a.number-b.number);
}
function placementsForBenefit(benId){ return placements.filter(p=>p.benefitId===benId); }

function pendingForTopLevelTriage(){
  const topIds = new Set(topLevelNotebooks().map(n=>n.id));
  return benefits.filter(b=>{
    if(b.trashed) return false;
    if(skippedIds.has('top::'+b.id)) return false;
    return !placements.some(p=>p.benefitId===b.id && topIds.has(p.notebookId));
  }).sort((a,b)=>a.order-b.order);
}
function pendingForHeadings(parentNb){
  const childId = parentNb.categorisedChildId;
  const placedInParent = placements.filter(p=>p.notebookId===parentNb.id);
  const uniqueBenIds = [...new Set(placedInParent.map(p=>p.benefitId))];
  return uniqueBenIds.map(benefitById).filter(b=>{
    if(!b || b.trashed) return false;
    if(skippedIds.has('hd::'+parentNb.id+'::'+b.id)) return false;
    if(!childId) return true;
    return !placements.some(p=>p.benefitId===b.id && p.notebookId===childId);
  });
}

function ensureCategorisedChild(parentNb){
  if(parentNb.categorisedChildId && nbById(parentNb.categorisedChildId)) return nbById(parentNb.categorisedChildId);
  const child = {id:uid('nb'), name:parentNb.name+' — Categorised', color:parentNb.color, parentId:parentNb.id, categorisedChildId:null, headings:[], nextNumber:1, createdAt:Date.now()};
  notebooks.push(child);
  parentNb.categorisedChildId = child.id;
  idbPut('notebooks', child);
  idbPut('notebooks', parentNb);
  return child;
}

/* ===================== Sidebar ===================== */
function renderSidebar(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    const nav = el.dataset.nav;
    el.classList.toggle('active',
      (nav==='import'&&view.type==='import')||
      (nav==='triage'&&view.type==='triage')||
      (nav==='all'&&view.type==='all')||
      (nav==='trash'&&view.type==='trash')
    );
    el.onclick = ()=>{
      if(nav==='import') switchView({type:'import'});
      else if(nav==='triage') switchView({type:'triage'});
      else if(nav==='all') switchView({type:'all'});
      else if(nav==='trash') switchView({type:'trash'});
    };
  });
  document.getElementById('pendingBadge').textContent = pendingForTopLevelTriage().length;

  const wrap = document.getElementById('nbList');
  wrap.innerHTML="";
  function renderLevel(parentId, depth){
    notebooks.filter(n=>n.parentId===parentId).sort((a,b)=>a.createdAt-b.createdAt).forEach(nb=>{
      const count = placementsForNotebook(nb.id).length;
      const div=document.createElement('div');
      div.className='nb-item'+(view.type==='notebook'&&view.id===nb.id?' active':'');
      div.style.marginLeft = (depth*14)+'px';
      div.innerHTML = `<span class="nb-dot" style="background:${nb.color}"></span><span class="nb-name">${depth>0?'↳ ':''}${escapeHtml(nb.name)}</span><span class="nb-count">${count}</span>`;
      div.addEventListener('click',()=>switchView({type:'notebook', id:nb.id}));
      div.addEventListener('dblclick',()=>notebookContextMenu(nb));
      wrap.appendChild(div);
      renderLevel(nb.id, depth+1);
    });
  }
  renderLevel(null, 0);
}
function notebookContextMenu(nb){
  const action = prompt(`Notebook: "${nb.name}"\n\nType RENAME to rename, DELETE to delete (and any of its Categorised children), or cancel.`,"");
  if(!action) return;
  const a=action.trim().toUpperCase();
  if(a==='RENAME'){
    const n=prompt("New name:", nb.name);
    if(n&&n.trim()){ nb.name=n.trim(); idbPut('notebooks',nb); renderSidebar(); renderView(); }
  } else if(a==='DELETE'){
    if(confirm(`Delete notebook "${nb.name}" and everything nested under it? Benefits themselves are kept, only placements here are removed.`)){
      deleteNotebookAndDescendants(nb.id);
    }
  }
}
async function deleteNotebookAndDescendants(nbId){
  for(const child of childrenOf(nbId)) await deleteNotebookAndDescendants(child.id);
  const toRemove = placements.filter(p=>p.notebookId===nbId);
  for(const p of toRemove) await idbDelete('placements',p.id);
  placements = placements.filter(p=>p.notebookId!==nbId);
  const nb = nbById(nbId);
  if(nb && nb.parentId){
    const parent = nbById(nb.parentId);
    if(parent && parent.categorisedChildId===nbId){ parent.categorisedChildId=null; await idbPut('notebooks',parent); }
  }
  await idbDelete('notebooks',nbId);
  notebooks = notebooks.filter(n=>n.id!==nbId);
  if(view.type==='notebook' && view.id===nbId) switchView({type:'all'});
  else { renderSidebar(); renderView(); }
}

/* ===================== Copy helper ===================== */
function makeCopyBtn(text){
  const btn = document.createElement('button');
  btn.className='icon-btn'; btn.textContent='📋 copy';
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const done = ()=>{ const orig=btn.textContent; btn.textContent='✓ copied'; setTimeout(()=>btn.textContent=orig,1100); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>alert("Couldn't copy — clipboard access may be blocked."));
    } else { alert("Clipboard not available in this browser."); }
  });
  return btn;
}

/* ===================== Line splitting (newline OR 3+ dots / ellipsis) ===================== */
function splitLines(text, dedupe, skipBlank){
  let lines = text.split(/\.{3,}|\u2026|\r\n|\r|\n/);
  if(skipBlank) lines = lines.map(l=>l.trim()).filter(l=>l.length>0);
  else lines = lines.map(l=>l.trim());
  if(dedupe){ const seen=new Set(); lines = lines.filter(l=>{ if(seen.has(l)) return false; seen.add(l); return true; }); }
  return lines;
}

/* ===================== IMPORT VIEW ===================== */
function renderImportView(root, actions){
  document.getElementById('ctxTitle').textContent="Import Text";
  document.getElementById('ctxSub').textContent="New lines AND runs of \"...\" both start a new benefit";
  root.innerHTML = `
    <div class="import-box">
      <div class="drop-zone" id="dropZone">Drop a .txt file here, or paste directly into the box below</div>
      <input type="file" id="fileInput" accept=".txt,text/plain" style="display:none;">
      <textarea id="importText" placeholder="Paste your entire file here. Every new line, and every run of three or more dots (...), starts a new benefit."></textarea>
      <div class="import-opts">
        <label><input type="checkbox" id="optDedupe"> Skip exact duplicate lines</label>
        <label><input type="checkbox" id="optMinLen" checked> Skip empty / whitespace-only lines</label>
      </div>
      <div class="import-preview" id="importPreview">0 lines detected</div>
      <button class="btn btn-primary" id="doImportBtn">Import as Benefits</button>
    </div>`;
  const ta = document.getElementById('importText');
  const preview = document.getElementById('importPreview');
  function updatePreview(){
    const lines = splitLines(ta.value, document.getElementById('optDedupe').checked, document.getElementById('optMinLen').checked);
    preview.textContent = lines.length + " line" + (lines.length===1?"":"s") + " detected";
  }
  ta.addEventListener('input', updatePreview);
  document.getElementById('optDedupe').addEventListener('change', updatePreview);
  document.getElementById('optMinLen').addEventListener('change', updatePreview);

  document.getElementById('fileInput').addEventListener('change', (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=(ev)=>{ ta.value = ev.target.result; updatePreview(); };
    r.readAsText(f);
  });
  const dz = document.getElementById('dropZone');
  dz.addEventListener('click', ()=>document.getElementById('fileInput').click());
  dz.addEventListener('dragover',(e)=>{ e.preventDefault(); dz.style.borderColor='var(--teal)'; });
  dz.addEventListener('dragleave',()=>{ dz.style.borderColor='var(--line)'; });
  dz.addEventListener('drop',(e)=>{
    e.preventDefault(); dz.style.borderColor='var(--line)';
    const f=e.dataTransfer.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=(ev)=>{ ta.value=ev.target.result; updatePreview(); }; r.readAsText(f);
  });

  document.getElementById('doImportBtn').addEventListener('click', async ()=>{
    const lines = splitLines(ta.value, document.getElementById('optDedupe').checked, document.getElementById('optMinLen').checked);

      benefits.push(b);
      await idbPut('benefits', b);
    }
    ta.value=""; updatePreview();
    alert(`Imported ${lines.length} benefits. Now sort them with Triage: New Benefits.`);
    switchView({type:'triage'});
  });
}

/* ===================== TRIAGE VIEW (top-level sort) ===================== */
function renderTriageView(root, actions){
  document.getElementById('ctxTitle').textContent = "Triage: New Benefits";
  const pending = pendingForTopLevelTriage();
  document.getElementById('ctxSub').textContent = pending.length + " pending";

  const skippedCount = [...skippedIds].filter(k=>k.startsWith('top::')).length;
  const showSkippedBtn = document.createElement('button');
  showSkippedBtn.className='btn btn-ghost btn-sm';
  showSkippedBtn.textContent = skippedCount>0 ? `Show skipped (${skippedCount})` : 'No skipped';
  showSkippedBtn.disabled = skippedCount===0;
  showSkippedBtn.addEventListener('click', ()=>{ [...skippedIds].filter(k=>k.startsWith('top::')).forEach(k=>skippedIds.delete(k)); renderView(); });
  actions.appendChild(showSkippedBtn);

  const nbs = topLevelNotebooks();
  root.innerHTML = `<div class="triage-toolbar"><input type="text" id="triageSearch" placeholder="Search pending text..."></div><div id="triageList"></div><div class="load-more-row" id="triageLoadMore"></div>`;
  const search = document.getElementById('triageSearch');
  let filtered = pending;

  function draw(){
    const q = search.value.trim().toLowerCase();
    filtered = q ? pending.filter(b=>b.text.toLowerCase().includes(q)) : pending;
    const listEl = document.getElementById('triageList');
    listEl.innerHTML="";
    if(nbs.length===0){ listEl.innerHTML = `<div class="empty"><div class="big">▢</div><div>No notebooks yet. Add one from the sidebar first.</div></div>`; document.getElementById('triageLoadMore').innerHTML=""; return; }
    if(filtered.length===0){ listEl.innerHTML = `<div class="empty"><div class="big">✓</div><div>${pending.length===0?"Nothing pending — all caught up.":"No matches."}</div></div>`; document.getElementById('triageLoadMore').innerHTML=""; return; }
    const shown = filtered.slice(0,pendingLimit);
    shown.forEach((b,idx)=>listEl.appendChild(renderTriageRow(b, nbs, 'top', idx===0, (nid,name)=>{
      const nb={id:uid('nb'), name, color:PALETTE[notebooks.length%PALETTE.length], parentId:null, categorisedChildId:null, headings:[], nextNumber:1, createdAt:Date.now()};
      notebooks.push(nb); idbPut('notebooks',nb); return nb;
    }, (benId, selectedIds, after)=>confirmIntoNotebooks(benId, selectedIds, after))));
    const lm = document.getElementById('triageLoadMore'); lm.innerHTML="";
    if(filtered.length>pendingLimit){
      const btn=document.createElement('button'); btn.className='btn btn-ghost btn-sm';
      btn.textContent=`Load more (${filtered.length-pendingLimit} remaining)`;
      btn.addEventListener('click', ()=>{ pendingLimit+=40; draw(); });
      lm.appendChild(btn);
    }
  }
  search.addEventListener('input', ()=>{ pendingLimit=40; draw(); });
  draw();

  document.onkeydown = (e)=>{
    if(view.type!=='triage') return;
    if(document.activeElement && (document.activeElement.tagName==='TEXTAREA'||document.activeElement===search)) return;
    const firstRow = filtered[0];
    if(!firstRow) return;
    const digit = parseInt(e.key,10);
    if(digit>=1 && digit<=9 && nbs[digit-1]){ togglePillSelection(firstRow.id, nbs[digit-1].id); draw(); }
    else if(e.key==='Enter'){
      e.preventDefault();
      const set = rowSelections.get(firstRow.id);
      if(set && set.size>0){ confirmIntoNotebooks(firstRow.id, set, ()=>{ rowSelections.delete(firstRow.id); pendingLimit=40; draw(); renderSidebar(); }); }
    }
    else if(e.key.toLowerCase()==='s'){ skippedIds.add('top::'+firstRow.id); draw(); renderSidebar(); }
  };
}

function togglePillSelection(benId, id){
  if(!rowSelections.has(benId)) rowSelections.set(benId, new Set());
  const set = rowSelections.get(benId);
  if(set.has(id)) set.delete(id); else set.add(id);
}

/* generic triage row renderer; onAddNew(name) creates+returns a new target pushed into the pill list live;
   onConfirm(benId, selectedIdSet, after) performs the actual placement write for this context */
function renderTriageRow(b, targets, scopeKey, isFocused, onAddNew, onConfirm){
  const el = document.createElement('div');
  el.className='triage-row'+(isFocused?' focused':'');
  const sel = rowSelections.get(b.id) || new Set();
  el.innerHTML = `
    <div class="triage-text" data-role="display">${escapeHtml(b.text)}</div>
    <div class="pill-row" data-role="pills">
      ${targets.map((t,i)=>`<button class="pill ${sel.has(t.id)?'sel':''}" data-t="${t.id}" style="${sel.has(t.id)?`background:${t.color};border-color:${t.color};`:''}"><span class="num">${i<9?(i+1):''}</span>${escapeHtml(t.name)}</button>`).join('')}
      <button class="pill add" data-role="addnb">+ new</button>
    </div>
    <div class="row-actions"></div>`;
  el.querySelectorAll('[data-t]').forEach(pillEl=>{
    pillEl.addEventListener('click', ()=>{ togglePillSelection(b.id, pillEl.dataset.t); renderView(); });
  });
  el.querySelector('[data-role="addnb"]').addEventListener('click', ()=>{
    const name = prompt("New name:");
    if(name && name.trim()){
      const t = onAddNew(uid('x'), name.trim());
      togglePillSelection(b.id, t.id);
      renderSidebar(); renderView();
    }
  });
  const actions = el.querySelector('.row-actions');
  actions.appendChild(makeCopyBtn(b.text));
  const editBtn=document.createElement('button'); editBtn.className='btn btn-ghost btn-sm'; editBtn.textContent='Edit text';
  editBtn.addEventListener('click', ()=>{
    const disp = el.querySelector('[data-role="display"]');
    disp.innerHTML = `<textarea>${escapeHtml(b.text)}</textarea><div style="margin-top:6px;"><button class="btn btn-primary btn-sm" data-role="savetext">Save</button></div>`;
    disp.querySelector('[data-role="savetext"]').addEventListener('click', async ()=>{ b.text = disp.querySelector('textarea').value; await idbPut('benefits', b); renderView(); });
  });
  const skipBtn=document.createElement('button'); skipBtn.className='btn btn-ghost btn-sm'; skipBtn.textContent='Skip';
  skipBtn.addEventListener('click', ()=>{ skippedIds.add(scopeKey+'::'+b.id); renderSidebar(); renderView(); });
  const confirmBtn=document.createElement('button'); confirmBtn.className='btn btn-primary btn-sm'; confirmBtn.textContent='Confirm';
  confirmBtn.addEventListener('click', ()=>{
    const set = rowSelections.get(b.id);
    if(!set || set.size===0){ alert("Select at least one button first, or use Skip."); return; }
    onConfirm(b.id, set, ()=>{ rowSelections.delete(b.id); renderSidebar(); renderView(); });
  });
  actions.appendChild(editBtn); actions.appendChild(skipBtn); actions.appendChild(confirmBtn);
  return el;
}

/* confirm callback for placing a benefit into one or more top-level (or general) notebooks */
async function confirmIntoNotebooks(benId, selectedIds, after){
  for(const nbId of selectedIds){
    const nb = nbById(nbId);
    if(!nb) continue;
    const placement = {id:uid('pl'), benefitId:benId, notebookId:nbId, headingId:null, number: nb.nextNumber||1, addedAt:Date.now()};
    placements.push(placement); await idbPut('placements', placement);
    nb.nextNumber = (nb.nextNumber||1)+1; await idbPut('notebooks', nb);
  }
  if(after) after();
}

/* confirm callback for placing a benefit under one or more headings inside a parent's Categorised child */
async function confirmIntoHeadings(benId, parentNb, selectedHeadingIds, after){
  const child = ensureCategorisedChild(parentNb);
  for(const headingId of selectedHeadingIds){
    const placement = {id:uid('pl'), benefitId:benId, notebookId:child.id, headingId, number: child.nextNumber||1, addedAt:Date.now()};
    placements.push(placement); await idbPut('placements', placement);
    child.nextNumber = (child.nextNumber||1)+1;
  }
  await idbPut('notebooks', child);
  if(after) after();
}

        const h = headings.find(x=>x.id===hid);
        const g=document.createElement('div'); g.className='group';
        g.innerHTML = `<div class="group-head"><span class="nb-dot" style="background:${h?h.color:'#888'}"></span><span class="cat-name">${escapeHtml(h?h.name:'Ungrouped')}</span><span class="cat-count">${groups[hid].length}</span></div>`;
        groups[hid].slice(0,notebookLimit).forEach(p=>g.appendChild(renderPlacementRow(p)));
        bodyWrap.appendChild(g);
      });
      document.getElementById('nbLoadMore').innerHTML="";
    } else {
      filtered.slice(0,notebookLimit).forEach(p=>bodyWrap.appendChild(renderPlacementRow(p)));
      const lm=document.getElementById('nbLoadMore'); lm.innerHTML="";
      if(filtered.length>notebookLimit){
        const btn=document.createElement('button'); btn.className='btn btn-ghost btn-sm';
        btn.textContent=`Load more (${filtered.length-notebookLimit} remaining)`;
        btn.addEventListener('click', ()=>{ notebookLimit+=100; drawList(); });
        lm.appendChild(btn);
      }
    }
  }
  search.addEventListener('input', ()=>{ notebookLimit=100; drawList(); });
  drawList();
}

function renderPlacementRow(p){
  const b = benefitById(p.benefitId);
  const el = document.createElement('div'); el.className='placement-row';
  el.innerHTML = `<div class="placement-num">#${p.number}</div><div class="placement-body" data-role="body">${escapeHtml(b.text)}</div><div class="placement-actions"></div>`;
  const actions = el.querySelector('.placement-actions');
  actions.appendChild(makeCopyBtn(b.text));
  const editBtn=document.createElement('button'); editBtn.className='icon-btn'; editBtn.textContent='edit';
  editBtn.addEventListener('click', ()=>{
    const body = el.querySelector('[data-role="body"]');
    body.innerHTML = `<textarea>${escapeHtml(b.text)}</textarea><div style="margin-top:6px;"><button class="btn btn-primary btn-sm" data-role="save">Save</button></div>`;
    body.querySelector('[data-role="save"]').addEventListener('click', async ()=>{ b.text = body.querySelector('textarea').value; await idbPut('benefits', b); renderView(); });
  });
  const removeBtn=document.createElement('button'); removeBtn.className='icon-btn'; removeBtn.textContent='remove here';
  removeBtn.addEventListener('click', async ()=>{
    if(!confirm("Remove this benefit from this notebook only? It stays everywhere else.")) return;
    await idbDelete('placements', p.id); placements = placements.filter(x=>x.id!==p.id);
    renderSidebar(); renderView();
  });
  const trashBtn=document.createElement('button'); trashBtn.className='icon-btn danger'; trashBtn.textContent='trash';
  trashBtn.addEventListener('click', async ()=>{
    if(!confirm("Trash this benefit entirely? It disappears from every notebook (recoverable from Trash).")) return;
    b.trashed=true; await idbPut('benefits', b); renderSidebar(); renderView();
  });
  actions.appendChild(editBtn); actions.appendChild(removeBtn); actions.appendChild(trashBtn);
  return el;
}

function exportNotebookTxt(nbId){
  const nb = nbById(nbId);
  const list = placementsForNotebook(nbId);
  let txt = `${nb.name}\n${'='.repeat(nb.name.length)}\n\n`;
  list.forEach(p=>{ txt += `${p.number}. ${benefitById(p.benefitId).text}\n\n`; });
  const blob = new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${slug(nb.name)}.txt`; a.click();
}
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function openReadView(nbId){
  const nb = nbById(nbId);
  const list = placementsForNotebook(nbId);
  document.getElementById('readTitle').textContent = "Read view — "+nb.name;
  const body = document.getElementById('readDocBody');
  body.innerHTML = list.length ? list.map(p=>`<p><span class="rd-num">${p.number}</span>${escapeHtml(benefitById(p.benefitId).text)}</p>`).join('') : `<div class="empty">Nothing here yet.</div>`;
  openModal('modalRead');
}
document.getElementById('printReadBtn').addEventListener('click', ()=>window.print());

/* ===================== ALL BENEFITS VIEW ===================== */
function renderAllBenefitsView(root, actions){
  document.getElementById('ctxTitle').textContent="All Benefits";
  const active = benefits.filter(b=>!b.trashed);
  document.getElementById('ctxSub').textContent = active.length+" total";
  root.innerHTML = `<div class="triage-toolbar"><input type="text" id="allSearch" placeholder="Search all benefits..."></div><div id="allList"></div><div class="load-more-row" id="allLoadMore"></div>`;
  const search = document.getElementById('allSearch');
  function draw(){
    const q=search.value.trim().toLowerCase();
    const filtered = q ? active.filter(b=>b.text.toLowerCase().includes(q)) : active;
    const listEl = document.getElementById('allList');
    listEl.innerHTML="";
    if(filtered.length===0){ listEl.innerHTML=`<div class="empty"><div class="big">▢</div><div>${active.length===0?"No benefits imported yet.":"No matches."}</div></div>`; document.getElementById('allLoadMore').innerHTML=""; return; }
    filtered.slice(0,allBenefitsLimit).forEach(b=>listEl.appendChild(renderBenefitRow(b)));
    const lm=document.getElementById('allLoadMore'); lm.innerHTML="";
    if(filtered.length>allBenefitsLimit){
      const btn=document.createElement('button'); btn.className='btn btn-ghost btn-sm';
      btn.textContent=`Load more (${filtered.length-allBenefitsLimit} remaining)`;
      btn.addEventListener('click', ()=>{ allBenefitsLimit+=60; draw(); });
      lm.appendChild(btn);
    }
  }
  search.addEventListener('input', draw);
  draw();
}
function renderBenefitRow(b){
  const el=document.createElement('div'); el.className='benefit-row';
  const plc = placementsForBenefit(b.id);
  const chips = plc.map(p=>{ const nb=nbById(p.notebookId); if(!nb) return ''; const h = p.headingId ? (nb.headings||[]).find(x=>x.id===p.headingId) : null; return `<span class="chip" style="background:${nb.color}">${escapeHtml(nb.name)}${h?(' · '+escapeHtml(h.name)):''} #${p.number}</span>`; }).join('');
  el.innerHTML = `<div data-role="body">${escapeHtml(b.text)}</div><div class="benefit-chips">${chips || '<span class="hint">not placed anywhere yet</span>'}</div><div class="row-actions"></div>`;
  const actions = el.querySelector('.row-actions');
  actions.appendChild(makeCopyBtn(b.text));
  const trashBtn=document.createElement('button'); trashBtn.className='icon-btn danger'; trashBtn.textContent='trash';
  trashBtn.addEventListener('click', async ()=>{ if(!confirm("Trash this benefit?")) return; b.trashed=true; await idbPut('benefits',b); renderSidebar(); renderView(); });
  actions.appendChild(trashBtn);
  return el;
}

/* ===================== TRASH VIEW ===================== */
function renderTrashView(root, actions){
  document.getElementById('ctxTitle').textContent="Trash";
  const trashed = benefits.filter(b=>b.trashed);
  document.getElementById('ctxSub').textContent = trashed.length+" trashed";
  root.innerHTML = `<div id="trashList"></div>`;
  const listEl = document.getElementById('trashList');
  if(trashed.length===0){ listEl.innerHTML = `<div class="empty"><div class="big">🗑</div><div>Trash is empty.</div></div>`; return; }
  trashed.forEach(b=>{
    const el=document.createElement('div'); el.className='benefit-row';
    el.innerHTML = `<div>${escapeHtml(b.text)}</div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-role="restore">Restore</button><button class="btn btn-danger btn-sm" data-role="purge">Delete forever</button></div>`;
    el.querySelector('[data-role="restore"]').addEventListener('click', async ()=>{ b.trashed=false; await idbPut('benefits',b); renderSidebar(); renderView(); });
    el.querySelector('[data-role="purge"]').addEventListener('click', async ()=>{
      if(!confirm("Permanently delete this benefit and remove it from every notebook?")) return;
      const relatedPlacements = placementsForBenefit(b.id);
      for(const p of relatedPlacements) await idbDelete('placements', p.id);
      placements = placements.filter(p=>p.benefitId!==b.id);
      await idbDelete('benefits', b.id);
      benefits = benefits.filter(x=>x.id!==b.id);
      renderSidebar(); renderView();
    });
    listEl.appendChild(el);
  });
}

/* ===================== Dashboard ===================== */
document.getElementById('statsBtn').addEventListener('click', ()=>{
  const active = benefits.filter(b=>!b.trashed);
  const grid = document.getElementById('statGrid');
  grid.innerHTML = [
    ['Total benefits', active.length],
    ['Notebooks', notebooks.length],
    ['Pending triage', pendingForTopLevelTriage().length],
    ['In trash', benefits.filter(b=>b.trashed).length],
  ].map(([lbl,num])=>`<div class="stat-box"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`).join('');
  const statNb = document.getElementById('statNb');
  function renderStatLevel(parentId, depth){
    return notebooks.filter(n=>n.parentId===parentId).map(nb=>{
      const row = `<div class="mini-row" style="margin-left:${depth*14}px;"><span class="nb-dot" style="background:${nb.color}"></span><span class="grow">${escapeHtml(nb.name)}</span><span style="font-family:var(--mono); font-size:12px;">${placementsForNotebook(nb.id).length}</span></div>`;
      return row + renderStatLevel(nb.id, depth+1).join('');
    });
  }
  statNb.innerHTML = renderStatLevel(null,0).join('') || '<div class="hint">None yet.</div>';
  openModal('modalStats');
});

/* ===================== Backup Import/Export ===================== */
document.getElementById('dataBtn').addEventListener('click', ()=>openModal('modalData'));
document.getElementById('exportAllBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify({benefits,notebooks,placements,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ledger-full-backup.json'; a.click();
});
document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async(evt)=>{
    try{
      const data=JSON.parse(evt.target.result);
      if(!Array.isArray(data.benefits)) throw new Error("bad format");
      for(const nb of (data.notebooks||[])){ if(!notebooks.some(x=>x.id===nb.id)){ notebooks.push(nb); await idbPut('notebooks',nb);} }
      for(const b of data.benefits){ if(!benefits.some(x=>x.id===b.id)){ benefits.push(b); await idbPut('benefits',b);} }
      for(const p of (data.placements||[])){ if(!placements.some(x=>x.id===p.id)){ placements.push(p); await idbPut('placements',p);} }
      renderSidebar(); renderView();
      alert("Import complete.");
    }catch(err){ alert("Couldn't read that file — make sure it's a Ledger JSON backup."); }
  };
  reader.readAsText(file);
  e.target.value="";
});

/* ===================== Modal plumbing ===================== */
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('[data-close]').forEach(btn=>btn.addEventListener('click',(e)=>e.target.closest('.modal-overlay').classList.remove('show')));
document.querySelectorAll('.modal-overlay').forEach(ov=>ov.addEventListener('click',(e)=>{ if(e.target===ov) ov.classList.remove('show'); }));
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') document.querySelectorAll('.modal-overlay.show').forEach(m=>m.classList.remove('show')); });

/* ===================== Theme ===================== */
function updateThemeButtons(){
  const t=document.documentElement.getAttribute('data-theme');
  document.getElementById('themeDark').classList.toggle('active', t==='dark');
  document.getElementById('themeLight').classList.toggle('active', t==='light');
}
document.getElementById('themeDark').addEventListener('click', ()=>{ document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('ledger_theme','dark'); updateThemeButtons(); });
document.getElementById('themeLight').addEventListener('click', ()=>{ document.documentElement.setAttribute('data-theme','light'); localStorage.setItem('ledger_theme','light'); updateThemeButtons(); });

boot();
})();
</script>
