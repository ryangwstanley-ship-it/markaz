<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجلس التوحيد — استماع وقراءة ومراجعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Markazi+Text:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root {
  --ink: #1C2530;
  --ink-soft: #2E3B49;
  --parchment: #F2ECDD;
  --parchment-deep: #E8DFC8;
  --gold: #B8935F;
  --gold-soft: #D9C39C;
  --sage: #6B7C6E;
  --rust: #A34B34;
  --line: rgba(28, 37, 48, 0.12);

  --font-display: 'Amiri', serif;
  --font-body: 'Noto Naskh Arabic', serif;
  --font-ui: 'Markazi Text', serif;

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  color: var(--parchment);
  font-family: var(--font-body);
}

body {
  min-height: 100vh;
}

::selection {
  background: var(--gold);
  color: var(--ink);
}

/* ============ Shell layout ============ */
.app-shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: 100vh;
}

@media (max-width: 860px) {
  .app-shell {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: static;
    height: auto;
  }
}

/* ============ Sidebar ============ */
.sidebar {
  background: #161D26;
  border-left: 1px solid var(--line);
  padding: 32px 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid rgba(184, 147, 95, 0.25);
}

.brand {
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--gold);
  margin: 0 0 8px;
  line-height: 1.3;
}

.brand-sub {
  font-family: var(--font-ui);
  font-size: 1rem;
  color: rgba(242, 236, 221, 0.6);
  margin: 0;
  line-height: 1.5;
}

.lesson-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.lesson-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background 0.2s ease;
  color: rgba(242, 236, 221, 0.75);
  font-family: var(--font-ui);
  font-size: 1.1rem;
}

.lesson-item:hover {
  background: rgba(184, 147, 95, 0.1);
}

.lesson-item.active {
  background: rgba(184, 147, 95, 0.16);
  color: var(--parchment);
}

.lesson-item-number {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--ink-soft);
  color: var(--gold);
  font-size: 0.95rem;
  font-weight: 600;
  flex-shrink: 0;
}

.lesson-item.active .lesson-item-number {
  background: var(--gold);
  color: var(--ink);
}

/* ============ Main ============ */
.main {
  background: var(--parchment);
  color: var(--ink);
  padding: 40px clamp(20px, 5vw, 72px) 80px;
}

.lesson-header {
  margin-bottom: 28px;
  text-align: center;
}

.lesson-eyebrow {
  font-family: var(--font-ui);
  font-size: 1.1rem;
  letter-spacing: 0.04em;
  color: var(--rust);
  margin: 0 0 6px;
}

.lesson-title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.8rem);
  margin: 0 0 8px;
  color: var(--ink);
}

.lesson-author {
  font-family: var(--font-ui);
  font-size: 1.1rem;
  color: var(--ink-soft);
  opacity: 0.75;
  margin: 0;
}

/* ============ Player ============ */
.player {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 20px;
  background: var(--ink);
  color: var(--parchment);
  border-radius: var(--radius-lg);
  padding: 18px 24px;
  margin-bottom: 28px;
  position: sticky;
  top: 16px;
  z-index: 20;
  box-shadow: 0 12px 30px rgba(28, 37, 48, 0.25);
}

.play-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: var(--gold);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s ease, background 0.2s ease;
}

.play-btn:hover {
  background: var(--gold-soft);
  transform: scale(1.04);
}

.play-btn:active {
  transform: scale(0.97);
}

.player-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.progress-track {
  position: relative;
  height: 6px;
  background: rgba(242, 236, 221, 0.18);
  border-radius: 3px;
  cursor: pointer;
}

.progress-fill {
  position: absolute;
  top: 0;
  right: 0;
  height: 100%;
  width: 0%;
  background: var(--gold);
  border-radius: 3px;
}

.progress-handle {
  position: absolute;
  top: 50%;
  right: 0%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--parchment);
  transform: translate(50%, -50%);
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.player-meta {
  display: flex;
  gap: 6px;
  font-family: var(--font-ui);
  font-size: 0.95rem;
  color: rgba(242, 236, 221, 0.65);
  direction: ltr;
  justify-content: flex-end;
}

.player-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.speed-btn, .rewind-btn {
  border: 1px solid rgba(242, 236, 221, 0.25);
  background: transparent;
  color: var(--parchment);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 1rem;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.2s ease;
}

.speed-btn:hover, .rewind-btn:hover {
  background: rgba(242, 236, 221, 0.08);
}

/* ============ View toggle ============ */
.view-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.toggle-btn {
  border: none;
  background: transparent;
  font-family: var(--font-ui);
  font-size: 1.15rem;
  color: var(--ink-soft);
  opacity: 0.55;
  padding: 10px 18px;
  cursor: pointer;
  position: relative;
  transition: opacity 0.2s ease, color 0.2s ease;
}

.toggle-btn:hover {
  opacity: 0.8;
}

.toggle-btn.active {
  opacity: 1;
  color: var(--rust);
}

.toggle-btn.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  right: 0;
  left: 0;
  height: 2px;
  background: var(--rust);
}

/* ============ View panels ============ */
.view-panel {
  display: none;
}

.view-panel[data-active="true"] {
  display: block;
}

/* ============ Lesson text ============ */
.lesson-text {
  max-width: 780px;
  margin: 0 auto;
  font-family: var(--font-body);
  font-size: 1.25rem;
  line-height: 2.3;
}

.lesson-heading {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--rust);
  margin: 40px 0 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--gold-soft);
}

.lesson-heading:first-child {
  margin-top: 0;
}

.lesson-para {
  margin: 0 0 22px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  transition: background 0.4s ease;
  cursor: pointer;
}

.lesson-para:hover {
  background: rgba(184, 147, 95, 0.08);
}

.lesson-para.playing {
  background: rgba(184, 147, 95, 0.22);
  box-shadow: inset 3px 0 0 var(--gold);
}

/* ============ Flashcards ============ */
.flashcard-stage {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}

.flashcard-counter {
  font-family: var(--font-ui);
  font-size: 1.1rem;
  color: var(--ink-soft);
  opacity: 0.7;
}

.flashcard {
  width: 100%;
  height: 320px;
  perspective: 1400px;
  cursor: pointer;
}

.flashcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  transform-style: preserve-3d;
}

.flashcard.flipped .flashcard-inner {
  transform: rotateY(180deg);
}

.flashcard-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius-lg);
  padding: 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: 0 16px 34px rgba(28, 37, 48, 0.16);
}

.flashcard-front {
  background: var(--ink);
  color: var(--parchment);
}

.flashcard-back {
  background: var(--gold-soft);
  color: var(--ink);
  transform: rotateY(180deg);
}

.flashcard-label {
  font-family: var(--font-ui);
  font-size: 1rem;
  letter-spacing: 0.06em;
  opacity: 0.6;
  margin: 0 0 16px;
}

.flashcard-content {
  font-family: var(--font-body);
  font-size: 1.2rem;
  line-height: 1.8;
  margin: 0;
}

.flashcard-nav {
  display: flex;
  gap: 10px;
}

.fc-btn {
  font-family: var(--font-ui);
  font-size: 1.05rem;
  padding: 10px 22px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.2s ease;
}

.fc-btn:hover {
  background: rgba(28, 37, 48, 0.06);
}

.fc-btn-flip {
  background: var(--rust);
  color: var(--parchment);
  border-color: var(--rust);
}

.fc-btn-flip:hover {
  background: #8C3D29;
}

.fc-shuffle {
  display: flex;
  align-items: center;
  gap: 8px;
  border: none;
  background: transparent;
  color: var(--sage);
  font-family: var(--font-ui);
  font-size: 1rem;
  cursor: pointer;
  padding: 6px 10px;
}

.fc-shuffle:hover {
  text-decoration: underline;
}

/* ============ Focus states ============ */
button:focus-visible,
.flashcard:focus-visible,
.lesson-item:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

/* ============ Reduced motion ============ */
@media (prefers-reduced-motion: reduce) {
  .flashcard-inner,
  .lesson-para,
  .play-btn {
    transition: none !important;
  }
}

/* ============ Sidebar mode toggle ============ */
.sidebar-mode-toggle {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}

.mode-btn {
  flex: 1;
  border: 1px solid var(--line);
  background: transparent;
  color: rgba(242, 236, 221, 0.65);
  font-family: var(--font-ui);
  font-size: 1.05rem;
  padding: 10px 8px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}

.mode-btn:hover {
  background: rgba(184, 147, 95, 0.08);
}

.mode-btn.active {
  background: var(--gold);
  color: var(--ink);
  border-color: var(--gold);
}

/* ============ Reading list (sidebar) ============ */
.reading-progress-summary {
  font-family: var(--font-ui);
  font-size: 0.95rem;
  color: rgba(242, 236, 221, 0.6);
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(184, 147, 95, 0.2);
}

.reading-progress-summary strong {
  color: var(--gold);
}

.day-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  color: rgba(242, 236, 221, 0.75);
  font-family: var(--font-ui);
  font-size: 1.1rem;
  transition: background 0.2s ease;
}

.day-item:hover {
  background: rgba(184, 147, 95, 0.1);
}

.day-item.active {
  background: rgba(184, 147, 95, 0.16);
  color: var(--parchment);
}

.day-item-check {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid rgba(242, 236, 221, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.day-item.completed .day-item-check {
  background: var(--sage);
  border-color: var(--sage);
  color: var(--parchment);
}

/* ============ Reading main view ============ */
.reading-view {
  display: none;
}

.reading-view[data-active="true"] {
  display: block;
}

.reading-day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.reading-day-title {
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 3vw, 2.2rem);
  color: var(--ink);
  margin: 0;
}

.reading-day-badge {
  font-family: var(--font-ui);
  font-size: 1rem;
  color: var(--rust);
  background: rgba(163, 75, 52, 0.08);
  padding: 6px 14px;
  border-radius: 999px;
}

.reading-progress-bar-track {
  height: 8px;
  background: rgba(28, 37, 48, 0.08);
  border-radius: 4px;
  margin: 18px 0 32px;
  overflow: hidden;
}

.reading-progress-bar-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 4px;
  width: 0%;
  transition: width 0.3s ease;
}

.reading-page {
  max-width: 780px;
  margin: 0 auto 48px;
  padding-bottom: 32px;
  border-bottom: 1px dashed var(--line);
}

.reading-page:last-of-type {
  border-bottom: none;
}

.reading-page-label {
  font-family: var(--font-ui);
  font-size: 1rem;
  color: var(--rust);
  opacity: 0.75;
  margin-bottom: 14px;
}

.hadith-block {
  font-family: var(--font-body);
  font-size: 1.2rem;
  line-height: 2.2;
  margin: 0 0 20px;
  padding: 14px 18px;
  background: rgba(232, 223, 200, 0.4);
  border-radius: var(--radius-md);
  border-right: 3px solid var(--gold-soft);
  white-space: pre-wrap;
}

.reading-complete-bar {
  max-width: 780px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
}

.reading-complete-btn {
  border: none;
  background: var(--rust);
  color: var(--parchment);
  font-family: var(--font-ui);
  font-size: 1.15rem;
  padding: 14px 32px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background 0.2s ease, transform 0.15s ease;
}

.reading-complete-btn:hover {
  background: #8c3d29;
}

.reading-complete-btn:active {
  transform: scale(0.98);
}

.reading-complete-btn.done {
  background: var(--sage);
  cursor: default;
}

.reading-day-nav {
  display: flex;
  gap: 12px;
}

.reading-day-nav button {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-soft);
  font-family: var(--font-ui);
  font-size: 1rem;
  padding: 10px 20px;
  border-radius: var(--radius-md);
  cursor: pointer;
}

.reading-day-nav button:hover {
  background: rgba(184, 147, 95, 0.08);
}

.reading-day-nav button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* ============ Responsive ============ */
@media (max-width: 600px) {
  .player {
    grid-template-columns: auto 1fr;
    row-gap: 12px;
  }
  .player-controls {
    grid-column: 1 / -1;
    justify-content: flex-end;
  }
  .lesson-text {
    font-size: 1.1rem;
  }
  .flashcard {
    height: 280px;
  }
}

</style>
</head>
<body>

<div class="app-shell">

  <!-- ============ Sidebar: Lesson list ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="brand">مَجَالِسُ التَّوْحِيد</h1>
      <p class="brand-sub">شرح كتاب التوحيد للإمام محمد بن عبد الوهاب</p>
    </div>
    <div class="sidebar-mode-toggle">
      <button class="mode-btn active" id="modeLessonsBtn">الدروس</button>
      <button class="mode-btn" id="modeReadingBtn">القراءة</button>
    </div>

    <nav class="lesson-list" id="lessonList">
      <!-- populated by JS -->
    </nav>

    <div id="readingSidebar" style="display:none;">
      <div class="reading-progress-summary" id="readingProgressSummary">
        <!-- populated by JS -->
      </div>
      <nav class="lesson-list" id="dayList">
        <!-- populated by JS -->
      </nav>
    </div>
  </aside>

  <!-- ============ Main content ============ -->
  <main class="main" id="main">

    <header class="lesson-header">
      <p class="lesson-eyebrow" id="bookTitle">كتاب التوحيد</p>
      <h2 class="lesson-title" id="lessonTitle">المجلس الخامس</h2>
      <p class="lesson-author" id="lessonAuthor">الإمام المجدد محمد بن عبد الوهاب</p>
    </header>

    <!-- ============ Audio player (persistent) ============ -->
    <section class="player" id="player">
      <button class="play-btn" id="playBtn" aria-label="تشغيل">
        <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
      </button>

      <div class="player-body">
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-handle" id="progressHandle"></div>
        </div>
        <div class="player-meta">
          <span id="timeCurrent">٠٠:٠٠</span>
          <span class="time-sep">/</span>
          <span id="timeTotal">٠٠:٠٠</span>
        </div>
      </div>

      <div class="player-controls">
        <button class="speed-btn" id="speedBtn" title="سرعة التشغيل">١x</button>
        <button class="rewind-btn" id="rewindBtn" title="رجوع ١٠ ثوانٍ">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/></svg>
        </button>
      </div>

      <audio id="audioEl" preload="metadata"></audio>
    </section>

    <!-- ============ View toggle ============ -->
    <div class="view-toggle" role="tablist">
      <button class="toggle-btn active" data-view="text" role="tab" aria-selected="true">النص</button>
      <button class="toggle-btn" data-view="flashcards" role="tab" aria-selected="false">البطاقات التعليمية</button>
    </div>

    <!-- ============ Text view ============ -->
    <section class="view-panel" id="view-text" data-active="true">
      <article class="lesson-text" id="lessonText">
        <!-- populated by JS: headings + paragraphs -->
      </article>
    </section>

    <!-- ============ Flashcards view ============ -->
    <section class="view-panel" id="view-flashcards" data-active="false">
      <div class="flashcard-stage">

        <div class="flashcard-counter">
          <span id="cardIndex">١</span> / <span id="cardTotal">٥٥</span>
        </div>

        <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="اضغط لقلب البطاقة">
          <div class="flashcard-inner" id="flashcardInner">
            <div class="flashcard-face flashcard-front">
              <p class="flashcard-label">سؤال</p>
              <p class="flashcard-content" id="cardQuestion"></p>
            </div>
            <div class="flashcard-face flashcard-back">
              <p class="flashcard-label">جواب</p>
              <p class="flashcard-content" id="cardAnswer"></p>
            </div>
          </div>
        </div>

        <div class="flashcard-nav">
          <button class="fc-btn" id="prevCard">السابق</button>
          <button class="fc-btn fc-btn-flip" id="flipCard">قلب البطاقة</button>
          <button class="fc-btn" id="nextCard">التالي</button>
        </div>

        <button class="fc-shuffle" id="shuffleCards">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M17 3l4 4-4 4M3 7h13a4 4 0 010 8H7m10 6l4-4-4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          ترتيب عشوائي
        </button>
      </div>
    </section>

    <!-- ============ Reading view (الترغيب والترهيب) ============ -->
    <section class="reading-view" id="readingView" data-active="false">
      <header class="reading-day-header">

          "text": "فِي تَوْحِيدِ مَاذَا؟ الْعِبَادَةِ، هَذَا هُوَ الْغَالِبُ وَهَذَا هُوَ الْأَصْلُ فِي هَذِهِ الْخُصُومَةِ. قَالَ جَلَّ وَعَلَا: {وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ}، وَقَالَ تَبَارَكَ وَتَعَالَى: {وَمَا أَرْسَلْنَا مِنْ قَبْلِكَ مِنْ رَسُولٍ إِلَّا نُوحِي إِلَيْهِ أَنَّهُ لَا إِلَهَ إِلَّا أَنَا فَاعْبُدُونِ}، فَكُلُّ رَسُولٍ أَرْسَلَهُ اللَّهُ جَلَّ وَعَلَا إِلَّا بِمَاذَا؟ بِهَذَا التَّوْحِيدِ. قَالَ شَيْخُ الْإِسْلَامِ مُحَمَّدُ بْنُ عَبْدِ الْوَهَّابِ رَحِمَهُ اللَّهُ: \"وَالْعِبَادَةُ هِيَ التَّوْحِيدُ؛ لِأَنَّ الْخُصُومَةَ بَيْنَ الْأَنْبِيَاءِ وَالْأُمَمِ فِيهِ\". الْقَاعِدَةُ الرَّابِعَةُ وَكَذَلِكَ هِيَ قَاعِدَةٌ مُهِمَّةٌ سَنَحْتَاجُهَا فِي بَابِ التَّبَرُّكِ: الْبَرَكَةُ لِلَّهِ وَصْفًا وَمِلْكًا وَفِعْلًا. إِيش مَعْنَى هَذَا الْكَلَامِ؟ مَعْنَاهُ أَنَّ كُلَّ بَرَكَةٍ فِي الْكَوْنِ هِيَ مِنْ آثَارِ بَرَكَتِهِ جَلَّ وَعَلَا، فَإِذَا تَقَرَّرَ هَذَا وَأَنَّ الْبَرَكَةَ مِنَ اللَّهِ جَلَّ وَعَلَا فَالْوَاجِبُ أَوَّلًا أَلَّا تُرْجَى هَذِهِ الْبَرَكَةُ إِلَّا مِنَ اللَّهِ، فَالْوَاجِبُ أَوَّلًا أَلَّا تُرْجَى هَذِهِ الْبَرَكَةُ إِلَّا مِنَ اللَّهِ، ثَانِيًا وَأَلَّا تُلتَمَسَ إِلَّا بِمَا شَرَعَ اللَّهُ، فَلَا تُطْلَبُ إِلَّا مِمَّنْ ثَبَتَتْ بَرَكَتُهُ عَنِ الشَّارِعِ. يَكْفِي؟ لَا يَكْفِي. عَلَى وَفْقِ الْكَيْفِيَّةِ الْوَارِدَةِ فِي الشَّرْعِ. فَالنَّبِيُّ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ بَرَكَتُهُ ذَاتِيَّةٌ، صَحِيحٌ أَوْ لَا؟ لِأَنَّ الصَّحَابَةَ كَانُوا يَتَبَرَّكُونَ بِعَرَقِهِ وَنُخَامَتِهِ وَفَضْلِ وُضُوئِهِ صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ وَسَلَّمَ. الصَّالِحُونَ إِيش الْبَرَكَةُ؟ الْمُؤْمِنُ إِيش الْبَرَكَةُ؟",

        {

          "text": "الْقَاعِدَةُ وَرَدَ بِالْقَاعِدَةِ: التَّوَجُّهُ إِلَى شَيْءٍ أَوْ جِهَةٍ بِقَصْدِ الْقُرْبَةِ وَحُصُولِ الثَّوَابِ مَاذَا؟ عِبَادَةٌ. فَهُوَ مَا تَوَجَّهَ إِلَى الْقَبْرِ النَّبَوِيِّ وَإِلَى الْحُجْرَةِ إِلَّا عَلَى هَذَا مَاذَا؟ الْأَمْرِ، فَيَكُونُ هَذَا الْأَمْرُ مَاذَا؟ مُخَالِفًا لِشَرْعِ اللَّهِ جَلَّ وَعَلَا. وَالْأَمْثِلَةُ عَلَى ذَلِكَ كَثِيرَةٌ سَتَأْتِي فِي مَوَاطِنِهَا إِنْ شَاءَ اللَّهُ تَعَالَى. الْمُهِمُّ عِنْدِي الْآنَ أَنْ تَضْبِطَ هَذِهِ الْقَوَاعِدَ. الْقَاعِدَةُ السَّادِسَةُ: الْعِبَادَةُ لَا تُسَمَّى عِبَادَةً فِي حُكْمِ الشَّارِعِ إِلَّا مَعَ التَّوْحِيدِ. لِمَاذَا يَا طُلَّابَ الْعِلْمِ؟ لِأَنَّ الْعِبَادَةَ مَهْمَا عَظُمَتْ عِنْدَ فَاعِلِهَا مَعَ الشِّرْكِ لَا تَنْفَعُ: {وَلَقَدْ أُوحِيَ إِلَيْكَ وَإِلَى الَّذِينَ مِنْ قَبْلِكَ لَئِنْ أَشْرَكْتَ لَيَحْبَطَنَّ عَمَلُكَ} صَحِيحٌ أَوْ لَا؟ فَالشِّرْكُ مُحْبِطٌ لِجَمِيعِ الْأَعْمَالِ. لَوْ يَأْتِي إِنْسَانٌ يَقُومُ اللَّيْلَ، يَصُومُ النَّهَارَ، يَتَصَدَّقُ عَلَى الْمَسَاكِينِ، وَيَخْرُجُ إِلَى الْجِهَادِ ثُمَّ هُوَ يَدْعُو غَيْرَ اللَّهِ، وَيَنْذُرُ لِغَيْرِ اللَّهِ تَبَارَكَ وَتَعَالَى، وَيَذْبَحُ لِغَيْرِ اللَّهِ جَلَّ وَعَلَا، هَلْ تَنْفَعُهُ هَذِهِ الطَّاعَاتُ وَالْعِبَادَاتُ؟ الْجَوَابُ لَا تَنْفَعُهُ؛ لِمَاذَا؟ لِأَنَّ الْعِبَادَةَ لَا تُسَمَّى عِبَادَةً إِلَّا مَعَ التَّوْحِيدِ، أَيْ فِي حُكْمِ الشَّرْعِ. الْقَاعِدَةُ السَّابِعَةُ: الْعِبَادَةُ لَا تَكُونُ إِلَّا مَعَ غَايَةِ الذُّلِّ وَغَايَةِ الْحُبِّ، وَلَا تَنْفَعُ عِبَادَةٌ بِوَاحِدٍ دُونَ الْآخَرِ. إِذًا لِأَنَّ الْعِبَادَةَ اسْمٌ يَجْمَعُ كَمَالَ الْحُبِّ لِلَّهِ وَنِهَايَتَهُ، وَكَمَالَ الذُّلِّ لِلَّهِ وَنِهَايَتَهُ، فَالْحُبُّ الْخَلِيُّ عَنْ ذُلٍّ هَا؟ لَا يُسَمَّى عِبَادَةً، وَالذُّلُّ الْخَلِيُّ عَنْ حُبٍّ لَا يُسَمَّى عِبَادَةً",

        {

          "text": "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ. كِتَابُ التَّوْحِيدِ وَقَوْلُ اللَّهِ تَعَالَى: {وَمَا خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ}. قَبْلَ أَنْ نَشْرَعَ فِي الشَّرْحِ نَأْخُذُ إِعْرَابَ الْبَسْمَلَةِ، نَأْخُذُ إِعْرَابَ الْبَسْمَلَةِ. \"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\"؛ الْبَاءُ فِي \"بِسْمِ اللَّهِ\" حَرْفُ جَرٍّ مَبْنِيٌّ عَلَى الْكَسْرِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ، وَأَمَّا \"اسْم\" فَهُوَ مَجْرُورٌ بِالْبَاءِ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ عَلَى آخِرِهِ، وَالْجَارُّ وَالْمَجْرُورُ مُتَعَلِّقَانِ بِفِعْلٍ مَحْذُوفٍ مُؤَخَّرٍ مُقَدَّرٍ تَقْدِيرُهُ \"بِسْمِ اللَّهِ أَكْتُبُ\" أَوْ \"أُؤَلِّفُ\" أَيْ فِي هَذَا الْمَقَامِ. وَهُنَا يَا إِخْوَانِي فَائِدَةٌ فِي هَذَا الْأَمْرِ، وَهِيَ أَنَّ الْأَحْسَنَ فِي مُتَعَلِّقِ الْجَارِّ وَالْمَجْرُورِ الْمَحْذُوفِ أَنْ يُقَدَّرَ فِعْلًا، وَأَنْ يُقَدَّرَ خَاصًّا، وَأَنْ يُقَدَّرَ مُؤَخَّرًا. خُذُوا هَذَا: الْأَحْسَنُ فِي مُتَعَلِّقِ الْجَارِّ وَالْمَجْرُورِ الْمَحْذُوفِ أَنْ يُقَدَّرَ فِعْلًا خَاصًّا مُؤَخَّرًا. أَمَّا كَوْنُهُ فِعْلًا؛ فَلِأَنَّ الْأَصْلَ فِي الْعَمَلِ الْأَفْعَالُ. أَمَّا كَوْنُهُ خَاصًّا؛ فَلِأَنَّهُ أَدَلُّ عَلَى الْمَقْصُودِ إِذْ كُلُّ مُبْتَدِئٍ بِالْبَسْمَلَةِ فِي أَمْرٍ يُضْمِرُ فِي نَفْسِهِ مَا جَعَلَ الْبَسْمَلَةَ مَبْدَأً لَهُ. إِيش مَعْنَى خَاصٍّ؟ مَثَلًا عِنْدَمَا أُرِيدُ أَنْ أَشْرَبَ هَذَا، أَقُولُ \"بِسْمِ اللَّهِ\"؛ هُنَا مُتَعَلِّقُ الْجَارِّ وَالْمَجْرُورِ هُنَا خَاصٌّ. مَا مَعْنَى خَاصٍّ؟ أَيْ خَاصٌّ بِهَذَا الْفِعْلِ وَهُوَ الشُّرْبُ. فَإِذَا كَانَ الْإِنْسَانُ يَشْرَبُ مَعْنَاهُ \"بِسْمِ اللَّهِ أَشْرَبُ\"، وَإِذَا كَانَ \"بِسْمِ اللَّهِ\" يَأْكُلُ مَعْنَاهُ يُضْمِرُ فِي نَفْسِهِ أَنَّهُ يَأْكُلُ، وَإِذَا كَانَ يَكْتُبُ وَهَكَذَا. هَذَا مَعْنَى أَنْ يَكُونَ خَاصًّا. فَالْمُبْتَدِئُ بِالْأَكْلِ إِذَا قَالَ \"بِسْمِ اللَّهِ\" فَإِنَّهُ يَنْوِي أَنْ يَكُونَ \"بِسْمِ اللَّهِ آكُلُ\" وَهَكَذَا. أَمَّا كَوْنُهُ مُؤَخَّرًا فَذَلِكَ لِأَمْرَيْنِ اثْنَيْنِ: الْأَمْرُ الْأَوَّلُ التَّبَرُّكُ بِالْبَدْءِ بِاسْمِ اللَّهِ جَلَّ وَعَلَا، وَالْأَمْرُ الثَّانِي لِإِفَادَةِ الْحَصْرِ؛ لِأَنَّ تَقْدِيمَ مَا حَقُّهُ التَّأْخِيرُ وَتَأْخِيرَ مَا حَقُّهُ التَّقْدِيمُ يَدُلُّ عَلَى الْحَصْرِ. فَإِذَا قُلْتَ \"بِسْمِ اللَّهِ أَكْتُبُ\" كَانَ بِمَنْزِلَةِ \"لَا أَكْتُبُ إِلَّا بِبِسْمِ اللَّهِ\" جَلَّ وَعَلَا. عِنْدَمَا تَقُولُ \"بِسْمِ اللَّهِ أَكْتُبُ\" كَانَ بِمَنْزِلَةِ أَنْ تَقُولَ \"لَا أَكْتُبُ إِلَّا بِبِسْمِ اللَّهِ\" جَلَّ وَعَلَا. إِذًا قُلْنَا الْجَارُّ وَالْمَجْرُورُ مُتَعَلِّقَانِ بِفِعْلٍ مَحْذُوفٍ مُقَدَّرٍ تَقْدِيرُهُ هُنَا \"بِسْمِ اللَّهِ أَكْتُبُ\" أَوْ \"أُؤَلِّفُ\". \"اسْم\" مُضَافٌ وَلَفْظُ الْجَلَالَةِ \"اللَّهُ\" مُضَافٌ إِلَيْهِ مَجْرُورٌ بِالْمُضَافِ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ عَلَى آخِرِهِ. \"الرَّحْمَنِ\" نَعْتٌ أَوَّلُ لِلَفْظِ الْجَلَالَةِ \"اللَّهُ\" وَهُوَ مَجْرُورٌ مِثْلَهُ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ عَلَى آخِرِهِ. \"الرَّحِيمِ\" نَعْتٌ ثَانٍ لِلَفْظِ الْجَلَالَةِ \"اللَّهُ\" وَهُوَ مَجْرُورٌ مِثْلَهُ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ عَلَى آخِرِهِ. وَالْمُصَنِّفُ رَحِمَهُ اللَّهُ جَلَّ وَعَلَا بَدَأَ بِالْبَسْمَلَةِ تَأَسِّيًا وَاقْتِدَاءً بِكِتَابِ اللَّهِ جَلَّ وَعَلَا، ثُمَّ اقْتِدَاءً بِسُنَّةِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي مُكَاتَبَتِهِ إِلَى الْمُلُوكِ وَغَيْرِهِمْ، وَمِنْهُ مُكَاتَبَةُ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِهِرَقْلَ عَظِيمِ الرُّومِ: \"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ مِنْ مُحَمَّدِ بْنِ عَبْدِ اللَّهِ إِلَى هِرَقْلَ عَظِيمِ الرُّومِ\". وَالْبَسْمَلَةُ يَا طُلَّابَ الْعِلْمِ هِيَ قَوْلُ \"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\" وَهَذَا اللَّفْظُ أَيِ الْبَسْمَلَةُ يُطْلَقُ عَلَيْهِ الْبَيَانُ مَاذَا يُسَمَّى هَذَا هَا مَرَّ مَعَنَا مَرَّةً أَظُنُّ نَعَمْ.",

          "text": "ابْنُ تَيْمِيَّةَ رَحِمَهُ اللَّهُ عَلَيْهِ -أَيِ الْعِبَادَةَ- بِكَوْنِهَا: \"اسْمٌ جَامِعٌ لِكُلِّ مَا يُحِبُّهُ اللَّهُ وَيَرْضَاهُ مِنَ الْأَقْوَالِ وَالْأَعْمَالِ الظَّاهِرَةِ وَالْبَاطِنَةِ\". وَهُنَا يَا طُلَّابَ الْعِلْمِ الْعِبَادَةُ تَكُونُ بِأَمْرَيْنِ اثْنَيْنِ: الْأَمْرُ الْأَوَّلُ امْتِثَالُ الْمَأْمُورِ، وَالْأَمْرُ الثَّانِي اجْتِنَابُ الْمَحْظُورِ. لَكِنْ تَنَبَّهْ لِقَيْدٍ مُهِمٍّ وَهُوَ أَنَّ هَذَا الِامْتِثَالَ لِلْمَأْمُورِ وَهَذَا الِاجْتِنَابَ لِلْمَحْظُورِ لَا بُدَّ أَنْ يَكُونَ عَلَى جِهَةِ الْمَحَبَّةِ وَالرَّجَاءِ وَالْخَوْفِ. لَا بُدَّ أَنْ يَكُونَ عَلَى جِهَةِ الْمَحَبَّةِ وَالرَّجَاءِ وَالْخَوْفِ. قَالَ الْمُصَنِّفُ رَحِمَهُ اللَّهُ جَلَّ وَعَلَا: {وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ}. هَذِهِ الْآيَةُ يَا طُلَّابَ الْعِلْمِ تَضَمَّنَتِ النَّفْيَ وَالْإِثْبَاتَ الْوَارِدَ فِي كَلِمَةِ التَّوْحِيدِ. وَقَدْ مَرَّ مَعَنَا أَنَّ \"لَا إِلَهَ إِلَّا اللَّهُ\" فِيهَا نَفْيٌ وَإِثْبَاتٌ، وَهُوَ مُقْتَضَى الْعِبَادَةِ، مُقْتَضَى تَوْحِيدِ اللَّهِ جَلَّ وَعَلَا؛ \"لَا إِلَهَ\" نَفْيُ الْعِبَادَةِ عَنْ كُلِّ مَا سِوَى اللَّهِ، \"إِلَّا اللَّهُ\" إِثْبَاتُ الْعِبَادَةِ لِلَّهِ جَلَّ وَعَلَا وَحْدَهُ لَا شَرِيكَ لَهُ. طَيِّبٌ يَا طُلَّابَ الْعِلْمِ فِي قَوْلِ اللَّهِ جَلَّ وَعَلَا: {وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ}، أَيْنَ النَّفْيُ وَالْإِثْبَاتُ فِي هَذِهِ الْآيَةِ؟ أَيْنَ النَّفْيُ وَالْإِثْبَاتُ؟ هَاتِ يَا عَبْدَ الْمَالِكِ.",

        {

          "type": "paragraph",
          "text": "الْقَسَمُ الْمُقَدَّرُ. \"وَلَقَدْ\" تَقْدِيرُهَا \"وَاللَّهِ لَقَدْ\"؛ هُنَا فِي قَسَمٍ مُقَدَّرٍ. إِذًا هَذِهِ الْآيَةُ مُؤَكَّدَةٌ بِثَلَاثِ مُؤَكِّدَاتٍ: الْأَوَّلُ الْقَسَمُ الْمُقَدَّرُ، الثَّانِي اللَّامُ الْمُوَطِّئَةُ لِلْقَسَمِ، وَالثَّالِثَةُ \"قَدْ\". وَهُنَا فَائِدَةٌ يَا طُلَّابَ الْعِلْمِ أَنَّ \"قَدْ\" فِي اللُّغَةِ الْعَرَبِيَّةِ تَدْخُلُ عَلَى الْفِعْلِ الْمُضَارِعِ وَتَدْخُلُ عَلَى الْمَاضِي. فَإِذَا دَخَلَتْ عَلَى الْفِعْلِ الْمُضَارِعِ يَكُونُ لَهَا مَعَانٍ ثَلَاثَةٌ -احْفَظُوا هَذَا فَهُوَ مُفِيدٌ لَكُمْ- أَنَّ \"قَدْ\" مَعَ الْفِعْلِ الْمُضَارِعِ يَكُونُ لَهَا ثَلَاثَةُ مَعَانٍ: الْمَعْنَى الْأَوَّلُ التَّحْقِيقُ كَمَا فِي هَذِهِ الْآيَةِ وَقَوْلِهِ جَلَّ وَعَلَا: {قَدْ يَعْلَمُ اللَّهُ الْمُعَوِّقِينَ مِنْكُمْ}، \"قَدْ\" هُنَا لِلتَّحْقِيقِ صَحِيحٌ أَوْ لَا؟ ثَانِيًا التَّقْلِيلُ؛ إِذَا دَخَلَتْ \"قَدْ\" عَلَى الْفِعْلِ الْمُضَارِعِ أَفَادَتْ مَعَانِيَ ثَلَاثَةً: الْمَعْنَى الْأَوَّلُ التَّحْقِيقُ، وَالْمَعْنَى الثَّانِي التَّقْلِيلُ، وَمِثَالُهُ \"قَدْ يَنْجَحُ الْكَسُولُ\". الْكَسُولُ بَطَّالٌ صَحِيحٌ أَوْ لَا؟ الْأَصْلُ فِيهِ أَنَّهُ فَاشِلٌ، يَعْنِي الْأَصْلُ أَنَّهُ لَا يَنْجَحُ، لَكِنْ قَدْ يَنْجَحُ؛ يَقْرَأُ -كَمَا فِي حَالَةِ الدِّرَاسَةِ النِّظَامِيَّةِ الْيَوْمَ- يَتْرُكُ كِتَابًا كَامِلًا يَقْرَأُ صَفْحَةً، يَذْهَبُ لِلِامْتِحَانِ فَيَجِدُ فِي الِامْتِحَانِ تِلْكَ الصَّفْحَةَ الَّتِي قَرَأَ، صَحِيحٌ أَوْ لَا؟ \"قَدْ\" هَذِهِ تُفِيدُ التَّقْلِيلَ. \"قَدْ يُكْرِمُ الْبَخِيلُ\"؛ الْبَخِيلُ لَا يُكْرِمُ أَبَدًا. ثَالِثًا تُفِيدُ التَّكْثِيرَ؛ \"قَدْ يَنْجَحُ الْمُجْتَهِدُ\". هُنَا \"قَدْ\" لَيْسَتْ لِلتَّحْقِيقِ قَطْعًا، لِأَنَّ \"قَدْ\" يَجْتَهِدُ الْإِنْسَانُ وَعَكْسُ الْأَوَّلِ؛ يَتْرُكُ صَفْحَةً وَاحِدَةً لَا يُعِدُّهَا إِعْدَادًا جَيِّدًا فَيَأْتِي الِامْتِحَانُ لَهُ تَعَلُّقٌ بِتِلْكَ الصَّفْحَةِ.",

          "text": "تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا. قَوْلُهُ جَلَّ وَعَلَا {وَقَضَى}؛ فَسَّرَهَا السَّلَفُ الصَّالِحُ بِمَعَانٍ؛ قَالَ ابْنُ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا: مَعْنَى قَضَى أَيْ أَمَرَ رَبُّكَ، وَ\"قَضَى رَبُّكَ\" بِمَعْنَى أَمَرَ رَبُّكَ. وَقَالَ الرَّبِيعُ بْنُ أَنَسٍ رَحِمَهُ اللَّهُ قَالَ: أَوْجَبَ رَبُّكَ، أَوْجَبَ رَبُّكَ، وَ\"قَضَى رَبُّكَ\" مَعْنَاهُ مَاذَا؟ أَوْجَبَ رَبُّكَ عَلَيْكَ. وَقَالَ مُجَاهِدٌ رَحِمَهُ اللَّهُ جَلَّ وَعَلَا: وَمَعْنَى قَضَى قَالَ أَوْصَى رَبُّكَ، وَأَوْصَى رَبُّكَ. وَقَالَ الضَّحَّاكُ: وَوَصَّى رَبُّكَ، وَقَالَ الضَّحَّاكُ: وَوَصَّى رَبُّكَ. إِذًا يَا طُلَّابَ الْعِلْمِ، السَّلَفُ ذَكَرُوا مَعْنَى قَضَى بِمَعْنَى مَاذَا؟ أَمَرَ وَوَصَّى، أَمَرَ وَوَصَّى. لِمَاذَا ذَكَرْنَا هَذَيْنِ الْمَعْنَيَيْنِ؟ لِأَنَّ \"أَوْجَبَ\" بِمَعْنَى مَاذَا؟ أَمَرَ، لِأَنَّ الْأَمْرَ يَدُلُّ عَلَى مَاذَا؟ عَلَى الْإِيجَابِ، عَلَى الْوُجُوبِ. وَكَذَلِكَ وَصَّى، لِأَنَّ لَفْظَ السَّلَفِ وَرَدَ بِلَفْظَيْنِ اثْنَيْنِ؛ اللَّفْظُ الْأَوَّلُ \"أَوْصَى\" وَاللَّفْظُ الثَّانِي مَاذَا؟ \"وَصَّى\"، وَكِلَاهُمَا بِنَفْسِ الْمَعْنَى، لِذَلِكَ تَأْتِي قَضَى بِمَعْنَى أَمَرَ وَوَصَّى، فَمَعْنَى {وَقَضَى رَبُّكَ} أَيْ فِيهِ مَعْنَى الْأَمْرِ وَفِيهِ مَعْنَى مَاذَا؟ الْوَصِيَّةِ. هُنَا مَا هُوَ الْأَمْرُ وَمَا هِيَ الْوَصِيَّةُ؟ أَلَّا تَعْبُدُوا إِلَّا اللَّهَ وَبِالْوَالِدَيْنِ إِحْسَانًا، {أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا}. قَوْلُهُ جَلَّ وَعَلَا {أَلَّا تَعْبُدُوا}؛ \"أَنْ\" هُنَا يَجُوزُ أَنْ تَكُونَ تَفْسِيرِيَّةً، يَجُوزُ أَنْ تَكُونَ هُنَا تَفْسِيرِيَّةً لِأَنَّ أَمَرَ وَوَصَّى فِيهَا مَعْنَى الْقَوْلِ دُونَ حُرُوفِ الْقَوْلِ، فِيهَا مَعْنَى الْقَوْلِ حُرُوفِ الْقَوْلِ هِيَ \"قَالَ\"، فَمَعْنَى أَمَرَ وَمَعْنَى وَصَّى فِيهَا مَاذَا؟ مَعْنَى الْقَوْلِ. أَيْ بِمَاذَا أَمَرَ وَوَصَّى؟ الْجَوَابُ بِأَنْ تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا. إِذًا قُلْنَا \"أَنْ\" يَجُوزُ أَنْ تَكُونَ تَفْسِيرِيَّةً، وَكَذَلِكَ يَجُوزُ أَنْ تَكُونَ مَصْدَرِيَّةً مَجْرُورَةً بِبَاءِ جَرٍّ مُقَ هِ وَسَلَّمَ. إِذًا الشَّيْخُ الْأَمِينُ ذَكَرَ الْقِسْمَ الْأَوَّلَ وَهُوَ أَنْ يَكُونَ الْخِطَابُ مُوَجَّهًا لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلَا يُرَادُ بِهِ النَّبِيُّ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ وَإِنَّمَا يُرَادُ بِهِ مَاذَا؟ الْأُمَّةُ، هَذَا الْقِسْمُ الْأَوَّلُ. وَالْقِسْمُ الثَّانِي يَكُونُ خَاصًّا بِهِ وَلَا يَدْخُلُ مَعَهُ غَيْرُهُ مِنْ أُمَّتِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. قَالَ رَحِمَهُ اللَّهُ: الثَّالِثُ هُوَ الشَّامِلُ لَهُ وَلِغَيْرِهِ، بِدَلِيلِ قَوْلِهِ تَعَالَى {يَا أَيُّهَا النَّبِيُّ إِذَا طَلَّقْتُمُ النِّسَاءَ} وَقَوْلِهِ {يَا أَيُّهَا النَّبِيُّ لِمَ تُحَرِّمُ مَا أَحَلَّ اللَّهُ لَكَ تَبْتَغِي مَرْضَاتَ أَزْوَاجِكَ}؛ فَهَذَا كُلُّهُ خِطَابٌ لِمَنْ؟ لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمَ. وَقَدْ جَاءَ بَعْدَ هَذَا الْخِطَابِ مُبَاشَرَةً قَوْلُ اللَّهِ جَلَّ وَعَلَا: {قَدْ فَرَضَ اللَّهُ لَكُمْ تَحِلَّةَ مَاذَا أَيْمَانِكُمْ} بِخِطَابِ مَاذَا؟ الْجَمْعِ، بِخِطَابِ الْجَمْعِ. فَخَاطَبَ اللَّهُ عَزَّ وَجَلَّ عُمُومَ الْأُمَّةِ بِذَلِكَ، وَإِنْ كَانَ الْخِطَابُ ابْتِدَاءً مُوَجَّهًا لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ شَامِلٌ لِكُلِّ أُمَّةِ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. مَنْ يَسْتَطِيعُ أَنْ يُعِيدَ لَنَا هَذِهِ الْأَقْسَامَ الثَّلَاثَةَ الَّتِي ذَكَرَهَا الشَّيْخُ مُحَمَّدٌ الْأَمِينُ الشِّنْقِيطِيُّ رَحِمَهُ اللَّهُ جَلَّ وَعَلَا؟ نَعَمْ. يَكُونُ مُوَجَّهًا لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلِأُمَّتِهِ.",

          "text": "فِي نَفْسِ الْوَقْتِ مَصْدَرِيَّةٌ؟ نَعَمْ نَعَمْ. وَفِي نَفْسِ الْوَقْتِ مَصْدَرِيَّةٌ؟ هُنَا تَفْسِيرِيَّةٌ. نَعَمْ هُنَا الْآنَ تَفْسِيرِيَّةٌ، أَيْ أَنَّ اللَّهَ تَبَارَكَ وَتَعَالَى عِنْدَمَا قَالَ {قُلْ تَعَالَوْا أَتْلُ مَا حَرَّمَ رَبُّكُمْ عَلَيْكُمْ} قَالَ {أَلَّا تُشْرِكُوا بِي شَيْئًا} أَيْ مَا حَرَّمَهُ اللَّهُ فَسَّرَهُ فِيمَا بَعْدُ، فَبَدَأَ بِالْإِشْرَاكِ بِاللَّهِ رَبِّ الْعَالَمِينَ ثُمَّ ذَكَرَ {وَبِالْوَالِدَيْنِ إِحْسَانًا} وَمَا مَرَّتْ مَعَنَا فِي الْآيَةِ الَّتِي قَبْلَهَا، ثُمَّ قَالَ {وَلَا تَقْتُلُوا أَوْلَادَكُمْ مِنْ إِمْلَاقٍ}؛ وَالْإِمْلَاقُ هُوَ الْفَقْرُ. وَوَرَدَ فِي آيَةٍ أُخْرَى قَوْلُ اللَّهِ جَلَّ وَعَلَا {وَلَا تَقْتُلُوا أَوْلَادَكُمْ خَشْيَةَ إِمْلَاقٍ}؛ مَا الْفَرْقُ بَيْنَهُمَا يَا طُلَّابَ الْعِلْمِ؟ مَا الْفَرْقُ بَيْنَ هَذِهِ الْفَائِدَةِ ذَكَرَهَا الشَّيْخُ الْعُثَيْمِينَ رَحِمَهُ اللَّهُ فِي كِتَابِ \"الْقَوْلِ الْمُفِيدِ\" عَلَى شَرْحِ كِتَابِ التَّوْحِيدِ؟ مَا الْفَرْقُ بَيْنَ قَوْلِ اللَّهِ جَلَّ وَعَلَا {وَلَا تَقْتُلُوا أَوْلَادَكُمْ مِنْ إِمْلَاقٍ} وَالثَّانِيَةِ {وَلَا تَقْتُلُوا أَوْلَادَكُمْ خَشْيَةَ إِمْلَاقٍ}؟ نَعَمْ إِمْلَاقُ الْأُولَى الْمَقْصُودُ الْفَقْرُ مُتَحَقِّقٌ، خَشْيَةَ الْفَقْرِ لَيْسَ مُتَحَقِّقًا وَلَكِنْ قَدَرًا...",

          "id": 10,
          "type": "paragraph",
          "text": "أَحْسَنْتَ. قَوْلُهُ {مِنْ إِمْلَاقٍ} أَيِ الْفَقْرُ هُنَا مُتَحَقِّقٌ، أَيْ أَنَّ الْإِنْسَانَ يَقْتُلُ وَلَدَهُ مِنَ الْفَقْرِ. أَمَّا فِي الْآيَةِ الثَّانِيَةِ {خَشْيَةَ إِمْلَاقٍ} هُوَ غَنِيٌّ وَلَكِنَّهُ يَخْشَى مَاذَا؟ يَخْشَى الْفَقْرَ. وَكِلَاهُمَا مُحَرَّمٌ فِي شَرْعِ اللَّهِ جَلَّ وَعَلَا. أَحْسَنْتَ ثُمَّ قَالَ جَلَّ وَعَلَا {نَحْنُ نَرْزُقُكُمْ وَإِيَّاهُمْ}؛ فَلَمَّا حَرَّمَ قَتْلَ الْأَوْلَادِ خَشْيَةَ الْفَقْرِ، بَيَّنَ اللَّهُ تَبَارَكَ وَتَعَالَى أَنَّ الرِّزْقَ بِيَدِهِ؛ {وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ فَوَرَبِّ السَّمَاءِ وَالْأَرْضِ إِنَّهُ لَحَقٌّ مِثْلَمَا أَنَّكُمْ تَنْطِقُونَ}، فَالرِّزْقُ بِيَدِهِ جَلَّ وَعَلَا وَلَيْسَ بِيَدِ مَاذَا؟ بِيَدِ وَالِدِهِ. ثُمَّ قَالَ {وَلَا تَقْرَبُوا الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ}؛ وَفِي هَذِهِ الْآيَةِ حَرَّمَ اللَّهُ جَلَّ وَعَلَا قُرْبَانَ الْفَوَاحِشِ، أَنْ يَقْرَبَ الْإِنْسَانُ الْفَوَاحِشَ، وَمِنْهُ قَوْلُ اللَّهِ جَلَّ وَعَلَا {وَلَا تَقْرَبُوا الزِّنَا إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا}، وَالنَّهْيُ عَنْ قُرْبِ الشَّيْءِ أَبْلَغُ مِنَ النَّهْيِ عَنْ قُرْبِهِ، لِمَاذَا؟ لِأَنَّ النَّهْيَ عَنْ قُرْبِ الشَّيْءِ يُؤَدِّي إِلَى النَّهْيِ عَنْ كُلِّ الْوَسَائِلِ الْمُوصِلَةِ إِلَيْهِ. فَلَمَّا حَرَّمَ اللَّهُ جَلَّ وَعَلَا الزِّنَا حَرَّمَ كُلَّ مَا مِنْ شَأْنِهِ أَنْ يُوصِلَ إِلَيْهِ مِنَ إِطْلَاقِ النَّظَرِ، وَمِنَ الْخَلْوَةِ بِالْأَجْنَبِيَّةِ، وَمِنَ الدُّخُولِ عَلَى النِّسَاءِ كَمَا جَاءَ فِي الْحَدِيثِ \"إِيَّاكُمْ وَالدُّخُولَ عَلَى النِّسَاءِ\" قَالُوا يَا رَسُولَ اللَّهِ أَرَأَيْتَ الْحَمْو - يَعْنِي أَخُو الزَّوْجِ يَدْخُلُ عَلَى زَوْجَةِ أَخِيهِ - فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الْحَمْوُ مَاذَا؟ الْمَوْتُ\". لِذَلِكَ أَتَتِ الشَّرِيعَةُ بِتَحْرِيمِ كُلِّ الْوَسَائِلِ الْمُوصِلَةِ إِلَى الْفَاحِشَةِ وَالْعِيَاذُ بِاللَّهِ. لِذَلِكَ تَحْرِيمُ قُرْبَانِ الشَّيْءِ أَعْظَمُ مِنْ تَحْرِيمِهِ مَاذَا أَصْلًا، لِمَاذَا؟ لِأَنَّ تَحْرِيمَ قُرْبِ الشَّيْءِ هُوَ تَحْرِيمٌ لِكُلِّ الْوَسَائِلِ الْمُوصِلَةِ إِلَيْهِ. ثُمَّ قَالَ جَلَّ وَعَلَا {وَلَا تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللَّهَ إِلَّا بِالْحَقِّ}؛ اللَّهُ تَبَارَكَ وَتَعَالَى تَعَالَى نَهَى عَنْ قَتْلِ النَّفْسِ وَاسْتَثْنَى مَا إِذَا كَانَ الْقَتْلُ بِحَقٍّ كَالْقَتْلِ فِي مَاذَا؟ فِي حَدٍّ مِنْ حُدُودِ اللَّهِ رَبِّ الْعَالَمِينَ جَلَّ وَعَلَا كَرَجْمِ مَاذَا؟ الزَّانِي، وَكَذَلِكَ النَّفْسِ بِالنَّفْسِ، وَكَذَلِكَ التَّارِكِ لِدِينِهِ الْمُفَارِقِ لِلْجَمَاعَةِ. فَهُنَا اللَّهُ عَزَّ وَجَلَّ لَمَّا حَرَّمَ قَتْلَ النَّفْسِ اسْتَثْنَى مَا يَكُونُ مِنْهَا بِحَقٍّ، وَهُوَ الَّذِي فِيهِ حَيَاةُ الْعِبَادِ كَمَا قَالَ جَلَّ وَعَلَا: {وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ يَا أُولِي الْأَلْبَابِ}. ثُمَّ قَالَ {ذَلِكُمْ وَصَّاكُمْ بِهِ لَعَلَّكُمْ تَعْقِلُونَ}. قَالَ {وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ حَتَّى يَبْلُغَ أَشُدَّهُ}؛ نَهَى اللَّهُ عَزَّ وَجَلَّ أَنْ يَقْرَبَ الْوَلِيُّ مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ، مَا مَعْنَى \"إِلَّا بِالَّتِي هِيَ أَحْسَنُ\"؟ إِلَّا بِمَا يَعُودُ عَلَيْهِ بِالنَّفْعِ دِينًا وَدُنْيَا، إِلَّا مَا يَعُودُ عَلَيْهِ دِينًا وَدُنْيَا. أَضْرِبُ لَكُمْ مِثَالًا: لَوْ أَنَّ الْوَلِيَّ يَعْمَلُ بِمَالِ الْيَتِيمِ فِي عَمَلٍ بِمَالِ الْيَتِيمِ يَدُرُّ عَلَيْهِ رِبْحًا كَبِيرًا وَفِيهِ رِبًا، وَيَعْمَلُ فِي مَالِ الْيَتِيمِ وَيَدُرُّ عَلَيْهِ رِبْحًا أَقَلَّ وَلَيْسَ فِيهِ رِبًا، فَمَا الْوَاجِبُ عَلَيْهِ فِي حَقِّهِ؟ هَا! الَّذِي لَا... لِمَاذَا؟ هُوَ أَحْسَنُ.",

          "text": "نَعَمْ مَبْنَاهُ أَنَّ هَذِهِ الْأُمُورَ لَا يُمْكِنُ أَنْ يَلْتَزِمَهَا الْعَبْدُ إِلَّا إِذَا اتَّقَى اللَّهَ، لِمَاذَا؟ لِأَنَّ اللَّهَ عَزَّ وَجَلَّ عَهِدَ بِوَصِيَّةٍ لِلْأَوَّلِينَ وَالْآخِرِينَ وَهِيَ تَقْوَى اللَّهِ، لِأَنَّ تَقْوَى اللَّهِ هِيَ أَسَاسُ كُلِّ خَيْرٍ. وَالتَّقْوَى إِجْمَالًا هِيَ امْتِثَالٌ لِلْمَأْمُورِ وَاجْتِنَابٌ لِمَاذَا؟ لِلْمَحْذُورِ. فَلَا يُمْكِنُ لِلْعَبْدِ أَنْ يَمْتَثِلَ مَا أُمِرَ بِهِ وَأَنْ يَجْتَنِبَ مَا نُهِيَ عَنْهُ إِلَّا إِذَا مَاذَا؟ إِلَّا إِذَا اتَّقَى اللَّهَ. أَحْسَنْتَ هَذَا سُؤَالٌ فِي مَحَلِّهِ. فَخَتَمَ اللَّهُ عَزَّ وَجَلَّ لِلْوَصَايَا الْعَشْرِ بِقَوْلِهِ {لَعَلَّكُمْ تَتَّقُونَ} لِهَذَا الْأَمْرِ، وَهُوَ أَنَّ الْإِنْسَانَ لَا يُمْكِنُ أَنْ يَتَّقِيَ اللَّهَ جَلَّ وَعَلَا حَقَّ التَّقْ... لَا يُمْكِنُ أَنْ يَمْتَثِلَ لِلْمَأْمُورِ وَيَجْتَنِبَ الْمَحْذُورَ إِلَّا إِذَا مَاذَا؟ إِلَّا إِذَا اتَّقَى اللَّهَ عَزَّ وَجَلَّ حَقَّ التَّقْوَى. قَالَ ابْنُ مَسْعُودٍ: \"مَنْ أَرَادَ أَنْ يَنْظُرَ إِلَى وَصِيَّةِ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الَّتِي عَلَيْهَا خَاتِمُهُ\" أَيْ إِذَا أَرَادَ الْإِنْسَانُ أَنْ يَنْظُرَ إِلَى وَصِيَّةٍ مَكْتُوبَةٍ وَعَلَيْهَا خَاتَمُ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَلْيَقْرَأْ... وَالْمَعْلُومُ يَا طُلَّابَ الْعِلْمِ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَاتَ وَلَمْ يَتْرُكْ وَصِيَّةً مَكْتُوبَةً. فَفِي مَرَضِ مَوْتِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ \"تَعَالَوْا أَكْتُبْ لَكُمْ كِتَابًا لَنْ تَضِلُّوا بَعْدِي أَبَدًا\". فَقَالَ جَمَاعَةٌ مِنَ الْقَوْمِ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَرِيضٌ فَلَا تَقَدَّمَ لَهُ الْكِتَابَ، وَقَالَ بَعْضُهُمْ بَلْ قَدِّمُوا لَهُ كِتَابًا يَكْتُبْ لَنَا كِتَابًا لَا نَضِلُّ بَعْدَهُ أَبَدًا. فَحَصَلَ التَّنَازُعُ فَقَالَ...",

 الجنَّةِ وألْوانُهم، فيرى ما في الجنَّة مِنْ خِلال البابِ، فيقولُ: ربِّ أَدْخلني الجنَّةَ. فيقولُ الله [له]: أتَسْأَلُ الجنَّةَ وقد نَجَّيْتُكَ مِنَ النارِ؟ فيقولُ: رَبِّ اجْعَلْ بَيْني وبيْنَها حِجاباً حتى لا أسْمعَ حَسيسَها. قال:\n\nفيدْخُلُ الجنَّةَ، ويرى أوْ يُرفَعُ له مَنْزِلٌ أمامَ ذلك كأنَّ ما هو فيه بالنسبَةِ إلَيْهِ حُلُمٌ، فيقولُ: ربِّ! أعْطِنيْ ذلك المنْزِلَ. فيقولُ [له]: لعَلَّكَ إنْ أَعطَيتُكَهُ تَسْأَلُ غيرَه؟ فيقول: لا وعِزَّتِكَ لا أسْألُك غَيرَهُ، وأنِّي مَنزِلٌ أحْسن منه؟ فيُعْطاه، فينزلُه، ويرى أمامَ ذلك منزلاً، كأنَّ ما هو فيه بالنسبةِ إليْهِ حُلُمٌ. قال: ربِّ أعْطِني ذلك المنْزِلَ، فيقولُ الله تبارَك وتعالى له. لعلَّكَ إنْ أعطيتُكَهُ تَسْأَلُ غيرَه؟ فيقولُ: لا وعزَّتِك [لا أسألك]، وأنِّي مَنزِلٌ أحْسَن منه؟ فيُعْطاه فينزله، ثُمَّ يسْكتُ. فيقولُ الله جلَّ ذِكْرُه: ما لَك لا تَسْأَلُ؟ فيقولُ: ربِّ! قد سأَلْتُكَ حتى استَتْحيَيْتُكَ، [وأقسمت لك حتى استحييتك] فيقول الله جلَّ ذِكْرُه: ألَمْ ترضَ أنْ أعْطيَكَ مثلَ الدنيا منذُ خَلْقتُها إلى يومِ أفْنَيْتُها وعَشَرةَ أضْعافِه؟ فيقولُ: أتَهْزَأُ بي وأنْتَ ربُّ العِزَّة؟ [فيضْحَكُ الرَّبُّ عزّ وجلّ من قوله\".\n\nقال: فرأيتُ عبد الله بنَ مسعودٍ إذا بَلَغَ هذا المكانَ مِنْ هذا الحديثِ ضَحِكَ، فقالَ لهُ رجلٌ. يا أبا عبدِ الرحمنِ! قَدْ سمعتُكَ تُحدّثُ هذا الحديثَ مراراً، كلّما بَلَغْتَ هذا المكانَ ضَحِكْتَ؟ فقالَ: إني سمعتُ رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - يحدّث هذا الحديثَ مراراً كلّما بَلَغَ هذا المكانَ مِنْ هذا الحديثِ ضَحِكَ حتى تبدوَ أضراسُه]، (١) قالَ: فيقولُ الربُّ جلَّ ذِكْرُه: لا، ولكنِّي على ذلك قادِرٌ، فيقولُ: ألحِقْني بالناسِ، فيقولُ: الْحَقْ بالناسِ.\n\nفيَنْطَلِقُ يرْمُل في الجنَّةِ، حتى إذا دَنا مِنَ الناسِ رُفِعَ له قَصْرٌ مِنْ دُرَّةٍ، فيَخِرُّ ساجِداً، فيقولُ له: ارْفَعْ رأْسَك، مالَك؟ فيقولُ: رأيتُ ربِّي أو تَراءى لي ربِّي، فيقالُ: إنَّما هو منزِلٌ مِنْ منازِلكَ. قال: ثُمَّ يلقى رجُلاً فيتَهيَّأُ لِلسُّجودِ له، فيقالُ لَه: مَهْ! فيقولُ: رأيتُ أنَّك مَلَكٌ مِنَ الملائِكَةِ، فيقولُ: إنَّما أنا خازِنٌ مِنْ خُزَّانِكَ، وعبدٌ مِنْ عَبيدِك، تحت يدي ألفُ قَهْرمانٍ على [مثل] ما أنا عليهِ. قال:\n\nفيَنْطَلِقُ أمامَهُ حتى يَفتَحَ له بابَ القَصْرِ، قال: وهو مِنْ دُرَّةٍ مُجَوَّفَةٍ، سقائِفُها وأبْوابُها وأغْلاقُها ومفاتيحُها منها، تَسْتَقْبِلُه جوْهَرةٌ خَضْراءُ، مُبَطَّنَةٌ بحمراء، (فيها سبْعون باباً، كلُّ بابٍ يُفْضي إلى جَوْهَرةٍ خَضْراءَ، مُبَطَّنةٍ،) (٢) كلُّ جَوْهرةٍ تُفْضي إلى جَوْهَرةِ على غيرِ لَوْنِ الأُخْرى، في كلِّ جوهَرةٍ سرُرٌ وأزْواجٌ ووَصائفُ، أدْناهُنَّ حوْراءُ عَيْناءُ، عليها سبْعونَ حُلَّةً، يُرى مُخَّ ساقِها منْ وراءِ حُلَلِها، كَبِدُها مِرْآتُه، وكَبِدُه مِرْآتُها، إذا أَعْرضَ عنها إعراضَةً ازْدادَتْ في عَيْنِه سبْعينَ ضِعْفاً عمّا كانَتْ قبلَ ذلك، فيقولُ لها: والله لقد ازْدَدْتِ في عيني سَبْعين ضِعْفاً، وتقولُ له: وأنتَ [والله] لَقدِ ازْدَدْتَ في عيْني سَبْعين  ضِعْفاً، فيقالُ له: أشرِفْ، أَشرِفْ. فيُشْرِفَ، فيُقالُ له: مُلْكُكَ مسيرةُ مئَةِ عامِ، يَنْفذُه بَصَرُكَ\".\n\nقال: فقال له عمر: ألا تَسْمَعُ ما يُحدِّثُنا ابْنُ أمِّ عبدٍ يا كعْبُ عن أدْنَى أهْلِ الجنَّةِ مَنزِلاً، فكيفَ أعْلاهُم؟\n\nقال: يا أميرَ المؤْمِنينَ ما لا عَيْنٌ رأَتْ ولا أُذُنٌ سمِعَتْ، فذكر الحديث"], "wordCount": 842}, {"page": 9, "hadiths": ["يَعْرَقُ الناسُ يَوْمَ القِيامَة حتى يَذْهَبَ في الأرْضِ عَرَقُهم سبْعينَ ذِراعاً، وإنَّهُ يُلْجِمُهُم حتى يَبْلُغَ آذانَهُمْ", "الميِّتُ يُبْعَثُ في ثيابِه التي يَموتُ فيها", "وعن أبي هريرة رضي الله عنه قال: قال رسول الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\n\"ما بينَ النَّفْخَتَيْنِ أربَعون\".\n\nقيل: أربَعون يوماً؟ قال أبو هريرة: أبَيْتُ، قالوا: أربعونَ شَهْراً؟ قال: أبَيْتُ، قالوا: أربعون سنَةً؟ قال: أبَيْتُ.\n\nثُمَّ ينْزِلُ مِنَ السماءِ ماءٌ فيَنْبُتونَ كما يَنْبُت البَقْلُ، وليسَ مِنَ الإنْسانِ شيْءٌ إلا يَبْلَى إلاَّ عَظْمٌ واحِدٌ، وهو عَجْبُ الذَّنَبِ، منه يُرَكَّبُ الخَلْقُ يومَ القِيامَةِ", "كيفَ أنْعَمُ وقدِ التَقم صاحِبُ القْرنِ القَرنَ، وحنى جَبْهَتَهُ، وأصْغَى سَمْعَهُ؛ يَنْتَظرُ أنْ يُؤْمَر فَينْفُخَ؟! \".\n\nفكأنَّ ذلك ثَقُلَ على أصْحابِه فقالوا: كيفَ نَفْعَلُ يا رسول الله! أوَ نَقولُ؟ قال:\n\n\"قولوا: حَسْبُنا الله، ونِعْمَ الوكيلُ، على الله توَكَّلْنا", "\"لأَنْ أمْشي على جَمْرَةٍ أو سَيْفٍ، أو مَ القِيامَةِ وعليها سِرْبالٌ مِنْ قَطِرانٍ، ودِرْعٌ مِنْ جَربٍ\"", "صحيح] وعن مجاهدٍ قال: قالت عائشة رضيَ الله عنها:\n\nما فعلَ يزيدُ بْنُ قيْسٍ لعَنَهُ الله؟ قالوا: قد ماتَ، قالَتْ: فأسْتَغْفِرُ الله.\n\nفقالوا لَها: ما لكِ لَعَنْتيهِ ثُمَّ قلْتِ: أسْتَغْفِرُ الله؟ قالَتْ: إنَّ رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - قال:\n\n\"لا تَسُبُّوا الأَمْواتَ، فإنَّهمْ أفْضَوْا إلى ما قَدَّموا\"", "كان رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - إذا دُعِيَ إلى جَنازَةٍ سأَل عنْها؟ فإنْ أثنِيَ عليها خَيرٌ قامَ فصَلى عليها، وإنْ أثْنِيَ عليها غيرُ ذلك قال لأهليها:\n\n\"شأْنُكُمْ بِها\". ولَمْ يُصَلِّ عليها", "[حسن لغيره] وعن أنسٍ رضي الله عنه؛ أنَّ النبيَّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - قال:\n\n\"ما مِنْ مسْلمٍ يموتُ فيَشْهَدُ له أرْبعةُ أهْلِ أبْياتٍ مِنْ جِيرانِه الأَدْنَيْنَ أنَّهم لا يعلَمون إلا خيراً؛ إلا قالَ الله: قد قبِلْتُ عِلْمَكُم فيه، وغفَرْتُ له ما لا تَعْلَمون", "مَرُّوا على النبيِّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - بِجَنازَةٍ فأثْنَوا علَيْها خيراً، فقال:\n\"وجَبَتْ\".\nثُمَّ مَرُّوا بأُخْرى فأَثْنوا علَيها شرّاً. فقال:\n\"وجَبَتْ\". ثُمَّ قال:\n\"إنَّ بعضَكُم على بعْضٍ شَهِيدٌ", "كان النبيُّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - إذا فَرغ مِنْ دَفْن الميَّت وقَف عليه فقال:\n\"اسْتَغْفِروا لأَخيكُم، واسْأَلوا لهُ بالتَّثْبيتِ؛ فإنَّه الآنَ يُسْألُ\"", "أسْرِعوا بالجنازَةِ، فإنْ تَكُ صالِحةً فخيرٌ تُقَدِّمونَها إلَيْهِ، وإنْ تَكُ سِوى ذلك فَشَرٌّ تَضعونَهٌ عنْ رِقابِكُمْ", "حسن لغيره] وروى ابن ماجه عن عمرو بن حزم عن النبي - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - قال:\n\"ما من مؤمنٍ يعزِّي أخاه بمصيبةٍ؛ إلا كساه الله من حُلَلٍ الكرامة", "ما مِنْ رجلٍ مسلمٍ يموتُ فيقومُ على جَنازَتِه أرْبعونَ رجلاً لا يُشْرِكونَ بالله شيئْاً؛ إلا شَفعهُم الله فيه", "\"ما منْ مَيِّتٍ يُصلِّي عليهِ أُمَّةٌ مِنَ المسْلِمينَ يَبْلُغونَ مِئةً، كلُّهم يَشْفَعون لَهُ، إلا شُفِّعوا فيه"], "wordCount": 331}, {"page": 12, "hadiths": ["\"مَنْ شهدَ الجَنازَة حتى يُصَلِّى علَيْها، فلهُ قيراطٌ (١)، ومَنْ شَهِدَها حتى تُدْفَنَ فلَهُ قِيراطَانِ\".\nقيلَ: وما القِيراطَانِ؟ قال:\n\"مِثْلُ الجبلَيْنِ العَظيمَيْنِ", "مَنْ غَسَّلَ مَيِّتاً فكتَم عليه غَفَر الله له أربعين مَرَّةً، ومَنْ كفَّنَ مَيِّتاً كساهُ الله مِنْ سُنْدُسٍ وإسْتَبْرقٍ في الجنَّةِ، ومَنْ حَفَر لِمَيِّتٍ قَبْراً فأجَنَّهُ فيه أجْرى الله لَهُ مِنَ الأَجْرِ كأجرِ مسْكَنٍ أسْكَنُه إلى", "قالَ رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\"إذا حضَرْتُم المريضَ أوِ الميِّتَ فقولوا خيراً، فإنَّ الملائِكَة يُؤمِّنونَ على ما تَقولُونَ\".\nقالَتْ: فلمَّا ماتَ أبو سلَمة أتَيْتُ النبيَّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - فقلتُ: يا رسول الله! إنَّ أبا سلَمةَ قد ماتَ، قال:\n\"قولي: اللهُمَّ اغْفِرْ لي ولَهُ، وأعْقِبْني مِنهُ عُقْبى (١) حسَنَةً\".\nفقلتُ ذلك، فأعْقَبني الله مَنْ هو خيرٌ لي مِنْه؛ مُحمَّداً - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -", "جاءَ رجلٌ إلى النبيِّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - فقال: يا رسول الله! أيُّ الصدَقَةِ أعْظَمُ أجْراً؟ قال:\n\"أنْ تَصَّدَّقَ وأنتَ صحيحٌ شَحِيحٌ، تَخْشى الفَقْرَ وتأَمَلُ الغِنى، ولا تُمهِلُ حتى إذا بَلَغْتَ الحُلْقومَ، قلْتَ: لِفُلانٍ كذا، ولِفلانٍ كَذا، وقدْ كان لِفُلانٍ", "ما حقُّ امْرئٍ، مسلم لَه شيْءٌ (٢) يوصي فيه يَبيتُ لَيْلَتيْنِ، -وفي رواية: ثلاث ليالٍ- إلا ووَصِيَّتِّه مكْتوبَةٌ عنده\".\nقال نافع: سمعتُ عبدَ الله بنَ عُمرَ يقول:\nما مرَّتْ عليَّ ليلَةٌ منذُ سمعتُ رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - يقولُ ذلك إلا وعندي وصِيَّتي مكْتوبَةٌ", "مَنْ قالَ: (لا إله إلا الله والله أكْبَرُ، لا إله إلا الله وحدَهُ، لا إله إلا الله ولا شريك له، لا إله إلا الله لَهُ الملْكُ، ولَهُ الحَمْدُ، لا إله إلا الله، ولا حولَ ولا قُوَّةَ إلا بالله) -يَعْقِدُهُنَّ خَمْساً بأصابِعهِ\"- ثم قال:\n\"مَنْ قالَهُنَّ في يومٍ أوْ في ليلَةٍ، أوْ في شَهْرٍ؛ ثُمَّ ماتَ في ذلك اليومِ أو في تلكَ الليلَةِ أوْ في ذلكَ الشهرِ غُفِرَ له ذَنْبُه"], "wordCount": 286}, {"page": 13, "hadiths": ["مَنْ قال: (لا إله إلا الله والله أكْبَرُ)، صدَّقَهُ ربُّه؛ فقال: لا إله إلا أَنا وأنا أكْبَرُ، وإذا قال: (لا إله إلاَّ الله وَحْدَهُ)، قال: يقولُ الله: لا إله إلا أنا وَحْدي، وإذا قال: (لا إله إلا الله وحْدَهُ لا شريكَ له)، قال: يقولُ: صدَقَ عبْدي، لا إله إلاَّ أنَا وَحْدي لا شريكَ لي، وإذا قالَ: (لا إله إلا الله وحده لا شريكَ لَه، لَهُ الملْكُ، ولَهُ الحَمْدُ)، قال: يقول: لا إله إلا أنا، ليَ المُلْكُ وليَ الحَمْدُ، وإذا قال: (لا إله إلا الله، ولا حَوْلَ ولا قُوَّةَ إلا بالله)، قال: لا إله إلاّ أنا ولا حَوْلَ ولا قُوَّةَ إلا بي\". وكان يقول: مَنْ قالَها في مَرضِهَ ثُمَّ ماتَ لَمْ تَطْعَمْهُ النارُ", "مَنْ عادَ مريضاً لَمْ يحضُرْ أجلُه فقال عنده سبْعَ مراتٍ: (أسأَلُ الله العظيمَ ربَّ العرشِ العظيمِ أنْ يَشفِيَك)؛ إلاَّ عافاه الله مِنْ ذلك المرضِ", "\"مَنْ عادَ مريضاً لَمْ يَزلْ يخوضُ في الرحْمَةِ حتى يَجْلِسَ؛ فإذا جلَس اغْتَمسَ فيها", "ما مِنْ مسلم يعودُ مسلِماً غَدوةً؛ إلا صلّى (١) عليه سَبْعون ألفَ ملَكٍ حتى يُمْسِيَ، وإنْ عادَ عَشِيَّةً؛ إلا صَلّى عليهِ سَبْعون ألْفَ ملَكٍ حتى يُصْبِحَ، وكانَ له خَريفٌ (٢) في الجَنَّةِ\"", "\"إنَّ المْسلِمَ إذا عادَ أخاه المسْلِمَ لَمْ يَزلْ في خُرْفَةِ الجنَّةِ حتى يرجعَ\".\nقيلَ: يا رسولَ الله! وما خرْفَة الجَنَّةِ؟ قال:\n\"جَناها", "[حسن لغيره] ولفظ ابن حبان عن النبيِّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\"إذا عادَ الرجلُ أخاه أو زارَه قالَ الله تعالى: طِبْتَ وطابَ مَمْشَاكَ، وتبوَّأْتَ مَنْزِلاً في الجنَّةِ", "[حسن لغيره] وعن أبي هريرة رضي الله عنه قال: قال رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\"مَنْ عاد مريضاً؛ ناداه منادٍ منَ السماءِ: طِبْتَ وطابَ مَمْشاكَ، وتَبوَّأْتَ مِنَ الجنَّةِ مَنْزِلاً", "قال: قال رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\"مَنْ أصْبَح منكمُ اليومَ صائماً؟ \".\nفقال أبو بكْرٍ: أنا. فقال:\n\"مَنْ أطْعَم منكمُ اليومَ مسكيناً؟ \".\nفقال أبو بكْرٍ: أنا. فقال:\n\"مَنْ تَبعَ منكمُ اليومَ جَنازَةً؟ \".\nقال أبو بكْرٍ: أنا. قال:\n\"منْ عادَ منكم اليومَ مَريضاً؟ \".\nقال أبو بكْرٍ: أنا. فقال رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ\n\"ما اجْتَمعتْ هذه الخِصالُ قَطُّ في رجلٍ [في يوم] (١) إلا دخَل الجَنَّةَ"], "wordCount": 339}, {"page": 14, "hadiths": ["خمْسٌ مَنْ فَعل واحدةً مِنْهُنَّ كان ضامِناً على الله عزَّ وجلَّ: مَنْ عادَ مريضاً، أو خَرج معَ جَنازَةٍ، أوْ خَرج غازِياً، أوْ دخَل على إِمامٍ يريدُ تَعْزيرَه وتوْقيرَه، أو قعَد في بَيْتِه فسَلِمَ الناسُ مِنْهُ وسَلِمَ مِنَ الناسِ", "[حسن لغيره] وعن نافع؛ أن ابن عمر رضي الله عنهما قال له:\nيا نافعُ! تَبَيَّغَ بيَ الدمُ فالْتَمِسْ لي حجَّاماً، واجْعَلْهُ رَفيقاً إنِ اسْتَطعْتَ، ولا تَجْعَلْة شَيْخاً كبيراً، ولا صبِيّاً صغيراً، فإنِّي سمعتُ رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - يقول: \"الحِجامَةٌ على الريِّقِ أمْثَل، وفيها شفاءٌ وبَركَةٌ، وتَزيدُ في العَقْل وفي الحِفْظِ، واحْتَجِموا على بَركةِ الله يومَ الخميسِ، واجْتَنِبوا الحِجَامة يومَ الأرِبْعاءِ والجُمُعَةِ والسبْتِ والأحَدِ تحرِّياً، واحْتَجِموا يومَ الاثْنَيْنِ والثُّلاثَاءِ؛ فإنَّه اليومُ الذي عافى الله فيه أيّوبَ، وضربَه بالبَلاءِ يومَ الأربعاءِ، فإنَّه لا يَبْدو جُذَامٌ ولا بَرَصٌ إلا يومَ الأربعاءِ، وليلةَ الأرِبْعاءِ", "مَنِ احْتَجم لِسَبْعَ عَشْرَةَ مِنَ الشهْرِ كان لَه شفاءً مِنْ كُلِّ داءٍ\"", "إنَّ رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - حيثُ عُرِجَ به ما مَرَّ على مَلأ مِنَ الملائِكَةِ إلا قالوا: علَيْكَ بالحِجامَةِ. وقال:\n\n\"إنَّ خَيْرَ ما تَحْتَجِمون فيه يَوْمَ سَبْعَ عَشْرَة، ويومَ تِسْعَ عَشْرَة، ويومَ إحْدى وعِشْرين", "حَدَّثَ رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - عَنْ ليلة أُسْرِيَ به أنَّه:\n\n\"لَمْ يَمُرَّ على مَلأٍ مِنَ الملائكَةِ إلا أَمروه: أنْ مُرْ أُمَّتكَ بالْحِجَامَةِ", "ما كانَ أحَدٌ يَشْتَكي إلى رسولِ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - وجَعاً في رأسِه إلا قال:\n\n\"احْتَجِمْ\".\n\nولا وَجعاً في رِجْلَيْه إلا قال:\n\n\"اخضُبْهُما\"", "\"إنْ كانَ في شيْءٍ مما تداوَيْتُم به خيرٌ فالحجَامةُ", "أنَّه جاءَ في ركْبِ عَشْرَةٍ إلى رسول الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - فبايع تِسْعَةً، وأمسكَ عَنْ رجلٍ منهم، فقالوا: ما شَأْنُه؟ فقال:\n\"إنَّ في عَضُدِه تَميمَةً\"، فقطَّعَ الرجُلُ التَّميمَةَ، فبايَعهُ، رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - ثُمَّ قال:\n\"مَنْ عَلَّقَ فقد أَشْرَكَ", "\"أعوذُ بِعزَّةِ الله وقُدْرَتِه مِنْ شرِّ ما أجِدُ", "\"ضَعْ يدكَ على الذي تألم مِنْ جَسدِك وقل: (بِسْمِ الله) ثلاثاً، وقُلْ سبع مراتٍ: (أعوذُ بالله وقدْرَتِه مِنْ شرِّ ما أجِدُ وأحاذِرُ) \".", "\"الحمَّى كِيرٌ مِنْ جهَنَّم، فما أصابَ المؤْمِنَ منها؛ كان حظُّه مِنْ جَهن َ البَلاءُ", "قال: قال النبيُّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\n\"يا عبّاسُ عَمَّ النبيِّ! أكْثِرْ مِنَ الدعاء بالعافِيَة", "قام أبو بكر الصديق (١) على المنبر ثم بكى فقال:\n\nقام فينا رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - عامَ أوَّلِ على المنْبَر، ثُمَّ بَكى: فقال:\n\n\"سَلوا الله العَفْوَ والعافِيَةَ، فإَنَّ أحداً لَمْ يُعْطَ بعدَ اليقينِ خَيْراً مِنَ العافِيَةِ", "قال: قال رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\n\"ما مِنْ دَعْوَةٍ يدعو بها العبدُ أفْضَلُ مِنْ (٣) (اللهُمَّ إنِّي أسْأَلُكَ المُعافاةَ في الدُّنْيا والآخرَةِ)", "لا يَموتُنَّ أحدُكم إلا وهو يُحْسِنُ الظَّنِّ بُالله عزَّ وجلَّ"], "wordCount": 339}, {"page": 17, "hadiths": ["أن النبيَّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - دخل على شابٍّ وهو في الموتِ فقال:\n\n\"كيفَ تَجِدُكَ؟ \".\n\nقال: أرجو الله يا رسولَ الله! وإنِّي أخافُ ذُنوبي، فقال رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\n\"لا يَجْتَمِعانِ في قَلْبِ عبدٍ في مِثْلِ هذا المَوْطِن إلا أعْطاهُ الله ما يَرْجو، وأمَّنَهُ مِمَّا يخَافُ", "خطَبَ رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - خُطْبةً ما سمِعْتُ مثْلَها قَطُّ، فقال:\n\n\"لوْ تَعْلَمونَ ما أعلَمُ لَضَحِكْتُم قَليلاً، ولبَكَيْتُمْ كَثيراً\".\n\nفَغطى أصْحابُ رسولِ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - وجُوهَهُم لهُم خَنِيْنٌ", "[حسن] وعن أبي ذرٍّ رضي الله عنه قال:\n\nقرأَ رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -: {هَلْ أَتَى عَلَى الْإِنْسَانِ حِينٌ مِنَ الدَّهْرِ} حتى خَتَمها، ثُمَّ قال:\n\n\"إنِّي أرى ما لا تَرَوْنَ، وأسْمَعُ ما لا تَسْمَعونَ، أطَّتِ السَّماءُ، وحُقَّ لَها أنْ تَئطَّ، ما فيها موْضعُ قَدم إلا مَلَكٌ واضعٌ جَبْهَتهُ ساجِداً لله، والله لوْ تعلَمون ما أعْلَمُ لَضَحِكْتُم قليلاً، ولبَكيْتُم كَثيراً، وما تَلذَّذْتُم بالنساءِ على الفُرش، ولَخرجْتُم إلى الصُّعُداتِ تَجْأَرونَ إلى الله، والله لوَدْدِتُ أنّي شَجرةٌ تُعْضَد", "\"لو يَعلَمُ المؤْمِنُ ما عندَ الله مِنَ العُقوبَةِ ما طمعَ بجنَّتَهِ أحَدٌ، ولَوْ يعلَمُ الكافِرُ ما عندَ الله مِنَ الرحْمَةِ ما قنِطَ مِنْ جنته [أَحَد]", "حسن موقوف صحيح] وعن بهز بن حكيم قال:\n\nأمَّنا زُرارةُ بنُ أوفى رضي الله عنه في مسجد (بني قُشير)، فقرأ: {المدثر}، فلما بلغ: {فَإِذَا نُقِرَ فِي النَّاقُورِ}؛ خرَّ ميّتاً", "\"مَنْ خافَ أَدْلَجَ، ومَنْ أدْلَج بلَغ المَنْزِلَ، ألا إنّ سِلْعَةَ الله غاليةً، ألا إنَّ سِلْعَة الله الجنَّةُ", "[حسن صحيح] وعن أبي هريرة رضي الله عنه عن النبي - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -؛ فيما يروي عن ربَّه جل وعلا؛ أنه قال:\n\n\"وعزَّتي لا أجمع على عبدي خوفين وأمنين، إذا خافني في الدنيا أمَّنته يوم القيامة، وإذا أمِنني في الدنيا أخفته في الآخرة"], "wordCount": 283}, {"page": 18, "hadiths": ["كانَ رجلان مِنْ (بَلِيٍّ) [حي] (١) من (قضاعة) أسْلَما معَ رسول الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -، فاسْتشُهِدَ أَحَدُهما وأُخِّر الآخَرُ سنَةً. قال طَلْحة بنُ عُبَيْدِ الله: [فأُريتُ الجنَّةَ] فرأيتُ المؤخَّر مِنْهما أدخِلَ الجنَّةَ قبْلَ الشهيدِ. فتَعجَّبْتُ لذلك، فأصْبَحْتُ فذكرتُ [ذلك] للنَّبِيِّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -. فقال رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\n\"أليْسَ قد صامَ بعدَهُ رمضانَ؟ وصلَّى ستَّةَ آلافِ رَكْعَةً، وكذا وكذا ركعةً صلاةَ سَنَةٍ", "خِيارُكُمْ أَطْوَلُكم أعْماراً، وأحْسَنكُم أعْمالاً", "مَنْ عُمِّرَ مِنْ أمَّتي سَبْعينَ سنَةً؛ فقد أعْذَر الله إليه في العُمُرِ", "الَتَّؤُدَةُ في كلِّ شيْءٍ خَيْرٌ، إلا في عَملِ الآخِرَةِ", "\"اغْتَنِمْ خَمْساً قبلَ خَمْسٍ: شبابَكَ قبلَ هَرمِكَ، وصِحَّتَك قبل سَقْمِكَ، وغِناكَ قبْلَ فقْرِكَ، وفَراغَك قَبْلَ شُغْلِكَ، وحياتَك قَبْلَ مَوْتِكَ", "\"صَلِّ صَلاةَ مُودِّعٍ، فإنَّكَ إنْ كنْتَ لا تَراهُ فإنَّه يراكَ، وايْأَس مِمّا في أيْدي الناسِ تكُنْ غَنِيَّاً، وإيَّاك وما يُعْتَذرُ مِنْهُ", "(حسن لغيره) أخَذَ رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - بِبَعْضِ جَسدِي، فقال: \"كُنْ في الدنيا كأنَّكَ غريبٌ أو عابرُ سَبيل، وعُدَّ نفْسَك في أصْحابِ القُبورِ (١) \"، -وقال لي:-\n\n\"يا ابْنَ عُمرَ! إذا أصْبَحْتَ فلا تُحَدِّثْ نَفْسَك بالمساءِ، وإذا أمْسَيْتَ فلا تُحَدِّثْ نفسَك بالصباحِ، وخُذْ منْ صحَّتِكَ قبلَ سَقْمِك (١)، ومِنْ حياتِكَ قَبْلَ موْتِك، فإنكَ لا تَدْري يا عبد اللهَ ما اسمك غَداً\"", "\"اسْتَحْيوا مِنَ الله حَقَّ الحَياء\".\nقال: قلْنا: يا نبيَّ الله! إنَّا لنَسْتَحْيِي والحمدُ لله. قال:\n\"ليسَ ذلك، ولِكنَّ الاسْتِحْياءَ مِنَ الله حقَّ الحَياءِ؛ أنْ تحفَظَ (١) الرأْسَ وما وَعى، وتَحفظَ (١) البطْنَ وما حَوى، ولتَذْكُرِ (١) الموتَ والبِلى، ومَنْ أرادَ الآخِرَة تركَ زينَةَ الدنْيا، فَمنْ فَعل ذلك؛ فقدِ اسْتَحْيا مِنَ الله حَقَّ الحَياءِ", "أن رجلاً قال للنبي - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -: أيُّ المؤمنين أفضلُ؟ قال:\n\"أحسنُهم خُلُقاً\".\nقال: فأيُّ المؤمنين أكيَسُ؟ قال:\n\"أكثرهم للموت ذِكِرْاً، وأحسنُهم لما بعده استعداداً، أولئك الأكياسُ", "أكْثروا ذِكْرَ هاذِمِ (١) اللَّذَّات. يعني الموْتَ\".\nرواه ابن ماجه والترمذي وحسنه.\n[حسن] ورواه الطبراني في \"الأوسط\" بإسناد حسن، وابن حبان في \"صحيحه\" وزاد:\n\"فإنَّهُ ما ذَكَرهُ أحَدٌ في ضِيقٍ إلا وَسَّعَهُ، ولا ذَكره في سَعَةٍ إلا ضيَّقها عَلَيْهِ"], "wordCount": 325}, {"page": 19, "hadiths": ["ما كانَ فينا فارِسٌ يومَ بَدْرٍ غيرَ المِقْدادِ، ولقد رأيْتُنا وما فينا إلا نائمٌ، إلا رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - تحْتَ شجَرةٍ يصَلي وَببْكي حتَّى أصْبحَ", "ما كانَ فينا فارِسٌ يومَ بَدْرٍ غيرَ المِقْدادِ، ولقد رأيْتُنا وما فينا إلا نائمٌ، إلا رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - تحْتَ شجَرةٍ يصَلي وَببْكي حتَّى أصْبحَ", "رأيتُ رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - يصلِّي ولصَدْرِه أزيزٌ كأزيزِ الرِّحا مِنَ البُكاءِ", "جلسنا إلى عبد الله بن عمروٍ في الحِجْر فقال:\nابْكوا، فإنْ لَمْ تجدوا بُكاءً فتَباكَوْا، لوْ تَعْلَموا العِلْم لَصلَّى أحَدُكم حتى يَنْكَسِرَ ظَهْرُه، ولَبَكى حتى ينْقَطعَ صوْتُه.", "عَينان لا تَمَسهما النارُ: عينٌ بكَتْ مِنْ خشْيَةِ الله، وعينٌ باتَتْ تحْرُسُ في سبيلِ الله", "أنَّ رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - كان إذا صلَّى بالناسِ يَخِرُّ رِجالٌ مِن قامَتِهم في الصلاة منَ الخَصاصَةِ، وهُمْ أصْحابُ الصَّفَّة، حتى يقولَ الأَعْرابُ: هؤلاءِ مَجانينَ (١) أو مَجانُون، فإذا صلَّى رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - انْصَرف إلَيْهِم، فقال:\n\n\"لو تَعْلَمونَ ما لَكُمْ عندَ الله لأحْبَبْتُم أنْ تَزْدادوا فاقَةً وحاجة", "كان نَبِيُّكُمْ أزْهَدَ الناسِ في الدنْيا، وأصْبَحْتُم أرْغَبَ الناسِ فيها", "دخلَتْ عليَّ امْرأَةٌ مِنَ الأَنْصارِ، فرأتْ فِراشَ رسولِ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - قطيفَةً (١) مَثْنِيَّةً (٢)، فَبعثَتْ إليَّ بِفراشٍ حشْوهُ الصُّوفُ، فدخَل عليَّ رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - فقال: ما هذا يا عائشةُ؟! \".\n\nقالتْ: قلتُ: يا رسولَ الله: فلانةُ الأنْصارِيَّةُ دخلَتْ فرأَتْ فراشَكَ، فذهبَتْ فبعَثتْ إليَّ بهذا، فقال:\n\n\"رُدِّيهِ يا عائشةُ! فوالله لوْ شِئْتُ لأَجْرى الله معي جبالَ الذَّهَبِ والفِضَّةِ\"", "\"أولئك عُجِّلَتْ لهُمْ طيِّباتُهم، وهي وشِيكَةُ الانْقِطَاعِ، وإنَّا قومٌ أُخِّرتْ لنا طيِّباتُنا في آخِرَتِنا", "\"لقد أُخِفْتُ في الله وما يُخافُ أَحَدٌ، ولقد أوذيتُ في الله وما يُؤْذَى أَحَدٌ، ولقد أتَتْ عليَّ ثلاثون مِنْ بَيْنِ يَوْمٍ ولَيْلةٍ؛ وما لي ولبِلالٍ طعامٌ يأْكُله ذو كَبِدٍ، إلاّ شَيْءٌ يُوارِيه إبْطُ بِلال\n\"حديث حسن صحيح. ومعنى هذا الحديث: حين خرج رسول الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - هارباً مِنْ مَكَّة ومعه بِلالٌ؛ إنَّما كان معَ بِلالٍ مِنَ الطعامِ ما يَحْمل تَحْتَ إبْطِه"], "wordCount": 328}, {"page": 20, "hadiths": ["أتيتُ النبيَّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - فرأيتُه متَغَيِّراً فقلتُ: بأبي أنْتَ؛ ما لي أراكَ متَغَيِّراً؟ قال:\n\n\"ما دخَل جَوْفي ما يدخُل جوْفَ ذاتِ كَبِدٍ منذُ ثَلاثٍ\"\nقال: فذهَبْتُ فإذا يهَودِيٌّ يَسْقي إِبِلاً لَهُ، فسَقَيْتُ له على كلِّ دَلْوٍ بتَمْرَةٍ، فَجمَعْتُ تَمْراً؛ فأتَيْتُ بِه النبيَّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -، فقال:\n\"مِنْ أيْنَ لك يا كَعْبُ؟ \"، فأخْبرتُه، فقال النبيُّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\"أتُحِبُّني يا كعْبُ؟ \".\nقلتُ: بأبي أنْتَ؛ نَعَمْ. قال:\n\"إنَّ الفَقْرَ أسْرَعُ إلى مَنْ يُحِبُّني مِنَ السيْلِ إلى مَعادِنِه، وإنَّهُ سَيُصيبُكَ بَلاءٌ، فأعِدَّ له تَجْفافاً\nقال: فَفَقَدَهُ النبيّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - فقال:\n\"ما فَعلَ كعْبٌ؟ \".\nقالوا: مريضٌ، فخَرجَ يَمْشيحتَّى دخَل عليْه، فقالَ لَهُ:\n\"أبْشِرْ يا كعْبُ! \".\nفقالتْ أمَّهُ: هَنيئاً لكَ الجَنَّةَ يا كعْبُ! فقالَ النبيُّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\"مَنْ هذه المُتأَلِّيَةُ على الله؟ \".\nقلتُ: هِيَ أمِّي يا رسولَ الله! قال\n\"ما يُدْريكِ يا أمَّ كَعْب  وجَفْنَةٌ ومَطْهَرةٌ! فقال سعد: اعْهَدْ إلَيْنا، فقال:\n\nيا سَعْد! اُذْكُرِ الله عندَ هَمَّكَ إذا هَمَمْتَ، وعند يَدَيْكَ إذا قَسَمْتَ، وعند حُكْمِكَ إذا حكَمْتَ", "[حسن] وعن أبي عسيبٍ رضي الله عنه قال:\n\nخَرَج رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - لَيْلاً فَمرَّ بي فَدعاني، فخَرجْتُ إليه، ثمَّ مَرَّ بأبي بَكْرٍ رحِمَهُ الله فدعَاهُ، فخرَج إلَيْهِ، ثُمَّ مَرَّ بعُمَر رَحِمَهُ الله فدَعاهُ، فَخرَج إلَيْهِ، فانْطَلقَ حتَّى دخَل حائِطاً لِبَعْضِ الأَنْصارِ، فقالَ لِصاحِبِ الحائِطِ: أطْعِمْنا [بسراً]، فجاءَ بعذْقٍ فَوضَعَهُ، فأَكَل رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - وأصحابُهُ، ثُمَّ دَعا بِماءٍ بارِدٍ فشَرِبَ، فقال: لتُسْأَلنَّ عن هذا يوم القيامَةِ\".\n\nقال: فأخَذَ عُمرُ رَحمةُ الله العِذْقَ فَضَرب بِه الأَرْضَ، حتَّى تَناثَر البُسْرُ قِبَلَ رَسولِ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -؛ ثمَّ قالَ: يا رسول الله! إنَّا لَمسؤولونَ عَنْ هذا يومَ القِيامَةِ؟ قال:\n\n\"نَعمْ، إلا مِنْ ثَلاثٍ: خِرْقَةٍ كَفَّ بها [الرجلُ] عَوْرَتَهُ، أوْ كِسْرَةٍ سَدَّ بها جَوْعَتَهُ، أوْ جُحْرٍ يَتدخَّلُ فيه مِنَ الحَرَّ والقَرِّ", "وعن ابن عمر رضي الله عنهما قال:\nلا يُصيبُ عبدٌ مِنَ الدُّنيا شيْئاً إلا نَقَص مِنْ دَرَجاتِهِ عندَ الله؛ وإنْ كانَ عليه كَريِماً", "لا يُصيبُ عبدٌ مِنَ الدُّنيا شيْئاً إلا نَقَص مِنْ دَرَجاتِهِ عندَ الله؛ وإنْ كانَ عليه كَريِماً"], "wordCount": 324}, {"page": 22, "hadiths": ["اللَّهُمَّ مَنْ آمَنَ بِكَ، وشَهِدَ أنِّي رَسولُك، فحبِّبْ إليهِ لقاءَك، وسَهِّلْ عليه قَضاءَك، وأَقْلِلْ لَهُ مِنَ الدنْيا، (١) ومَنْ لَمْ يُؤْمِنْ بِكَ، ويَشْهَدْ أنِّي رسولُكَ؛ فَلا تُحبِّبْ إليه لِقاءَك، ولا تُسَهِّلْ عليهِ قَضاءَك، وكَثِّرْ عليه مِنَ الدنْيا", "كانَ النبيّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - يَخرجُ إلينا في الصُّفَّةِ وعلينا الحَوْتَكِيَّةُ، فقال:\n\n\"لوْ تَعْلَمونَ ما ذُخِرَ لَكُمْ ما حَزِنْتُم على ما زُوِيَ عنكُم، ولَتُفْتَحَنَّ عليكم (٢) فارِسُ والرومُ", "رأى سعدٌ رضي الله عنه أنَّ له فَضْلاً على مَنْ دُونَهُ. فقال رسولُ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\n\"هَلْ تُنْصَرونَ وتُرْزَقونَ إلا بِضُعَفائِكُمْ", "فقال: يا رسولَ الله! هذ  "hadiths": ["لا تُرْسِلوا فَواشِيَكُم [وصِبْيانَكُمْ] (٣) إذا غابَتِ الشمسُ حتّى تذهبَ فَحْمةُ العشَاءِ، فإنَّ الشياطين تَعْبَثُ (١) إذا غابَتِ الشمسُ حتى تَذْهَبَ فَحْمَةُ العِشَاءِ", "لا تَصْحَبُ الملائكةُ رُفْقةً فيها جُلْجُلٌ", "\"لا تَصْحَبُ الملائِكَةُ رُفقةً فيها كلبٌ أو جَرسٌ\"", "\"لا يَحِلُّ لامْرأَةٍ تُؤْمِنُ بالله واليومِ الآخِرِ تسافِرُ مسيرَةَ يومٍ وليلَةٍ إلا مَعَ ذي مَحْرَمٍ عليها\".\n\n[صحيح] وفي رواية:\n\n\"مسيرَةَ يَوْمٍ", "\"لا يَحِلُّ لامْرَأةٍ تُؤْمِنُ بالله واليوم الآخِرِ أنْ تُسافِرَ سَفَراً يكونُ ثلاثَةَ أيّامٍ فَصاعِداً إلا ومَعها أبوها، أوْ أخوها، أوْ زوجُها، أو ابْنُها، أوْ ذو مَحْرَمٍ منها\".\n\nرواه البخاري ومسلم وأبو داود والترمذي وابن ماجه.\n\nوفي رواية للبخاري ومسلم:\n\n\"لا تُسافِر المرأَةُ يومَيْنِ مِنَ الدهر إلا ومَعها ذو مَحْرَمٍ منها أوْ زَوْجُها\"", "الراكبُ شيطانٌ، والراكبانِ شَيْطانان، والثلاثَةُ رَكبٌ", "لو أنَّ الناسَ يعلَمونَ مِنَ الوِحْدَةِ ما أعَلَمُ، ما سارَ راكبٌ بلَيلٍ وَحْدَهُ", "إنِّي لَمِمَّنْ يرفَعُ أغْصانَ الشجرةِ عَنْ وَجْهِ رَسولِ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - وهو يَخْطُبُ فقالَ:\n\n\"لَوْلا أنَّ الكِلابَ أُمَّةٌ مِنَ الأُمَمِ لأَمَرْتُ بِقَتْلِها، فاقْتُلوا مِنْها كلَّ أَسْودَ بَهِيمٍ، وما مِنْ أهْلِ بيْتٍ يَرْتَبِطونَ كَلْباً؛ إلا نَقصَ مِنْ عَملِهمْ كلَّ يومٍ قيراطٌ إلا كَلْبَ صيْدٍ، أوْ كلبَ حَرْثٍ، أو كلْبَ غَنم", "مَنِ اقْتَنى كَلْباً إلا كلبَ صَيْدٍ أو مْاشِيَةٍ، فإنَّه يَنْقصُ مِنْ أَجْرِهِ كلُّ يومٍ قيراطانِ", "سَيَخْرُج عليكُم في آخِرِ الزَّمانِ نارٌ مِنْ حَضْرَمَوْتَ تَحْشُر الناسَ\".\n\nقال: قلنا: بما تأْمُرنا يا رسولَ الله؟ قال:\n\n\"عليكم بالشامِ", "طويى لِلشَامِ، إنَّ ملائِكَةَ الرَّحْمنِ باسِطَةٌ أجْنِحَتها علَيْهِ\".", "إنِّي رأيْتُ كأنَّ عَمودَ الكتابِ انْتُزِع مِنْ تحتِ وسادَتي، فأتْبَعْتُه بَصرِي، فإذا هو نورٌ ساطعٌ، عُمِدَ بِه إلى الشامِ، ألا وإنَّ الإيمانَ إذا وقَعَتِ الفِتَنُ بالشَّامِ", "سمعتُ رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -، يقولُ لِحُذَيْفَةَ بْنِ اليَمان ومعاذِ بْنِ جَبلٍ وهُما يَسْتَشِيرانِه في المَنْزلِ، فأَوْمَأَ إلى الشَّام، ثُمَّ سَألاه؟ فأَوْمَأَ إلى ا ا تقولوا للْمنافِقِ: سَيِّداً، فإنَّه إنْ يَكُ سَيِّداً؛ فقدْ أسْخَطْتُم ربَّكم عزَّ وجَلَّ\"", "ينْتَهِيَنَّ أقْوامٌ يفْتَخِرونَ بآبائِهِمُ الَّذين مَاتوا، إنَّما هم فَحْمُ جَهَّنم، أو لَيكونُنَّ أهْونَ على الله مِنَ الجُعَلِ الذي يُدَهْدهُ الخُرْءَ بأنْفِهِ، إنَّ الله [قد] (١) أذْهَبَ عنكم عُبِّيَّةَ الجاهِليَّةِ وفَخْرَها بالآباءِ، إنَّما هو مؤمِنٌ تَقِيٌّ، وفاجِرٌ شَقِيٌّ، الناسُ [كلُّهُمْ] (٢) بنو آدَمَ، وآدَمُ خُلِقَ مِنَ التُّرابِ", "إذا مشَتْ أُمَّتي المُطَيْطاءَ، وخَدمَتْهُمْ فارِسُ والرومُ، سُلِّطَ بعضُهُمْ على بعْضٍ", "مَنْ تَعظَّم في نَفْسِه أوِ اخْتَال في مِشْيَتِه؛ لَقِي الله تبارك وتعالى وهو عليه غَضْبانُ", "بينما رجلٌ يمشي في حُلَّةٍ تُعْجِبُه نَفْسُه، مُرَجَّلٌ رأْسَه يَخْتالُ في مِشْيَتِه، إذْ خسَف الله بِهِ، فهو يَتَجَلْجَلُ في الأرْضِ إلى يَوْمِ القِيامَةِ", "[صحيح لغيره] وقد رواه الحاكم فقال:\n\"ولكِنَّ الكِبْرَ مَنْ بَطَرَ الَحقِّ وَازْدَرى الناسَ", "\"لا يدخلُ الجَنَّةَ مَنْ كانَ في قَلْبِهِ مِثْقالُ ذَرَّةٍ مِنْ كِبْرٍ\"\nفقال رجلٌ: إنَّ الرجلَ يُحِبُّ أنْ يكونَ ثَوْبُه حَسناً، ونَعْلُه حَسَناً؟ قال\nإن الله جَميلٌ يحِبُّ الجمَالَ، الكِبْرُ بَطَرُ الحَقِّ وغَمْطُ الناسِ"], "wordCount": 306}, {"page": 29, "hadiths": ["[حسن] وعن عمرو بن شعيبٍ عن أبيه عن جده [عن النبيِّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -] (٢) قال:\n\"يُحْشَرُ المتَكَبِّرونَ يومَ القِيامَةِ أمْثَالَ الذَّرِّ في صُوَر الرجَالِ، يَغْشاهُمُ الذُّلُّ من كُلِّ مكانٍ، فيُساقُون إلى سِجْنٍ في جهنَّمَ يقالُ له: (بُولَسُ)، تَعْلوهُمْ نارُ الأَنْيارِ، يُسْقَوْنَ مِنْ عُصارَةِ أهْلِ النارِ: طينَةِ الخَبالِ", "[حسن] وعن عبد الله بن سلام رضي الله عنه:\nأنَّه مَرَّ في السوقِ وعليه حُزْمَةٌ مِنْ حطَبٍ، فقيلَ لَهُ: ما يَحْمِلُكَ على هذا وقد أغْناكَ الله عَنْ هذا؟ قال: أَرَدْتُ أَنْ أدْمَغَ الكِبْرَ، سمِعْتُ رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - يقولُ:\n\"لا يدخلُ الجنَّةَ مَنْ في قلْبِهِ خَرْدَلَةٌ مِنْ كِبْرٍ", "[حسن] وعن أبي سلمة بن عبد الرحمن بن عوف قال:\nالْتَّقى عبدُ الله بنُ عُمَر، وعبدُ الله بْنُ عَمْرو بنِ العاصي رضي الله عنْهُمْ على المَرْوَةِ، فتَحدَّثا، ثُمَّ مَضى عبدُ الله نارَ", "أنَّ رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - قال:\n\"مَنْ صَمتَ نَجا", "أنَّ عمَر دخَل يوماً على أبي بكرٍ الصِّديقِ رضي الله عنهما، وهو يجْبِذُ لِسانَهُ! فقال عمر: مه! غَفَر الله لكَ. فقال له أبو بكرٍ:\n\nإنَّ هذا أورَدَني (١) المَوارِدِ", "[صحيح] وعن أبي وائلٍ عن عبد الله:\nأنَّه ارْتَقى الصَّفا، فأخذَ بِلسَانِه فقال:\nيا لسانُ! قُلْ خيراً تَغْنَمْ، واسْكُتْ عنْ شرٍ تَسْلَمْ، مِن قَبْلِ أنْ تَنْدَمَ. ثُمَّ قال: سمعتُ رسولَ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - يقول:\n\"أكثرُ خطايا (٢) ابْنِ آدَم في لِسانِه", "(حسن لغيره) إنَّك لنْ تزالَ سالماً ما سكَتَّ، فإذا تكلَّمْتَ كُتِبَ لك أو عليك", "الصومُ جُنَّةٌ، والصَدقَةٌ تطْفِئُ الخَطيئَةَ كما يُطْفِئُ الماءُ النارَ، وصلاةُ الرجُل مِنْ جوفِ اللّيْلِ (١) \". ثُمَّ تَلا قَوْلَهُ: {تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ} حتَّى بَلَغَ {يَعْمَلُونَ}، ثُمَّ قالَ:", "صحيح موقوف] وعن عبد الله بن مسعودٍ رضي الله عنه قال:\n\nوالذي لا إله غَيْرُه ما على ظَهْرِ الأرْضِ شيْءٌ أحْوَجُ إلى طولِ سَجْنٍ مِنْ لِسَانٍ", "مَنْ وقاهُ الله شرَّ ما بيْنَ لَحْيَيْهِ، وشرَّ ما بينَ رِجْلَيْهِ؛ دَخَل الجنَّةَ", "\"المسلمُ مَنْ سلِمَ المسلمونَ مِنْ لِسانِه ويدِه، والمهاجِرُ (٢) مَنْ هجَرَ ما نَهى الله عَنْهُ", "\"من ذَبَّ عن عِرْضِ أخيه بالغَيبة؛ كان حقاً على الله أنْ يعتقه من النار"], "wordCount": 330}, {"page": 31, "hadiths": ["[حسن لغيره] وعن عَمْرِو بْنِ شعيبٍ عن أبيه عن جده:\n\nأنَّهم ذَكروا عندَ رسولِ الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - رجلاً فقالوا: لا يَأْكُلُ حتى يُطْعَمَ، ولا يَرْحَلُ حتى يُرَحَّلَ له! فقال النبيُّ - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -:\n\n\"اغْتبْتُموه\".\n\nفقالوا: يا رسول الله! إنَّما حدَّثْنا بِما فيه. قال:\n\n\"حسْبُكَ إذا ذكَرْتَ أخاكَ بِما فيه\"", "[حسن لغيره] وعن عائشة أيضاً:\n\nأنه اعتَلَّ بعيرٌ لصفيةَ بنت حُيَيّ، وعندَ زينبَ فضلُ ظهرٍ، فقال النبي\n\nصَلَّى اللهُ عَلَيْهِ وَسَلَّمَ - لزينب:\n\n\"أعطيها بعيراً\".\n\nفقالتْ: أنا أُعطي تلك اليهودية؟! فغضب رسول الله - صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ -، فهجرها ذا الحجة، والمحرم، وبعض صفر", "وعن عائشة رضي الله عنها قالتْ:\n\nقلتُ للنبيِّ - صَلّ
