<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Notes</title>
<style>
  :root{
    --bg: #15181b;
    --bg-raised: #1e2226;
    --card: #23282d;
    --card-hover: #292f35;
    --ink: #e9e6df;
    --ink-dim: #9aa1a8;
    --ink-faint: #656d74;
    --line: #33393f;
    --amber: #d4a24c;
    --teal: #5eb1a3;
    --red: #c86b5a;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height:100vh;
    line-height:1.5;
  }
  a{color:inherit;}

  /* ===== Header ===== */
  header{
    border-bottom:1px solid var(--line);
    padding:22px 28px 18px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-family:var(--mono);
    color:var(--amber);
    font-size:13px;
    letter-spacing:2px;
    border:1px solid var(--amber);
    padding:2px 7px;
    border-radius:3px;
  }
  .brand h1{
    font-size:20px;
    font-weight:600;
    letter-spacing:0.3px;
  }
  .stats{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-faint);
    display:flex;
    gap:18px;
  }
  .stats span b{color:var(--ink-dim); font-weight:600;}

  /* ===== Layout ===== */
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:26px 28px 80px;
    display:grid;
    grid-template-columns:1fr;
    gap:26px;
  }

  /* ===== Composer ===== */
  .composer{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px;
  }
  .composer h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--ink-faint);
    margin-bottom:14px;
    font-weight:600;
  }
  .row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field label{
    font-size:11px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.8px;
  }
  input[type=text], input[type=number], textarea, select{
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:6px;
    padding:9px 11px;
    font-family:var(--sans);
    font-size:14px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus, textarea:focus, select:focus{
    border-color:var(--teal);
  }
  .field.code-num input{width:110px; font-family:var(--mono);}
  .field.code-cat{min-width:200px; flex:1;}
  .field.title{flex:2; min-width:220px;}
  select{cursor:pointer;}
  textarea{
    width:100%;
    min-height:130px;
    resize:vertical;
    font-size:14px;
    line-height:1.6;
  }
  .new-cat-row{
    display:none;
    gap:10px;
    margin-top:8px;
    align-items:center;
  }
  .new-cat-row.show{display:flex;}
  .new-cat-row input{flex:1;}
  .btn{
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    border:none;
    border-radius:6px;
    padding:9px 16px;
    cursor:pointer;
    transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--teal); color:#0f1412;}
  .btn-primary:hover{opacity:0.88;}
  .btn-ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-faint); color:var(--ink);}
  .btn-danger{background:transparent; color:var(--red); border:1px solid #4a3530;}
  .btn-danger:hover{background:rgba(200,107,90,0.12);}
  .btn-small{padding:5px 10px; font-size:12px;}
  .composer-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
  }
  .hint{font-size:12px; color:var(--ink-faint);}

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
  }
  .toolbar-left{display:flex; gap:10px; flex-wrap:wrap; flex:1;}
  .toolbar input[type=text]{min-width:200px; flex:1;}
  .toolbar select{min-width:150px;}
  .toolbar-right{display:flex; gap:8px;}

  /* ===== Groups / Notes ===== */
  .group{margin-bottom:22px;}
  .group-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .group-head .cat-name{
    font-weight:700;
    font-size:15px;
    letter-spacing:0.2px;
  }
  .group-head .cat-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
    background:var(--bg-raised);
    padding:2px 8px;
    border-radius:10px;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:12px;
  }
  .note{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:background .15s, border-color .15s;
  }
  .note:hover{background:var(--card-hover); border-color:#3d444b;}
  .note-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .note-code{
    font-family:var(--mono);
    font-size:11px;
    color:var(--amber);
    background:rgba(212,162,76,0.1);
    border:1px solid rgba(212,162,76,0.35);
    padding:2px 7px;
    border-radius:4px;
    white-space:nowrap;
  }
  .note-title{
    font-weight:600;
    font-size:14.5px;
    flex:1;
  }
  .note-body{
    font-size:13.5px;
    color:var(--ink-dim);
    white-space:pre-wrap;
    word-break:break-word;
    max-height:120px;
    overflow:hidden;
    position:relative;
  }
  .note-body.expanded{max-height:none;}
  .note-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:4px;
  }
  .note-date{font-size:11px; color:var(--ink-faint);}
  .note-actions{display:flex; gap:6px;}
  .icon-btn{
    background:transparent;
    border:none;
    color:var(--ink-faint);
    cursor:pointer;
    font-size:12px;
    padding:3px 6px;
    border-radius:4px;
    font-family:var(--sans);
  }
  .icon-btn:hover{color:var(--ink); background:var(--bg-raised);}
  .icon-btn.danger:hover{color:var(--red);}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-faint);
  }
  .empty .big{font-size:34px; margin-bottom:10px;}

  /* edit mode */
  .note.editing textarea{width:100%; min-height:90px; margin-top:4px;}
  .note.editing .edit-row{display:flex; gap:8px; margin-top:6px;}

  footer{
    text-align:center;
    padding:20px;
    color:var(--ink-faint);
    font-size:11px;
    font-family:var(--mono);
  }

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}

  @media (max-width:600px){
    header{padding:18px;}
    .wrap{padding:18px 16px 60px;}
    .field.title{flex:1 1 100%;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">§</span>
    <h1>Ledger</h1>
  </div>
  <div class="stats">
    <span>Notes <b id="statNotes">0</b></span>
    <span>Categories <b id="statCats">0</b></span>
  </div>
</header>

<div class="wrap">

  <!-- Composer -->
  <div class="composer">
    <h2>New Entry</h2>
    <div class="row">
      <div class="field code-num">
        <label>Number</label>
        <input type="text" id="inputNumber" placeholder="e.g. 1, 2a, 07">
      </div>
      <div class="field code-cat">
        <label>Falls under</label>
        <select id="inputCategory"></select>
      </div>
      <div class="field title">
        <label>Title</label>
        <input type="text" id="inputTitle" placeholder="Note title">
      </div>
    </div>
    <div class="new-cat-row" id="newCatRow">
      <input type="text" id="newCatInput" placeholder="New category name">
      <button class="btn btn-primary btn-small" id="confirmNewCat">Add</button>
      <button class="btn btn-ghost btn-small" id="cancelNewCat">Cancel</button>
    </div>
    <div class="field" style="margin-top:6px;">
      <label>Note</label>
      <textarea id="inputBody" placeholder="Write anything..."></textarea>
    </div>
    <div class="composer-actions">
      <span class="hint" id="composerHint">Pick a number and a category — or use "None" / "Random" if it doesn't fit anywhere.</span>
      <button class="btn btn-primary" id="saveNoteBtn">Save Note</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <input type="text" id="searchInput" placeholder="Search title, body, number, category...">
      <select id="filterCategory"><option value="__all__">All categories</option></select>
      <select id="sortSelect">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="number">By number</option>
        <option value="title">By title (A–Z)</option>
      </select>
    </div>
    <div class="toolbar-right">
      <button class="btn btn-ghost btn-small" id="exportBtn">Export JSON</button>
      <button class="btn btn-ghost btn-small" id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="btn btn-danger btn-small" id="clearAllBtn">Clear All</button>
    </div>
  </div>

  <!-- Notes -->
  <div id="notesContainer"></div>

</div>

<footer>LEDGER · LOCAL STORAGE · NO ACCOUNT · NO SYNC</footer>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "ledger_notes_v1";
  const CATS_KEY = "ledger_categories_v1";
  const DEFAULT_CATS = ["None", "Random"];

  let notes = [];
  let categories = [];

  // ---------- Persistence ----------
  function load(){
    try{
      notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }catch(e){ notes = []; }
    try{
      categories = JSON.parse(localStorage.getItem(CATS_KEY)) || [];
    }catch(e){ categories = []; }
    DEFAULT_CATS.forEach(c => { if(!categories.includes(c)) categories.push(c); });
    // ensure any category referenced by a note exists in the list
    notes.forEach(n => { if(n.category && !categories.includes(n.category)) categories.push(n.category); });
  }
  function saveNotes(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }
  function saveCats(){ localStorage.setItem(CATS_KEY, JSON.stringify(categories)); }

  // ---------- Elements ----------
  const inputNumber = document.getElementById('inputNumber');
  const inputCategory = document.getElementById('inputCategory');
  const inputTitle = document.getElementById('inputTitle');
  const inputBody = document.getElementById('inputBody');
  const saveNoteBtn = document.getElementById('saveNoteBtn');
  const newCatRow = document.getElementById('newCatRow');
  const newCatInput = document.getElementById('newCatInput');
  const confirmNewCat = document.getElementById('confirmNewCat');
  const cancelNewCat = document.getElementById('cancelNewCat');
  const searchInput = document.getElementById('searchInput');
  const filterCategory = document.getElementById('filterCategory');
  const sortSelect = document.getElementById('sortSelect');
  const notesContainer = document.getElementById('notesContainer');
  const statNotes = document.getElementById('statNotes');
  const statCats = document.getElementById('statCats');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  const clearAllBtn = document.getElementById('clearAllBtn');

  const NEW_CAT_VALUE = "__new__";

  // ---------- Category select rendering ----------
  function renderCategoryOptions(){
    // composer select
    inputCategory.innerHTML = "";
    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      inputCategory.appendChild(opt);
    });
    const newOpt = document.createElement('option');
    newOpt.value = NEW_CAT_VALUE; newOpt.textContent = "+ New category...";
    inputCategory.appendChild(newOpt);

    // filter select
    const prevVal = filterCategory.value || "__all__";
    filterCategory.innerHTML = '<option value="__all__">All categories</option>';
    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      filterCategory.appendChild(opt);
    });
    if([...filterCategory.options].some(o => o.value === prevVal)){
      filterCategory.value = prevVal;
    }
  }

  inputCategory.addEventListener('change', () => {
    if(inputCategory.value === NEW_CAT_VALUE){
      newCatRow.classList.add('show');
      newCatInput.focus();
    } else {
      newCatRow.classList.remove('show');
    }
  });

  confirmNewCat.addEventListener('click', () => {
    const name = newCatInput.value.trim();
    if(!name) return;
    if(!categories.includes(name)){
      categories.push(name);
      saveCats();
    }
    renderCategoryOptions();
    inputCategory.value = name;
    newCatRow.classList.remove('show');
    newCatInput.value = "";
  });
  cancelNewCat.addEventListener('click', () => {
    newCatRow.classList.remove('show');
    newCatInput.value = "";
    inputCategory.value = categories[0] || "None";
  });

  // ---------- Save note ----------
  function genId(){
    return 'n_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }

  saveNoteBtn.addEventListener('click', () => {
    const number = inputNumber.value.trim();
    let category = inputCategory.value;
    if(category === NEW_CAT_VALUE){
      alert("Finish adding your new category first (or press Add / Cancel).");
      return;
    }
    const title = inputTitle.value.trim();
    const body = inputBody.value;

    if(!title && !body.trim()){
      alert("Give the note a title or some content — can't save a completely empty note.");
      return;
    }

    notes.unshift({
      id: genId(),
      number: number || "—",
      category: category || "None",
      title: title || "(untitled)",
      body: body,
      created: Date.now(),
      updated: Date.now()
    });
    saveNotes();

    inputNumber.value = "";
    inputTitle.value = "";
    inputBody.value = "";
    renderNotes();
  });

  // ---------- Rendering notes ----------
  function fmtDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'}) + ' · ' +
           d.toLocaleTimeString(undefined,{hour:'2-digit', minute:'2-digit'});
  }

  function getFilteredSorted(){
    let list = notes.slice();
    const q = searchInput.value.trim().toLowerCase();
    if(q){
      list = list.filter(n =>
        (n.title||"").toLowerCase().includes(q) ||
        (n.body||"").toLowerCase().includes(q) ||
        (n.number||"").toLowerCase().includes(q) ||
        (n.category||"").toLowerCase().includes(q)
      );
    }
    const catFilter = filterCategory.value;
    if(catFilter && catFilter !== "__all__"){
      list = list.filter(n => n.category === catFilter);
    }
    const sortMode = sortSelect.value;
    if(sortMode === "newest") list.sort((a,b)=>b.created-a.created);
    else if(sortMode === "oldest") list.sort((a,b)=>a.created-b.created);
    else if(sortMode === "title") list.sort((a,b)=>a.title.localeCompare(b.title));
    else if(sortMode === "number") list.sort((a,b)=>{
      const na = parseFloat(a.number), nb = parseFloat(b.number);
      const aNum = isNaN(na) ? Infinity : na;
      const bNum = isNaN(nb) ? Infinity : nb;
      if(aNum !== bNum) return aNum - bNum;
      return (a.number||"").localeCompare(b.number||"");
    });
    return list;
  }

  function groupByCategory(list){
    const map = {};
    list.forEach(n => {
      const c = n.category || "None";
      if(!map[c]) map[c] = [];
      map[c].push(n);
    });
    return map;
  }

  function escapeHtml(str){
    return (str||"").replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function renderNotes(){
    const list = getFilteredSorted();
    statNotes.textContent = notes.length;
    statCats.textContent = categories.length;

    notesContainer.innerHTML = "";

    if(list.length === 0){
      notesContainer.innerHTML = `
        <div class="empty">
          <div class="big">□</div>
          <div>${notes.length === 0 ? "No notes yet — add your first entry above." : "Nothing matches your search or filter."}</div>
        </div>`;
      return;
    }

    // If filtering to one category or sorting by number/title/date, still group by category for structure,
    // unless a single category filter is active — then just list flat.
    const singleCat = filterCategory.value !== "__all__";
    const groups = singleCat ? {[filterCategory.value]: list} : groupByCategory(list);

    Object.keys(groups).forEach(catName => {
      const groupNotes = groups[catName];
      const groupWrap = document.createElement('div');
      groupWrap.className = 'group';

      const head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML = `<span class="cat-name">${escapeHtml(catName)}</span><span class="cat-count">${groupNotes.length}</span>`;
      groupWrap.appendChild(head);

      const cardsWrap = document.createElement('div');
      cardsWrap.className = 'cards';

      groupNotes.forEach(n => {
        cardsWrap.appendChild(renderNoteCard(n));
      });

      groupWrap.appendChild(cardsWrap);
      notesContainer.appendChild(groupWrap);
    });
  }

  function renderNoteCard(n){
    const el = document.createElement('div');
    el.className = 'note';
    el.dataset.id = n.id;

    el.innerHTML = `
      <div class="note-top">
        <span class="note-code">${escapeHtml(n.number)} · ${escapeHtml(n.category)}</span>
      </div>
      <div class="note-title">${escapeHtml(n.title)}</div>
      <div class="note-body">${escapeHtml(n.body)}</div>
      <div class="note-foot">
        <span class="note-date">${fmtDate(n.updated)}</span>
        <span class="note-actions">
          <button class="icon-btn" data-action="expand">expand</button>
          <button class="icon-btn" data-action="edit">edit</button>
          <button class="icon-btn danger" data-action="delete">delete</button>
        </span>
      </div>
    `;

    el.querySelector('[data-action="expand"]').addEventListener('click', (e) => {
      const bodyEl = el.querySelector('.note-body');
      bodyEl.classList.toggle('expanded');
      e.target.textContent = bodyEl.classList.contains('expanded') ? 'collapse' : 'expand';
    });

    el.querySelector('[data-action="delete"]').addEventListener('click', () => {
      if(confirm(`Delete "${n.title}"? This can't be undone.`)){
        notes = notes.filter(x => x.id !== n.id);
        saveNotes();
        renderNotes();
      }
    });

    el.querySelector('[data-action="edit"]').addEventListener('click', () => {
      openEditMode(el, n);
    });

    return el;
  }

  function openEditMode(el, n){
    el.classList.add('editing');
    const catOptions = categories.map(c =>
      `<option value="${escapeHtml(c)}" ${c===n.category?'selected':''}>${escapeHtml(c)}</option>`
    ).join('');

    el.innerHTML = `
      <div class="row" style="margin-bottom:6px;">
        <div class="field code-num">
          <label>Number</label>
          <input type="text" class="edit-number" value="${escapeHtml(n.number)}">
        </div>
        <div class="field" style="flex:1;">
          <label>Category</label>
          <select class="edit-category">${catOptions}</select>
        </div>
      </div>
      <div class="field">
        <label>Title</label>
        <input type="text" class="edit-title" value="${escapeHtml(n.title)}">
      </div>
      <textarea class="edit-body">${escapeHtml(n.body)}</textarea>
      <div class="edit-row">
        <button class="btn btn-primary btn-small" data-action="save">Save changes</button>
        <button class="btn btn-ghost btn-small" data-action="cancel">Cancel</button>
      </div>
    `;

    el.querySelector('[data-action="save"]').addEventListener('click', () => {
      n.number = el.querySelector('.edit-number').value.trim() || "—";
      n.category = el.querySelector('.edit-category').value;
      n.title = el.querySelector('.edit-title').value.trim() || "(untitled)";
      n.body = el.querySelector('.edit-body').value;
      n.updated = Date.now();
      saveNotes();
      renderNotes();
    });

    el.querySelector('[data-action="cancel"]').addEventListener('click', () => {
      renderNotes();
    });
  }

  // ---------- Toolbar events ----------
  searchInput.addEventListener('input', renderNotes);
  filterCategory.addEventListener('change', renderNotes);
  sortSelect.addEventListener('change', renderNotes);

  // ---------- Export / Import ----------
  exportBtn.addEventListener('click', () => {
    const data = { notes, categories, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ledger-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const data = JSON.parse(evt.target.result);
        if(!Array.isArray(data.notes)) throw new Error("bad format");
        const mode = confirm("Click OK to MERGE with existing notes, or Cancel to REPLACE everything.");
        if(mode){
          notes = notes.concat(data.notes);
          (data.categories||[]).forEach(c => { if(!categories.includes(c)) categories.push(c); });
        } else {
          notes = data.notes;
          categories = data.categories && data.categories.length ? data.categories : DEFAULT_CATS.slice();
          DEFAULT_CATS.forEach(c => { if(!categories.includes(c)) categories.push(c); });
        }
        saveNotes(); saveCats();
        renderCategoryOptions();
        renderNotes();
      }catch(err){
        alert("Couldn't read that file — make sure it's a Ledger JSON export.");
      }
    };
    reader.readAsText(file);
    importFile.value = "";
  });

  clearAllBtn.addEventListener('click', () => {
    if(confirm("Delete ALL notes? Categories will be kept. This can't be undone.")){
      notes = [];
      saveNotes();
      renderNotes();
    }
  });

  // ---------- Init ----------
  load();
  renderCategoryOptions();
  inputCategory.value = categories.includes("None") ? "None" : categories[0];
  renderNotes();

})();
</script>
</body>
</html>
