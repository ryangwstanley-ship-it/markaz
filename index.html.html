// ============ State ============
let lessonsData = null;
let currentLesson = null;
let currentCardIndex = 0;
let cardOrder = [];
let speeds = [1, 1.25, 1.5, 0.75];
let speedIndex = 0;

const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabicDigits(str) {
  return String(str).replace(/[0-9]/g, d => arabicDigits[d]);
}

// ============ Load data ============
async function loadLessons() {
  lessonsData = window.EMBEDDED_LESSONS;
  renderLessonList();
  loadLesson(lessonsData.lessons[0].id);
}

// ============ Sidebar ============
function renderLessonList() {
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  lessonsData.lessons.forEach(lesson => {
    const item = document.createElement('div');
    item.className = 'lesson-item';
    item.dataset.id = lesson.id;
    item.setAttribute('tabindex', '0');
    item.setAttribute('role', 'button');
    item.innerHTML = `
      <span class="lesson-item-number">${toArabicDigits(lesson.number)}</span>
      <span class="lesson-item-title">${lesson.title}</span>
    `;
    item.addEventListener('click', () => loadLesson(lesson.id));
    item.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') loadLesson(lesson.id);
    });
    list.appendChild(item);
  });
}

function markActiveLesson(id) {
  document.querySelectorAll('.lesson-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

// ============ Load a lesson ============
function loadLesson(id) {
  const lesson = lessonsData.lessons.find(l => l.id === id);
  if (!lesson) return;
  currentLesson = lesson;

  document.getElementById('bookTitle').textContent = lesson.bookTitle;
  document.getElementById('lessonTitle').textContent = lesson.title;
  document.getElementById('lessonAuthor').textContent = lesson.author;

  markActiveLesson(id);
  renderLessonText(lesson);
  renderFlashcards(lesson);
  setupAudio(lesson);
}

// ============ Text rendering ============
function renderLessonText(lesson) {
  const container = document.getElementById('lessonText');
  container.innerHTML = '';
  lesson.paragraphs.forEach(p => {
    const el = document.createElement(p.type === 'heading' ? 'h3' : 'p');
    el.className = p.type === 'heading' ? 'lesson-heading' : 'lesson-para';
    el.textContent = p.text;
    el.dataset.id = p.id;
    if (p.type === 'paragraph' && p.start !== null) {
      el.addEventListener('click', () => seekAudioTo(p.start));
    }
    container.appendChild(el);
  });
}

// Highlight the paragraph currently playing, based on audio currentTime.
// Paragraph start/end times are placeholders (null) until lesson data includes them.
function updatePlayingParagraph(currentTime) {
  if (!currentLesson) return;
  document.querySelectorAll('.lesson-para').forEach(el => el.classList.remove('playing'));
  const match = currentLesson.paragraphs.find(p =>
    p.type === 'paragraph' && p.start !== null && p.end !== null &&
    currentTime >= p.start && currentTime < p.end
  );
  if (match) {
    const el = document.querySelector(`.lesson-para[data-id="${match.id}"]`);
    if (el) {
      el.classList.add('playing');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function seekAudioTo(seconds) {
  const audio = document.getElementById('audioEl');
  if (seconds === null || !audio.src) return;
  audio.currentTime = seconds;
  audio.play();
}

// ============ Audio player ============
function setupAudio(lesson) {
  const audio = document.getElementById('audioEl');
  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.querySelector('.icon-play');
  const iconPause = document.querySelector('.icon-pause');

  audio.pause();
  audio.currentTime = 0;
  iconPlay.style.display = '';
  iconPause.style.display = 'none';

  if (lesson.audioSrc) {
    audio.src = lesson.audioSrc;
  } else {
    audio.removeAttribute('src');
  }

  updateTimeDisplay(0, 0);
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressHandle').style.right = '0%';
}

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return toArabicDigits(`${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);
}

function updateTimeDisplay(current, total) {
  document.getElementById('timeCurrent').textContent = formatTime(current);
  document.getElementById('timeTotal').textContent = formatTime(total);
}

function initPlayerEvents() {
  const audio = document.getElementById('audioEl');
  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.querySelector('.icon-play');
  const iconPause = document.querySelector('.icon-pause');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const progressHandle = document.getElementById('progressHandle');
  const speedBtn = document.getElementById('speedBtn');
  const rewindBtn = document.getElementById('rewindBtn');

  playBtn.addEventListener('click', () => {
    if (!audio.src) return;
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', () => {
    iconPlay.style.display = 'none';
    iconPause.style.display = '';
  });

  audio.addEventListener('pause', () => {
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
  });

  audio.addEventListener('loadedmetadata', () => {
    updateTimeDisplay(audio.currentTime, audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    progressFill.style.width = pct + '%';
    progressHandle.style.right = pct + '%';
    updateTimeDisplay(audio.currentTime, audio.duration);
    updatePlayingParagraph(audio.currentTime);
  });

  progressTrack.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = progressTrack.getBoundingClientRect();
    // RTL: distance from the right edge represents progress
    const fromRight = rect.right - e.clientX;
    const pct = Math.min(Math.max(fromRight / rect.width, 0), 1);
    audio.currentTime = pct * audio.duration;
  });

  speedBtn.addEventListener('click', () => {
    speedIndex = (speedIndex + 1) % speeds.length;
    audio.playbackRate = speeds[speedIndex];
    speedBtn.textContent = toArabicDigits(speeds[speedIndex]) + 'x';
  });

  rewindBtn.addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  });
}

// ============ View toggle ============
function initViewToggle() {
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.toggle-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');

      const view = btn.dataset.view;
      document.querySelectorAll('.view-panel').forEach(panel => {
        panel.dataset.active = (panel.id === `view-${view}`) ? 'true' : 'false';
      });
    });
  });
}

// ============ Flashcards ============
function renderFlashcards(lesson) {
  cardOrder = lesson.flashcards.map((_, i) => i);
  currentCardIndex = 0;
  document.getElementById('cardTotal').textContent = toArabicDigits(lesson.flashcards.length);
  showCard();
}

function showCard() {
  const flashcard = document.getElementById('flashcard');
  flashcard.classList.remove('flipped');

  const cards = currentLesson.flashcards;
  const idx = cardOrder[currentCardIndex];
  const card = cards[idx];

  document.getElementById('cardQuestion').textContent = card.q;
  document.getElementById('cardAnswer').textContent = card.a;
  document.getElementById('cardIndex').textContent = toArabicDigits(currentCardIndex + 1);
}

function initFlashcardEvents() {
  const flashcard = document.getElementById('flashcard');
  const flipBtn = document.getElementById('flipCard');
  const prevBtn = document.getElementById('prevCard');
  const nextBtn = document.getElementById('nextCard');
  const shuffleBtn = document.getElementById('shuffleCards');

  function flip() {
    flashcard.classList.toggle('flipped');
  }

  flashcard.addEventListener('click', flip);
  flashcard.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  });
  flipBtn.addEventListener('click', flip);

  prevBtn.addEventListener('click', () => {
    currentCardIndex = (currentCardIndex - 1 + cardOrder.length) % cardOrder.length;
    showCard();
  });

  nextBtn.addEventListener('click', () => {
    currentCardIndex = (currentCardIndex + 1) % cardOrder.length;
    showCard();
  });

  shuffleBtn.addEventListener('click', () => {
    for (let i = cardOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cardOrder[i], cardOrder[j]] = [cardOrder[j], cardOrder[i]];
    }
    currentCardIndex = 0;
    showCard();
  });
}

// ============ Init ============
document.addEventListener('DOMContentLoaded', () => {
  initPlayerEvents();
  initViewToggle();
  initFlashcardEvents();
  loadLessons();
});

</script>
</body>
</html>
