<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجلس التوحيد — استماع وقراءة ومراجعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Markazi+Text:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root {
  --ink: #1C2530;
  --ink-soft: #2E3B49;
  --parchment: #F2ECDD;
  --parchment-deep: #E8DFC8;
  --gold: #B8935F;
  --gold-soft: #D9C39C;
  --sage: #6B7C6E;
  --rust: #A34B34;
  --line: rgba(28, 37, 48, 0.12);

  --font-display: 'Amiri', serif;
  --font-body: 'Noto Naskh Arabic', serif;
  --font-ui: 'Markazi Text', serif;

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  color: var(--parchment);
  font-family: var(--font-body);
}

body {
  min-height: 100vh;
}

::selection {
  background: var(--gold);
  color: var(--ink);
}

/* ============ Shell layout ============ */
.app-shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: 100vh;
}

@media (max-width: 860px) {
  .app-shell {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: static;
    height: auto;
  }
}

/* ============ Sidebar ============ */
.sidebar {
  background: #161D26;
  border-left: 1px solid var(--line);
  padding: 32px 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid rgba(184, 147, 95, 0.25);
}

.brand {
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--gold);
  margin: 0 0 8px;
  line-height: 1.3;
}

.brand-sub {
  font-family: var(--font-ui);
  font-size: 1rem;
  color: rgba(242, 236, 221, 0.6);
  margin: 0;
  line-height: 1.5;
}

.lesson-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.lesson-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background 0.2s ease;
  color: rgba(242, 236, 221, 0.75);
  font-family: var(--font-ui);
  font-size: 1.1rem;
}

.lesson-item:hover {
  background: rgba(184, 147, 95, 0.1);
}

.lesson-item.active {
  background: rgba(184, 147, 95, 0.16);
  color: var(--parchment);
}

.lesson-item-number {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--ink-soft);
  color: var(--gold);
  font-size: 0.95rem;
  font-weight: 600;
  flex-shrink: 0;
}

.lesson-item.active .lesson-item-number {
  background: var(--gold);
  color: var(--ink);
}

/* ============ Main ============ */
.main {
  background: var(--parchment);
  color: var(--ink);
  padding: 40px clamp(20px, 5vw, 72px) 80px;
}

.lesson-header {
  margin-bottom: 28px;
  text-align: center;
}

.lesson-eyebrow {
  font-family: var(--font-ui);
  font-size: 1.1rem;
  letter-spacing: 0.04em;
  color: var(--rust);
  margin: 0 0 6px;
}

.lesson-title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.8rem);
  margin: 0 0 8px;
  color: var(--ink);
}

.lesson-author {
  font-family: var(--font-ui);
  font-size: 1.1rem;
  color: var(--ink-soft);
  opacity: 0.75;
  margin: 0;
}

/* ============ Player ============ */
.player {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 20px;
  background: var(--ink);
  color: var(--parchment);
  border-radius: var(--radius-lg);
  padding: 18px 24px;
  margin-bottom: 28px;
  position: sticky;
  top: 16px;
  z-index: 20;
  box-shadow: 0 12px 30px rgba(28, 37, 48, 0.25);
}

.play-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: var(--gold);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s ease, background 0.2s ease;
}

.play-btn:hover {
  background: var(--gold-soft);
  transform: scale(1.04);
}

.play-btn:active {
  transform: scale(0.97);
}

.player-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.progress-track {
  position: relative;
  height: 6px;
  background: rgba(242, 236, 221, 0.18);
  border-radius: 3px;
  cursor: pointer;
}

.progress-fill {
  position: absolute;
  top: 0;
  right: 0;
  height: 100%;
  width: 0%;
  background: var(--gold);
  border-radius: 3px;
}

.progress-handle {
  position: absolute;
  top: 50%;
  right: 0%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--parchment);
  transform: translate(50%, -50%);
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.player-meta {
  display: flex;
  gap: 6px;
  font-family: var(--font-ui);
  font-size: 0.95rem;
  color: rgba(242, 236, 221, 0.65);
  direction: ltr;
  justify-content: flex-end;
}

.player-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.speed-btn, .rewind-btn {
  border: 1px solid rgba(242, 236, 221, 0.25);
  background: transparent;
  color: var(--parchment);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 1rem;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.2s ease;
}

.speed-btn:hover, .rewind-btn:hover {
  background: rgba(242, 236, 221, 0.08);
}

/* ============ View toggle ============ */
.view-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.toggle-btn {
  border: none;
  background: transparent;
  font-family: var(--font-ui);
  font-size: 1.15rem;
  color: var(--ink-soft);
  opacity: 0.55;
  padding: 10px 18px;
  cursor: pointer;
  position: relative;
  transition: opacity 0.2s ease, color 0.2s ease;
}

.toggle-btn:hover {
  opacity: 0.8;
}

.toggle-btn.active {
  opacity: 1;
  color: var(--rust);
}

.toggle-btn.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  right: 0;
  left: 0;
  height: 2px;
  background: var(--rust);
}

/* ============ View panels ============ */
.view-panel {
  display: none;
}

.view-panel[data-active="true"] {
  display: block;
}

/* ============ Lesson text ============ */
.lesson-text {
  max-width: 780px;
  margin: 0 auto;
  font-family: var(--font-body);
  font-size: 1.25rem;
  line-height: 2.3;
}

.lesson-heading {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--rust);
  margin: 40px 0 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--gold-soft);
}

.lesson-heading:first-child {
  margin-top: 0;
}

.lesson-para {
  margin: 0 0 22px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  transition: background 0.4s ease;
  cursor: pointer;
}

.lesson-para:hover {
  background: rgba(184, 147, 95, 0.08);
}

.lesson-para.playing {
  background: rgba(184, 147, 95, 0.22);
  box-shadow: inset 3px 0 0 var(--gold);
}

/* ============ Flashcards ============ */
.flashcard-stage {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}

.flashcard-counter {
  font-family: var(--font-ui);
  font-size: 1.1rem;
  color: var(--ink-soft);
  opacity: 0.7;
}

.flashcard {
  width: 100%;
  height: 320px;
  perspective: 1400px;
  cursor: pointer;
}

.flashcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  transform-style: preserve-3d;
}

.flashcard.flipped .flashcard-inner {
  transform: rotateY(180deg);
}

.flashcard-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius-lg);
  padding: 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: 0 16px 34px rgba(28, 37, 48, 0.16);
}

.flashcard-front {
  background: var(--ink);
  color: var(--parchment);
}

.flashcard-back {
  background: var(--gold-soft);
  color: var(--ink);
  transform: rotateY(180deg);
}

.flashcard-label {
  font-family: var(--font-ui);
  font-size: 1rem;
  letter-spacing: 0.06em;
  opacity: 0.6;
  margin: 0 0 16px;
}

.flashcard-content {
  font-family: var(--font-body);
  font-size: 1.2rem;
  line-height: 1.8;
  margin: 0;
}

.flashcard-nav {
  display: flex;
  gap: 10px;
}

.fc-btn {
  font-family: var(--font-ui);
  font-size: 1.05rem;
  padding: 10px 22px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.2s ease;
}

.fc-btn:hover {
  background: rgba(28, 37, 48, 0.06);
}

.fc-btn-flip {
  background: var(--rust);
  color: var(--parchment);
  border-color: var(--rust);
}

.fc-btn-flip:hover {
  background: #8C3D29;
}

.fc-shuffle {
  display: flex;
  align-items: center;
  gap: 8px;
  border: none;
  background: transparent;
  color: var(--sage);
  font-family: var(--font-ui);
  font-size: 1rem;
  cursor: pointer;
  padding: 6px 10px;
}

.fc-shuffle:hover {
  text-decoration: underline;
}

/* ============ Focus states ============ */
button:focus-visible,
.flashcard:focus-visible,
.lesson-item:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

/* ============ Reduced motion ============ */
@media (prefers-reduced-motion: reduce) {
  .flashcard-inner,
  .lesson-para,
  .play-btn {
    transition: none !important;
  }
}

/* ============ Responsive ============ */
@media (max-width: 600px) {
  .player {
    grid-template-columns: auto 1fr;
    row-gap: 12px;
  }
  .player-controls {
    grid-column: 1 / -1;
    justify-content: flex-end;
  }
  .lesson-text {
    font-size: 1.1rem;
  }
  .flashcard {
    height: 280px;
  }
}

</style>
</head>
<body>

<div class="app-shell">

  <!-- ============ Sidebar: Lesson list ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="brand">مَجَالِسُ التَّوْحِيد</h1>
      <p class="brand-sub">شرح كتاب التوحيد للإمام محمد بن عبد الوهاب</p>
    </div>
    <nav class="lesson-list" id="lessonList">
      <!-- populated by JS -->
    </nav>
  </aside>

  <!-- ============ Main content ============ -->
  <main class="main" id="main">

    <header class="lesson-header">
      <p class="lesson-eyebrow" id="bookTitle">كتاب التوحيد</p>
      <h2 class="lesson-title" id="lessonTitle">المجلس الخامس</h2>
      <p class="lesson-author" id="lessonAuthor">الإمام المجدد محمد بن عبد الوهاب</p>
    </header>

    <!-- ============ Audio player (persistent) ============ -->
    <section class="player" id="player">
      <button class="play-btn" id="playBtn" aria-label="تشغيل">
        <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
      </button>

      <div class="player-body">
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-handle" id="progressHandle"></div>
        </div>
        <div class="player-meta">
          <span id="timeCurrent">٠٠:٠٠</span>
          <span class="time-sep">/</span>
          <span id="timeTotal">٠٠:٠٠</span>
        </div>
      </div>

      <div class="player-controls">
        <button class="speed-btn" id="speedBtn" title="سرعة التشغيل">١x</button>
        <button class="rewind-btn" id="rewindBtn" title="رجوع ١٠ ثوانٍ">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/></svg>
        </button>
      </div>

      <audio id="audioEl" preload="metadata"></audio>
    </section>

    <!-- ============ View toggle ============ -->
    <div class="view-toggle" role="tablist">
      <button class="toggle-btn active" data-view="text" role="tab" aria-selected="true">النص</button>
      <button class="toggle-btn" data-view="flashcards" role="tab" aria-selected="false">البطاقات التعليمية</button>
    </div>

    <!-- ============ Text view ============ -->
    <section class="view-panel" id="view-text" data-active="true">
      <article class="lesson-text" id="lessonText">
        <!-- populated by JS: headings + paragraphs -->
      </article>
    </section>

    <!-- ============ Flashcards view ============ -->
    <section class="view-panel" id="view-flashcards" data-active="false">
      <div class="flashcard-stage">

        <div class="flashcard-counter">
          <span id="cardIndex">١</span> / <span id="cardTotal">٥٥</span>
        </div>

        <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="اضغط لقلب البطاقة">
          <div class="flashcard-inner" id="flashcardInner">
            <div class="flashcard-face flashcard-front">
              <p class="flashcard-label">سؤال</p>
              <p class="flashcard-content" id="cardQuestion"></p>
            </div>
            <div class="flashcard-face flashcard-back">
              <p class="flashcard-label">جواب</p>
              <p class="flashcard-content" id="cardAnswer"></p>
            </div>
          </div>
        </div>

        <div class="flashcard-nav">
          <button class="fc-btn" id="prevCard">السابق</button>
          <button class="fc-btn fc-btn-flip" id="flipCard">قلب البطاقة</button>
          <button class="fc-btn" id="nextCard">التالي</button>
        </div>

        <button class="fc-shuffle" id="shuffleCards">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M17 3l4 4-4 4M3 7h13a4 4 0 010 8H7m10 6l4-4-4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          ترتيب عشوائي
        </button>
      </div>
    </section>

  </main>
</div>

window.EMBEDDED_LESSONS = {

        {

          "text": "1. مُقَدِّمَةُ الْمَجْلِسِ وَافْتِتَاحِيَّةُ الْقِرَاءَةِ",

        },
        {
          "id": 2,
          "type": "paragraph",
          "text": "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ، الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى أَشْرَفِ الْأَنْبِيَاءِ وَالْمُرْسَلِينَ. اللَّهُمَّ عَلِّمْنَا مَا يَنْفَعُنَا، وَانْفَعْنَا بِمَا عَلَّمْتَنَا، وَزِدْنَا عِلْمًا. أَمَّا بَعْدُ، فَإِنَّ خَيْرَ الْكَلَامِ كَلَامُ اللَّهِ عَزَّ وَجَلَّ، وَخَيْرَ الْهَدْيِ هَدْيُ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَشَرَّ الْأُمُورِ مُحْدَثَاتُهَا، وَكُلُّ مُحْدَثَةٍ بِدْعَةٌ، وَكُلُّ بِدْعَةٍ ضَلَالَةٌ، وَكُلُّ ضَلَالَةٍ فِي النَّارِ. ثُمَّ أَمَّا بَعْدُ، فَنَسْتَكْمِلُ وَإِيَّاكُمْ التَّعْلِيقَ عَلَى هَذَا الْكِتَابِ، كِتَابِ التَّوْحِيدِ، لِلْإِمَامِ الْمُجَدِّدِ مُحَمَّدِ بْنِ عَبْدِ الْوَهَّابِ رَحِمَهُ اللَّهُ تَعَالَى، وَهَذَا هُوَ الْمَجْلِسُ الْخَامِسُ مِنَ التَّعْلِيقِ عَلَى هَذَا الْكِتَابِ. تَفَضَّلْ شَيْخُ.",

          "id": 3,
          "type": "paragraph",
          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ قَوْلِ اللَّهِ تَعَالَى: {وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَى فَادْعُوهُ بِهَا وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ}. ذَكَرَ ابْنُ أَبِي حَاتِمٍ عَنِ ابْنِ عَبَّاسٍ: {يُلْحِدُونَ فِيهِ} فِي أَسْمَائِهِ يُشْرِكُونَ. وَعَنْهُ: سَمَّوُا اللَّاتَ مِنَ الْإِلَهِ، وَالْعُزَّى مِنَ الْعَزِيزِ. وَعَنِ الْأَعْمَشِ: يُدْخِلُونَ فِيهَا مَا لَيْسَ مِنْهَا.\"",

        {

        {
          "id": 7,

        {

        {
          "id": 11,
          "type": "paragraph",
          "text": "النَّوْعُ الْخَامِسُ: إِنْكَارُ هَذِهِ الْأَسْمَاءِ، أَنْ يُنْكِرَ اسْمًا مِنْ أَسْمَاءِ اللَّهِ عَزَّ وَجَلَّ كَمَا فَعَلَ الْجَهْمِيَّةُ الْمَحْضَةُ، وَكَمَا فَعَلَ غُلَاةُ الْمُعْتَزِلَةِ، وَكَمَا تَقَدَّمَ مَعَنَا مِنْ فِعْلِ كُفَّارِ قُرَيْشٍ، قَالُوا: {وَمَا الرَّحْمَنُ}، فَأَنْكَرُوا اسْمَ الرَّحْمَنِ عَزَّ وَجَلَّ، فَكَانَ هَذَا مِنْ إِلْحَادِهِمْ فِي أَسْمَاءِ اللَّهِ عَزَّ وَجَلَّ.",

        {

        {
          "id": 13,

          "start": null,

        },
        {
          "id": 14,
          "type": "paragraph",
          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ لَا يُقَالُ السَّلَامُ عَلَى اللَّهِ. فِي الصَّحِيحِ عَنْ أَبِي مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: كُنَّا إِذَا كُنَّا مَعَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي صَلَاةٍ قُلْنَا: السَّلَامُ عَلَى اللَّهِ مِنْ عِبَادِهِ، السَّلَامُ عَلَى فُلَانٍ وَفُلَانٍ. فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: لَا تَقُ... السَّلَامُ عَلَى اللَّهِ، فَإِنَّ اللَّهَ هُوَ السَّلَامُ.\"",
          "start": null,
          "end": null
        },
        {
          "id": 15,
          "type": "paragraph",
          "text": "هَذَا الْبَابُ مِنَ الْأَبْوَابِ الَّتِي جَاءَتْ فِي بَيَانِ الْأَدَبِ مَعَ اللَّهِ عَزَّ وَجَلَّ، وَوَجْهُ ذَلِكَ أَنَّ قَوْلَ \"السَّلَامُ عَلَى اللَّهِ\" يَدُلُّ عَلَى أَنَّ لِلَّهِ نَوْعَ نَقْصٍ، فَلِذَلِكَ يُدْعَى لَهُ بِالسَّلَامِ أَنْ يَسْلَمَ مِنْ هَذَا النَّقْصِ. وَالصَّوَابُ أَنَّ اللَّهَ هُوَ السَّلَامُ، فَلَيْسَ فِيهِ نَقْصٌ بِوَجْهٍ مِنَ الْوُجُوهِ، بَلِ اللَّهُ عَزَّ وَجَلَّ مُنَزَّهٌ عَنِ النَّقَائِصِ. فَلِذَلِكَ كَانَ فِي هَذَا الْقَوْلِ \"السَّلَامُ عَلَى اللَّهِ\" سُوءُ أَدَبٍ مَعَ اللَّهِ، كَأَنَّهُ يَدْعُو أَنْ يُسَلِّمَ اللَّهُ مِنَ النَّقْصِ وَأَنْ يَسْلَمَ مِنَ الضَّرَرِ، وَاللَّهُ عَزَّ وَجَلَّ مُسْتَغْنٍ عَنْ دُعَائِهِ، بَلْ عَزَّ وَجَلَّ هُوَ السَّلَامُ هُوَ الَّذِي يُسَلِّمُ خَلْقَهُ مِنَ النَّقْصِ وَمِنَ الضَّرَرِ. وَلِذَلِكَ قَالَ: \"لَا تَقُولُوا السَّلَامُ عَلَى اللَّهِ\"، هَذَا دَلِيلٌ عَلَى التَّحْرِيمِ، تَحْرِيمِ هَذَا اللَّفْظِ؛ مُجَرَّدُ اللَّفْظِ مُحَرَّمٌ وَإِنْ لَمْ يَقْصِدْ هَذَا الْمَعْنَى. فَالسَّلَامُ مِنَ اللَّهِ وَلَيْسَ اللَّهُ مُحْتَاجًا لِأَنْ يُسَلَّمَ أَوْ يُسَلَّمَ عَلَيْهِ. نَعَمْ.",

        {
          "id": 16,
          "type": "heading",
          "text": "4. بَابُ النَّهْيِ عَنْ تَعْلِيقِ الدُّعَاءِ بِالْمَشِيئَةِ",
          "start": null,

        },
        {
          "id": 17,
          "type": "paragraph",
          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ قَوْلِ: اللَّهُمَّ اغْفِرْ لِي إِنْ شِئْتَ. عَنْ أَبِي هُرَيْرَةَ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: لَا يَقُلْ أَحَدُكُمُ: اللَّهُمَّ اغْفِرْ لِي إِنْ شِئْتَ، اللَّهُمَّ ارْحَمْنِي إِنْ شِئْتَ، لِيَعْزِمِ الْمَسْأَلَةَ فَإِنَّ اللَّهَ لَا مُكْرِهَ لَهُ. وَلِمُسْلِمٍ: وَلْيُعَظِّمِ الرَّغْبَةَ فَإِنَّ اللَّهَ لَا يَتَعَاظَمُهُ شَيْءٌ أَعْطَاهُ.\"",
          "start": null,
          "end": null

        {
          "id": 18,
          "type": "paragraph",
          "text": "هَذَا الْحَدِيثُ فِي النَّهْيِ عَنْ تَعْلِيقِ دُعَاءِ اللَّهِ عَزَّ وَجَلَّ بِالْمَشِيئَةِ بِهَذَا اللَّفْظِ: \"اللَّهُمَّ اغْفِرْ لِي إِنْ شِئْتَ\". وَوَجْهُ النَّهْيِ وَاضِحٌ مِنَ الْحَدِيثِ، وَجْهَانِ: الْوَجْهُ الْأَوَّلُ قَالَ: \"لِيَعْزِمِ الْمَسْأَلَةَ فَإِنَّ اللَّهَ لَا مُكْرِهَ لَهُ\". أَنْتَ إِذَا قُلْتَ \"اللَّهُمَّ اغْفِرْ لِي إِنْ شِئْتَ\" يُوحِمُكَ... أَمَّا أَنَّكَ تَقْصِدُ أَنَّ اللَّهَ عَزَّ وَجَلَّ أَنْتَ لَا تُرِيدُ إِكْرَاهَهُ وَلِذَلِكَ تُخَيِّرُهُ تَقُولُ: إِنْ شِئْتَ اغْفِرْ لِي، إِنْ شِئْتَ أَعْطِنِي. اللَّهُ عَزَّ وَجَلَّ لَا مُكْرِهَ لَهُ فَأَنْتَ لَا تَسْتَطِيعُ أَنْ تُكْرِهَ اللَّهَ عَزَّ وَجَلَّ، فَهَذَا فِيهِ سُوءُ أَدَبٍ مَعَ اللَّهِ عَزَّ وَجَلَّ. الْوَجْهُ الثَّانِي أَنْ يَتَعَاظَمَ هَذِهِ الْمَسْأَلَةَ عَلَى اللَّهِ عَزَّ وَجَلَّ، يَظُنُّ أَنَّ اللَّهَ عَزَّ وَجَلَّ صَعْبٌ عَلَيْهِ أَنْ يَفْعَلَ هَذَا أَوْ عَظِيمٌ عَلَيْهِ، فَهَذَا فِيهِ تَنْقِيصٌ كَبِيرٌ لِلَّهِ عَزَّ وَجَلَّ. لِذَلِكَ الْمُؤْمِنُ لَا بُدَّ أَنْ يَعْلَمَ أَنَّ اللَّهَ هُوَ الْقَادِرُ الْمُخْتَارُ، وَأَنَّ اللَّهَ هُوَ الْغَنِيُّ الْكَرِيمُ الَّذِي لَا يَتَعَاظَمُهُ شَيْءٌ وَلَا يُعْجِزُهُ شَيْءٌ، فَيَدْعُو وَيُعَظِّمُ الرَّغْبَةَ وَيَعْزِمُ الْمَسْأَلَةَ.",

          "id": 19,
          "type": "paragraph",
          "text": "ا... التَّعْلِيقُ التَّعْلِيقُ... الْآنَ لَفْظُ \"إِنْ شَاءَ اللَّهُ\" لَهُ أَحْوَالٌ، يَعْنِي التَّعْلِيقَ بِالْمَشِيئَةِ... الْمَشِيئَةُ الْمَشِي... التَّعْلِيقُ بِالْمَشِيئَةِ فِي الْحَالَةِ الْأُولَى أَنْ يُعَلِّقَهَا فِي الدُّعَاءِ، وَهَذَا هُوَ الْمَنْهِيُّ عَنْهُ فِي هَذَا الْحَدِيثِ؛ يَقُولُ: \"اللَّهُمَّ اغْفِرْ لِي إِنْ شِئْتَ، اللَّهُمَّ أَعْطِنِي إِنْ شِئْتَ، اللَّهُمَّ ارْزُقْنِي إِنْ شِئْتَ\". هَذَا هُوَ الْمَنْهِيُّ عَنْهُ فِي هَذَا الْحَدِيثِ، وَالنَّهْيُ لِلتَّحْرِيمِ.",
          "start": null,
          "end": null
        },
        {
          "id": 20,
          "type": "paragraph",
          "text": "النَّوْعُ الثَّانِي: أَنْ يُعَلِّقَهَا عَلَى أَمْرٍ مَاضٍ، يُقَالُ لَهُ: حَضَرْتَ الدَّرْسَ؟ ذَهَبْتَ لِلْمَسْجِدِ؟ فَعَلْتَ كَذَا؟ فَعَلْتَ...؟ يَقُولُ: \"فَعَلْتُ إِنْ شَاءَ اللَّهُ\". هَذَا بِدْعَةٌ لِأَنَّهُ لَا مَعْنَى لَهُ، فَكَوْنُكَ فَعَلْتَ هَذَا دَلَّ عَلَى أَنَّ اللَّهَ شَاءَ وَقَدَّرَهُ، وَ\"إِنْ شَاءَ اللَّهُ\" هَذَا لَفْظٌ شَرْعِيٌّ، فَكَوْنُكَ أَتَيْتَ بِهِ عَلَى هَذَا الْوَجْهِ الْمُبْتَدَعِ مَعْنَاهُ أَنَّ هَذَا الْفِعْلَ بِدْعَةٌ وَهُوَ مُنَافٍ لِلْعَقْلِ.",
          "start": null,
          "end": null
        },
        {
          "id": 21,
          "type": "paragraph",
          "text": "النَّوْعُ الثَّالثُ مِنْ تَعْلِيقِ الْمَشِيئَةِ: أَنْ يُعَلِّقَ عَلَى أَمْرٍ مُسْتَقْبَلٍ، وَهَذَا هُوَ الْمُسْتَحَبُّ لِقَوْلِ اللَّهِ عَزَّ وَجَلَّ: {وَلَا تَقُولَنَّ لِشَيْءٍ إِنِّي فَاعِلٌ ذَلِكَ غَدًا إِلَّا أَنْ يَشَاءَ اللَّهُ}، فَيُعَلِّقُ الْإِنْسَانُ الْأَمْرَ الْمُسْتَقْبَلَ بِالْمَشِيئَةِ.",
          "start": null,
          "end": null
        },
        {
          "id": 22,
          "type": "paragraph",
          "text": "الرَّابِعُ: أَنْ يُعَلِّقَهَا عَلَى أَمْرٍ مَاضٍ دِينِيٍّ عَلَى عِبَادَةٍ فَعَلَهَا فِي الْمَاضِي، يُقَالُ لَهُ: هَلْ صَلَّيْتَ؟ يُقَالُ: \"صَلَّيْتُ إِنْ شَاءَ اللَّهُ\". هَذَا إِنْ أَرَادَ بِهِ مُجَرَّدَ التَّعْلِيقِ عَلَى الْمَشِيئَةِ كَانَ بِدْعَةً كَالنَّوْعِ الثَّانِي، لَكِنْ إِنْ أَرَادَ بِهِ أَنَّ الْقَبُولَ... قَبُولَ هَذَا الْعَمَلِ، يَعْنِي صَلَّيْتُ وَإِنْ شَاءَ اللَّهُ أَنَّ اللَّهَ قَبِلَ عَمَلِي، كَانَ جَائِزًا لِيَنْفِيَ التَّزْكِيَةَ عَنْ نَفْسِهِ. هَذِهِ هِيَ الْأَحْوَالُ الْأَرْبَعَةُ لِتَعْلِيقِ الْمَشِيئَةِ.",
          "start": null,
          "end": null
        },
        {
          "id": 23,
          "type": "paragraph",
          "text": "طَبْعًا يُعْلَمُ أَنَّ قَوْلَ \"إِنْ شَاءَ اللَّهُ\" إِمَّا أَنْ يَأْتِيَ لِلتَّحْقِيقِ وَإِمَّا أَنْ يَأْتِيَ لِلتَّعْلِيقِ، لَكِنَّ كَلَامَنَا كَانَ فِي التَّعْلِيقِ. التَّحْقِيقُ لِأَمْرٍ مُسْتَقْبَلٍ عَازِمٍ عَلَيْهِ، يَقُولُ سَأَفْعَلُ كَذَا وَهُوَ عَازِمٌ وَيَقُولُ \"إِنْ شَاءَ اللَّهُ\" تَبَرُّكًا أَيْ بِمَشِيئَةِ اللَّهِ عَزَّ وَجَلَّ سَأَفْعَلُ ذَلِكَ وَبِإِذْنِ اللَّهِ عَزَّ وَجَلَّ إِنِّي سَأَفْعَلُ ذَلِكَ. طَبْعًا اخْتَلَفَ فِيهِ أَهْلُ الْعِلْمِ لَكِنَّ الصَّوَابُ وَالْأَقْرَبُ جَوَازُهُ، قَالَ اللَّهُ عَزَّ وَجَلَّ: {لَقَدْ صَدَقَ اللَّهُ رَسُولَهُ الرُّؤْيَا بِالْحَقِّ لَتَدْخُلُنَّ الْمَسْجِدَ الْحَرَامَ إِنْ شَاءَ اللَّهُ آمِنِينَ}. اللَّهُ أَخْبَرَ قَالَ: \"لَقَدْ صَدَقَ اللَّهُ رَسُولَهُ بِالْحَقِّ\" هَذَا وَاقِعٌ، لَكِنَّ هَذِهِ \"إِنْ شَاءَ اللَّهُ\" يَعْنِي بِإِذْنِ اللَّهِ سَتَدْخُلُونَهُ وَبِبَرَكَةِ اللَّهِ عَزَّ وَجَلَّ سَتَدْخُلُونَ الْمَسْجِدَ الْحَرَامَ. وَجَاءَ عَنْ شَيْخِ الْإِسْلَامِ أَنَّهُ قَالَ: \"سَنَنْتَصِرُ\"، لَمَّا كَانَ يُحَارِبُ التَّتَارَ، قَالَ: \"سَنَنْتَصِرُ سَنَنْتَصِرُ سَنَنْتَصِرُ\"، قِيلَ لَهُ: \"قُلْ إِنْ شَاءَ اللَّهُ\"، قَالَ: \"سَنَنْتَصِرُ إِنْ شَاءَ اللَّهُ\"، بِمَعْنَى أَنَّهُ سَيَتَحَقَّقُ ذَلِكَ وَنَحْنُ بِمَشِيئَةِ اللَّهِ عَزَّ وَجَلَّ. هَذَا قَرِيبٌ مِنْ جِنْسِ الدُّعَاءِ كَأَنَّهُ يَدْعُو اللَّهَ عَزَّ وَجَلَّ أَنْ يُقَدِّرَ لَهُ هَذَا النَّصْرَ. نَعَمْ.",
          "start": null,
          "end": null
        },
        {
          "id": 24,
          "type": "heading",
          "text": "5. بَابُ \"لَا يَقُلْ عَبْدِي وَأَمَتِي\" وَالْأَدَبُ فِي الْأَلْفَاظِ",
          "start": null,
          "end": null
        },
        {
          "id": 25,
          "type": "paragraph",
          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ لَا يَقُلْ عَبْدِي وَأَمَتِي. فِي الصَّحِيحِ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: لَا يَقُلْ أَحَدُكُمْ أَطْعِمْ رَبَّكَ، وَضِّئْ رَبَّكَ، وَلْيَقُلْ سَيِّدِي وَمَوْلَايَ. وَلَا يَقُلْ أَحَدُكُمْ عَبْدِي وَأَمَتِي، وَلْيَقُلْ فَتَايَ وَفَتَاتِي وَغُلَامِي.\"",
          "start": null,
          "end": null
        },
        {
          "id": 26,
          "type": "paragraph",
          "text": "نَعَمْ، \"لَا يَقُلْ عَبْدِي وَأَمَتِي\" هَذَا أَيْضًا مِنْ بَابِ الْأَدَبِ مَعَ اللَّهِ عَزَّ وَجَلَّ. لِلْوَجْهِ الثَّانِي الَّذِي وَ\"أَطْعِمْ رَبَّكَ وَضِّئْ رَبَّكَ\" هُنَا اسْمَانِ: \"الْعَبْدُ\" وَ\"الرَّبُّ\"، كُلٌّ مِنْهُ لَهُ حَالٌ. ا... نِسْبَةُ الرَّبِّ إِلَى... نِسْبَةُ قَوْلِ فُلَانٍ يَعْنِي هَذَا رَبُّ فُلَانٍ وَغَيْرُ ذَلِكَ وَمَا أَشْبَهَهُ عَلَى أَحْوَالٍ:",
          "start": null,
          "end": null
        },
        {
          "id": 27,
          "type": "paragraph",
          "text": "الْحَالَةُ الْأُولَى: أَنْ يُضِيفَ إِلَى الرَّبِّ الْكَافَ، يُقَالُ... يَقُولُ هَذَا فُلَانٌ رَبُّكَ، يُكَلِّمُ الْعَبْدَ مَثَلًا يَقُولُ: هَذَا رَبُّكَ، أَوْ يُكَلِّمُ الْمُوَظَّفَ الَّذِي عِنْدَ سَيِّدِ عَمَلِهِ يَقُولُ: هَذَا رَبُّكَ. هَذَا مَنْهِيٌّ عَنْهُ لِدَلَالَةِ هَذَا الْحَدِيثِ: \"لَا يَقُلْ أَحَدُكُمْ أَطْعِمْ رَبَّكَ وَوَضِّئْ رَبَّكَ\"، هَذَا دَلِيلٌ فِي النَّهْيِ عَنْ هَذَا اللَّفْظِ.",
          "start": null,
          "end": null
        },
        {
          "id": 28,
          "type": "paragraph",
          "text": "النَّوْعُ الثَّانِي: أَنْ يُضِيفَهُ لِلْيَاءِ، يَاءِ الْمُتَكَلِّمِ، يَنْسِبَهُ إِلَى نَفْسِهِ يَقُولُ: \"هَذَا فُلَانٌ رَبِّي\"، فُلَانٌ ا... يَقُولُ \"فُلَانٌ رَبِّي\"، هَذَا هُوَ الْوَجْهُ... هَذَا أَيْضًا مَنْهِيٌّ عَنْهُ لِهَذَا الْحَدِيثِ قَالَ: \"وَلْيَقُلْ سَيِّدِي وَمَوْلَايَ\"، فَلَا يَقُولُ \"رَبِّي\" بَلْ يَقُولُ \"سَيِّدِي وَمَوْلَايَ\". وَجَاءَ فِي حَدِيثٍ فِي صَحِيحِ مُسْلِمٍ: \"لَا يَقُلْ أَحَدُكُمْ أَطْعِمْ رَبِّي\"، فَأَيْضًا وَرَدَ النَّهْيُ عَنْ هَذِهِ الصُّورَةِ. إِذًا الصُّورَةُ الْأُولَى أَنْ يُضِيفَهَا إِلَى الْكَافِ، الصُّورَةُ الثَّانِيَةُ أَنْ يُضِيفَهَا إِلَى يَاءِ الْمُتَكَلِّمِ.",
          "start": null,
          "end": null
        },
        {
          "id": 29,
          "type": "paragraph",
          "text": "الصُّورَةُ الثَّالِثَةُ: أَنْ يُضِيفَهُ إِلَى يَاءِ الْغَائِبِ، هَذَا الْأَصْلُ فِيهِ الْجَوَازُ، يُقَالُ فُلَانٌ... فَلَا... يَعْنِي \"فُلَانٌ رَبُّهُ\". قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي عَلَامَاتِ السَّاعَةِ كَمَا جَاءَ فِي بَعْضِ الرِّوَايَاتِ: \"أَنْ تَلِدَ الْأَمَةُ رَبَّهَا\"، فَهَذَا هُنَا دَلِيلٌ عَلَى جَوَازِ هَذِهِ النِّسْبَةِ.",
          "start": null,
          "end": null
        },
        {
          "id": 30,
          "type": "paragraph",
          "text": "إِنَّ النَّوْعُ الرَّابِعُ: أَنْ يُضَافَ إِلَى اسْمٍ ظَاهِرٍ، يُقَالُ \"هَذَا فُلَانٌ رَبُّ فُلَانٍ\"، فَهَذَا فُلَانٌ إِنْ كَانَ مَوْجُودًا - يَعْنِي مَوْجُودٌ فِي الْمَجْلِسِ - كَانَ ذَلِكَ مَكْرُوهًا كَقَوْلِكَ \"فُلَانٌ رَبُّكَ\" وَ\"فُلَانٌ رَبِّي\". يُقَالُ أَلَّا... فَتَقُولُ \"هَذَا رَبُّهُ\"، رَبُّهُ قُلْنَا لَيْسَتْ مَكْرُوهَةً، لَكِنْ إِنْ لَمْ يَكُنْ مَوْجُودًا هُنَا يَجُوزُ، تَقُولُ \"هَذَا فُلَانٌ رَبُّ فُلَانٍ\" بِمَعْنَى أَنَّهُ سَيِّدُهُ، بِمَعْنَى أَنَّهُ مَوْلَاهُ إِلَى مَا ذَلِكَ. قَالَ يُوسُفُ: {إِنَّهُ رَبِّي أَحْسَنَ مَثْوَايَ}، لَكِنَّ هَذِهِ شَرِيعَةُ مَنْ قَبْلَنَا، أَمَّا هُنَا جَاءَ نَهْيٌ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا يَقُولُ فُلَانٌ أَطْعِمْ رَبِّي\". إِذًا هَذِهِ أَحْوَالُ قَوْلِ \"فُلَانٌ رَبُّ فُلَانٍ\" وَمَا أَشْبَهَهُ.",
          "start": null,
          "end": null
        },
        {
          "id": 31,
          "type": "paragraph",
          "text": "قَوْلُ \"الْعَبْدُ وَالْأَمَةُ\"، نِسْبَةُ الْعَبْدِ وَالْأَمَةِ عَلَى صُورَتَيْنِ: الصُّورَةُ الْأُولَى أَنْ يَنْسِبَهُ إِلَى نَفْسِهِ يَقُولُ \"فُلَانٌ عَبْدِي\"، هَذَا نَصُّ الْحَدِيثِ عَلَى النَّهْيِ عَنْهُ وَقَالَ: \"وَلَا يَقُلْ أَحَدُكُمْ عَبْدِي وَأَمَتِي، وَلَا يَقُلْ فَتَايَ وَفَتَاتِي\". النَّوْعُ الثَّانِي أَنْ يَنْسِبَهُ إِلَى غَيْرِهِ وَهَذَا يَجُوزُ، تَقَدَّمَ مَعَنَا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"لَيْسَ عَلَى الْمُسْلِمِ فِي عَبْدِهِ وَلَا فِي فَرَسِهِ صَدَقَةٌ\"، وَتَقَدَّمَ مَعَنَا أَنَّهُ إِنْ كَانَ مَمْلُوكًا لَهُ فَإِنَّهُ يَجُوزُ أَنْ يُقَالَ \"هَذَا فُلَانٌ عَبْدُ فُلَانٍ\" بِمَعْنَى أَنَّهُ مَمْلُوكُهُ. نَعَمْ. أَمَّا الْأَحْوَالُ الْأُخْرَى تَقَدَّمَتْ مَعَنَا إِنْ كَانَ ا... عِبَادَةً وَإِنْ كَانَ مِنْ بَابِ التَّسْمِيَةِ بِغَيْرِ اللَّهِ عَزَّ وَجَلَّ، تَقَدَّمَ مَعَنَا الْكَلَامُ عَلَى ذَلِكَ. نَعَمْ.",
          "start": null,
          "end": null
        },
        {
          "id": 32,
          "type": "heading",
          "text": "6. بَابُ \"لَا يُرَدُّ مَنْ سَأَلَ بِاللَّهِ\" وَبَابُ \"لَا يُسْأَلُ بِوَجْهِ اللَّهِ إِلَّا الْجَنَّةُ\"",

        {
          "id": 33,
          "type": "paragraph",
          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ لَا يُرَدُّ مَنْ سَأَلَ بِاللَّهِ. عَنِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: مَنْ سَأَلَ بِاللَّهِ فَأَعْطُوهُ، وَمَنْ اسْتَعَاذَ بِاللَّهِ فَأَعِيذُوهُ، وَمَنْ دَعَاكُمْ فَأَجِيبُوهُ، وَمَنْ صَنَعَ إِلَيْكُمْ مَعْرُوفًا فَكَافِئُوهُ، فَإِنْ لَمْ تَجِدُوا مَا تُكَافِئُونَهُ فَادْعُوا لَهُ حَتَّى تَرَوْا أَنَّكُمْ قَدْ كَافَأْتُمُوهُ. رَوَاهُ أَبُو دَاوُدَ وَالنَّسَائِيُّ بِسَنَدٍ صَحِيحٍ.\"",

        {
          "id": 34,

          "text": "قَالَ: بَابُ لَا يُرَدُّ مَنْ سَأَلَ بِاللَّهِ. سَيَأْتِي الْبَابُ الَّذِي يَلِيهِ \"بَابُ لَا يُسْأَلُ بِوَجْهِ اللَّهِ إِلَّا الْجَنَّةُ\". هَذَا الْبَابُ تَوَجَّهَ الْخِطَابُ فِيهِ إِلَى الْمَسْؤُولِ، يَعْنِي أَنَّ الْمَسْؤُولَ لَا يَنْبَغِي لَهُ أَنْ يَرُدَّ مَنْ سَأَلَهُ بِاللَّهِ، وَالْبَابُ الَّذِي يَلِيهِ الْخِطَابُ فِيهِ لِلسَّائِلِ لِأَنَّهُ لَا يَنْبَغِي أَنْ يَسْأَلَ بِاللَّهِ. إِذًا لَا يُرَدُّ مَنْ سَأَلَ بِاللَّهِ، السُّؤَالُ بِاللَّهِ عَلَى أَحْوَالٍ: الْحَالَةُ الْأُولَى: أَنْ يَسْأَلَ حَقًّا لِهَذَا السَّائِلِ، فَيَأْتِي السَّائِلُ يَقُولُ س... نَشَدْتُكَ بِاللَّهِ أَنْ تُوَفِّيَنِي حَقِّي، تَقْضِيَ دَيْنِي إِلَى مَا ذَلِكَ. هَذَا يَجِبُ إِجَابَتُهُ، يَجِبُ إِجَابَتُهُ فَيَجِبُ أَنْ يَرُدَّ لِصَاحِبِ الْحَقِّ حَقَّهُ.",

        {

          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ مَا جَاءَ فِي اللَّوْ. وَقَوْلُ اللَّهِ تَعَالَى: {يَقُولُونَ لَوْ كَانَ لَنَا مِنَ الْأَمْرِ شَيْءٌ مَا قُتِلْنَا هَاهُنَا}. وَقَوْلُهُ: {الَّذِينَ قَالُوا لِإِخْوَانِهِمْ وَقَعَدُوا لَوْ أَطَاعُونَا مَا قُتِلُوا}. فِي الصَّحِيحِ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلَا تَعْجِزْ، وَإِنْ أَصَابَكَ شَيْءٌ فَلَا تَقُلْ لَوْ أَنِّي فَعَلْتُ كَذَا لَكَانَ كَذَا وَكَذَا، وَلَكِنْ قُلْ: قَدَرُ اللَّهِ وَمَا شَاءَ فَعَلَ، فَإِنَّ لَوْ تَفْتَحُ عَمَلَ الشَّيْطَانِ.\"",

        {
          "id": 47,
          "type": "paragraph",
          "text": "هَذَا الْبَابُ فِي بَابِ مَا جَاءَ فِي اللَّوْ. اللَّوُ خُلَاصَتُهَا أَنَّهَا... نَعَمْ، تَفَضَّلْ شَيْخُ، أَنَّهَا كَلَامٌ كَغَيْرِهِ مِنَ الْكَلَامِ. هَذِهِ الْخُلَاصَةُ، هَذِهِ خُلَاصَةُ اللَّوِ. وَقَوْلُ لَوْ هَذِهِ وَمَا أَشْبَهَهَا كَـ لَيْتَ وَغَيْرِهَا عَلَى أَقْسَامٍ: الْقِسْمُ الْأَوَّلُ: أَنْ يَقُولَ لَوْ اعْتِرَاضًا عَلَى قَضَاءِ اللَّهِ عَزَّ وَجَلَّ وَقَدَرِهِ، فَهَذَا النَّوْعُ مُحَرَّمٌ. قَالَ تَعَالَى: {يَقُولُونَ لَوْ كَانَ لَنَا مِنَ الْأَمْرِ شَيْءٌ مَا قُتِلْنَا هَاهُنَا}، هَؤُلَاءِ الْكُفَّارُ قَالُوا هَذَا الْكَلَامَ. إِذًا هَذَا النَّوْعُ مُحَرَّمٌ. النَّوْعُ الثَّانِي: أَنْ يَقُولَ عَلَى وَجْهِ الِاحْتِجَاجِ بِالْقَدَرِ عَلَى الْمَعَاصِي، يَقُولُونَ لَوْ شَاءَ اللَّهُ عَزَّ وَجَلَّ لَآمَنَّا، لَوْ شَاءَ اللَّهُ عَزَّ وَجَلَّ لَمَا كَفَرْنَا، لَوْ شَاءَ اللَّهُ عَزَّ وَجَلَّ لَصَدَقْنَا. تَقَدَّمَ الِاحْتِجَاجُ بِالْقَدَرِ عَلَى الْمَعَاصِي بَاطِلٌ، فَإِذًا قَوْلُ لَوْ فِي هَذَا السِّيَاقِ مُحَرَّمٌ وَمُمْتَنِعٌ، وَهَذَا هُوَ شُبْهَةُ الْمُشْرِكِينَ؛ قَالُوا: {لَوْ شَاءَ اللَّهُ مَا أَشْرَكْنَا}. إِذًا هَذَا النَّوْعُ الثَّانِي مُحَرَّمٌ. النَّوْعُ الثَّالِثُ: أَنْ يَقُولَهُ عَلَى سَبِيلِ التَّحَسُّرِ وَالنَّدَمِ عَلَى مَا فَاتَ، وَهَذَا أَيْضًا مَنْهِيٌّ عَنْهُ بِدَلَالَةِ حَدِيثِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"وَلَا تَعْجِزَنَّ، وَإِنْ أَصَابَكَ شَيْءٌ فَلَا تَقُلْ لَوْ أَنِّي فَعَلْتُ كَذَا لَكَانَ كَذَا وَكَذَا، وَلَكِنْ قُلْ قَدَرُ اللَّهِ - أَوْ قَدَّرَ اللَّهُ - وَمَا شَاءَ فَعَلَ، فَإِنَّ لَوْ تَفْتَحُ عَمَلَ الشَّيْطَانِ\". تَفْتَحُ عَمَلَ الشَّيْطَانِ دَلِيلٌ عَلَى التَّحْرِيمِ. النَّوْعُ الثَّالِثُ: يَقُولُهَا لِتَمَنِّي الْخَيْرِ أَوْ تَمَنِّي أَمْرٍ دِينِيٍّ، وَهَذَا يَجُوزُ. النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"لَوِ اسْتَقْبَلْتُ مِنْ أَمْرِي مَا اسْتَدْبَرْتُ مَا سُقْتُ الْهَدْيَ\"، فَهَذَا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هُنَا تَمَنَّ... تَمَنَّى أَمَانِيَّ دِينِيًّا وَهُوَ أَنْ يَحُجَّ حَجَّ الْمُتَمَتِّعِ. وَكَذَلِكَ هِيَ تَجُوزُ لِبَيَانِ الْعِلْمِ، فَإِنْ كَانَ فِيهَا مَصْلَحَةٌ كَقَوْلِ اللَّهِ عَزَّ وَجَلَّ: {لَوْ كَانَ فِيهِمَا آلِهَةٌ إِلَّا اللَّهُ}، هَذَا قَوْلُ لَوْ هُنَا تَبَيَّنَ مِنْهُ الْحُكْمُ وَتَبَيَّنَ مِنْهُ عِلْمٌ، فَلِذَلِكَ هَذَا أَيْضًا يَجُوزُ. إِذًا لَوْ كَغَيْرِهَا مِنَ الْكَلَامِ، أَيُّ كَلَامٍ فِيهِ تَسَخُّطٌ عَلَى قَضَاءِ اللَّهِ عَزَّ وَجَلَّ وَقَدَرِهِ، وَفِيهِ تَنَدُّمٌ وَتَحَسُّرٌ عَلَى مَا فَاتَ، وَفِيهِ اعْتِرَاضٌ عَلَى الْقَدَرِ... عَلَى الْمَعَاصِي بِالْقَدَرِ، فَهُوَ مُحَرَّمٌ وَمَنْهِيٌّ عَنْهُ. نَعَمْ.",

        {

        {
          "id": 50,
          "type": "paragraph",
          "text": "هَذَا الْبَابُ تَقَدَّمَ مَعَنَا كَثِيرًا مَا يُشْبِهُهُ؛ بَابُ سَبِّ الدَّهْرِ، وَقَاعِدَةُ الْأَسْبَابِ وَالْأَبْوَابِ الْكَثِيرَةِ الَّتِي فِيهِ. فَهَذَا مُنْدَرِجٌ ضِمْنَ قَاعِدَةِ الْأَسْبَابِ، ذَلِكَ أَنَّ الرِّيحَ هِيَ لَيْسَتْ سَبَبًا حَقِيقِيًّا، لَيْسَتْ سَبَبًا ا... مُسْتَقِلًّا فِي هَذَا التَّأْثِيرِ، وَإِنَّمَا هِيَ بِتَقْدِيرِ اللَّهِ عَزَّ وَجَلَّ، فَهِيَ لَيْسَتْ ذَاتَ إِرَادَةٍ. وَالْقَاعِدَةُ أَنَّهُ لَا يَجُوزُ سَبُّ هَذِهِ الْأُمُورِ الَّتِي لَيْسَتْ ذَاتَ إِرَادَةٍ. فَسَبُّ الرِّيحِ وَالدَّهْرِ مِمَّا أَرْسَلَهُ اللَّهُ عَزَّ وَجَلَّ مُحَرَّمٌ عَلَى الْأَقْسَامِ الَّتِي ذَكَرْنَاهَا؛ إِنْ ظَنَّ أَنَّهُ مُسْتَقِلٌّ كَانَ ذَلِكَ كُفْرًا أَكْبَرَ، وَإِنْ ظَنَّ أَنَّهُ سَبَبٌ وَهْمِيٌّ كَانَ ذَلِكَ كُفْرًا أَصْغَرَ، وَإِنْ سَبَّهَا وَلَمْ يَعْتَقِدْ أَنَّهَا مُؤَثِّرَةٌ لَكِنْ سَبَّهَا لِلْفَسَادِ الَّذِي أَوْقَعَتْهُ كَانَ ذَلِكَ مُحَرَّمًا. وَإِنْ أَخْبَرَ عَنْ هَذِهِ الرِّيحِ مُجَرَّدَ إِخْبَارٍ كَانَ ذَلِكَ جَائِزًا، كَقَوْلِ: \"هَذِهِ وَاللَّهِ كَانَتْ رِيحٌ شَدِيدَةٌ\"، \"هَذِهِ كَانَتْ رِيحٌ مُتْعِبَةٌ\"، \"هَذِهِ رِيحٌ أَتْعَبَتْنَا وَصَعَّبَتْ عَلَيْنَا\"، ذَاكَ جَائِزٌ. قَالَ اللَّهُ عَزَّ وَجَلَّ: {بِرِيحٍ صَرْصَرٍ عَاتِيَةٍ}، فَوَصَفَهَا اللَّهُ عَزَّ وَجَلَّ بِهَذِهِ الْأَوْصَافِ. إِذًا هَذَا رَاجِعٌ إِلَى كَلَامِنَا عَلَى سَبِّ الدَّهْرِ، سَبِّ مَا لَيْسَ لَهُ إِرَادَةٌ. فَكُلُّ مَا لَيْسَ لَهُ إِرَادَةٌ فَإِنَّ سَبَّهُ مُحَرَّمٌ لِأَنَّهُ رَاجِعٌ عَلَى اللَّهِ عَزَّ وَجَلَّ مِنْ بَابِ اللَّازِمِ. نَعَمْ.",

          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ قَوْلِ اللَّهِ تَعَالَى: {يَظُنُّونَ بِاللَّهِ غَيْرَ الْحَقِّ ظَنَّ الْجَاهِلِيَّةِ يَقُولُونَ هَلْ لَنَا مِنَ الْأَمْرِ مِنْ شَيْءٍ قُلْ إِنَّ الْأَمْرَ كُلَّهُ لِلَّهِ}. وَقَوْلِهِ: {الظَّانِّينَ بِاللَّهِ ظَنَّ السَّوْءِ عَلَيْهِمْ دَائِرَةُ السَّوْءِ}. قَالَ ابْنُ الْقَيِّمِ فِي الْآيَةِ الْأُولَى: فُسِّرَ بِأَنَّهُ سُبْحَانَهُ لَا يَنْصُرُ رَسُولَهُ وَأَنَّ أَمْرَهُ سَيَضْمَحِلُّ، وَفُسِّرَ بِأَنَّ مَا أَصَابَهُ لَمْ يَكُنْ بِقَدَرِ اللَّهِ وَحِكْمَتِهِ، وَفُسِّرَ بِإِنْكَارِ الْحِكْمَةِ، وَإِنْكَارِ الْقَدَرِ، وَإِنْكَارِ أَنْ يُتِمَّ أَمْرَ رَسُولِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَنْ يُظْهِرَهُ عَلَى الدِّينِ كُلِّهِ. وَهَذَا هُوَ ظَنُّ السَّوْءِ الَّذِي ظَنَّهُ الْمُنَافِقُونَ وَالْمُشْرِكُونَ فِي سُورَةِ الْفَتْحِ. وَإِنَّمَا كَانَ هَذَا ظَنَّ السَّوْءِ لِأَنَّهُ ظَنُّ غَيْرِ مَا يَلِيقُ بِهِ سُبْحَانَهُ، وَمَا يَلِيقُ بِحِكْمَتِهِ وَحَمْدِهِ وَوَعْدِهِ الصَّادِقِ. فَمَنْ ظَنَّ أَنَّهُ يُدِيلُ الْبَاطِلَ عَلَى الْحَقِّ إِدَالَةً مُسْتَقِرَّةً يَضْمَحِلُّ مَعَهَا الْحَقُّ، أَوْ أَنْكَرَ أَنْ يَكُونَ مَا جَرَى بِقَضَائِهِ وَقَدَرِهِ، أَوْ أَنْكَرَ أَنْ يَكُونَ قَدَرُهُ لِحِكْمَةٍ بَالِغَةٍ يَسْتَحِقُّ عَلَيْهَا الْحَمْدَ، بَلْ زَعَمَ أَنَّ ذَلِكَ لِمَشِيئَةٍ مُجَرَّدَةٍ، فَذَلِكَ ظَنُّ الَّذِينَ كَفَرُوا {فَوَيْلٌ لِلَّذِينَ كَفَرُوا مِنَ النَّارِ}. وَأَكْثَرُ النَّاسِ يَظُنُّونَ بِاللَّهِ ظَنَّ السَّوْءِ فِيمَا يَخْتَدُّ بِهِمْ وَفِيمَا يَفْعَلُونَهُ بِغَيْرِهِمْ، وَلَا يَسْلَمُ مِنْ ذَلِكَ إِلَّا مَنْ عَرَفَ اللَّهَ وَأَسْمَاءَهُ وَصِفَاتَهُ وَمُوجَبَ حِكْمَتِهِ وَحَمْدِهِ. فَلْيَعْتَنِ اللَّبِيبُ النَّاصِحُ لِنَفْسِهِ بِهَذَا، وَلْيَتُبْ إِلَى اللَّهِ وَلْيَسْتَغْفِرْهُ مِنْ ظَنِّهِ بِرَبِّهِ ظَنَّ السَّوْءِ. وَلَوْ فَتَّشْتَ مَنْ فَتَّشْتَ لَرَأَيْتَ عِنْدَهُ تَعَنُّتًا عَلَى الْقَدَرِ وَمَلَامَةً لَهُ، وَأَنَّهُ كَانَ يَنْبَغِي أَنْ يَكُونَ كَذَا وَكَذَا، فَمُسْتَقِلٌّ وَمُسْتَكْثِرٌ. وَفَتِّشْ نَفْسَكَ هَلْ أَنْتَ سَالِمٌ؟ فَإِنْ تَنْجُ مِنْهَا تَنْجُ مِنْ ذِي عَظِيمَةٍ، وَإِلَّا فَإِنِّي ل           "text": "نَعَمْ، هَذَا الْبَابُ جَاءَ ا... اسْتِكْمَالًا لِلْأَبْوَابِ الَّتِي جَاءَتْ فِي بَيَانِ الْأَدَبِ مَعَ اللَّهِ عَزَّ وَجَلَّ، وَتَقَدَّمَ مَعَنَا الْكَلَامُ عَلَى أَغْلَبِ مَسَائِلِهِ عِنْدَ الْكَلَامِ عَلَى بَابِ الرَّجَاءِ. فَالظَّنُّ السَّيِّءُ بِاللَّهِ عَزَّ وَجَلَّ ضَابِطُهُ هُوَ أَنْ يَظُنَّ كُلَّ ظَنٍّ غَيْرِ لَائِقٍ بِاللَّهِ عَزَّ وَجَلَّ، فَكُلُّ مَا لَا يَلِيقُ بِاللَّهِ عَزَّ وَجَلَّ فَهُوَ ظَنُّ السَّوْءِ. وَالْإِنْسَانُ يَنْبَغِي دَائِمًا أَنْ يَدْفَعَ عَنْ نَفْسِهِ هَذَا الظَّنَّ، وَأَنْ يَظُنَّ بِاللَّهِ الظَّنَّ الْحَسَنَ. وَهَذَا هُوَ الرَّجَاءُ، وَقُلْنَا إِنَّهُ يَصِلُ إِلَى ذَلِكَ بِأُمُورٍ: أَنْ يَعْرِفَ أَسْمَاءَ اللَّهِ عَزَّ وَجَلَّ وَصِفَاتِهِ، وَأَنْ يَعْرِفَ حَالَ نَفْسِهِ، وَأَنْ يُسَلِّمَ لِحِكْمَةِ اللَّهِ عَزَّ وَجَلَّ فِي خَلْقِهِ وَفِي تَقْدِيرِهِ لِلْأُمُورِ. فَإِذَا عَلِمَ أَسْمَاءَ اللَّهِ عَزَّ وَجَلَّ عَلِمَ أَنَّ اللَّهَ لَيْسَ بِظَلَّامٍ لِلْعَبِيدِ، وَإِذَا عَلِمَ حَالَ نَفْسِهِ عَلِمَ أَنَّهُ مُسْتَحِقٌّ لِهَذَا الِابْتِلَاءِ الَّذِي نَزَلَ بِهِ. لِذَلِكَ قَالَ ابْنُ الْقَيِّمِ - وَكَلَامُهُ هَذَا مُخْتَصَرٌ مِنْ \"زَادِ الْمَعَادِ\" نَقَلَهُ الْمُصَنِّفُ رَحِمَهُ اللَّهُ - قَالَ: \"وَلَوْ فَتَّشْتَ مَنْ فَتَّشْتَ لَرَأَيْتَ عِنْدَهُ تَعَنُّتًا عَنِ الْقَدَرِ\".",

        },
        {
          "id": 54,
          "type": "paragraph",
          "text": "أَغْلَبُ النَّاسِ الْيَوْمَ لَا يَكَادُ يَسْلَمُ، يَرَى أَنَّهُ لَا يَسْتَحِقُّ، يَرَى أَنَّهُ مَظْلُومٌ، يَرَى أَنَّ الْكَوْنَ تَآمَرَ ضِدَّهُ، يَرَى أَنَّهُ لَا يَسْتَحِقُّ أَكْثَرَ مِنْ هَذَا. فَهَذَا كُلُّهُ مِنَ الظَّنِّ السَّيِّءِ بِاللَّهِ عَزَّ وَجَلَّ وَإِسَاءَةِ الظَّنِّ بِهِ سُبْحَانَهُ وَتَعَالَى. بَلِ الْإِنْسَانُ كَمَا قُلْنَا كُلُّ ابْنِ آدَمَ خَطَّاءٌ، يُخْطِئُونَ بِاللَّيْلِ وَالنَّهَارِ، وَمَا وَقَعَ بَلَاءٌ إِلَّا بِذَنْبٍ. الْمُقْتَضَى أَنْ يَكُونَ الْبَلَاءُ بِعَدَدِ الذُّنُوبِ، فَكَمَا أَنَّكَ تُذْنِبُ لَيْلًا وَنَهَارًا تَكُونُ مُبْتَلًى لَيْلًا وَنَهَارًا. وَمَعَ ذَلِكَ نَرَى اللَّهَ عَزَّ وَجَلَّ لَا يَبْتَلِيهِمْ إِلَّا بِأُمُورٍ يَسِيرَةٍ حَقِيرَةٍ، وَتَرَى النِّعَمَ تَتَفَاوَتُ - يَعْنِي كَثِيرَةً عَلَيْهِمْ - وَمَعَ ذَلِكَ يَعْتَرِضُونَ. أَنْتَ لَا تَسْتَحِقُّ عَلَى اللَّهِ عَزَّ وَجَلَّ شَيْئًا، أَنْتَ لَمْ تَقُمْ بِحُقُوقِ اللَّهِ عَزَّ وَجَلَّ، لَمْ تُؤَدِّ حَقَّهُ كَمَا يَنْبَغِي بَلْ أَسَأْتَ وَظَلَمْتَ. وَهَذَا رَحْمَةٌ مِنَ اللَّهِ عَزَّ وَجَلَّ عَجَّلَ لَكَ بِابْتِلَاءٍ بَسِيطٍ يَسِيرٍ يُكَفِّرُ بِهِ الذُّنُوبَ، وَإِذَا أَنْتَ تَسْتَحِقُّ عَلَى هَذِهِ الْمَعَاصِي.",

          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ مَا جَاءَ فِي مُنْكِرِ الْقَدَرِ. وَقَالَ ابْنُ عُمَرَ: وَالَّذِي نَفْسُ ابْنِ عُمَرَ بِيَدِهِ لَوْ كَانَ لِأَحَدِهِمْ مِثْلُ أُحُدٍ ذَهَبًا ثُمَّ أَنْفَقَهُ فِي سَبِيلِ اللَّهِ مَا قَبِلَهُ اللَّهُ مِنْهُ حَتَّى يُؤْمِنَ بِالْقَدَرِ. ثُمَّ اسْتَدَلَّ بِقَوْلِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: الْإِيمَانُ أَنْ تُؤْمِنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الْآخِرِ وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ. رَوَاهُ مُسْلِمٌ. وَعَنْ عُبَادَةَ بْنِ الصَّامِتِ أَنَّهُ قَالَ لِابْنِهِ: يَا يَا بُنَيَّ، إِنَّكَ لَنْ تَجِدَ طَعْمَ الْإِيمَانِ حَتَّى تَعْلَمَ أَنَّ مَا أَصَابَكَ لَمْ يَكُنْ لِيُخْطِئَكَ وَمَا أَخْطَأَكَ لَمْ يَكُنْ لِيُصِيبَكَ. سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ الْقَلَمَ، فَقَالَ لَهُ اكْتُبْ، فَقَالَ رَبِّ وَمَا أَكْتُبُ؟ قَالَ اكْتُبْ مَقَادِيرَ كُلِّ شَيْءٍ حَتَّى تَقُومَ السَّاعَةُ. يَا بُنَيَّ سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: مَنْ مَاتَ عَلَى غَيْرِ هَذَا فَلَيْسَ مِنِّي. وَرِوَايَةٌ لِأَحْمَدَ: إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ تَعَالَى الْقَلَمَ فَقَالَ لَهُ اكْتُبْ، فَجَرَى فِي تِلْكَ السَّاعَةِ مَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ. وَفِي رِوَايَةِ ابْنِ وَهْبٍ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: فَمَنْ لَمْ يَعْمَلْ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ أَحْرَقَهُ اللَّهُ بِالنَّارِ. وَفِي الْمُسْنَدِ وَالسُّنَنِ عَنِ ابْنِ الدَّيْلَمِيِّ قَالَ: أَتَيْتُ أُبَيَّ بْنَ كَعْبٍ فَقُلْتُ: فِي نَفْسِي شَيْءٌ مِنَ الْقَدَرِ، فَحَدِّثْنِي بِشَيْءٍ لَعَلَّ اللَّهَ يُذْهِبُهُ مِنْ قَلْبِي. فَقَالَ: لَوْ أَنْفَقْتَ مِثْلَ أُحُدٍ ذَهَبًا مَا قَبِلَهُ اللَّهُ مِنْكَ حَتَّى تُؤْمِنَ بِالْقَدَرِ، فَتَعْلَمَ أَنَّ مَا أَصَابَكَ لَمْ يَكُنْ لِيُخْطِئَكَ وَمَا أَخْطَأَكَ لَمْ يَكُنْ لِيُصِيبَكَ، وَلَوْ مُتَّ عَلَى غَيْرِ هَذَا لَكُنْتَ مِنْ أَهْلِ النَّارِ. قَالَ: فَأَتَيْتُ عَبْدَ اللَّهِ بْنَ مَسْعُودٍ وَحُذَيْفَةَ بْنَ الْيَمَانِ وَزَيْدَ بْنَ ثَابِتٍ فَك           "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ مَا جَاءَ فِي الْمُصَوِّرِينَ. عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: قَالَ اللَّهُ تَعَالَى: وَمَنْ أَظْلَمُ مِمَّنْ ذَهَبَ يَخْلُقُ كَخَلْقِي؟ فَلْيَخْلُقُوا ذَرَّةً أَوْ لِيَخْلُقُوا حَبَّةً أَوْ لِيَخْلُقُوا شَعِيرَةً. أَخْرَجَاهُ. وَلَهُمَا عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: بَلْ أَشَدُّ النَّاسِ عَذَابًا يَوْمَ الْقِيَامَةِ الَّذِينَ يُضَاهُونَ بِخَلْقِ اللَّهِ. وَلَهُمَا عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: كُلُّ مُصَوِّرٍ فِي النَّارِ، كُلُّ مُصَوِّرٍ فِي النَّارِ، يُجْعَلُ لَهُ بِكُلِّ صُورَةٍ صَوَّرَهَا نَفْسٌ يُعَذَّبُ بِهَا فِي جَهَنَّمَ. وَلَهُمَا عَنْهُمَا مَرْفُوعًا: مَنْ صَوَّرَ صُورَةً فِي الدُّنْيَا كُلِّفَ أَنْ يَنْفُخَ فِيهَا الرُّوحَ وَلَيْسَ بِنَافِخٍ. وَلِمُسْلِمٍ عَنْ أَبِي الْهَيَّاجِ قَالَ: قَالَ لِي عَلِيٌّ: أَلَا أَبْعَثُكَ عَلَى مَا بَعَثَنِي عَلَيْهِ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ؟ أَلَّا تَدَعَ صُورَةً إِلَّا طَمَسْتَهَا وَلَا قَبْرًا مُشْرِفًا إِلَّا سَوَّيْتَهُ.\"",

        {

          "text": "قَالَ: بَابُ مَا جَاءَ فِي الْمُصَوِّرِ. هَذَا الْبَابُ ذَكَرَهُ الْمُصَنِّفُ رَحِمَهُ اللَّهُ عَزَّ وَجَلَّ فِي هَذَا الْكِتَابِ \"كِتَابِ التَّوْحِيدِ\" لِأَنَّ التَّصْوِيرَ ذَرِيعَةٌ لِلشَّكِّ... ذَرِيعَةٌ لِلشِّرْكِ، وَلِأَنَّ فِيهِ مُضَاهَاةً لِخَلْقِ اللَّهِ عَزَّ وَجَلَّ. فَالالتَّصْوِيرُ تَحْرِيمُهُ رَاجِعٌ لِأَرْبَعَةِ أُمُورٍ: الْأَمْرُ الْأَوَّلُ أَنَّهُ مُضَاهَاةٌ لِخَلْقِ اللَّهِ عَزَّ وَجَلَّ كَمَا جَاءَ فِي الْأَحَادِيثِ الَّتِي فِي الْبَابِ. الْأَمْرُ الثَّانِي أَنَّهُ ذَرِيعَةٌ لِلشِّرْكِ، فَإِنَّهُ تَقَدَّمَ مَعَنَا كَثِيرًا أَنَّ سَبَبَ كُفْرِ بَنِي آدَمَ غُلُوُّهُمْ فِي الصَّالِحِينَ، وَمِنَ السَّبَبِ... وَتَعْظِيمِ الْكَوَاكِبِ، وَمِنْ صُوَرِ غُلُوِّهِمْ فِي الصَّالِحِينَ هَذِهِ التَّمَاثِيلُ الَّتِي نَصَبُوهَا كَقَوْمِ نُوحٍ نَصَبُوا لِـ \"وَدٍّ\" وَ\"سُوَاعٍ\" وَ\"يَغُوثَ\" نَصَبُوا لَهُمْ تَمَاثِيلَ، لَمَّا نُسِيَ الْعِلْمُ عَبَدُوهَا. فَإِذًا هُوَ ذَرِيعَةٌ لِلشِّرْكِ. الْعِلَّةُ الثَّالِثَةُ الَّتِي لِأَجْلِهَا حُرِّمَ التَّصْوِيرُ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ جَاءَ عَنْهُ أَنَّ الْمَلَائِكَةَ لَا تَدْخُلُ بَيْتًا فِيهِ تِمْثَالٌ وَلَا صُورَةٌ، فَإِذًا هُوَ سَبَبٌ أَوْ مَانِعٌ مِنْ دُخُولِ الْمَلَائِكَةِ لِلْبَيْتِ. الْأَمْرُ الرَّابِعُ أَنَّهُ ا... يُورِثُ التَّعَلُّقَ بِالدُّنْيَا، يُورِثُ التَّعَلُّقَ بِالدُّنْيَا وَزِينَتِهَا. لِذَلِكَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَمَّا دَخَلَ بَيْتَ عَائِشَةَ وَكَانَ فِيهِ ذَاكَ السِّتَارُ الَّذِي رُسِمَ عَلَيْهِ صُورَةُ طَائِرٍ قَالَ: \"حَوِّلِيهِ\"، فَإِنَّهُ إِذَا دَخَلَ... فَإِنَّ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ إِذَا دَخَلْتُ تَذَكَّرْتُ الدُّنْيَا. فَدَلَّ هَذَا عَلَى أَنَّهُ يُورِثُ التَّعَلُّقَ بِالدُّنْيَا. هَذِهِ الْعِلَلُ الْأَرْبَعَةُ عُمُومًا حُرِّمَ لِأَجْلِهَا التَّصْوِيرُ.",

        {
          "id": 68,

          "text": "أَمَّا الْحُكْمُ عَلَى التَّصْوِيرِ نَفْسِهِ فَعَلَى صُوَرٍ كَثِيرَةٍ الَّذِي يَهُمُّنَا مِنْهَا سَيَأْتِي. أَوَّلًا نَقُولُ مَا هُوَ التَّصْوِيرُ؟ جَاءَ عِنْدَنَا لَفْظُ \"التِّمْثَالِ\" وَجَاءَ عِنْدَنَا لَفْظُ \"الصُّورَةِ\". التِّمْثَالُ وَالصُّورَةُ فِي اللُّغَةِ وَاحِدٌ، يُطْلَقُ التِّمْثَالُ عَلَى مَا كَانَ لَهُ ظِلٌّ وَعَلَى مَا لَيْسَ لَهُ ظِلٌّ، هَذِهِ الصُّورَةُ الْمَوْجُودَةُ الَّتِي لَيْسَ... يُطْلَقُ عَلَيْهَا فِي اللُّغَةِ تِمْثَالٌ. الصُّورَةُ كَذَلِكَ تُطْلَقُ عَلَى مَا لَهُ ظِلٌّ وَمَا لَيْسَ لَهُ ظِلٌّ. الْآنَ الْأَغْلَبُ عِنْدَ النَّاسِ أَنْ يُطْلِقُوا التِّمْثَالَ عَلَى الْمُجَسَّمِ الَّذِي لَهُ ظِلٌّ، وَالصُّورَةَ عَلَى الْمُسَطَّحِ الَّذِي لَيْسَ لَهُ ظِلٌّ. وَالتِّمْثَالُ لِأَنَّهُ مِنَ الْمُمَاثَلَةِ، يُمَاثِلُ هَذَا الْمَخْلُوقَ، يُمَثِّلُهُ عَلَى شَكْلِ هَذَا التِّمْثَالِ أَوْ هَذَا الْمُجَسَّمِ. الْمُهِمُّ الْكَلَامُ عَلَى التَّصْوِيرِ أَيْ عَلَى صُنْعِ التَّمَاثِيلِ أَوْ صُنْعِ الصُّورِ الْمُسَطَّحَةِ عَلَى صُوَرٍ ثَلَاثَةٍ:",

          "text": "الصُّورَةُ الرَّابِعَةُ: أَنْ يُصَوِّرَ مَا يُنْفَخُ فِيهِ الرُّوحُ عَادَةً - الْأَصْلُ الْكَائِنَاتُ الْحَيَّةُ - هَذَا نَقْسِمُهُ إِلَى قِسْمَيْنِ: الْقِسْمُ الْأَوَّلُ أَنْ يَكُونَ مُجَسَّمًا لَهُ ظِلٌّ، النَّوْعُ الثَّانِي أَنْ يَكُونَ مُسَطَّحًا. النَّوْعُ الْأَوَّلُ الْمُجَسَّمُ لَهُ ظِلٌّ عَلَى صُوَرٍ كَثِيرَةٍ: الصُّورَةُ الْأُولَى أَنْ يَكُونَ تَامَّ الْخِلْقَةِ وَيَدُومُ طَوِيلًا؛ أَخَذَ تِمْثَالًا مِنْ حَجَرٍ وَشَكَّلَهُ عَلَى شَكْلِ إِنْسَانٍ، عَلَى شَكْلِ حَيَوَانٍ، عَلَى غَيْرِ ذَلِكَ، فَهَذَا مُحَرَّمٌ. هَذَا مُحَرَّمٌ بِالْإِجْمَاعِ وَبِدَلَالَةِ هَذِهِ الْأَدِلَّةِ الَّتِي تَقَدَّمَتْ مَعَنَا فِي الْبَابِ. وَهَذَا ذَرِيعَةٌ شَدِيدَةٌ جِدًّا لِلشِّرْكِ. قَدْ يَقُولُ قَائِلٌ: الْيَوْمَ لَا نَحْنُ نَعْرِفُ وَكَذَا وَكَذَا، لَا يُعْتَبَرُ وَلَا يُلْتَفَتُ لِذَلِكَ، النُّصُوصُ عَامَّةٌ وَهَذَا سَبَبُ شِرْكِ بَنِي آدَمَ، سَبَبُ شِرْكِ قَوْمِ نُوحٍ، وَسَبَبُ شِرْكِ قُرَيْشٍ؛ أَنَّ هَذَا الَّذِي يَلُتُّ لَهُمُ السَّوِيقَ \"اللَّاتُ\" نَصَبُوا لَهُ تِمْثَالًا فَعَبَدُوهُ بَعْدَ ذَلِكَ. إِذًا هَذِهِ ذَرِيعَةٌ اعْتَبَرَهَا الشَّارِعُ. الصُّورَةُ الثَّانِيَةُ مِنْ هَذِهِ التَّمَاثِيلِ الْمُجَسَّمَةِ الَّتِي لَا تَدُومُ طَوِيلًا؛ تِمْثَالٌ مِنْ أَكْلٍ، تِمْثَالٌ مِنْ ثَلْجٍ، تِمْثَالٌ مِنْ غَيْرِ ذَلِكَ مِمَّا لَا يَدُومُ طَوِيلًا. الْجُمْهُورُ عَلَى تَحْرِيمِهِ، وَلَقَبُ تَحْرِيمِهِ لِأَنَّهُ دَاخِلٌ فِي هَذَا الْعُمُومِ وَلَمْ نَجِدْ مَا يَسْتَثْنِيهِ وَيُخْرِجُهُ مِنْ عُمُومِ تَحْرِيمِ التَّمَاثِيلِ. الصُّورَةُ الثَّالِثَةُ مِنْ هَذِهِ التَّمَاثِيلِ الْمُجَسَّمَةِ الَّتِي لَهَا ظِلٌّ \"دُمُى الْأَطْفَالِ\"، وَدُمُى... دُمَى الْأَطْفَالِ الصَّحِيحُ جَوَازُهَا؛ لِأَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَقَرَّ عَائِشَةَ، كَانَ لَدَيْهَا دُمًى هَكَذَا فَقَالَ: \"مَا هَذِهِ؟\"، قَالَتْ: \"بَنَاتِي\". فَكَانَتْ تَلْعَبُ بِهَا، وَكَانَ لَهَا فَرَسٌ لَهُ جَنَاحَانِ فَقَالَ: \"مَا هَذَا؟\"، قَالَتْ: \"أَمَا عَلِمْتَ أَنَّ نَبِيَّ اللَّهِ سُلَيْمَانَ كَانَ لَهُ فَرَسٌ لَهُ جَنَاحَانِ؟\". الشَّاهِدُ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَقَرَّهَا عَلَى هَذَا. دُمَى الْأَطْفَالِ إِذًا جَائِزَةٌ لِلْأَطْفَالِ وَلَا يُلْتَفَتُ إِلَى كَوْنِهَا دَقِيقَةً أَوِ الْوَجْهُ وَاضِحٌ لَا، الْأَصْلُ جَوَازُهَا، هَذِهِ مُسْتَثْنَاةٌ مِنْ هَذَا الْعُمُومِ. ذَهَبَ بَعْضُ أَهْلِ الْعِلْمِ إِلَى أَنَّهُ مَا كَانَ دَقِيقًا يَحْرُمُ لَكِنَّ هَذَا لَا دَلِيلَ عَلَيْهِ، لِأَنَّهُ لَوْ كَانَ الْعِلَّةُ عَدَمَ الدِّقَّةِ وَغَيْرَ ذَلِكَ لَجَازَ لِلْكِبَارِ كَذَلِكَ اللَّعِبُ بِهَذِهِ الْأَطْفَالِ. نَحْنُ اسْتَثْنَيْنَاهَا لِلْأَطْفَالِ مَعَ كَوْنِهَا مُجَسَّمَةً. إِذًا هَذَا حُكْمُ التَّمَاثِيلِ الْمُجَسَّمَةِ الَّتِي لَهَا ظِلٌّ؛ لَا تَجُوزُ إِلَّا دُمَى الْأَطْفَالِ، الْبَاقِي مُحَرَّمٌ.",

        {
          "id": 72,
          "type": "paragraph",
          "text": "النَّوْعُ الثَّالِثُ... النَّوْعُ الْقِسْمُ الثَّانِي مِنْ هَذِهِ التَّمَاثِيلِ \"ذَوَاتِ الْأَرْوَاحِ\": التَّمَاثِيلُ الْمُسَطَّحَةُ الْمَرْسُومَةُ. هَذِهِ ا... اخْتَلَفَ فِيهَا الْعِلْمُ عَلَى أَقْوَالٍ، أَقْرَبُ الْأَقْوَالِ وَاللَّهُ أَعْلَمُ جَوَازُهَا وَهُوَ مَذْهَبُ الْمَالِكِيَّةِ. ذَهَبَ الْمَالِكِيَّةُ إِلَى جَوَازِ رَسْمِ هَذِهِ ذَوَاتِ الْأَرْوَاحِ إِذَا كَانَتْ مُسَطَّحَةً وَلَمْ يَكُنْ لَهَا ظِلٌّ، اسْتَدَلُّوا بِعِدَّةِ أُمُورٍ، مِنْ هَذِهِ الْأُمُورِ هَذَا الْحَدِيثُ: \"قَالَ اللَّهُ تَعَالَى: وَمَنْ أَظْلَمُ مِمَّنْ ذَهَبَ يَخْلُقُ كَخَلْقِي؟ فَلْيَخْلُقُوا ذَرَّةً أَوْ لِيَخْلُقُوا حَبَّةً\"، قَالَ \"يَخْلُقُ كَخَلْقِي\"، الْعِلَّةُ مُضَاهَاةُ خَلْقِ اللَّهِ عَزَّ وَجَلَّ، وَاللَّهُ عَزَّ وَجَلَّ لَمْ يَخْلُقْ هَذِهِ الْأَشْيَاءَ مُسَطَّحَةً إِنَّمَا خَلَقَهَا مُجَسَّمَةً، إِذًا لَمْ تَحْصُلِ الْعِلَّةُ هُنَا. الْوَجْهُ الثَّانِي أَنَّهُمُ اسْتَدَلُّوا بِأَفْعَالِ الصَّحَابَةِ، كَثِيرٌ مِنَ الصَّحَابَةِ جَاءَ عَنْهُمْ أَنَّهُ كَانَ فِي خَاتَمِهِمْ صُوَرٌ؛ أَنَسُ بْنُ مَالِكٍ، عِمْرَانُ بْنُ الْحُصَيْنِ وَغَيْرُ ذَلِكَ، كَانَ فِي خَوَاتِمِهِمْ مَنْقُوشٌ صُوَرُ كَائِنَاتٍ حَيَّةٍ. الْأَمْرُ الثَّالِثُ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ اسْتَثْنَى قَالَ: \"إِلَّا رَقْمًا فِي ثَوْبٍ\"، الرَّقْمُ فِي الثَّوْبِ هُوَ الشَّيْءُ الْمَرْسُومُ. فَلِذَلِكَ هَذَا بِهَذِهِ الْأَدِلَّةِ وَبِمَا ثَبُتَ عَنِ السَّلَفِ وَعَنِ الصَّحَابَةِ وَغَيْرِهِمْ قَالُوا إِنَّ هَذِهِ الصُّوَرَ الْمَرْسُومَةَ جَائِزَةٌ. أَمَّا الْقَوْلُ الثَّانِي قَوْلُ الْجُمْهُورِ قَالُوا مُحَرَّمَةٌ، قَالُوا هِيَ دَاخِلَةٌ فِي عُمُومِ الصُّوَرِ. وَالْقُرْبُ وَاللَّهُ أَعْلَمُ وَاللَّهُ أَعْلَمُ هُوَ الْجَوَازُ الَّذِي هُوَ مَذْهَبُ الْمَالِكِيَّةِ أَوْ كَرَاهَةُ التَّنْزِيهِ، وَإِذَا وُجِدَ فِي كَلَامِ السَّلَفِ أَنَّ هَذِهِ الصُّوَرَ مَكْرُوهَةٌ - أَيِ الْمَنْصُوبَةَ وَالْمُسَطَّحَةَ هَذِهِ الْمُسَطَّحَةَ - كَرَاهَةُ تَنْزِيهٍ فِي الْغَالِبِ. جُمْهُورُ السَّلَفِ عَلَى أَنَّهُ كَرَاهَةُ تَنْزِيهٍ ذَكَرَ ذَلِكَ الْقُرْطُبِيُّ. جَاءَ عَنْ بَعْضِ الْحَنَابِلَةِ أَنَّهُ يُكْرَهُ مِنْهَا مَا كَانَ مَنْصُوبًا، أَمَّا مَا كَانَ مَبْسُوطًا فَإِنَّهُ يَجُوزُ، وَكَمَا قُلْنَا أَنَّهُ لَا فَرْقَ بَيْنَ الْمَنْصُوبِ وَالْمَبْسُوطِ. جَاءَ عَنْ بَعْضِ الصَّحَابَةِ أَنَّهُمْ كَانُوا يُعَلِّقُونَ مِنَ السِّتْرِ عَلَيْهَا ا... الصُّوَرَ هَذِهِ الْمَرْسُومَةَ، وَالْمَسْأَلَةُ اجْتِهَادِيَّةٌ، فَمَنْ رَأَى أَنَّهَا مُحَرَّمَةٌ فَلَهُ أَنْ يَأْخُذَ بِدَلِيلِهِ، وَهَذِهِ الْمَسْأَلَةُ يَنْبَنِي عَلَيْهَا - يَعْنِي هِيَ مَنْبَنِيَةٌ أَصْلًا عَلَى كَثِيرٍ مِنَ الْخِلَافَاتِ بَيْنَ الْمُحَدِّثِينَ فِي أَسَانِيدِ الْأَحَادِيثِ الْوَارِدَةِ فِي إِبَاحَةِ هَذِهِ الصُّوَرِ وَفِي مَنْعِهَا، فَاخْتَلَفَ أَهْلُ الْعِلْمِ كَثِيرًا فِي تَصْحِيحِهَا وَتَضْعِيفِهَا.",

          "text": "\"هَا نَعَمْ تَفَضَّلْ، الصُّوَرُ الَّتِي بِهَا صُوَرُ النَّاسِ بَعْضُ النَّاسِ يَقُومُ بِتَعْلِيقِهَا فِي الْمَحَلَّاتِ؟\" قُلْنَا هَذَا بَعْضُ أَهْلِ الْحِلْمِ الْحَنَابِلَةِ كَرِهُوا الصُّورَةَ الْمَنْصُوبَةَ الْمُعَلَّقَةَ هَذِهِ، وَقُلْنَا الْأَصْلُ أَنَّهَا كَالْمُمْتَهَنَةِ هَذِهِ الْمَبْسُوطَةِ، إِذًا الْأَصْلُ الْجَوَازُ. وَهَذِهِ أَصْلًا صُوَرٌ فُوتُوغْرَافِيَّةٌ فِي الْغَالِبِ الَّتِي فِيهَا ا... فِي الْجَرَائِدِ هَذِهِ قَالَ صُوَرٌ فُوتُوغْرَافِيَّةٌ. لَكِنْ نَحْنُ نَسِينَا مَسْأَلَةً فِي الْمُجَسَّمِ؛ الْمُجَسَّمُ الَّذِي فِيهِ عُضْوٌ مِنْ أَعْضَاءِ الْحَيَاةِ نَاقِصٌ مَا حُكْمُهُ؟ طَبْعًا أَوَّلًا اتَّفَقُوا أَنَّ الْمُجَسَّمَ إِذَا قُطِعَ رَأْسُهُ فَإِنَّهُ جَائِزٌ؛ جَاءَ عَنِ ابْنِ عَبَّاسٍ: \"إِنَّمَا الصُّورَةُ الرَّأْسُ\"، فَإِذَا قُطِعَ الرَّأْسُ فَهَذَا الْأَصْلُ أَنَّهُ لَا حَيَاةَ فِيهِ لَا يَكُونُ مِنْ ذَوِي الْأَرْوَاحِ. فَهَذَا الْمُجَسَّمُ الْبَدَنُ دُونَ الرَّأْسِ جَائِزٌ. لَكِنَّ الْخِلَافَ إِذَا قُطِعَ عُضْوٌ مِنْ أَعْضَاءِ الْحَيَاةِ غَيْرَ الرَّأْسِ، يَعْنِي وَجَدْنَا رَأْسًا دُونَ بَدَنٍ أَوْ قُطِعَ مَا تَقُومُ بِهِ الْحَيَاةُ، اخْتَلَفَ أَهْلُ الْعِلْمِ. الْأَحْوَطُ وَالْأَقْرَبُ تَحْرِيمُهُ لِأَنَّ ابْنَ عَبَّاسٍ قَالَ \"إِنَّمَا الصُّورَةُ الرَّأْسُ\"، فَدَلَّ عَلَى أَنَّ الصُّورَةَ مُقَيَّدَةٌ بِالرَّأْسِ، فَإِذَا وُجِدَ الرَّأْسُ كَانَ ذَلِكَ صُورَةً دَاخِلَةً فِي الْعُمُومِ الْمَنْهِيِّ عَنْهُ. نَعَمْ. بَابُ مَا جَاءَ كَثْرَةِ الْحَلْفِ.",

        {
          "id": 77,
          "type": "paragraph",
          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ مَا جَاءَ فِي كَثْرَةِ الْحَلِفِ. وَقَوْلِ اللَّهِ تَعَالَى: {وَاحْفَظُوا أَيْمَانَكُمْ}. عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: الْحَلِفُ مُنَفِّقَةٌ لِلسِّلْعَةِ مُمْحِقَةٌ لِلْكَسْبِ. أَخْرَجَاهُ. وَعَنْ سَلْمَانَ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: ثَلَاثَةٌ لَا يُكَلِّمُهُمُ اللَّهُ وَلَا يُزَكِّيهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ: أُشَيْمِطٌ زَانٍ، وَعَائِلٌ مُسْتَكْبِرٌ، وَرَجُلٌ جَعَلَ اللَّهَ بِضَاعَتَهُ لَا يَشْتَرِي إِلَّا بِيَمِينِهِ وَلَا يَبِيعُ إِلَّا بِيَمِينِهِ. رَوَاهُ الطَّبَرَانِيُّ بِسَنَدٍ صَحِيحٍ. وَفِي الصَّحِيحِ عَنْ عِمْرَانَ بْنِ حُصَيْنِ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: خَيْرُ أُمَّتِي قَرْنِي ثُمَّ الَّذِينَ يَلُونَهُمْ ثُمَّ الَّذِينَ يَلُونَهُمْ. قَالَ عِمْرَانُ: فَلَا أَدْكُرُ بَعْدَ قَوْمِهِ مَرَّتَيْنِ مَرَّتَيْنِ أَوْ ثَلَاثًا؟ ثُمَّ إِنَّ بَعْدَهُمْ قَوْمٌ يَشْهَدُونَ يَشْهَدُونَ وَلَا يُسْتَشْهَدُونَ، وَيَخُونُونَ وَلَا يُؤْتَمَنُونَ، وَيَنْذُرُونَ وَلَا يُوفُونَ، وَيَظْهَرُ فِيهِمُ السِّمَنُ. وَفِيهِ عَنِ ابْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: خَيْرُ النَّاسِ قَرْنِي ثُمَّ الَّذِينَ يَلُونَهُمْ ثُمَّ الَّذِينَ يَلُونَهُمْ، ثُمَّ يَجِيءُ قَوْمٌ تَسْبِقُ شَهَادَةُ أَحَدِهِمْ يَمِينَهُ وَيَمِينُهُ شَهَادَتَهُ.\"",

          "text": "نَعَمْ، قَالَ: بَابُ مَا جَاءَ فِي كَثْرَةِ الْحَلِفِ. هَذَا أَيْضًا مِنَ الْأَدَبِ مَعَ اللَّهِ عَزَّ وَجَلَّ؛ أَلَّا يُعَرِّضَ عَزَّ وَجَلَّ لِلْحَلِفِ عَلَى كُلِّ شَيْءٍ، وَلَا يُكْثِرَ الْحَلِفَ بِهِ سُبْحَانَهُ لِأَنَّ أَصْلًا حَقِيقَةَ الْحَلِفِ التَّعْظِيمُ، فَإِذَا أَكْثَرَ مِنَ الْحَلِفِ كَانَ ذَلِكَ مُنَافِيًا لِالتَّعْظِيمِ. قَالَ اللَّهُ عَزَّ وَجَلَّ: {وَاحْفَظُوا أَيْمَانَكُمْ}. حِفْظُ الْيَمِينِ أَوَّلُ مَا يَدْخُلُ فِيهِ عَدَمُ الْإِكْثَارِ مِنَ الْحَلِفِ، وَأَلَّا يَحْلِفَ إِلَّا بِاللَّهِ عَزَّ وَجَلَّ. ثُمَّ هَذَا الْحَالِفُ إِنْ حَلَفَ بِاللَّهِ عَزَّ وَجَلَّ مِنْ حِفْظِهِ لِيَمِينِهِ أَنْ يُوفِيَ بِهَذَا الْقَسَمِ. طَيِّبْ إِنْ لَمْ يُوفِ بِهَذَا الْقَسَمِ يُكَفِّرْ، فَعَلَيْهِ أَنْ يَأْتِيَ بِالْكَفَّارَةِ. وَالْمَذْمُومُ فِي هَذَا الْحَدِيثِ لَيْسَ الْحَلِفَ كَذِبًا بَلِ الْحَلِفَ بِاللَّهِ صَادِقًا، فَكَثْرَةُ الْحَلِفِ بِاللَّهِ صَادِقًا كَانَ مَذْمُومًا لِأَنَّهُ مُنَاقِضٌ لِتَعْظِيمِ اللَّهِ عَزَّ وَجَلَّ وَسَبَبٌ لِامْتِهَانِهِ. ثُمَّ الْإِنْسَانُ كُلَّمَا كَثُرَ حَلِفُهُ كُلَّمَا كَثُرَ خَطَأُهُ، كُلَّمَا اسْتَسْهَلَ الْحَلِفَ كُلَّمَا حَلَفَ عَلَى أُمُورٍ هِيَ لَا لَيْسَ مُتَأَكِّدًا مِنْهَا، ثُمَّ بَعْدَ ذَلِكَ يَصِلُ إِلَى أَنْ يَحْلِفَ عَلَى الْكَذِبِ. وَلِذَلِكَ قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الْحَلِفُ مُنَفِّقَةٌ لِلسِّلْعَةِ مُمْحِقَةٌ لِلْكَسْبِ\"، يَعْنِي أَنْتَ تَحْلِفُ سَتُنَفِّقُ سِلْعَتَكَ سَتَذْهَبُ سَتُبَاعُ لَكِنْ لَنْ يَكُونَ لَكَ فِيهَا بَرَكَةٌ بَلْ سَتُمْحَقُ هَذِهِ الْبَرَكَةُ.",

          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ مَا جَاءَ فِي ذِمَّةِ اللَّهِ وَذِمَّةِ نَبِيِّهِ. وَقَوْلِ اللَّهِ تَعَالَى: {وَأَوْفُوا بِعَهْدِ اللَّهِ إِذَا عَاهَدْتُمْ وَلَا تَنْقُضُوا الْأَيْمَانَ بَعْدَ تَوْكِيدِهَا}. وَعَنْ بُرَيْدَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا أَمَّرَ أَمِيرًا عَلَى جَيْشٍ أَوْ سَرِيَّةٍ أَوْصَاهُ بِتَقْوَى اللَّهِ وَمَنْ مَعَهُ مِنَ الْمُسْلِمِينَ خَيْرًا، فَقَالَ: اغْزُوا بِاسْمِ اللَّهِ، قَاتِلُوا مَنْ كَفَرَ بِاللَّهِ، اغْزُوا وَلَا تَغُلُّوا، وَلَا تَغْدِرُوا، وَلَا تَمْثُلُوا، وَلَا تَقْتُلُوا وَلِيدًا. وَإِذَا لَقِيتَ عَدُوَّكَ مِنَ الْمُشْرِكِينَ فَادْعُهُمْ إِلَى ثَلَاثِ خِصَالٍ - أَوْ خِلَالٍ - فَأَيَّتُهُنَّ مَا أَجَابُوكَ فَاقْبَلْ مِنْهُمْ وَكَفَّ عَنْهُمْ. ثُمَّ ادْعُهُمْ إِلَى الْإِسْلَامِ، فَإِنْ أَجَابُوكَ فَاقْبَلْ مِنْهُمْ، ثُمَّ ادْعُهُمْ إِلَى التَّحَوُّلِ مِنْ دَارِهِمْ إِلَى دَارِ الْمُهَاجِرِينَ، وَأَخْبِرْهُمْ أَنَّهُمْ إِنْ فَعَلُوا ذَلِكَ فَلَهُمْ مَا لِلْمُهَاجِرِينَ وَعَلَيْهِمْ مَا عَلَى الْمُهَاجِرِينَ. فَإِنْ أَبَوْا أَنْ يَتَحَوَّلُوا مِنْهَا فَأَخْبِرْهُمْ أَنَّهُمْ... فَأَخْبِرْ فَأَخْبِرْهُمْ أَنَّهُمْ يَكُونُونَ كَأَعْرَابِ الْمُسْلِمِينَ، يَجْرِي عَلَيْهِمْ حُكْمُ اللَّهِ تَعَالَى وَلَا يَكُونُ لَهُمْ فِي الْغَنِيمَةِ وَلَا الْفَيْءِ شَيْءٌ إِلَّا أَنْ يُجَاهِدُوا مَعَ الْمُسْلِمِينَ. فَإِنْ هُمْ أَبَوْا فَاسْأَلْهُمُ الْجِزْيَةَ، فَإِنْ هُمْ أَجَابُوكَ فَاقْبَلْ مِنْهُمْ وَكَفَّ عَنْهُمْ. فَإِنْ هُمْ أَبَوْا فَاسْتَعِنْ بِاللَّهِ وَقَاتِلْهُمْ. وَإِذَا حَاصَرْتَ أَهْلَ حِصْنٍ فَأَرَادُوا أَنْ تَجْعَلَ لَهُمْ ذِمَّةَ اللَّهِ وَذِمَّةَ نَبِيِّهِ، فَلَا تَجْعَلْ لَهُمْ ذِمَّةَ اللَّهِ وَذِمَّةَ نَبِيِّهِ، وَلَكِنِ اجْعَلْ لَهُمْ ذِمَّتَكَ وَذِمَّةَ أَصْحَابِكَ، فَإِنَّكُمْ أَنْ تُخْفِرُوا ذِمَمَكُمْ وَذِمَمَ أَصْحَابِكُمْ أَهْوَنُ مِنْ أَنْ تُخْفِرُوا ذِمَّةَ اللَّهِ وَذِمَّةَ نَبِيِّهِ. وَإِذَا حَاصَرْتَ أَهْلَ حِصْنٍ فَأَرَادُوكَ أَنْ تُنْزِلَهُمْ عَلَى حُكْمِ اللَّهِ، فَلَا تُنْزِلْهُمْ عَلَى حُكْمِ اللَّهِ وَلَكِنْ أَنْزِلْهُمْ عَلَى حُكْمِكَ، فَإِنَّكَ لَا تَدْرِي أَتُصِيبُ فِيهِمْ حُكْمَ اللَّهِ أَمْ لَا. رَوَاهُ مُسْلِمٌ.\"",

          "id": 82,

          "text": "نَعَمْ، هَذَا الْبَابُ جَاءَ كَذَلِكَ فِي الْأَدَبِ مَعَ اللَّهِ عَزَّ وَجَلَّ وَتَعْظِيمِهِ، وَمِنْ ذَلِكَ أَنْ تُعَظِّمَ ذِمَّتَهُ. فَأَوَّلُ مَا يَدْخُلُ فِيهِ أَهْلُ الذِّمَّةِ، فَإِنَّ أَهْلَ الذِّمَّةِ لَهُمْ أَحْكَامٌ شَرَعَهَا اللَّهُ عَزَّ وَجَلَّ لَهُمْ، فَلَا يَنْبَغِي عَلَى الْإِسْلَامِ... عَلَى الْمُسْلِمِ أَنْ يُخْفِرَ ذِمَّةَ اللَّهِ عَزَّ وَجَلَّ فِي هَؤُلَاءِ الَّذِينَ أَمَّنَهُمُ اللَّهُ عَزَّ وَجَلَّ بِشَرْطِهِ. إِذًا هَذَا مِمَّا يَدْخُلُ فِيهَا، مِمَّا يَدْخُلُ فِيهَا كَذَلِكَ أَلَّا يُعْطِيَهُمْ ذِمَّةَ اللَّهِ عَزَّ وَجَلَّ لِأَنَّ الْإِنْسَانَ قَدْ يُخْفِرُ بِهَذِهِ الذِّمَّةِ وَقَدْ لَا يُوفِي بِهَذَا الْعَهْدِ، فَأَنْ يُخْفِرَ ذِمَّةَ نَفْسِهِ أَوَّلُ مِنْ أَنْ يُخْفِرَ ذِمَّةَ اللَّهِ عَزَّ وَجَلَّ وَكَذَلِكَ ذِمَّةَ نَبِيِّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.",

        {
          "id": 83,
          "type": "paragraph",
          "text": "وَلِذَلِكَ قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"وَإِذَا حَاصَرْتَ أَهْلَ حِصْنٍ فَأَرَادُوكَ أَنْ تَجْعَلَ لَهُمْ ذِمَّةَ اللَّهِ وَذِمَّةَ نَبِيِّهِ فَلَا تَجْعَلْ لَهُمْ ذِمَّةَ اللَّهِ وَذِمَّةَ نَبِيِّهِ وَلَكِنِ اجْعَلْ لَهُمْ ذِمَّتَكَ وَذِمَّةَ أَصْحَابِكَ\". هُنَا هَؤُلَاءِ حُوصِرُوا فَطَلَبُوا ذِمَّةَ اللَّهِ عَزَّ وَجَلَّ، هَلْ يُعْطِيهَا لَهُمُ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ؟ قَالَ لَا، أَعْطِهِمْ ذِمَّتَكَ وَذِمَّةَ أَصْحَابِكَ، خُصُوصًا فِي هَذَا الْمَوْقِفِ لِأَنَّكَ أَنْتَ وَإِنْ أَمِنْتَ عَلَى نَفْسِكَ لَا تَأْمَنُ عَلَى مَنْ مَعَكَ مِنَ الْجَيْشِ أَنْ يُخْفِرُوا ذِمَّةَ اللَّهِ عَزَّ وَجَلَّ. فَمِنْ بَابِ تَعْظِيمِ اللَّهِ عَزَّ وَجَلَّ أَلَّا تَجْعَلَ لَهُمْ ذِمَّةَ اللَّهِ عَزَّ وَجَلَّ وَإِنَّمَا تَجْعَلَ لَهُمْ ذِمَّتَكَ أَنْتَ، فَتُؤَمِّنُهُمْ أَنْتَ وَتُدْخِلُهُمْ فِي ذِمَّتِكَ، هَذَا مِنْ بَابِ تَعْظِيمِ اللَّهِ عَزَّ وَجَلَّ.",

        {

          "type": "paragraph",
          "text": "قَالَ: \"وَإِذَا حَاصَرْتَ أَهْلَ حِصْنٍ فَأَرَادُوكَ أَنْ تُنْزِلَهُمْ عَلَى حُكْمِ اللَّهِ عَزَّ وَجَلَّ، فَلَا تُنْزِلْهُمْ عَلَى حُكْمِ اللَّهِ وَلَكِنْ أَنْزِلْهُمْ عَلَى حُكْمِكَ\". هَذِهِ الْآيَةُ وَهَذَا الْحَدِيثُ اسْتَدَلَّ بِهِ ابْنُ الْقَيِّمِ رَحِمَهُ اللَّهُ تَعَالَى قَالَ: لَا يُقَالُ فِي الْمَسَائِلِ الِاجْتِهَادِيَّةِ هَذَا حُكْمُ اللَّهِ عَزَّ وَجَلَّ. بَعْضُ النَّاسِ كَثِيرٌ حَتَّى فِي كُتُبِ أَهْلِ الْعِلْمِ تَجِدُهُمْ إِذَا سُئِلَ يَسْأَلُ: مَا حُكْمُ اللَّهِ عَزَّ وَجَلَّ فِي هَذِهِ الْمَسْأَلَةِ؟ وَمَا حُكْمُ الشَّرِيعَةِ فِي هَذِهِ الْمَسْأَلَةِ؟ هَذَا كَرِهُوهُ لِمَاذَا؟ لِأَنَّ هَذَا الْمُجْتَهِدَ قَدْ يُصِيبُ وَقَدْ يُخْطِئُ فَلَا يَكُونُ بِذَلِكَ قَدْ أَصَابَ حُكْمَ اللَّهِ عَزَّ وَجَلَّ. فَلِذَلِكَ الْأَصْلُ أَلَّا يُنْسَبَ هَذَا الْحُكْمُ إِلَى اللَّهِ عَزَّ وَجَلَّ بَلْ يَنْسِبُهُ إِلَى نَفْسِهِ، وَيَقَعُ فِي هَذَا التَّجَوُّزِ يُقَالُ هَذَا حُكْمُ اللَّهِ عَزَّ وَجَلَّ مِنْ بَابِ غَلَبَةِ الظَّنِّ. لِذَلِكَ هَذَا فِيهِ تَنْزِيهٌ وَاحْتِيَاطٌ، وَفِيهِ أَنَّ الْحَقَّ وَاحِدٌ لَا يَتَعَدَّدُ؛ لِأَنَّ حُكْمَ اللَّهِ عَزَّ وَجَلَّ هُوَ الْحَقُّ وَمَا سِوَاهُ هُوَ الْبَاطِلُ. فَلِذَلِكَ قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"فَإِنَّكَ لَا تَدْرِي أَتُصِيبُ حُكْمَ اللَّهِ فِيهِمْ أَمْ لَا\". أَنْتَ مُجْتَهِدٌ، إِنْ أَصَبْتَ حُكْمَ اللَّهِ أَصَبْتَ الْحَقَّ، إِنْ لَمْ تُصِبْ حُكْمَ اللَّهِ أَنْتَ مُجْتَهِدٌ مَعْذُورٌ لَكِنَّ حُكْمَكَ بَاطِلٌ. لِذَلِكَ الْحَقُّ وَاحِدٌ، لَوْ كَانَ الْحَقُّ كُلُّ مَا ذَهَبَ إِلَيْهِ الْمُجْتَهِدُونَ حَقًّا وَالْحَقُّ يَتَعَدَّدُ لَكَانَ قَوْلُهُ كَذَلِكَ حَقًّا سَوَاءً أَصَابَ حُكْمَ اللَّهِ عَزَّ وَجَلَّ أَمْ لَمْ يُصِبْهُ. إِذًا الْمُجْتَهِدُونَ الْحَقُّ مِنْ أَقْوَالِهِمْ وَاحِدٌ، وَلَكِنْ كَمَا تَقَدَّمَ مَعَنَا فِي فَضْلِ الْإِسْلَامِ إِذَا حَكَمَ... إِذَا اجْتَهَدَ الْحَاكِمُ فَأَصَابَ فَلَهُ أَجْرَانِ؛ أَجْرُ الِاجْتِهَادِ وَالْإِصَابَةِ، وَإِذَا اجْتَهَدَ فَأَخْطَأَ فَلَهُ أَجْرٌ وَاحِدٌ أَجْرُ الِاجْتِهَادِ. نَعَمْ.",

          "text": "بَابُ مَا جَاءَ فِي الْإِقْسَامِ عَلَى اللَّهِ عَزَّ وَجَلَّ، هَذَا الْإِقْسَامُ عَلَى اللَّهِ عَزَّ وَجَلَّ لَهُ أَحْوَالٌ: الْحَالَةُ الْأُولَى الَّتِي ذَكَرَهَا هَذَا الْمُصَنِّفُ ذَكَرَهَا فِي حَدِيثِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ قَالَ: \"وَاللَّهِ لَا يَغْفِرُ اللَّهُ لِفُلَانٍ\". هَذَا الْعَابِدُ حَلَفَ أَنَّ اللَّهَ عَزَّ وَجَلَّ لَا يَغْفِرُ لِصَاحِبِهِ الْفَاسِقِ الْمُسْرِفِ عَلَى نَفْسِهِ، فَهَذَا أَحْبَطَ اللَّهُ عَزَّ وَجَلَّ عَمَلَهُ. لِمَاذَا؟ لِأَنَّهُ حَلَفَ عَلَى اللَّهَ عَزَّ وَجَلَّ مِنْ بَابِ الْعُجْبِ، الْإِعْجَابِ بِنَفْسِهِ وَتَعْظِيمِهَا، أُعْجِبَ بِنَفْسِهِ وَأُعْجِبَ بِعِبَادَتِهِ فَلِذَلِكَ تَأَلَّى عَلَى اللَّهِ عَزَّ وَجَلَّ وَقَالَ أَنَّهُ لَا يَغْفِرُ لِهَذَا الْفَاسِقِ فَاحْتَقَرَهُ إِلَى جَنْبِ نَفْسِهِ، وَكَذَلِكَ هُوَ تَكَلَّمَ عَنِ اللَّهِ عَزَّ وَجَلَّ بِغَيْرِ عِلْمٍ، وَالْأَصْلُ أَنَّ اللَّهَ عَزَّ وَجَلَّ يَغْفِرُ تَوْبَةَ التَّائِبِ. هَذِهِ الْحَالَةُ الْأُولَى أَنْ يَحْلِفَ عَلَى اللَّهِ عَزَّ وَجَلَّ وَهُوَ مُعْجَبٌ، مِنْ ذَلِكَ أَنْ يَحْلِفَ سَيَقُولُ: \"وَاللَّهِ سَيَنْصُرُنِي اللَّهُ عَزَّ وَجَلَّ\"، \"وَاللَّهِ سَيَرْزُقُنِي\"، \"وَاللَّهِ سَيُعْطِينِي\"، أَوْ يَحْلِفَ عَلَى اللَّهِ عَزَّ وَجَلَّ \"أَقْسَمْتُ عَلَيْكَ يَا اللَّهُ أَنْ تَرْزُقَنِي\"، تَسْأَلُهُ لِمَاذَا؟ يَقُولُ لِأَنَّ... إِنْسَانٌ مُصَلٍّ عَابِدٌ زَاهِدٌ قَانِتٌ فاستحق هذا على الله عز وجل فهذا منه.",

        {
          "id": 89,
          "type": "paragraph",
          "text": "النَّوْعُ الثَّانِي: أَنْ يَحْلِفَ مِنْ بَابِ حُسْنِ الظَّنِّ بِاللَّهِ عَزَّ وَجَلَّ وَمَعَ مُلَاحَظَةِ احْتِقَارِهِ لِنَفْسِهِ وَازْدِرَائِهَا، فَهَذَا جَائِزٌ. وَالدَّلِيلُ هَذَا الَّذِي أَخْبَرَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْهُ \"رُبَّ أَشْعَثَ أَغْبَرَ مَرْدُودٍ بِالْأَبْوَابِ لَوْ أَقْسَمَ عَلَى اللَّهِ لَأَبَرَّهُ\". فَهَذَا أَقْسَمَ مِنْ بَابِ حُسْنِ الظَّنِّ بِاللَّهِ عَزَّ وَجَلَّ وَأَنَّ اللَّهَ عَزَّ وَجَلَّ لَا يُخَيِّبُهُ إِنْ دَعَاهُ، لِمَاذَا؟ لَيْسَ لِأَنَّهُ مُسْتَحِقٌّ بَلْ لِأَنَّ اللَّهَ عَزَّ وَجَلَّ هُوَ الْكَرِيمُ الَّذِي يُجِيبُ دَعْوَةَ الدَّاعِي.",

        {
          "id": 90,
          "type": "paragraph",
          "text": "النَّوْعُ الثَّالِثُ: أَنْ يُقْسِمَ عَلَى اللَّهِ عَزَّ وَجَلَّ فِي أَمْرٍ مَعْلُومٍ مِنَ الدِّينِ بِالضَّرُورَةِ، هَذَا يَجُوزُ. مَا الدَّلِيلُ؟ أَنَا أَسْأَلُكُمُ الْآنَ مَا الدَّلِيلُ؟ الدَّلِيلُ تَقَدَّمَ مَعَنَا فِي كِتَابِ التَّوْحِيدِ... يُقْسِمُ عَلَى اللَّهِ عَزَّ وَجَلَّ فِي أَمْرٍ مَعْلُومٍ مِنَ الدِّينِ بِالضَّرُورَةِ مَعْلُومٍ مَعْلُومٍ أَمْرٍ عَلِمَ تَيَقَّنَ مِنْهُ؛ يُقْسِمُ أَنَّ الْقِيَامَةَ آتِيَةٌ، يُقْسِمُ أَنَّ اللَّهَ عَزَّ وَجَلَّ لَا يُدْخِلُ كُفَّارًا الْجَنَّةَ. نَعَمْ شَيْخُ، هَا لَا... كَيْفَ مَا فَهِمْتَ السُّؤَالَ؟ حَدٌّ يُقْسِمُ عَلَى اللَّهِ عَزَّ وَجَلَّ بِأَمْرٍ مَعْلُومٍ مِنَ الدِّينِ مَا فِي شَكٍّ، يَقُولُ: وَاللَّهِ الْقِيَامَةُ آتِيَةٌ، وَاللَّهِ اللَّهُ عَزَّ وَجَلَّ لَنْ يُدْخِلَ الْكُفَّارَ... النَّارَ... وَاضِحٌ يَا شَيْخُ؟ هَلْ يَجُوزُ هَذَا؟ قُلْنَا يَجُوزُ، مَا الدَّلِيلُ؟ تَقَدَّمَ مَعَ... فِي كِتَابِ التَّوْحِيدِ. هَا؟ سُؤَالٌ ذَهَبِيٌّ هَذَا شُوَيْ جَوَائِزُ مَوْجُودَةٌ يَا جَمَاعَةُ الْيَوْمَ مَا أَعْطَيْتُ شَيْءٌ. السُّؤَالُ مَا فَهِمُوهُ الشَّيْخُ. أَمْرٌ مَعْلُومٌ مِنَ الدِّينِ بِالضَّرُورَةِ يَوْمُ الْقِيَامَةِ فِي شَكٍّ؟ لَا. لَوْ قَالَ الْإِنْسَانُ \"يَوْمُ الْقِيَامَةِ آتٍ وَاللَّهِ الْعَظِيمُ يَوْمُ الْقِيَامَةِ آتٍ\" يَجُوزُ. مَا الدَّلِيلُ؟ هَا دَلِيلٌ عَلَى أَنَّهُ يَجُوزُ الْإِقْسَامُ يُقْسِمُ عَلَى اللَّهِ عَزَّ وَجَلَّ بِذَلِكَ نَعَمْلُهُ هَا؟ إِيهْ وَيْنِ الْقَسَمُ؟ ثُمَّ هَذَا إِخْبَارٌ مِنَ اللَّهِ عَزَّ وَجَلَّ \"لَتَدْخُلُنَّ\" هَذِهِ الْعاقِبَةُ عَاقِبَتُكُمْ أَنَّكُمْ سَتَدْخُلُونَ النَّارَ - يَعْنِي مَالُكُمُ اسْتَغْفِرُ اللَّهَ سَتَدْخُلُونَ الْمَسْجِدَ الْحَرَامَ - مَالُكُمْ أَنَّكُمْ سَتَدْخُلُونَ، لَيْسَتِ الْقَسَمَ. الشَّاهِدُ الدَّلِيلُ يَا جَمَاعَةُ تَقَدَّمَ مَعَنَا فِي كِتَابِ التَّوْحِيدِ فِي حَدِيثِ ابْنِ عُمَرَ أَنَّهُ قَالَ: \"وَالَّذِي نَفْسُ عُمَرَ بِيَدِهِ لَا يَغْفِرُ اللَّهُ عَزَّ وَجَلَّ لَهُمْ حَتَّى يُؤْمِنُوا بِالْقَدَاءِ أَيِ الْمَرْتَبَةِ الْأُولَى الْعِلْمِ\". فَمَنْ أَنْكَرَ الْعِلْمَ فَهُوَ كَافِرٌ فَاللَّهُ عَزَّ وَجَلَّ لَا يَغْفِرُ لَهُ حَتَّى يَرْجِعَ عَنْ كُفْرِهِ. فَهَذَا ابْنُ عُمَرَ أَقْسَمَ عَلَى اللَّهِ عَزَّ وَجَلَّ قَالَ \"وَالَّذِي نَفْسُ ابْنِ عُمَرَ بِيَدِهِ\" هَذَا قَسَمٌ عَلَى اللَّهِ عَزَّ وَجَلَّ أَنَّهُ لَا يَغْفِرُ لِهَؤُلَاءِ. هَذَا يُشْبِهُ هَذَا الْقَسَمَ \"وَاللَّهِ لَا يَغْفِرُ اللَّهُ لِفُلَانٍ\"؟ لَا يُشْبِهُهُ لِأَنَّ ابْنَ عُمَرَ أَقْسَمَ عَلَى أَمْرِ الدِّينِ بِالضَّرُورَةِ؛ الْمُنْكِرُ عِلْمَ اللَّهِ عَزَّ وَجَلَّ لَا يَغْفِرُ اللَّهُ عَزَّ وَجَلَّ لَهُ. أَمَّا هَذَا إِنَّكَ... يَعْنِي حَلَفَ عَلَى عُجْبٍ مِنْ نَفْسِهِ وَاسْتِكْبَارٍ. نَعَمْ. هَذَا جَيِّدٌ نَعَمْ. وَإِنَّمَا هَذَا خَبَرٌ مِنَ اللَّهِ عَزَّ وَجَلَّ لَكِنْ جَيِّدٌ كَذَا لَكِنْ تَأَخَّرْتَ الشَّيْخُ جُبْنَا لَوْ سَعَتْ. نَعَمْ.",

        {
          "id": 92,
          "type": "paragraph",
          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ لَا يُسْتَشْفَعُ بِاللَّهِ عَلَى خَلْقِهِ. عَنْ جُبَيْرِ بْنِ مُطْعِمٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: أَتَى أَعْرَابِيٌّ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: يَا رَسُولَ اللَّهِ، نُهِكَتِ الْأَنْفُسُ وَجَاعَتِ الْأَمْوَالُ، فَاسْتَسْقِ لَنَا رَبَّكَ، إِنَّا نَسْتَشْفِعُ بِاللَّهِ عَلَيْكَ وَبِكَ عَلَى اللَّهِ. فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: سُبْحَانَ اللَّهِ سُبْحَانَ اللَّهِ! فَمَا زَالَ يُسَبِّحُ حَتَّى عُرِفَ ذَلِكَ فِي وُجُوهِ أَصْحَابِهِ ثُمَّ قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: وَيْحَكَ! أَتَدْرِي مَا اللَّهُ؟ إِنَّ شَأْنَ اللَّهِ أَعْظَمُ مِنْ ذَلِكَ، إِنَّهُ لَا يُسْتَشْفَعُ بِاللَّهِ عَلَى أَحَدٍ مِنْ خَلْقِهِ. وَذَكَرَ الْحَدِيثَ رَوَاهُ أَبُو دَاوُدَ.\"",

        {
          "id": 93,
          "type": "paragraph",
          "text": "وَاللَّهِ يَا شَيْخُ أَنَا مَا أَرُدَّكَ الشَّيْخُ تَفَضَّلْ. قَالَ: بَابُ لَا يُسْتَشْفَعُ بِاللَّهِ عَلَى خَلْقِهِ. هَذَا مِنْ أَبْوَابِ الْأَدَبِ كَذَلِكَ مَعَ اللَّهِ عَزَّ وَجَلَّ، فَاللَّهُ عَزَّ وَجَلَّ لَا يَحْتَاجُ لِأَنْ يَكُونَ هُنَاكَ وَاسِطَةٌ بَيْنَهُ وَبَيْنَ خَلْقِهِ. تَكَلَّمَ الْكَلَامَ عَلَى هَذِهِ مَسْأَلَةً فِي الشَّفَاعَةِ، لِأَنَّ هَذَا الَّذِي يَتَوَسَّطُ بِالنَّاسِ عِنْدَ اللَّهِ عَزَّ وَجَلَّ قَدْ يَحْصُلُ مِنْهُ هَذَانِ: الْأَمْرُ الْأَوَّلُ أَنْ يَظُنَّ اللَّهَ عَزَّ وَجَلَّ لَا يَعْلَمُ حَالَ ا... مَخْلُوقَاتِهِ وَلَا يَعْلَمُ حَالَ مُلْكِهِ فَلِذَلِكَ يَحْتَاجُ مَنْ يُعْلِمُهُ وَيَشْفَعُ لَهُ.",

          "id": 94,
          "type": "paragraph",
          "text": "أَمَّا هُنَا هَذَا الْبَابُ \"بَابُ لَا يُسْتَشْفَعُ بِاللَّهِ\" هَذِهِ صُورَةٌ ثَانِيَةٌ، أَنْ أَنْ يَذْهَبَ إِلَى الْمَخْلُوقِ وَيَسْتَشْفِعَ بِاللَّهِ عَزَّ وَجَلَّ عِنْدَهُ، يَقُولُ ا... يَقُولُ \"اللَّهُ شَفِيعِي عِنْدَكَ\" كَمَا فِي الْحَدِيثِ \"إِنَّا نَسْتَشْفِعُ بِاللَّهِ عَلَيْكَ وَبِكَ عَلَى اللَّهِ\". هَذَا فِيهِ سُوءُ لِأَنَّ اللَّهَ عَزَّ وَجَلَّ لَا لَا يَشْفَعُ لِخَلْقِهِ عِنْدَ خَلْقِهِ، فَاللَّهُ عَزَّ وَجَلَّ أَعْظَمُ مِنْ ذَلِكَ فَلِذَلِكَ قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ \"سُبْحَانَ اللَّهِ\". هَذِهِ لِتَنْزِيهِ اللَّهِ عَزَّ وَجَلَّ عَنْ هَذَا النَّقْصِ قَالَ \"وَيْحَكَ أَتَدْرِي مَا اللَّهُ؟\"، يَعْنِي أَنْتَ مَا قُلْتَ هَذَا الْكَلَامَ إِلَّا مِنْ سُوءِ عِلْمِكَ بِاللَّهِ عَزَّ وَجَلَّ، إِنَّ شَأْنَ اللَّهِ أَعْظَمُ مِنْ ذَلِكَ، إِنَّهُ لَا يُسْتَشْفَعُ بِاللَّهِ عَلَى أَحَدٍ مِنْ خَلْقِهِ. لَا أَحَدَ أَصْلًا مِنَ الْخَلْقِ قَادِرٌ عَلَى أَنْ يَرُدَّ اللَّهَ عَزَّ وَجَلَّ، وَاللَّهُ عَزَّ وَجَلَّ أَعْظَمُ مِنْ ذَلِكَ أَنْ يُجْعَلَ وَاسِطَةً. لِذَلِكَ بَعْضُ النَّاسِ إِذَا سَأَلْتَهُ أَنْتَ عِنْدَكَ وَاسِطَةٌ فِي الْعَمَلِ مَثَلًا يَقُولُ \"وَاسِطَةُ اللَّهِ عَزَّ وَجَلَّ\"، هَذَا غَ... هَذَا خَطَأٌ لَا يَجُوزُ هَذَا اللَّفْظُ، هَذَا لَفْظٌ فِي سُوءِ أَدَبٍ مَعَ اللَّهِ عَزَّ وَجَلَّ. قُلْ \"اللَّهُ حَسْبِي\"، هَذَا لَفْظٌ اللَّفْظُ الشَّرْعِيُّ {حَسْبِيَ اللَّهُ وَنِعْمَ الْوَكِيلُ}. أَمَّا أَنْ يُقَالَ \"اللَّهُ وَاسِطَتِي يَتَوَسَّطُ لِي عِنْدَ فُلَانٍ\"، الشَّفِيعُ الْأَصْلُ فِيهِ أَنْ يَكُونَ أَقَلَّ مِنَ الْمَشْفُوعِ فِيهِ وَيَتَوَدَّدُ إِلَيْهِ وَيَتَلَطَّفُ، وَهَذَا مُمْتَنِعٌ فِي حَقِّ اللَّهِ عَزَّ وَجَلَّ بَلِ اللَّهُ عَزَّ وَجَلَّ أَعْظَمُ مِنْ ذَلِكَ فَلَا يُسْتَشْفَعُ بِهِ عَلَى أَحَدٍ مِنْ خَلْقِهِ. نَعَمْ.",

        {
          "id": 96,
          "type": "paragraph",
          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ مَا جَاءَ فِي حِمَايَةِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ التَّوْحِيدَ وَسَدِّ طُرُقِ الشِّرْكِ. عَنْ عَبْدِ اللَّهِ بْنِ الشِّخِّيرِ رَضِيَ رَضِيَ اللَّهُ عَنْهُ قَالَ: انْطَلَقْتُ فِي وَفْدِ بَنِي عَامِرٍ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقُلْتُ: أَنْتَ سَيِّدُنَا. فَقَالَ: السَّيِّدُ اللَّهُ تَبَارَكَ وَتَعَالَى. قُلْنَا: وَأَفْضَلُنَا فَضْلًا وَأَعْظَمُنَا طَوْلًا. فَقَالَ: قُولُوا بِقَوْلِكُمْ أَوْ بَعْضِ قَوْلِكُمْ وَلَا يَسْتَجْرِيَنَّكُمُ الشَّيْطَانُ. رَوَاهُ أَبُو دَاوُدَ بِسَنَدٍ جَيِّدٍ. وَعَنْ أَنَسٍ رَضِيَ اللَّهُ عَنْهُ أَنَّ نَاسًا قَالُوا: يَا رَسُولَ اللَّهِ يَا خَيْرَنَا وَابْنَ خَيْرِنَا، وَسَيِّدَنَا وَابْنَ سَيِّدِنَا. فَقَالَ: يَا أَيُّهَا النَّاسُ قُولُوا بِقَوْلِكُمْ وَلَا يَسْتَهْوِيَنَّكُمُ الشَّيْطَانُ، أَنَا مُحَمَّدٌ عَبْدُ اللَّهِ وَرَسُولُهُ، مَا أُحِبُّ أَنْ تَرْفَعُونِي فَوْقَ مَنْزِلَتِي الَّتِي أَنْزَلَنِي اللَّهُ عَزَّ وَجَلَّ. رَوَاهُ النَّسَائِيُّ بِسَنَدٍ جَيِّدٍ.\"",

        {
          "id": 97,
          "type": "paragraph",
          "text": "نَعَمْ، قَالَ: بَابُ مَا جَاءَ فِي حِمَايَةِ الْمُصْطَفَى صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حِمَى التَّوْحِيدِ وَسَدِّهِ طُرُقَ الشِّرْكِ. تَقَدَّمَ مَعَنَا \"بَابُ حِمَايَةِ جَنَابِ التَّوْحِيدِ\"؛ ذَاكَ جَنَابُ التَّوْحِيدِ هُوَ مِنَ التَّوْحِيدِ، فَالنَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَمَى التَّوْحِيدَ، أَمَّا هُنَا حِمَى حِمَى التَّوْحِيدِ مَا يُحِيطُ بِهِ. فَهَذَا مِنْ تَعْظِيمِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِهَذَا الْأَمْرِ وَمِنْ خَوْفِهِ مِنْ رُجُوعِ الشِّرْكِ إِلَى أُمَّتِهِ، فَلِذَلِكَ سَدَّ كُلَّ الطُّرُقِ الْمُوصِلَةِ لَيْسَ إِلَى التَّوْحِيدِ بَلْ إِلَى حِمَاهُ أَيْ إِلَى الْأُمُورِ الَّتِي هِيَ لَيْسَتْ أَصْلًا شِرْكًا. وَمِنْ ذَلِكَ هَذَا الْحَدِيثُ قَالَ: \"انْطَلَقْتُ فِي وَفْدِ بَنِي عَامِرٍ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقُلْنَا أَنْتَ سَيِّدُنَا فَقَالَ السَّيِّدُ اللَّهُ\". فَقُلْنَا \"أَفْضَلُنَا وَفَضْلًا وَأَعْظَمُنَا طَوْلًا\". وَفِي رِوَايَةِ الْأُخْرَى \"أَنْتَ سَيِّدُنَا وَابْنُ سَيِّدِنَا وَخَيْرُنَا وَابْنُ خَيْرِنَا\". فَقَالَ \"قُولُوا بِقَوْلِكُمْ أَوْ بَعْضِ قَوْلِكُمْ وَلَا يَسْتَجْرِيَنَّكُمُ الشَّيْطَانُ\" يَعْنِي قُولُوا بِقَوْلِكُمْ الَّذِي تَعْرِفُونَهُ لَا لَا يَسْتَجْرِيَنَّكُمُ الشَّيْطَانُ وَلَا يَعْنِي يَأْخُذُكُمْ حُبُّ حُسْنِ الْكَلَامِ وَالْبَلَاغَةِ فِي الْخَطَابَةِ لِأَنْ تَجَاوَزُوا الْحَدَّ الْمَشْرُوعَ وَتَصِلُوا إِلَى الْغُلُوِّ. فَالْأَصْلُ قُولُوا بِقَوْلِكُمُ الَّذِي تَعْرِفُونَهُ أَوْ بَعْضِ قَوْلِكُمْ فَلَا يَسْتَجْرِيَنَّكُمُ الشَّيْطَانُ. هُمْ مَاذَا قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ؟ قَالُوا أَنْتَ سَيِّدُنَا، أَنْكَرَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَيْهِمْ ذَلِكَ. النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ سَيِّدُنَا، النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ \"أَنَا سَيِّدُ وَلَدِ آدَمَ\"، وَفِي رِوَايَةِ \"وَلَا فَخْرَ\". فَالشَّاهِدُ أَنَّ هَذَا ثَابِتٌ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَوَّلًا حَقُّهُ أَنْ يُوصَفَ كَمَا قُلْنَا مَاذَا قُلْنَا؟ تَقَدَّمَ مَعَنَا فِي الدَّرْسِ الْمَاضِي نَعَمْ أَنَّهُ عَبْدٌ لِلَّهِ عَزَّ وَجَلَّ، هَذَا هُوَ الْوَصْفُ الدِّينِيُّ الَّذِي يُحِبُّهُ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ أَعْظَمُ مَرَاتِبِ الْمَرَاتِبِ الَّتِي يُوصَفُ بِهَا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. قُلْنَا أَنَّهُ وُصِفَ بِهَا فِي الْإِسْرَاءِ، وَوُصِفَ بِهَا فِي يَوْمِ الْقِيَامَةِ عِنْدَمَا يَكُونُ لَهُ الشَّفَاعَةُ الْعُظْمَى فِي الْمَقَامِ الْمَحْمُودِ. إِذًا هَذَا السَّبَبُ الْأَوَّلُ. السَّبَبُ الثَّانِي أَنَّ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَافَ إِنْ أَقَرَّهُمْ عَلَى ذَلِكَ أَنْ يَغْلُوا أَكْثَرَ فَيَزِيدُوا فِي قَوْلِهِمْ عَلَى السَّيِّدِ وَيَصِلَ إِلَى مَرْتَبَةِ الْغُلُوِّ، أَوْ أَنْ يَعْتَقِدُوا فِيهِ سِيَادَةً هِيَ مِنْ حَقِّ اللَّهِ عَزَّ وَجَلَّ، فَإِنَّ السُّؤْدَدَ وَالْمُلْكَ الْحَقِيقِيَّ لِلَّهِ عَزَّ وَجَلَّ. فَلِذَلِكَ قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ \"وَلَا يَسْتَجْرِيَنَّكُمُ الشَّيْطَانُ\"، فِي الرِّوَايَةِ الْأُخْرَى \"وَلَا يَسْتَهْوِيَنَّكُمُ الشَّيْطَانُ، أَنَا مُحَمَّدٌ عَبْدُ اللَّهِ وَرَسُولُهُ، مَا أُحِبُّ أَنْ تَرْفَعُونِي فَوْقَ مَنْزِلَتِي الَّتِي أَنْزَلَنِي اللَّهُ عَزَّ وَجَلَّ\". فَإِنَّ هَذِهِ الْخَطَابَةَ وَهَذَا تَزْوِيقُ الْكَلَامِ هَذَا يُسَهِّلُ عَلَى الشَّيْطَانِ أَنْ يُلْقِيَ فِي هَذَا الْكَلَامِ مَا هُوَ لَيْسَ مِنْهُ وَمَا هُوَ مِنْ بَابِ الْغُلُوِّ الْمَنْهِيِّ عَنْهُ الَّذِي قَدْ يُوصِلُ إِلَى الشِّرْكِ. فَلِذَلِكَ نَهَى النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْهُ وَأَقَرَّهُمْ قَالَ فِي التَّفْسِيرِ الْآخَرِ \"قُولُوا بِقَوْلِكُمْ\" أَيْ أَنَّ قَوْلَكُمْ صَحِيحٌ لَكِنْ لَا يَكُنْ هَذَا الْقَوْلُ يَحْمِلُكُمْ عَلَى أَنْ تَرْفَعُوا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَوْقَ مَنْزِلَتِهِ وَأَنْ تُنْزِلُوهُ فَوْقَ مَنْزِلَتِهِ. وَهَذَا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هُنَا بِالذَّاتِ أَنْكَرَ عَلَيْهِمْ لِأَنَّهُمْ وَفْدٌ جَاءُوا أَعْرَابٌ، وَالْأَعْرَابُ لَا يُؤْمَنُ مِنْهُمْ مِثْلُ ذَلِكَ، هُمْ لَيْسُوا مِنَ الصَّحَابَةِ الَّذِينَ كَانُوا مُلَازِمِينَ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَيَعْرِفُونَ تَفَاصِيلَ التَّوْحِيدِ. فَلِذَلِكَ كَثِيرٌ مِنَ الْوُفُودِ الَّتِي جَاءَتِ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنْكَرَ عَلَيْهَا بَعْدَ ذَلِكَ، مِثْلَ الَّذِي قَالَ: \"مَنْ يُطِعِ اللَّهَ وَرَسُولَهُ فَقَدْ فَقَدْ أَطَاعَ اللَّهَ، وَمَنْ يَعْصِهِمَا فَقَدْ خَابَ وَخَسِرَ\". قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"بِئْسَ خَطِيبُ الْقَوْمِ أَنْتَ\". فَالْأَعْرَابُ لَا يُؤْمَنُ مِنْهُمْ مِثْلُ ذَلِكَ. نَعَمْ تَفَضَّلْ شَيْخُ.",

          "id": 100,
          "type": "paragraph",
          "text": "\"أَحْسَنَ اللَّهُ إِلَيْكُمْ. بَابُ مَا جَاءَ فِي قَوْلِ اللَّهِ تَعَالَى: {وَمَا قَدَرُوا اللَّهَ حَقَّ قَدْرِهِ وَالْأَرْضُ جَمِيعًا قَبْضَتُهُ يَوْمَ الْقِيَامَةِ}. عَنِ ابْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: جَاءَ حَبْرٌ مِنَ الْأَحْبَارِ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: يَا مُحَمَّدُ إِنَّا نَجِدُ أَنَّ اللَّهَ يَجْعَلُ السَّمَاوَاتِ عَلَى إِصْبَعٍ، وَالْأَرَضِينَ عَلَى إِصْبَعٍ، وَالشَّجَرَ عَلَى إِصْبَعٍ، وَالْمَاءَ عَلَى إِصْبَعٍ، وَالثَّرَى عَلَى إِصْبَعٍ، وَسَائِرَ الْخَلْقِ عَلَى إِصْبَعٍ، فَيَقُولُ أَنَا الْمَلِكُ. فَضَحِكَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَتَّى بَدَتْ نَوَاجِذُهُ مُصَدِّقًا لِقَوْلِ الْحَبْرِ ثُمَّ قَرَأَ: {وَمَا قَدَرُوا اللَّهَ حَقَّ قَدْرِهِ وَالْأَرْضُ جَمِيعًا قَبْضَتُهُ يَوْمَ الْقِيَامَةِ}. وَفِي رِوَايَةٍ لِمُسْلِمٍ: وَالْجِبَالَ وَالشَّجَرَ عَلَى إِصْبَعٍ ثُمَّ يَهُزُّهُنَّ فَيَقُولُ أَنَا الْمَلِكُ أَنَا اللَّهُ. وَفِي رِوَايَةٍ لِلْبُخَارِيِّ: يَجْعَلُ السَّمَاوَاتِ عَلَى إِصْبَعٍ وَالْمَاءَ وَالثَّرَى عَلَى إِصْبَعٍ وَسَائِرَ الْخَلْقِ عَلَى إِصْبَعٍ. أَخْرَجَاهُ. وَلِمُسْلِمٍ عَنِ ابْنِ عُمَرَ مَرْفُوعًا: يَطْوِي اللَّهُ السَّمَاوَاتِ يَوْمَ الْقِيَامَةِ ثُمَّ يَأْخُذُهُنَّ بِيَمِينِهِ ثُمَّ يَقُولُ أَنَا الْمَلِكُ أَيْنَ الْجَبَّارُونَ أَيْنَ الْمُتَكَبِّرُونَ؟ ثُمَّ يَقُولُ الْأَرَضِينَ الْأَرَضِينَ السَّبْعَ ثُمَّ يَأْخُذُهُنَّ بِشِمَالِهِ ثُمَّ يَقُولُ أَنَا الْمَلِكُ أَيْنَ الْجَبَّارُونَ أَيْنَ الْمُتَكَبِّرُونَ؟ وَرُوِيَ عَنِ ابْنِ عَبَّاسٍ قَالَ: مَا السَّمَاوَاتُ السَّبْعُ وَالْأَرْضُونَ السَّبْعُ فِي كَفِّ الرَّحْمَنِ إِلَّا كَخَرْدَلَةٍ فِي يَدِ أَحَدِكُمْ. وَقَالَ ابْنُ جَرِيرٍ حَدَّثَنِي يُونُسُ أَخْبَرَنَا ابْنُ وَهْبٍ قَالَ قَالَ ابْنُ زَيْدٍ حَدَّثَنِي أَبِي قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: السَّمَاوَاتُ السَّبْعُ فِي الْكُرْسِيِّ إِلَّا كَدَرَاهِمَ سَبْعَةٍ أُلْقِيَتْ فِي تُرْسٍ. قَالَ وَقَالَ أَبُو ذَرٍّ رَضِيَ اللَّهُ عَنْهُ سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: مَا الْكُرْسِيُّ مَا الْكُرْسِيُّ فِي الْعَرْشِ إِلَّا كَحَلْقَةٍ مِنْ حَدِيدٍ أُلْقِيَتْ بَيْنَ ظَهْرَانَيْ فَلَاةٍ مِنَ الْأَرْضِ. وَعَنِ ابْنِ مَسْعُودٍ: بَيْنَ السَّمَاءِ الدُّنْيَا وَالَّتِي تَلِيهَا خَمْسُمِائَةِ عَامٍ، وَبَيْنَ كُلِّ سَمَاءٍ خَمْسُمِائَةِ عَامٍ، وَبَيْنَ السَّمَاءِ السَّابِعَةِ وَالْكُرْسِيِّ خَمْسُمِائَةِ عَامٍ، وَبَيْنَ الْكُرْسِيِّ وَالْمَاءِ خَمْسُمِائَةِ عَامٍ، وَالْعَرْشُ فَوْقَ الْمَاءِ، وَاللَّهُ فَوْقَ الْعَرْشِ لَا يَخْفَى عَلَيْهِ شَيْءٌ مِنْ أَعْمَالِكُمْ. أَخْرَجَهُ ابْنُ مَهْدِيٍّ عَنْ مُحَمَّدِ بْنِ سَلَمَةَ عَنْ عَاصِمٍ عَنْ زِرٍّ عَنْ عَبْدِ اللَّهِ. وَرَوَاهُ ابْنُ أَحْمَدَ الْمَسْعُودِيُّ عَنْ عَاصِمٍ عَنْ أَبِي وَائِلٍ عَنْ عَبْدِ اللَّهِ، قَالَ لَهُ الْحَافِظُ الذَّهَبِيُّ رَحِمَهُ اللَّهُ قَالَ وَلَهُ طُرُقٌ. وَعَنِ الْعَبَّاسِ بْنِ عَبْدِ الْمُطَّلِبِ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: هَلْ تَدْرُونَ كَمْ بَيْنَ السَّمَاءِ وَالْأَرْضِ؟ قُلْنَا اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ بَيْنَهُمَا مَسِيرَةُ خَمْسِمِائَةِ سَنَةٍ، وَمِنْ كُلِّ سَمَاءٍ إِلَى سَمَاءٍ مَسِيرَةُ خَمْسِمِائَةِ سَنَةٍ، وَكَثَفُ كُلِّ سَمَاءٍ مَسِيرَةُ خَمْسِمِائَةِ سَنَةٍ، وَبَيْنَ السَّمَاءِ السَّابِعَةِ وَالْعَرْشِ بَحْرٌ بَيْنَ أَسْفَلِهِ وَأَعْلَاهُ كَمَا بَيْنَ السَّمَاءِ وَالْأَرْضِ، وَاللَّهُ تَعَالَى فَوْقَ ذَلِكَ وَلَيْسَ يَخْفَى عَلَيْهِ شَيْءٌ مِنْ أَعْمَالِ بَنِي آدَمَ. أَخْرَجَهُ أَبُو دَاوُدَ وَغَيْرُهُ. وَاللَّهُ سُبْحَانَهُ وَتَعَالَى... تَمَّ بِحَمْدِ اللَّهِ.\"",
